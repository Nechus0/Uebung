    'D steht im zweiten Absatz. A widerspricht der unabhängigen Expertenjury. B widerspricht den unterschiedlichen Wirkungen. C widerspricht dem geringen Finanzierungsanteil.'],

  ['Der Fall der Berliner Mauer',
    'Die Öffnung der Berliner Mauer am 9. November 1989 kam für viele Beobachter überraschend. Ihr gingen monatelange Massenproteste in der DDR und eine Fluchtbewegung über Ungarn voraus, das im Sommer 1989 seine Grenze zu Österreich geöffnet hatte. Die unmittelbare Auslösung war eine missverständliche Ankündigung auf einer Pressekonferenz, wonach neue Reiseregelungen „sofort“ gelten sollten.\n\nDie deutsche Wiedervereinigung folgte am 3. Oktober 1990. Mit ihr wurde das Gebiet der ehemaligen DDR Teil der Europäischen Gemeinschaft, ohne dass ein eigenes Beitrittsverfahren durchlaufen werden musste. Einige europäische Regierungen hatten der Wiedervereinigung zunächst zurückhaltend gegenübergestanden.',
    'r',
    ['Die Grenzöffnung Ungarns zu Österreich erfolgte nach dem Fall der Berliner Mauer.',
      'Das Gebiet der ehemaligen DDR musste ein eigenes Beitrittsverfahren zur Europäischen Gemeinschaft durchlaufen.',
      'Alle europäischen Regierungen unterstützten die Wiedervereinigung von Anfang an uneingeschränkt.',
      'Eine missverständliche Ankündigung auf einer Pressekonferenz war der unmittelbare Auslöser der Maueröffnung.'],
    3,
    'D steht im ersten Absatz. A kehrt die zeitliche Reihenfolge um. B widerspricht dem Text. C widerspricht der anfänglichen Zurückhaltung einiger Regierungen.'],

  ['Buchdruck',
    'Die Einführung des Buchdrucks mit beweglichen Lettern durch Johannes Gutenberg um 1450 veränderte die Verbreitung von Wissen grundlegend. Bücher konnten nun in größerer Zahl und zu geringeren Kosten hergestellt werden als durch Abschreiben von Hand. Innerhalb weniger Jahrzehnte entstanden Druckereien in zahlreichen europäischen Städten.\n\nHistoriker betonen, dass der Buchdruck die Reformation erheblich begünstigte: Flugschriften konnten rasch in großer Auflage verbreitet werden. Sie warnen jedoch davor, die Wirkung der Technik isoliert zu betrachten. Die Lesefähigkeit war noch lange auf einen kleinen Teil der Bevölkerung beschränkt, und viele Inhalte wurden weiterhin mündlich weitergegeben, etwa durch Vorlesen.',
    'a',
    ['Der Buchdruck führte innerhalb weniger Jahre dazu, dass der Großteil der Bevölkerung lesen konnte.',
      'Auch Menschen, die nicht lesen konnten, konnten auf Inhalte gedruckter Schriften zugreifen.',
      'Die Reformation wäre ohne den Buchdruck unmöglich gewesen.',
      'Handschriftlich kopierte Bücher waren günstiger als gedruckte Bücher.'],
    1,
    'B lässt sich daraus ableiten, dass Inhalte etwa durch Vorlesen mündlich weitergegeben wurden. A widerspricht der langen Beschränkung der Lesefähigkeit. C übertreibt, der Text spricht nur von „begünstigte“. D kehrt den Kostenvorteil um.'],

  ['Europäisches Kulturerbe-Siegel',
    'Das Europäische Kulturerbe-Siegel wird an Stätten vergeben, die für die Geschichte und Kultur Europas und die europäische Integration symbolisch bedeutsam sind. Anders als bei der Welterbeliste der UNESCO steht dabei nicht die Schönheit oder die Erhaltung einer Stätte im Vordergrund, sondern ihre Bedeutung für die gemeinsame europäische Geschichte und für die Werte der Union.\n\nZu den ausgezeichneten Stätten gehören neben historischen Bauwerken auch Orte, die für politische Ereignisse stehen, etwa Gedenkstätten oder Orte, an denen wichtige Verträge unterzeichnet wurden. Die ausgezeichneten Stätten müssen zudem Bildungsangebote bereitstellen, insbesondere für junge Menschen.',
    'r',
    ['Das Siegel wird vorrangig nach der architektonischen Schönheit einer Stätte vergeben.',
      'Das Europäische Kulturerbe-Siegel und die UNESCO-Welterbeliste verfolgen dieselben Kriterien.',
      'Auch ein Ort, an dem ein bedeutender europäischer Vertrag unterzeichnet wurde, kann ausgezeichnet werden.',
      'Ausgezeichnete Stätten sind von Bildungsaufgaben befreit.'],
    2,
    'C entspricht dem zweiten Absatz. A und B widersprechen dem Unterschied zur UNESCO-Liste. D widerspricht der Pflicht zu Bildungsangeboten.'],

  ['Brexit',
    'Das Vereinigte Königreich trat am 31. Januar 2020 aus der Europäischen Union aus, nachdem sich im Referendum 2016 eine knappe Mehrheit von rund 52 Prozent für den Austritt ausgesprochen hatte. Es folgte eine Übergangsphase bis Ende 2020, in der das Unionsrecht weiter galt. Seit 2021 regelt ein Handels- und Kooperationsabkommen die Beziehungen.\n\nDas Abkommen sieht zollfreien Handel mit Waren vor, sofern Ursprungsregeln eingehalten werden. Dennoch sind neue Handelshemmnisse entstanden, etwa durch Zollformalitäten und Kontrollen. Für Nordirland gelten besondere Regeln, um eine harte Grenze auf der irischen Insel zu vermeiden. Dienstleistungen, insbesondere Finanzdienstleistungen, sind vom Abkommen nur begrenzt erfasst.',
    'f',
    ['In der Übergangsphase bis Ende 2020 galt das Unionsrecht im Vereinigten Königreich weiter.',
      'Seit dem Austritt fallen für Waren zwischen der Union und dem Vereinigten Königreich keinerlei Formalitäten an.',
      'Für Nordirland gelten besondere Regelungen.',
      'Finanzdienstleistungen sind vom Handels- und Kooperationsabkommen nur in begrenztem Umfang erfasst.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Es sind neue Zollformalitäten und Kontrollen entstanden. A, C und D stehen so im Text.'],

  ['Europäischer Gerichtshof für Menschenrechte',
    'Der Europäische Gerichtshof für Menschenrechte (EGMR) in Straßburg ist ein Organ des Europarats, nicht der Europäischen Union. Er überwacht die Einhaltung der Europäischen Menschenrechtskonvention durch die 46 Mitgliedstaaten des Europarats. Einzelpersonen können sich an den Gerichtshof wenden, nachdem sie den innerstaatlichen Rechtsweg ausgeschöpft haben.\n\nDie Urteile des EGMR sind für den betroffenen Staat verbindlich; ihre Umsetzung wird vom Ministerkomitee des Europarats überwacht. Der Gerichtshof kann jedoch keine nationalen Gesetze aufheben. Die Europäische Union ist der Konvention trotz einer entsprechenden Verpflichtung in ihren Verträgen bislang nicht beigetreten.',
    'r',
    ['Der EGMR ist das oberste Gericht der Europäischen Union.',
      'Eine Person kann sich an den EGMR wenden, bevor sie die nationalen Gerichte angerufen hat.',
      'Der EGMR kann nationale Gesetze für nichtig erklären.',
      'Die Europäische Union ist bislang nicht Vertragspartei der Europäischen Menschenrechtskonvention.'],
    3,
    'D entspricht dem letzten Satz. A verwechselt EGMR und Gerichtshof der EU. B widerspricht der Ausschöpfung des innerstaatlichen Rechtswegs. C widerspricht dem Text.'],

  ['Städtepartnerschaften',
    'Nach dem Zweiten Weltkrieg entstanden zahlreiche Partnerschaften zwischen deutschen und französischen Städten. Sie sollten Begegnungen zwischen den Bürgerinnen und Bürgern ermöglichen und zur Aussöhnung beitragen. Heute gibt es tausende solcher Partnerschaften, und viele umfassen auch Städte in Mittel- und Osteuropa.\n\nUntersuchungen zeigen, dass die Aktivität der Partnerschaften sehr unterschiedlich ist. Während einige regelmäßige Austausche von Schulklassen, Vereinen und Verwaltungen pflegen, bestehen andere fast nur noch auf dem Papier. Als entscheidend für eine lebendige Partnerschaft gilt das Engagement einzelner Personen und Vereine vor Ort. Die Union fördert Begegnungsprojekte im Rahmen ihres Programms für Bürgerinnen und Bürger.',
    'a',
    ['Alle Städtepartnerschaften pflegen heute einen regelmäßigen Austausch.',
      'Städtepartnerschaften bestehen ausschließlich zwischen deutschen und französischen Städten.',
      'Das Fehlen engagierter Personen vor Ort kann dazu beitragen, dass eine Partnerschaft kaum noch aktiv ist.',
      'Die Union finanziert sämtliche Aktivitäten von Städtepartnerschaften.'],
    2,
    'C lässt sich aus der Bedeutung des Engagements vor Ort ableiten. A widerspricht den Partnerschaften, die fast nur auf dem Papier bestehen. B widerspricht der Einbeziehung Mittel- und Osteuropas. D übertreibt die Förderung von Begegnungsprojekten.'],

  ['Die europäische Hymne',
    'Die Melodie der Europahymne stammt aus dem letzten Satz der Neunten Sinfonie Ludwig van Beethovens, der auf Friedrich Schillers Gedicht „An die Freude“ beruht. Der Europarat wählte sie 1972 als seine Hymne; 1985 übernahmen die Staats- und Regierungschefs der Europäischen Gemeinschaften sie als offizielle Hymne.\n\nDie Hymne wird ohne Text gespielt. Damit soll vermieden werden, eine der vielen Sprachen Europas zu bevorzugen. Sie soll die nationalen Hymnen der Mitgliedstaaten nicht ersetzen, sondern die gemeinsamen Werte zum Ausdruck bringen. Ein Versuch, die Symbole der Union, einschließlich der Hymne, in einem Verfassungsvertrag festzuschreiben, scheiterte, nachdem dieser in Referenden in Frankreich und den Niederlanden abgelehnt worden war.',
    'r',
    ['Die Hymne wird mit dem deutschen Originaltext Schillers gesungen.',
      'Die Europahymne soll die Nationalhymnen der Mitgliedstaaten ersetzen.',
      'Der Europarat verwendete die Melodie als Hymne, bevor die Europäischen Gemeinschaften sie übernahmen.',
      'Der Verfassungsvertrag, der die Symbole festschreiben sollte, trat in Kraft.'],
    2,
    'C folgt aus den Jahreszahlen 1972 und 1985. A widerspricht dem Spielen ohne Text. B widerspricht dem Text. D widerspricht dem Scheitern des Verfassungsvertrags.'],

  ['Hanse',
    'Die Hanse war vom 12. bis zum 17. Jahrhundert ein Verbund von Kaufleuten und später von Städten, der den Handel im Nord- und Ostseeraum prägte. Zu ihren Hochzeiten gehörten ihr rund 200 Städte an, darunter Lübeck, Hamburg, Danzig und Riga. Die Hanse hatte weder eine feste Verfassung noch eine ständige gemeinsame Verwaltung oder ein eigenes Heer.\n\nIhre wichtigsten Entscheidungen wurden auf Hansetagen getroffen, zu denen allerdings nie alle Mitgliedsstädte Vertreter entsandten. Der Niedergang der Hanse wird unter anderem auf das Erstarken der Territorialstaaten und die Verlagerung der Handelswege in den Atlantik zurückgeführt. Heute wird der Begriff häufig genutzt, um Kooperationen im Ostseeraum zu bezeichnen.',
    'f',
    ['Zu den Hansestädten gehörten Städte an der Ostsee.',
      'Die Hanse verfügte über ein ständiges eigenes Heer und eine feste Verfassung.',
      'An den Hansetagen nahmen nicht immer alle Mitgliedsstädte teil.',
      'Die Verlagerung von Handelswegen trug zum Niedergang der Hanse bei.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text, der ausdrücklich weder Verfassung noch Heer nennt. A, C und D stehen so im Text.'],

  ['Übersetzung in den Institutionen',
    'Die Generaldirektion Übersetzung der Kommission ist einer der größten Übersetzungsdienste der Welt. Übersetzerinnen und Übersetzer arbeiten grundsätzlich in ihre Muttersprache, weil davon ausgegangen wird, dass Texte in der eigenen Sprache am präzisesten und natürlichsten formuliert werden.\n\nMaschinelle Übersetzung wird inzwischen in großem Umfang eingesetzt, um Entwürfe zu erstellen, die anschließend von Fachleuten überarbeitet werden. Bei Rechtstexten, deren Sprachfassungen gleichermaßen verbindlich sind, gilt eine sorgfältige menschliche Prüfung weiterhin als unverzichtbar. Nicht jedes Dokument wird in alle Amtssprachen übersetzt; interne Arbeitsdokumente liegen oft nur in einer oder wenigen Sprachen vor.',
    'a',
    ['Rechtstexte werden ausschließlich maschinell übersetzt.',
      'Eine Übersetzerin mit Muttersprache Polnisch übersetzt in der Regel aus anderen Sprachen ins Polnische.',
      'Alle Dokumente der Kommission liegen in allen Amtssprachen vor.',
      'Die Kommission setzt keine maschinelle Übersetzung ein.'],
    1,
    'B folgt aus dem Grundsatz, in die Muttersprache zu übersetzen. A widerspricht der unverzichtbaren menschlichen Prüfung. C widerspricht dem letzten Satz. D widerspricht dem umfangreichen Einsatz maschineller Übersetzung.'],

  ['Frauenwahlrecht in Europa',
    'Das Frauenwahlrecht wurde in Europa zu sehr unterschiedlichen Zeitpunkten eingeführt. Finnland gewährte Frauen bereits 1906 das aktive und passive Wahlrecht auf nationaler Ebene. In Deutschland und Österreich durften Frauen 1919 zum ersten Mal an nationalen Wahlen teilnehmen, in Frankreich erst 1945.\n\nIn der Schweiz erhielten Frauen das Wahlrecht auf Bundesebene erst 1971. Der letzte Kanton führte das Frauenstimmrecht auf kantonaler Ebene sogar erst 1990 ein, nachdem ihn das Bundesgericht dazu verpflichtet hatte. Historiker erklären die späte Einführung in der Schweiz unter anderem damit, dass dort die Männer selbst in Volksabstimmungen über die Ausweitung des Wahlrechts entscheiden mussten.',
    'r',
    ['Frauen in Frankreich konnten vor Frauen in Deutschland an nationalen Wahlen teilnehmen.',
      'In der Schweiz führten alle Kantone das Frauenstimmrecht gleichzeitig mit dem Bund 1971 ein.',
      'Finnland führte das Frauenwahlrecht auf nationaler Ebene früher ein als Deutschland.',
      'Das Frauenstimmrecht wurde in der Schweiz durch einen Beschluss des Bundesgerichts auf Bundesebene eingeführt.'],
    2,
    'C folgt aus den Jahreszahlen 1906 und 1919. A kehrt die Reihenfolge um. B widerspricht der Einführung im letzten Kanton erst 1990. D verwechselt Bundes- und Kantonsebene.'],

  ['Denkmalschutz und Klimaschutz',
    'Historische Gebäude verbrauchen oft viel Energie, weil sie schlecht gedämmt sind. Gleichzeitig schränkt der Denkmalschutz die Möglichkeiten zur energetischen Sanierung ein, etwa beim Austausch historischer Fenster oder bei der Dämmung von Fassaden. Daraus entstehen Zielkonflikte.\n\nFachleute weisen jedoch darauf hin, dass der Erhalt bestehender Gebäude auch aus Klimasicht Vorteile hat: In der Bausubstanz ist bereits eine große Menge an Energie und Emissionen gebunden, die bei Abriss und Neubau erneut anfallen würde. Zudem lassen sich viele Gebäude durch angepasste Maßnahmen, etwa Innendämmung oder moderne Heiztechnik, deutlich verbessern, ohne ihr Erscheinungsbild zu verändern.',
    'h',
    ['Historische Gebäude sollten abgerissen und durch energieeffiziente Neubauten ersetzt werden.',
      'Denkmalschutz und Klimaschutz stehen zwar in einem Spannungsverhältnis, doch der Erhalt und die angepasste Sanierung alter Gebäude können auch dem Klima dienen.',
      'Denkmalgeschützte Gebäude lassen sich energetisch überhaupt nicht verbessern.',
      'Der Denkmalschutz hat keinerlei Einfluss auf die Sanierungsmöglichkeiten.'],
    1,
    'B fasst Zielkonflikt und Lösungsansatz zusammen. A widerspricht dem Vorteil des Erhalts. C widerspricht den angepassten Maßnahmen. D widerspricht dem ersten Absatz.'],

  ['Tag der Europäischen Union',
    'Der 9. Mai wird in der Europäischen Union als Europatag begangen. Das Datum erinnert an die Erklärung, die der französische Außenminister Robert Schuman am 9. Mai 1950 abgab und in der er die Zusammenlegung der Kohle- und Stahlproduktion vorschlug. Diese Erklärung gilt als Ausgangspunkt der heutigen Europäischen Union.\n\nDer Europarat begeht dagegen den 5. Mai als Europatag, den Tag seiner Gründung im Jahr 1949. In einigen Staaten hat der 9. Mai zudem eine andere historische Bedeutung, da dort an diesem Tag das Ende des Zweiten Weltkriegs in Europa gefeiert wird. Die Organe der Union öffnen rund um den Europatag häufig ihre Türen für Besucherinnen und Besucher.',
    'r',
    ['Der Europarat und die Europäische Union feiern den Europatag am selben Tag.',
      'Die Schuman-Erklärung wurde am Tag der Gründung des Europarats abgegeben.',
      'Der Europarat wurde vor der Schuman-Erklärung gegründet.',
      'Der 9. Mai hat in allen europäischen Staaten dieselbe historische Bedeutung.'],
    2,
    'C folgt aus den Jahreszahlen 1949 und 1950. A widerspricht den unterschiedlichen Daten. B widerspricht dem 5. Mai als Gründungstag. D widerspricht der abweichenden Bedeutung in einigen Staaten.'],

  ['Kolonialismus und Museen',
    'Viele europäische Museen besitzen Kulturgüter, die während der Kolonialzeit aus Afrika, Asien und Ozeanien nach Europa gelangten. Ein Teil dieser Objekte wurde erworben, ein anderer Teil jedoch unter Zwang oder im Zuge militärischer Gewalt geraubt. Seit einigen Jahren verstärken Museen die Provenienzforschung, um die Herkunft einzelner Objekte zu klären.\n\nMehrere Staaten haben begonnen, Objekte an die Herkunftsländer zurückzugeben, etwa die sogenannten Benin-Bronzen. Die Rückgaben werden unterschiedlich bewertet. Befürworter sehen darin eine notwendige Anerkennung historischen Unrechts. Andere verweisen auf praktische Fragen, etwa wer im Herkunftsland rechtmäßiger Empfänger ist. Eine allgemeine rechtliche Pflicht zur Rückgabe besteht bislang in den meisten Staaten nicht.',
    'a',
    ['Alle Kulturgüter aus der Kolonialzeit in europäischen Museen wurden geraubt.',
      'Die Klärung der Herkunft eines Objekts kann eine Voraussetzung für die Entscheidung über seine Rückgabe sein.',
      'In den meisten Staaten sind Museen gesetzlich verpflichtet, koloniale Kulturgüter zurückzugeben.',
      'Die Rückgabe der Benin-Bronzen ist unumstritten.'],
    1,
    'B lässt sich daraus ableiten, dass Objekte teils erworben, teils geraubt wurden und Provenienzforschung dies klären soll. A widerspricht dieser Unterscheidung. C widerspricht dem Fehlen einer allgemeinen Pflicht. D widerspricht den unterschiedlichen Bewertungen.'],

  ['Einheitliche Europäische Akte',
    'Die Einheitliche Europäische Akte von 1986 war die erste umfassende Änderung der Gründungsverträge. Sie setzte das Ziel, den Binnenmarkt bis Ende 1992 zu vollenden. Um dies zu ermöglichen, wurde für viele binnenmarktbezogene Entscheidungen im Rat die qualifizierte Mehrheit anstelle der Einstimmigkeit eingeführt.\n\nZudem stärkte die Akte die Rolle des Europäischen Parlaments durch das Verfahren der Zusammenarbeit, das dem Parlament allerdings noch kein Vetorecht verlieh. Erst mit späteren Vertragsänderungen wurde das Parlament im Mitentscheidungsverfahren zu einem gleichberechtigten Gesetzgeber neben dem Rat. Die Akte schrieb außerdem die Europäische Politische Zusammenarbeit in der Außenpolitik erstmals vertraglich fest.',
    'r',
    ['Die Einheitliche Europäische Akte machte das Parlament zum gleichberechtigten Gesetzgeber.',
      'Durch die Einheitliche Europäische Akte wurde im Rat für viele Binnenmarktentscheidungen die Einstimmigkeit abgeschafft.',
      'Die Einheitliche Europäische Akte verlieh dem Parlament ein Vetorecht in der Gesetzgebung.',
      'Die außenpolitische Zusammenarbeit war bereits in den Römischen Verträgen geregelt.'],
    1,
    'B folgt aus der Einführung der qualifizierten Mehrheit für viele Binnenmarktentscheidungen. A und C widersprechen dem zweiten Absatz. D widerspricht der erstmaligen vertraglichen Festschreibung durch die Akte.'],

  ['Sprachenvielfalt',
    'In Europa werden neben den 24 Amtssprachen der Union zahlreiche Regional- und Minderheitensprachen gesprochen, etwa Baskisch, Katalanisch, Sorbisch oder Friesisch. Einige dieser Sprachen haben Millionen Sprecherinnen und Sprecher, andere nur noch wenige hundert und gelten als vom Aussterben bedroht.\n\nDie Europäische Charta der Regional- oder Minderheitensprachen des Europarats verpflichtet die Staaten, die sie ratifiziert haben, diese Sprachen in Bildung, Medien und öffentlichem Leben zu fördern. Nicht alle Mitgliedstaaten der Union haben die Charta ratifiziert. Katalanisch hat in den Organen der Union einen Sonderstatus: Es ist keine Amtssprache, kann aber in bestimmten Fällen verwendet werden.',
    'f',
    ['Einige Regional- und Minderheitensprachen haben mehr als eine Million Sprecher.',
      'Katalanisch ist eine der 24 Amtssprachen der Union.',
      'Die Charta der Regional- oder Minderheitensprachen wurde vom Europarat geschaffen.',
      'Nicht alle Mitgliedstaaten der Union sind an die Charta gebunden.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Katalanisch ist keine Amtssprache, hat aber einen Sonderstatus. A, C und D ergeben sich aus dem Text.'],

  ['Industrielle Revolution',
    'Die Industrialisierung setzte in Großbritannien in der zweiten Hälfte des 18. Jahrhunderts ein und breitete sich im 19. Jahrhundert auf den europäischen Kontinent aus. Als begünstigende Faktoren für Großbritannien gelten unter anderem reiche Kohlevorkommen, ein entwickeltes Finanzsystem, vergleichsweise hohe Löhne, die den Einsatz von Maschinen lohnend machten, und der Zugang zu überseeischen Märkten.\n\nDie Industrialisierung steigerte langfristig den Wohlstand erheblich. In den ersten Jahrzehnten waren die Lebensbedingungen vieler Arbeiterinnen und Arbeiter in den schnell wachsenden Städten jedoch schlecht; die Löhne stiegen zunächst nur langsam, und Kinderarbeit war verbreitet. Historiker streiten bis heute darüber, wann sich der Lebensstandard der breiten Bevölkerung spürbar verbesserte.',
    'a',
    ['Die Industrialisierung begann gleichzeitig in allen europäischen Staaten.',
      'Hohe Löhne können einen Anreiz schaffen, Arbeit durch Maschinen zu ersetzen.',
      'Die Industrialisierung verbesserte die Lebensbedingungen aller Arbeiter unmittelbar.',
      'Unter Historikern besteht Einigkeit darüber, wann sich der Lebensstandard der Bevölkerung verbesserte.'],
    1,
    'B ergibt sich aus der Begründung, hohe Löhne hätten den Einsatz von Maschinen lohnend gemacht. A widerspricht der Ausbreitung von Großbritannien aus. C widerspricht den schlechten Lebensbedingungen in den ersten Jahrzehnten. D widerspricht dem anhaltenden Streit.'],

  ['Europäische Nachbarschaftspolitik',
    'Die Europäische Nachbarschaftspolitik richtet sich an 16 Staaten im Osten und Süden der Union, darunter die Ukraine, Georgien, Marokko und Tunesien. Sie soll Stabilität, Sicherheit und Wohlstand in der Nachbarschaft fördern. Die Partnerländer erhalten finanzielle Unterstützung und engere Handelsbeziehungen, wenn sie politische und wirtschaftliche Reformen umsetzen.\n\nDie Nachbarschaftspolitik ist von der Erweiterungspolitik zu unterscheiden: Sie begründet keine Beitrittsperspektive. Einige Partnerländer im Osten haben inzwischen dennoch einen Beitrittsantrag gestellt und den Kandidatenstatus erhalten, womit für sie die Regeln der Erweiterungspolitik gelten. Kritiker bemängeln, dass die Union bei der Förderung demokratischer Reformen im Süden häufig Stabilität und Migrationskontrolle Vorrang gegeben habe.',
    'r',
    ['Die Teilnahme an der Nachbarschaftspolitik begründet einen Anspruch auf Mitgliedschaft in der Union.',
      'Die Nachbarschaftspolitik umfasst ausschließlich Staaten im Süden der Union.',
      'Einige Partnerländer der Nachbarschaftspolitik sind inzwischen Beitrittskandidaten.',
      'Die Unterstützung der Union ist nicht an Reformen geknüpft.'],
    2,
    'C steht im zweiten Absatz. A widerspricht dem fehlenden Beitrittsbezug. B widerspricht der Einbeziehung östlicher Staaten. D widerspricht der Bindung an Reformen.'],

  ['Europawahlen',
    'Das Europäische Parlament ist das einzige direkt gewählte Organ der Union. Die Wahlen finden alle fünf Jahre statt, und zwar nach dem Grundsatz der Verhältniswahl, die Einzelheiten des Wahlverfahrens regeln jedoch weitgehend die Mitgliedstaaten. So unterscheiden sich etwa das Mindestwahlalter und die Existenz einer Sperrklausel zwischen den Staaten.\n\nDie Sitze werden nach dem Prinzip der degressiven Proportionalität verteilt: Größere Mitgliedstaaten haben mehr Sitze als kleinere, aber ein Abgeordneter aus einem kleinen Mitgliedstaat vertritt weniger Einwohner als einer aus einem großen. Die Wahlbeteiligung sank lange Zeit von Wahl zu Wahl, stieg jedoch 2019 erstmals wieder deutlich an.',
    'a',
    ['Das Wahlverfahren für die Europawahlen ist in allen Mitgliedstaaten identisch.',
      'Eine Stimme in Malta hat bei der Sitzverteilung rechnerisch mehr Gewicht als eine Stimme in Deutschland.',
      'Alle Mitgliedstaaten haben gleich viele Abgeordnete.',
      'Die Wahlbeteiligung ist seit der ersten Wahl ununterbrochen gesunken.'],
    1,
    'B folgt aus der degressiven Proportionalität: Ein Abgeordneter aus einem kleinen Staat vertritt weniger Einwohner. A widerspricht den nationalen Unterschieden. C widerspricht dem Mehr an Sitzen für größere Staaten. D widerspricht dem Anstieg 2019.'],
]);

EPSO_VERBAL_ADD('f', [
  ['Europäische Krankenversicherungskarte',
    'Mit der Europäischen Krankenversicherungskarte erhalten Versicherte bei einem vorübergehenden Aufenthalt in einem anderen Mitgliedstaat medizinisch notwendige Leistungen zu denselben Bedingungen und Kosten wie die Versicherten des Aufenthaltsstaats. Sie gilt auch in Island, Liechtenstein, Norwegen und der Schweiz.\n\nDie Karte ersetzt keine Reiseversicherung. Sie deckt weder private Behandlungen noch die Kosten eines Rücktransports ins Heimatland. Ist im Aufenthaltsstaat eine Zuzahlung üblich, muss auch der Reisende diese leisten. Wer gezielt ins Ausland reist, um sich dort behandeln zu lassen, kann sich nicht auf die Karte stützen; für geplante Behandlungen gelten eigene Regeln.',
    'r',
    ['Die Karte übernimmt die Kosten für einen Rücktransport ins Heimatland.',
      'Mit der Karte werden Reisende von allen Zuzahlungen befreit.',
      'Wer im Urlaub in Norwegen erkrankt, kann die Karte nutzen.',
      'Die Karte deckt auch geplante Behandlungen im Ausland.'],
    2,
    'C ist richtig, weil die Karte auch in Norwegen gilt. A widerspricht dem Text. B ist falsch, übliche Zuzahlungen fallen auch für Reisende an. D ist falsch, für geplante Behandlungen gelten eigene Regeln.'],

  ['Europäische Arbeitsbehörde',
    'Die Europäische Arbeitsbehörde (ELA) mit Sitz in Bratislava soll die Mitgliedstaaten dabei unterstützen, die Vorschriften zur Arbeitskräftemobilität und zur Koordinierung der sozialen Sicherheit fair und wirksam durchzusetzen. Sie koordiniert unter anderem gemeinsame Kontrollen nationaler Behörden, etwa auf Baustellen oder in der Saisonarbeit.\n\nDie ELA hat keine eigenen Kontrollbefugnisse gegenüber Unternehmen. Kontrollen finden nur statt, wenn die betroffenen Mitgliedstaaten zustimmen, und werden von deren Behörden durchgeführt. Zudem bietet die ELA Informationen für Arbeitnehmer und Arbeitgeber zu ihren Rechten und Pflichten bei grenzüberschreitender Beschäftigung an.',
    'f',
    ['Die ELA hat ihren Sitz in Bratislava.',
      'Die ELA kann Unternehmen ohne Zustimmung des betroffenen Mitgliedstaats eigenständig kontrollieren.',
      'Die ELA koordiniert gemeinsame Kontrollen nationaler Behörden.',
      'Die ELA informiert Arbeitnehmer über ihre Rechte bei grenzüberschreitender Beschäftigung.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Die ELA hat keine eigenen Kontrollbefugnisse, und Kontrollen setzen die Zustimmung der Mitgliedstaaten voraus. A, C und D stehen so im Text.'],

  ['Arbeitszeitrichtlinie',
    'Die Arbeitszeitrichtlinie legt Mindestanforderungen für die Arbeitszeitgestaltung fest. Die durchschnittliche wöchentliche Arbeitszeit darf einschließlich Überstunden 48 Stunden nicht überschreiten, wobei ein Bezugszeitraum von bis zu vier Monaten zugrunde gelegt werden kann. Beschäftigte haben Anspruch auf eine tägliche Ruhezeit von mindestens elf zusammenhängenden Stunden und auf mindestens vier Wochen bezahlten Jahresurlaub.\n\nDer Gerichtshof hat entschieden, dass Bereitschaftsdienst, den ein Arbeitnehmer am Arbeitsplatz verbringen muss, vollständig als Arbeitszeit gilt. Zudem müssen Arbeitgeber ein System zur Erfassung der täglichen Arbeitszeit einrichten. Die Mitgliedstaaten dürfen unter bestimmten Voraussetzungen erlauben, dass Beschäftigte freiwillig länger arbeiten.',
    'a',
    ['Ein Beschäftigter darf in einer einzelnen Woche niemals mehr als 48 Stunden arbeiten.',
      'Eine Ärztin, die im Krankenhaus Bereitschaftsdienst leistet, arbeitet in dieser Zeit im Sinne der Richtlinie.',
      'Die Richtlinie garantiert sechs Wochen bezahlten Urlaub.',
      'Arbeitgeber sind nicht verpflichtet, die Arbeitszeit zu erfassen.'],
    1,
    'B folgt aus der Rechtsprechung zum Bereitschaftsdienst am Arbeitsplatz. A übersieht den Bezugszeitraum für den Durchschnitt. C übertreibt, garantiert sind mindestens vier Wochen. D widerspricht der Erfassungspflicht.'],

  ['Einsamkeit',
    'Einsamkeit wird zunehmend als Problem der öffentlichen Gesundheit wahrgenommen. Nach Erhebungen der Union fühlt sich ein erheblicher Teil der Bevölkerung zumindest zeitweise einsam. Anders als oft angenommen, sind junge Erwachsene dabei nicht seltener betroffen als ältere Menschen; in einigen Erhebungen berichten sie sogar häufiger von Einsamkeit.\n\nEinsamkeit ist nicht gleichbedeutend mit sozialer Isolation: Man kann viele Kontakte haben und sich dennoch einsam fühlen, und umgekehrt können Menschen mit wenigen Kontakten zufrieden sein. Anhaltende Einsamkeit wird in Studien mit einem erhöhten Risiko für Depressionen und Herz-Kreislauf-Erkrankungen in Verbindung gebracht.',
    'r',
    ['Wer viele soziale Kontakte hat, kann sich nicht einsam fühlen.',
      'Ältere Menschen sind nach allen Erhebungen deutlich häufiger einsam als junge Erwachsene.',
      'Einsamkeit und soziale Isolation bezeichnen dasselbe Phänomen.',
      'In einigen Erhebungen geben junge Erwachsene häufiger an, sich einsam zu fühlen, als ältere Menschen.'],
    3,
    'D steht so im Text. A und C widersprechen der Unterscheidung von Einsamkeit und Isolation. B widerspricht den Erhebungsergebnissen.'],

  ['Europäische Säule sozialer Rechte',
    'Die Europäische Säule sozialer Rechte umfasst 20 Grundsätze, etwa zu fairen Löhnen, Gleichstellung, Kinderbetreuung und sozialem Schutz. Sie wurde 2017 von Parlament, Rat und Kommission feierlich proklamiert. Die Säule selbst ist nicht rechtsverbindlich; ihre Umsetzung erfolgt über Rechtsakte der Union und Maßnahmen der Mitgliedstaaten.\n\nIm Aktionsplan zur Säule wurden drei Kernziele für 2030 festgelegt: Mindestens 78 Prozent der 20- bis 64-Jährigen sollen erwerbstätig sein, mindestens 60 Prozent der Erwachsenen sollen jährlich an einer Weiterbildung teilnehmen, und die Zahl der von Armut oder sozialer Ausgrenzung bedrohten Menschen soll um mindestens 15 Millionen sinken.',
    'r',
    ['Die Grundsätze der Säule sind unmittelbar einklagbar.',
      'Bis 2030 sollen mindestens 60 Prozent der Erwachsenen jährlich an einer Weiterbildung teilnehmen.',
      'Die Säule wurde allein von der Kommission beschlossen.',
      'Ziel ist eine Erwerbstätigenquote von 60 Prozent bis 2030.'],
    1,
    'B entspricht dem zweiten Kernziel. A widerspricht der fehlenden Rechtsverbindlichkeit. C ist falsch, die Säule wurde von drei Organen proklamiert. D verwechselt die Zielwerte, die Erwerbstätigenquote soll 78 Prozent erreichen.'],

  ['Übergewicht bei Kindern',
    'In vielen Mitgliedstaaten ist ein erheblicher Teil der Kinder übergewichtig. Übergewicht im Kindesalter setzt sich häufig im Erwachsenenalter fort und erhöht das Risiko für Diabetes und Herz-Kreislauf-Erkrankungen. Kinder aus Familien mit niedrigem Einkommen sind in den meisten Ländern häufiger betroffen.\n\nAls wirksam gelten Maßnahmen, die an mehreren Stellen ansetzen: ein gesundes Angebot in Schulkantinen, mehr Bewegung im Schulalltag, Beschränkungen der an Kinder gerichteten Werbung für ungesunde Lebensmittel und Steuern auf stark zuckerhaltige Getränke. Einzelmaßnahmen, etwa reine Informationskampagnen, zeigen dagegen oft nur geringe Wirkung.',
    'h',
    ['Übergewicht bei Kindern ist ein reines Problem mangelnder Information der Eltern.',
      'Übergewicht bei Kindern hat langfristige gesundheitliche Folgen und lässt sich am ehesten durch ein Bündel verschiedener Maßnahmen verringern.',
      'Steuern auf zuckerhaltige Getränke sind die einzige wirksame Maßnahme gegen Übergewicht bei Kindern.',
      'Kinder aus einkommensstarken Familien sind häufiger übergewichtig.'],
    1,
    'B fasst Problem und empfohlenen Ansatz zusammen. A widerspricht der geringen Wirkung reiner Informationskampagnen. C widerspricht dem Bündelansatz. D kehrt den sozialen Zusammenhang um.'],

  ['Entsendung von Arbeitnehmern',
    'Entsandte Arbeitnehmer sind Beschäftigte, die von ihrem Arbeitgeber vorübergehend in einen anderen Mitgliedstaat geschickt werden, um dort eine Dienstleistung zu erbringen. Nach der überarbeiteten Entsenderichtlinie haben sie Anspruch auf dieselbe Entlohnung wie vergleichbare Beschäftigte im Aufnahmestaat, einschließlich Zulagen, und nicht nur auf den dortigen Mindestlohn.\n\nDauert die Entsendung länger als zwölf Monate, in begründeten Fällen 18 Monate, gelten nahezu alle Arbeitsbedingungen des Aufnahmestaats. In der sozialen Sicherheit bleiben entsandte Arbeitnehmer dagegen grundsätzlich bis zu 24 Monate im System ihres Herkunftsstaats versichert.',
    'a',
    ['Entsandte Arbeitnehmer erhalten nach der Richtlinie nur den Mindestlohn des Aufnahmestaats.',
      'Ein für zehn Monate entsandter Arbeitnehmer bleibt in der Regel im Sozialversicherungssystem seines Herkunftsstaats.',
      'Nach zwölf Monaten wechselt ein entsandter Arbeitnehmer automatisch in die Sozialversicherung des Aufnahmestaats.',
      'Zulagen sind von der gleichen Entlohnung ausgenommen.'],
    1,
    'B folgt aus der Regel, dass entsandte Arbeitnehmer bis zu 24 Monate im Herkunftssystem versichert bleiben. A und D widersprechen dem Anspruch auf gleiche Entlohnung einschließlich Zulagen. C verwechselt die Frist für die Arbeitsbedingungen mit der für die Sozialversicherung.'],

  ['Pflegekräftemangel',
    'Die Zahl der pflegebedürftigen Menschen in der Union wird mit der Alterung der Bevölkerung voraussichtlich deutlich steigen. Gleichzeitig berichten viele Mitgliedstaaten bereits heute von einem Mangel an Pflegekräften. Die Arbeitsbedingungen in der Pflege gelten vielerorts als belastend, und die Bezahlung liegt häufig unter dem Durchschnitt vergleichbar qualifizierter Berufe.\n\nEin großer Teil der Pflege wird nicht von Fachkräften, sondern von Angehörigen geleistet, überwiegend von Frauen. Diese reduzieren dafür häufig ihre Erwerbstätigkeit, was sich später in niedrigeren Renten niederschlagen kann. Einige Mitgliedstaaten decken ihren Bedarf zudem durch Pflegekräfte aus anderen Mitgliedstaaten, was dort wiederum Lücken hinterlassen kann.',
    'r',
    ['Die Pflege wird in der Union überwiegend von Fachkräften geleistet.',
      'Die Anwerbung von Pflegekräften aus anderen Mitgliedstaaten kann den Mangel in deren Herkunftsländern verstärken.',
      'Pflegekräfte verdienen in der Regel mehr als vergleichbar qualifizierte Beschäftigte.',
      'Die Zahl der Pflegebedürftigen wird voraussichtlich sinken.'],
    1,
    'B entspricht dem letzten Satz. A widerspricht der großen Rolle der Angehörigen. C kehrt den Lohnvergleich um. D widerspricht der erwarteten Zunahme.'],

  ['Tabakpolitik',
    'Der Tabakkonsum ist die größte vermeidbare Ursache für Krankheit und vorzeitigen Tod in der Union. Die Tabakproduktrichtlinie schreibt unter anderem vor, dass kombinierte Warnhinweise aus Bild und Text 65 Prozent der Vorder- und Rückseite von Zigarettenpackungen bedecken müssen. Zigaretten mit charakteristischen Aromen wie Menthol sind verboten.\n\nIm Rahmen des Plans zur Krebsbekämpfung strebt die Union eine „tabakfreie Generation“ an, in der bis 2040 weniger als fünf Prozent der Bevölkerung Tabak konsumieren. Die Besteuerung von Tabak liegt weitgehend in der Zuständigkeit der Mitgliedstaaten, die Union legt jedoch Mindeststeuersätze fest. Die Preise für Zigaretten unterscheiden sich daher erheblich zwischen den Mitgliedstaaten.',
    'f',
    ['Mentholzigaretten dürfen in der Union nicht verkauft werden.',
      'Die Union legt Mindeststeuersätze für Tabak fest.',
      'Die Zigarettenpreise sind in allen Mitgliedstaaten nahezu gleich.',
      'Bis 2040 sollen weniger als fünf Prozent der Bevölkerung Tabak konsumieren.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Preise unterscheiden sich erheblich. A, B und D stehen so im Text.'],

  ['Gender-Pay-Gap',
    'Der unbereinigte geschlechtsspezifische Lohnunterschied gibt an, um wie viel Prozent der durchschnittliche Bruttostundenverdienst von Frauen unter dem von Männern liegt. In der Union beträgt er rund zwölf Prozent. Er berücksichtigt nicht, dass Frauen und Männer im Durchschnitt in unterschiedlichen Branchen, Berufen und Positionen arbeiten.\n\nDer bereinigte Lohnunterschied vergleicht dagegen Frauen und Männer mit vergleichbaren Merkmalen und fällt deutlich geringer aus. Er lässt sich jedoch nicht vollständig durch messbare Merkmale erklären. Zudem weisen Fachleute darauf hin, dass auch die Unterschiede in Branche und Position ihrerseits Folgen von Benachteiligungen sein können, etwa durch fehlende Kinderbetreuung.',
    'a',
    ['Der unbereinigte Lohnunterschied misst ausschließlich die ungleiche Bezahlung für gleiche Arbeit.',
      'Ein geringer bereinigter Lohnunterschied schließt eine Benachteiligung von Frauen auf dem Arbeitsmarkt nicht aus.',
      'Der bereinigte Lohnunterschied ist größer als der unbereinigte.',
      'Der bereinigte Lohnunterschied lässt sich vollständig durch messbare Merkmale erklären.'],
    1,
    'B ergibt sich aus dem Hinweis, dass Unterschiede in Branche und Position selbst Folge von Benachteiligung sein können. A widerspricht der Definition des unbereinigten Unterschieds. C kehrt das Verhältnis um. D widerspricht dem Text.'],

  ['Psychische Gesundheit am Arbeitsplatz',
    'Psychische Belastungen gehören zu den häufigsten arbeitsbedingten Gesundheitsproblemen in Europa. Als Risikofaktoren gelten unter anderem hoher Zeitdruck, geringe Handlungsspielräume, unklare Aufgaben, mangelnde Unterstützung durch Vorgesetzte und die ständige Erreichbarkeit über digitale Kommunikationsmittel.\n\nArbeitgeber sind nach dem Unionsrecht verpflichtet, Gefährdungen am Arbeitsplatz zu beurteilen; dazu gehören ausdrücklich auch psychosoziale Risiken. In der Praxis werden diese jedoch seltener erfasst als körperliche Gefährdungen. Einige Mitgliedstaaten haben ein „Recht auf Nichterreichbarkeit“ eingeführt, das Beschäftigten erlaubt, außerhalb der Arbeitszeit nicht auf dienstliche Nachrichten zu reagieren.',
    'r',
    ['Nach dem Unionsrecht müssen Arbeitgeber nur körperliche Gefährdungen beurteilen.',
      'Psychosoziale Risiken werden in der Praxis häufiger erfasst als körperliche.',
      'Alle Mitgliedstaaten haben ein Recht auf Nichterreichbarkeit eingeführt.',
      'Geringe Handlungsspielräume gelten als Risikofaktor für psychische Belastungen.'],
    3,
    'D steht in der Aufzählung der Risikofaktoren. A widerspricht der Einbeziehung psychosozialer Risiken. B kehrt die Praxis um. C verallgemeinert „einige Mitgliedstaaten“.'],

  ['Arzneimittelengpässe',
    'In den vergangenen Jahren kam es in der Union wiederholt zu Engpässen bei wichtigen Arzneimitteln, etwa bei Antibiotika und Fiebersäften für Kinder. Als Ursachen gelten unter anderem die Konzentration der Wirkstoffproduktion auf wenige Hersteller außerhalb Europas, niedrige Preise für Generika, die die Produktion wenig lohnend machen, und plötzliche Nachfragespitzen.\n\nDie Union hat eine Liste kritischer Arzneimittel erstellt und will die Versorgungssicherheit unter anderem durch eine stärkere Überwachung der Lieferketten und die Förderung der Produktion in Europa verbessern. Hersteller sollen verpflichtet werden, drohende Engpässe früher zu melden. Fachleute warnen, dass eine Rückverlagerung der Produktion Zeit brauche und die Kosten erhöhen könne.',
    'a',
    ['Engpässe betreffen ausschließlich neue, patentgeschützte Arzneimittel.',
      'Eine Produktion in Europa könnte die Versorgung sicherer, aber auch teurer machen.',
      'Die Wirkstoffproduktion ist auf viele Hersteller weltweit verteilt.',
      'Die Rückverlagerung der Produktion nach Europa lässt sich kurzfristig und ohne Mehrkosten umsetzen.'],
    1,
    'B lässt sich aus dem Ziel der Versorgungssicherheit und der Warnung vor höheren Kosten ableiten. A widerspricht den Beispielen und der Rolle der Generika. C widerspricht der Konzentration auf wenige Hersteller. D widerspricht der Warnung der Fachleute.'],

  ['Mutterschutz und Elternzeit',
    'Nach der Richtlinie zur Vereinbarkeit von Beruf und Privatleben hat jeder Elternteil Anspruch auf mindestens vier Monate Elternurlaub, von denen mindestens zwei Monate nicht auf den anderen Elternteil übertragen werden können. Diese beiden Monate müssen angemessen vergütet werden; die Höhe legen die Mitgliedstaaten fest.\n\nVäter oder gleichgestellte zweite Elternteile haben zudem Anspruch auf mindestens zehn Arbeitstage Vaterschaftsurlaub rund um die Geburt. Beschäftigte mit Kindern bis zu einem bestimmten Alter sowie pflegende Angehörige können flexible Arbeitsregelungen beantragen; der Arbeitgeber muss einen solchen Antrag prüfen und eine Ablehnung begründen, ist aber nicht verpflichtet, ihm zu entsprechen.',
    'r',
    ['Ein Elternteil kann seinen gesamten Elternurlaub auf den anderen übertragen.',
      'Die Richtlinie legt die genaue Höhe der Vergütung des Elternurlaubs fest.',
      'Arbeitgeber müssen jedem Antrag auf flexible Arbeitsregelungen zustimmen.',
      'Ein Arbeitgeber, der einen Antrag auf flexible Arbeitszeiten ablehnt, muss die Ablehnung begründen.'],
    3,
    'D entspricht dem letzten Satz. A widerspricht den zwei nicht übertragbaren Monaten. B ist falsch, die Höhe legen die Mitgliedstaaten fest. C widerspricht dem fehlenden Anspruch auf Zustimmung.'],

  ['Obdachlosigkeit',
    'Obdachlosigkeit hat in vielen Mitgliedstaaten in den vergangenen Jahren zugenommen. Genaue Zahlen sind schwer zu ermitteln, da die Staaten unterschiedliche Definitionen verwenden: Manche zählen nur Menschen, die auf der Straße leben, andere auch Personen in Notunterkünften oder solche, die vorübergehend bei Bekannten unterkommen.\n\nAls vielversprechender Ansatz gilt „Housing First“: Obdachlose Menschen erhalten zunächst ohne Vorbedingungen eine eigene Wohnung und anschließend begleitende Unterstützung. Evaluationen zeigen hohe Quoten dauerhaft gesicherter Wohnverhältnisse. Finnland, das diesen Ansatz besonders konsequent verfolgt, ist eines der wenigen Länder, in denen die Obdachlosigkeit deutlich zurückgegangen ist.',
    'f',
    ['Die Mitgliedstaaten verwenden unterschiedliche Definitionen von Obdachlosigkeit.',
      'Bei „Housing First“ müssen Betroffene zunächst bestimmte Voraussetzungen erfüllen, bevor sie eine Wohnung erhalten.',
      'In Finnland ist die Obdachlosigkeit deutlich zurückgegangen.',
      'Die unterschiedlichen Definitionen erschweren den Vergleich der Zahlen zwischen den Mitgliedstaaten.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Die Wohnung wird ohne Vorbedingungen vergeben. A, C und D ergeben sich aus dem Text.'],

  ['Gesundheitsdatenraum',
    'Mit dem Europäischen Gesundheitsdatenraum sollen Patientinnen und Patienten einen einfacheren Zugang zu ihren elektronischen Gesundheitsdaten erhalten und diese mit Gesundheitsdienstleistern in anderen Mitgliedstaaten teilen können. Dazu gehören etwa Patientenkurzakten, elektronische Verschreibungen und Laborbefunde.\n\nDarüber hinaus sollen anonymisierte oder pseudonymisierte Gesundheitsdaten unter strengen Bedingungen für Forschung, Innovation und Politikgestaltung genutzt werden können. Die Nutzung erfolgt über nationale Stellen, die den Zugang genehmigen. Patienten sollen der sogenannten Sekundärnutzung ihrer Daten grundsätzlich widersprechen können. Datenschützer warnen dennoch vor Risiken, da Gesundheitsdaten besonders sensibel sind.',
    'r',
    ['Gesundheitsdaten dürfen ohne jede Genehmigung für Forschungszwecke genutzt werden.',
      'Patienten können der Nutzung ihrer Daten für Forschungszwecke grundsätzlich widersprechen.',
      'Der Gesundheitsdatenraum soll nur innerhalb eines Mitgliedstaats funktionieren.',
      'Datenschützer halten den Gesundheitsdatenraum für völlig unbedenklich.'],
    1,
    'B entspricht dem Widerspruchsrecht gegen die Sekundärnutzung. A widerspricht der Genehmigung durch nationale Stellen. C widerspricht dem grenzüberschreitenden Austausch. D widerspricht den Warnungen der Datenschützer.'],

  ['Fachkräftemangel',
    'In zahlreichen Mitgliedstaaten fehlen Fachkräfte, vor allem im Gesundheitswesen, in der Informationstechnik, im Handwerk und im Baugewerbe. Gleichzeitig ist die Arbeitslosigkeit in manchen Regionen weiterhin hoch. Fachleute sprechen von einem Passungsproblem: Die Qualifikationen der Arbeitsuchenden entsprechen nicht immer den Anforderungen der offenen Stellen, oder Arbeitsuchende und Stellen befinden sich in unterschiedlichen Regionen.\n\nAls Gegenmaßnahmen gelten Weiterbildung, eine bessere Anerkennung ausländischer Abschlüsse, eine höhere Erwerbsbeteiligung von Frauen und älteren Menschen sowie gezielte Zuwanderung. Die Mobilität innerhalb der Union bleibt vergleichsweise gering; nur ein kleiner Teil der Erwerbstätigen lebt und arbeitet in einem anderen Mitgliedstaat.',
    'a',
    ['Hohe Arbeitslosigkeit und Fachkräftemangel können gleichzeitig bestehen.',
      'Der Fachkräftemangel betrifft ausschließlich den IT-Sektor.',
      'Die Mehrheit der Erwerbstätigen in der Union arbeitet in einem anderen Mitgliedstaat.',
      'Die Anerkennung ausländischer Abschlüsse spielt für den Fachkräftemangel keine Rolle.'],
    0,
    'A folgt aus dem beschriebenen Passungsproblem. B widerspricht der Aufzählung mehrerer Branchen. C widerspricht der geringen Mobilität. D widerspricht den genannten Gegenmaßnahmen.'],

  ['Rentensysteme',
    'Die Rentensysteme der Mitgliedstaaten unterscheiden sich erheblich. In den meisten Staaten beruht die gesetzliche Rente überwiegend auf dem Umlageverfahren: Die Beiträge der heutigen Erwerbstätigen finanzieren die Renten der heutigen Rentnerinnen und Rentner. Einige Staaten ergänzen dies durch verpflichtende kapitalgedeckte Säulen, bei denen Beiträge angelegt werden.\n\nUmlagefinanzierte Systeme reagieren empfindlich auf das Verhältnis von Beitragszahlern zu Rentenempfängern. Kapitalgedeckte Systeme sind davon weniger direkt betroffen, hängen aber von der Entwicklung der Finanzmärkte ab. Viele Mitgliedstaaten haben in den vergangenen Jahrzehnten das gesetzliche Rentenalter angehoben, teilweise gekoppelt an die Entwicklung der Lebenserwartung.',
    'r',
    ['Im Umlageverfahren wird jeder Beitrag für die spätere eigene Rente des Beitragszahlers angelegt.',
      'Kapitalgedeckte Systeme sind unabhängig von der Entwicklung der Finanzmärkte.',
      'In allen Mitgliedstaaten ist die gesetzliche Rente vollständig kapitalgedeckt.',
      'Ein sinkender Anteil von Beitragszahlern belastet umlagefinanzierte Systeme.'],
    3,
    'D folgt aus der Empfindlichkeit gegenüber dem Verhältnis von Beitragszahlern zu Rentenempfängern. A beschreibt das Kapitaldeckungsverfahren. B widerspricht der Abhängigkeit von den Finanzmärkten. C widerspricht dem überwiegenden Umlageverfahren.'],

  ['Luftverkehr und Gesundheit',
    'Fluglärm kann die Gesundheit von Anwohnern beeinträchtigen. Studien bringen dauerhafte Lärmbelastung mit Schlafstörungen, Bluthochdruck und bei Kindern mit Beeinträchtigungen der Lesefähigkeit in Verbindung. Die Weltgesundheitsorganisation empfiehlt deutlich niedrigere Lärmwerte, als sie in der Umgebung vieler Flughäfen gemessen werden.\n\nZur Minderung des Lärms setzen Flughäfen auf leisere Flugzeuge, lärmabhängige Landegebühren, veränderte Anflugverfahren und Nachtflugbeschränkungen. Solche Beschränkungen werden von Fluggesellschaften häufig mit Hinweis auf wirtschaftliche Nachteile kritisiert. Die Union schreibt ein ausgewogenes Verfahren vor, bei dem Betriebsbeschränkungen erst nach Prüfung anderer Maßnahmen eingeführt werden sollen.',
    'r',
    ['Die gemessenen Lärmwerte an vielen Flughäfen liegen unter den Empfehlungen der WHO.',
      'Nach dem Unionsrecht sollen Betriebsbeschränkungen erst nach Prüfung anderer Maßnahmen eingeführt werden.',
      'Fluggesellschaften unterstützen Nachtflugbeschränkungen in der Regel.',
      'Fluglärm hat nach den Studien keinen Einfluss auf Kinder.'],
    1,
    'B beschreibt das ausgewogene Verfahren. A kehrt das Verhältnis zu den WHO-Empfehlungen um. C widerspricht der Kritik der Fluggesellschaften. D widerspricht den Beeinträchtigungen der Lesefähigkeit.'],

  ['Soziale Wirtschaft',
    'Zur Sozialwirtschaft zählen Genossenschaften, Vereine, Stiftungen und Sozialunternehmen, deren Hauptziel nicht die Gewinnmaximierung, sondern ein sozialer oder ökologischer Zweck ist. Erzielte Gewinne werden überwiegend reinvestiert. In der Union arbeiten Millionen Menschen in diesem Sektor, etwa in der Pflege, der Arbeitsmarktintegration oder im genossenschaftlichen Wohnungsbau.\n\nSozialunternehmen haben häufig Schwierigkeiten, Finanzierung zu erhalten, weil Banken ihre Geschäftsmodelle schwer einschätzen können. Die Union unterstützt sie über Programme wie InvestEU und den Europäischen Sozialfonds Plus. Die rechtlichen Rahmenbedingungen unterscheiden sich stark zwischen den Mitgliedstaaten; nicht alle kennen eine eigene Rechtsform für Sozialunternehmen.',
    'a',
    ['Unternehmen der Sozialwirtschaft dürfen keine Gewinne erzielen.',
      'Die Schwierigkeit, Geschäftsmodelle von Sozialunternehmen einzuschätzen, kann ihren Zugang zu Krediten erschweren.',
      'Alle Mitgliedstaaten haben eine einheitliche Rechtsform für Sozialunternehmen.',
      'Die Sozialwirtschaft ist in der Union ein unbedeutender Arbeitgeber.'],
    1,
    'B folgt aus dem zweiten Absatz. A ist falsch, Gewinne werden überwiegend reinvestiert, nicht verboten. C widerspricht den unterschiedlichen Rahmenbedingungen. D widerspricht den Millionen Beschäftigten.'],

  ['Gesundheitsausgaben',
    'Die Gesundheitsausgaben machen in den meisten Mitgliedstaaten zwischen sieben und zwölf Prozent der Wirtschaftsleistung aus. Höhere Ausgaben gehen nicht automatisch mit einer höheren Lebenserwartung einher: Einige Staaten mit vergleichsweise niedrigen Ausgaben erreichen ähnliche Werte wie Staaten mit deutlich höheren Ausgaben.\n\nFachleute führen dies unter anderem darauf zurück, dass die Lebenserwartung stark von Faktoren außerhalb des Gesundheitssystems abhängt, etwa von Ernährung, Rauchen, Bildung und Einkommen. Zudem unterscheiden sich die Systeme darin, wie effizient sie die Mittel einsetzen, etwa beim Verhältnis von Vorsorge und Behandlung.',
    'h',
    ['Die Lebenserwartung eines Landes hängt ausschließlich von seinen Gesundheitsausgaben ab.',
      'Staaten mit niedrigen Gesundheitsausgaben haben immer eine geringere Lebenserwartung.',
      'Die Höhe der Gesundheitsausgaben allein erklärt Unterschiede in der Lebenserwartung nur begrenzt, da auch Lebensumstände und Effizienz eine Rolle spielen.',
      'Vorsorge spielt für die Effizienz von Gesundheitssystemen keine Rolle.'],

    'C fasst beide Absätze zusammen. A und B widersprechen dem ersten Absatz. D widerspricht dem Hinweis auf das Verhältnis von Vorsorge und Behandlung.'],

  ['Jugendgarantie',
    'Mit der Jugendgarantie haben sich die Mitgliedstaaten verpflichtet, allen jungen Menschen unter 30 Jahren innerhalb von vier Monaten, nachdem sie arbeitslos geworden sind oder die Schule verlassen haben, ein hochwertiges Angebot für eine Beschäftigung, eine Weiterbildung, eine Ausbildung oder ein Praktikum zu unterbreiten.\n\nDie Jugendgarantie ist eine politische Verpflichtung, kein einklagbarer Rechtsanspruch. Die Jugendarbeitslosigkeit ist seit ihrer Einführung in vielen Mitgliedstaaten deutlich gesunken; wie viel davon auf die Jugendgarantie und wie viel auf die allgemeine Konjunktur zurückgeht, ist schwer zu bestimmen. Kritisiert wird zudem, dass nicht alle Angebote die angestrebte Qualität erreichen.',
    'r',
    ['Junge Menschen können ein Angebot nach der Jugendgarantie vor Gericht einklagen.',

      'Die Jugendgarantie richtet sich an junge Menschen unter 30 Jahren.',

  ['Barrierefreies Reisen',
    'Nach dem Unionsrecht haben Menschen mit Behinderungen und Personen mit eingeschränkter Mobilität bei Reisen mit Flugzeug, Bahn, Schiff und Fernbus Anspruch auf kostenlose Hilfeleistung, etwa beim Ein- und Aussteigen. Im Luftverkehr muss die Hilfe in der Regel mindestens 48 Stunden vor dem Abflug angemeldet werden.\n\nFluggesellschaften dürfen eine Beförderung nur aus Sicherheitsgründen verweigern, die gesetzlich festgelegt sind, oder wenn die Größe des Flugzeugs die Beförderung physisch unmöglich macht. Mobilitätshilfen wie Rollstühle werden kostenlos befördert. Wird ein Rollstuhl beschädigt, ist die Haftung der Fluggesellschaft nach geltendem internationalem Recht jedoch begrenzt, was Behindertenverbände kritisieren.',
    'f',
    ['Die Hilfeleistung für Personen mit eingeschränkter Mobilität ist kostenlos.',
      'Eine Fluggesellschaft kann die Beförderung eines Rollstuhlnutzers aus beliebigen Gründen verweigern.',
      'Im Luftverkehr sollte die Hilfeleistung in der Regel mindestens 48 Stunden vorher angemeldet werden.',

  ['Kinderarmut',
    'Fast jedes vierte Kind in der Union ist von Armut oder sozialer Ausgrenzung bedroht. Kinder, die in Armut aufwachsen, haben im Durchschnitt schlechtere Bildungschancen und einen schlechteren Gesundheitszustand, und sie sind als Erwachsene häufiger selbst von Armut betroffen.\n\nMit der Europäischen Garantie für Kinder haben sich die Mitgliedstaaten verpflichtet, bedürftigen Kindern den Zugang zu frühkindlicher Betreuung, Bildung, Gesundheitsversorgung, gesunder Ernährung und angemessenem Wohnraum zu sichern. Die Garantie ist eine Empfehlung des Rates; die Umsetzung und Finanzierung obliegen vor allem den Mitgliedstaaten, die dafür Mittel aus dem Europäischen Sozialfonds Plus nutzen können.',
    'a',
    ['Armut in der Kindheit kann sich bis ins Erwachsenenalter auswirken.',
      'Die Europäische Garantie für Kinder ist eine verbindliche Verordnung.',
      'Die Union finanziert die Garantie für Kinder vollständig selbst.',
      'Mehr als die Hälfte aller Kinder in der Union ist von Armut bedroht.'],
    0,
    'A folgt aus dem höheren Armutsrisiko im Erwachsenenalter. B widerspricht dem Charakter als Empfehlung. C widerspricht der vorrangigen Finanzierung durch die Mitgliedstaaten. D übertreibt, der Text nennt fast jedes vierte Kind.'],

  ['Vier-Tage-Woche',
    'In mehreren europäischen Ländern haben Unternehmen und Verwaltungen Pilotprojekte mit einer Vier-Tage-Woche bei vollem Lohn durchgeführt. In vielen dieser Projekte berichteten die Beschäftigten von geringerem Stress und besserer Vereinbarkeit von Beruf und Privatleben, während die Produktivität nach Angaben der Unternehmen weitgehend stabil blieb.\n\nKritiker geben zu bedenken, dass sich an solchen Projekten überwiegend Unternehmen beteiligen, die ohnehin von dem Modell überzeugt sind, und dass die Ergebnisse daher nicht ohne Weiteres auf die gesamte Wirtschaft übertragbar seien. In Branchen mit festen Präsenzzeiten, etwa in der Pflege oder im Einzelhandel, sei eine Arbeitszeitverkürzung zudem nur mit zusätzlichem Personal möglich.',
    'r',
    ['Die Pilotprojekte beweisen, dass die Vier-Tage-Woche in allen Branchen ohne Nachteile funktioniert.',
      'Die teilnehmenden Unternehmen wurden zufällig aus der gesamten Wirtschaft ausgewählt.',
      'Nach Angaben der Unternehmen ging die Produktivität in den meisten Projekten stark zurück.',
      'Die Auswahl der teilnehmenden Unternehmen könnte die Ergebnisse der Pilotprojekte beeinflusst haben.'],
    3,
    'D gibt den Einwand der Kritiker wieder. A übertreibt, gerade die Übertragbarkeit wird bezweifelt. B widerspricht der Selbstauswahl überzeugter Unternehmen. C widerspricht der weitgehend stabilen Produktivität.'],
]);

EPSO_VERBAL_ADD('g', [
  ['Gemeinsames Europäisches Asylsystem',
    'Nach der Dublin-Verordnung ist grundsätzlich derjenige Mitgliedstaat für die Prüfung eines Asylantrags zuständig, über den eine asylsuchende Person erstmals in die Union eingereist ist. Dies hat in der Vergangenheit Staaten an den Außengrenzen, etwa Italien und Griechenland, besonders stark belastet. Gleichzeitig reisten viele Asylsuchende ohne Registrierung in andere Mitgliedstaaten weiter.\n\nDas 2024 verabschiedete Migrations- und Asylpaket behält das Grundprinzip der Zuständigkeit des Ersteinreisestaats bei, führt aber einen Solidaritätsmechanismus ein. Mitgliedstaaten unter Migrationsdruck sollen unterstützt werden; die übrigen Staaten können wählen, ob sie Asylsuchende aufnehmen, finanzielle Beiträge leisten oder operative Unterstützung bereitstellen. Zudem sollen Asylanträge von Personen aus Staaten mit niedriger Anerkennungsquote in beschleunigten Grenzverfahren geprüft werden.',
    'r',
    ['Das Migrations- und Asylpaket hebt die Zuständigkeit des Ersteinreisestaats vollständig auf.',
      'Nach dem neuen Solidaritätsmechanismus müssen alle Mitgliedstaaten Asylsuchende aufnehmen.',
      'Ein Mitgliedstaat kann sich an der Solidarität beteiligen, ohne Asylsuchende aufzunehmen.',

    2,
