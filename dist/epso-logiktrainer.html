/* Fragenpool Sprachlogik – Block C: Umwelt, Klima, Energie */
EPSO_VERBAL_ADD('c', [
  ['Emissionshandel',
    'Das Emissionshandelssystem der Union (EU-EHS) legt eine Obergrenze für die Gesamtmenge an Treibhausgasen fest, die von den erfassten Anlagen ausgestoßen werden darf. Innerhalb dieser Grenze erhalten oder kaufen Unternehmen Zertifikate, die sie untereinander handeln können. Für jede Tonne CO2 muss ein Zertifikat abgegeben werden. Die Obergrenze sinkt jedes Jahr, sodass die Gesamtemissionen der erfassten Sektoren zurückgehen.\n\nDas System erfasst unter anderem Kraftwerke, energieintensive Industrien und den innereuropäischen Luftverkehr, seit 2024 auch den Seeverkehr. Für Gebäude und Straßenverkehr wird ein gesondertes System eingerichtet. Ein Unternehmen, das seine Emissionen kostengünstig senken kann, kann überschüssige Zertifikate verkaufen; so sollen Emissionen dort gemindert werden, wo es am wenigsten kostet.',
    'r',
    ['Das EU-EHS legt für jedes Unternehmen fest, wie viel es höchstens ausstoßen darf, ohne Handel zu erlauben.',
      'Der Straßenverkehr ist in dasselbe System wie die Kraftwerke einbezogen.',
      'Ein Unternehmen, das weniger ausstößt, als es Zertifikate besitzt, kann die übrigen Zertifikate verkaufen.',
      'Die Obergrenze für die Gesamtemissionen bleibt jedes Jahr gleich.'],
    2,
    'C folgt aus dem letzten Absatz. A widerspricht dem Handel der Zertifikate. B ist falsch, für den Straßenverkehr gibt es ein gesondertes System. D widerspricht der jährlich sinkenden Obergrenze.'],

  ['CO2-Grenzausgleich',
    'Mit dem CO2-Grenzausgleichssystem (CBAM) will die Union verhindern, dass Produktion in Länder mit weniger strengen Klimaschutzauflagen verlagert wird, ein Phänomen, das als „Carbon Leakage“ bezeichnet wird. Importeure bestimmter Waren wie Stahl, Zement, Aluminium und Düngemittel müssen künftig einen CO2-Preis zahlen, der dem Preis im Emissionshandel der Union entspricht.\n\nWurde im Herkunftsland bereits ein CO2-Preis gezahlt, kann dieser angerechnet werden. In einer Übergangsphase müssen Importeure lediglich über die in ihren Waren enthaltenen Emissionen berichten, ohne zu zahlen. Parallel dazu werden die kostenlosen Zertifikate, die Industrien in der Union bisher zum Schutz vor Carbon Leakage erhielten, schrittweise abgeschafft. Mehrere Handelspartner haben das System als protektionistisch kritisiert.',
    'a',
    ['Ein Importeur von Zement aus einem Land mit eigenem CO2-Preis zahlt in jedem Fall den vollen EU-Preis zusätzlich.',
      'Während der Übergangsphase entstehen Importeuren bereits Zahlungspflichten.',
      'Der CO2-Grenzausgleich soll die kostenlosen Zertifikate als Schutz vor Carbon Leakage ablösen.',
      'Das System gilt für sämtliche in die Union eingeführten Waren.'],
    2,
    'C folgt aus der parallelen Abschaffung der kostenlosen Zertifikate, die bisher denselben Zweck erfüllten. A widerspricht der Anrechnung. B widerspricht der reinen Berichtspflicht. D ist falsch, erfasst sind nur bestimmte Waren.'],

  ['Wiederherstellung der Natur',
    'Die Verordnung über die Wiederherstellung der Natur verpflichtet die Mitgliedstaaten, bis 2030 Wiederherstellungsmaßnahmen auf mindestens 20 Prozent der Land- und Meeresflächen der Union einzuleiten. Bis 2050 sollen alle wiederherstellungsbedürftigen Ökosysteme erfasst sein. Die Mitgliedstaaten müssen dazu nationale Wiederherstellungspläne erarbeiten.\n\nDie Verordnung war politisch stark umstritten. Vertreter der Landwirtschaft befürchteten Einschränkungen der Nutzung landwirtschaftlicher Flächen. Im Gesetzgebungsverfahren wurde deshalb eine „Notbremse“ aufgenommen, mit der Ziele für landwirtschaftliche Ökosysteme unter außergewöhnlichen Umständen ausgesetzt werden können. Die Verordnung verpflichtet Landwirte nicht unmittelbar zu bestimmten Maßnahmen; die Umsetzung obliegt den Mitgliedstaaten.',
    'r',
    ['Die Verordnung schreibt Landwirten unmittelbar vor, einen Teil ihrer Flächen stillzulegen.',
      'Bis 2030 müssen 20 Prozent der Flächen vollständig wiederhergestellt sein.',
      'Die Verordnung wurde ohne nennenswerten Widerstand verabschiedet.',
      'Unter außergewöhnlichen Umständen können Ziele für landwirtschaftliche Ökosysteme ausgesetzt werden.'],
    3,
    'D beschreibt die „Notbremse“. A widerspricht dem letzten Satz. B verwechselt „Maßnahmen einleiten“ mit „vollständig wiederherstellen“. C widerspricht der starken Umstrittenheit.'],

  ['Wärmepumpen',
    'Wärmepumpen entziehen der Umgebungsluft, dem Erdreich oder dem Grundwasser Wärme und heben sie mithilfe von Strom auf ein höheres Temperaturniveau. Aus einer Kilowattstunde Strom können sie je nach Bauart und Bedingungen drei bis fünf Kilowattstunden Wärme erzeugen. Ihre Effizienz sinkt jedoch, je größer der Unterschied zwischen der Temperatur der Wärmequelle und der benötigten Vorlauftemperatur ist.\n\nIn gut gedämmten Gebäuden mit Flächenheizungen arbeiten Wärmepumpen daher besonders effizient. In unsanierten Altbauten mit alten Heizkörpern sind sie zwar oft ebenfalls einsetzbar, erreichen dort aber in der Regel eine geringere Effizienz. Ob eine Wärmepumpe klimafreundlicher ist als eine Gasheizung, hängt auch davon ab, wie der verwendete Strom erzeugt wird.',
    'a',
    ['Wärmepumpen können in unsanierten Altbauten grundsätzlich nicht eingesetzt werden.',
      'An sehr kalten Wintertagen arbeitet eine Luftwärmepumpe in der Regel weniger effizient als an milden Tagen.',
      'Wärmepumpen sind unabhängig vom Strommix immer klimafreundlicher als Gasheizungen.',
      'Eine Wärmepumpe erzeugt aus einer Kilowattstunde Strom stets genau vier Kilowattstunden Wärme.'],
    1,
    'B folgt daraus, dass die Effizienz mit dem Temperaturunterschied sinkt, und an kalten Tagen ist die Außenluft als Wärmequelle kälter. A widerspricht dem Text („oft ebenfalls einsetzbar“). C widerspricht dem letzten Satz. D widerspricht der Spanne von drei bis fünf.'],

  ['Kreislaufwirtschaft',
    'In einer Kreislaufwirtschaft werden Produkte und Materialien so lange wie möglich genutzt, repariert und wiederverwertet, um den Verbrauch neuer Rohstoffe und die Menge an Abfällen zu verringern. Die Abfallhierarchie der Union legt eine Rangfolge fest: Vermeidung hat Vorrang vor Vorbereitung zur Wiederverwendung, diese vor Recycling, Recycling vor sonstiger Verwertung, etwa energetischer Nutzung, und diese wiederum vor der Beseitigung.\n\nDie Recyclingquote allein sagt daher wenig darüber aus, wie weit eine Volkswirtschaft auf dem Weg zur Kreislaufwirtschaft ist. Ein Land kann eine hohe Recyclingquote erreichen und dennoch pro Kopf sehr viel Abfall erzeugen. Der Anteil wiederverwendeter Materialien am gesamten Materialeinsatz liegt in der Union derzeit bei nur rund zwölf Prozent.',
    'r',
    ['Nach der Abfallhierarchie ist Recycling der Vermeidung von Abfall vorzuziehen.',
      'Die energetische Verwertung von Abfällen steht in der Abfallhierarchie über dem Recycling.',
      'Ein Land mit hoher Recyclingquote kann gleichzeitig ein hohes Abfallaufkommen pro Kopf haben.',
      'Mehr als die Hälfte der in der Union eingesetzten Materialien stammt aus Wiederverwendung.'],
    2,
    'C steht fast wörtlich im Text. A und B kehren die Rangfolge der Abfallhierarchie um. D widerspricht dem Anteil von rund zwölf Prozent.'],

  ['Grüne Wasserstoffwirtschaft',
    'Wasserstoff gilt als wichtiger Baustein, um Industriezweige zu dekarbonisieren, deren Prozesse sich nur schwer elektrifizieren lassen, etwa die Stahl- oder die Chemieindustrie. Als klimafreundlich gilt er jedoch nur, wenn er mithilfe von erneuerbarem Strom durch Elektrolyse hergestellt wird. Derzeit wird der weitaus größte Teil des Wasserstoffs noch aus Erdgas gewonnen, wobei erhebliche Mengen CO2 freigesetzt werden.\n\nDie Herstellung von grünem Wasserstoff ist mit Umwandlungsverlusten verbunden. Fachleute raten deshalb, ihn vorrangig dort einzusetzen, wo es keine effizienteren Alternativen gibt. Für die Beheizung von Wohngebäuden oder den Antrieb von Pkw gilt die direkte Nutzung von Strom in den meisten Fällen als effizienter.',
    'h',
    ['Wasserstoff sollte möglichst schnell in allen Bereichen eingesetzt werden, die bisher fossile Energie nutzen.',
      'Grüner Wasserstoff ist ein wertvoller, aber verlustbehafteter Energieträger, der vor allem dort eingesetzt werden sollte, wo direkte Elektrifizierung schwierig ist.',
      'Der heute verwendete Wasserstoff ist überwiegend klimaneutral.',
      'Wasserstoff ist für die Stahlindustrie ungeeignet.'],
    1,
    'B fasst den Text zusammen. A widerspricht der Empfehlung, Wasserstoff gezielt einzusetzen. C widerspricht der Herstellung aus Erdgas. D widerspricht dem ersten Satz.'],

  ['Luftqualität',
    'Luftverschmutzung ist nach Angaben der Europäischen Umweltagentur das größte umweltbedingte Gesundheitsrisiko in der Union. Besonders schädlich ist Feinstaub, der tief in die Lunge und den Blutkreislauf eindringen kann. Die Belastung ist in den vergangenen Jahrzehnten deutlich zurückgegangen, liegt aber an vielen Orten weiterhin über den Richtwerten der Weltgesundheitsorganisation.\n\nDie überarbeitete Luftqualitätsrichtlinie senkt die Grenzwerte schrittweise bis 2030, ohne sie vollständig an die WHO-Richtwerte anzugleichen. Bürgerinnen und Bürger erhalten zudem das Recht, Schadensersatz zu verlangen, wenn ihre Gesundheit durch einen Verstoß gegen die Vorschriften geschädigt wurde. Mitgliedstaaten können unter bestimmten Bedingungen eine Fristverlängerung beantragen.',
    'f',
    ['Die Feinstaubbelastung ist in der Union über die Jahrzehnte gesunken.',
      'Nach der überarbeiteten Richtlinie entsprechen die EU-Grenzwerte ab 2030 genau den Richtwerten der WHO.',
      'Unter bestimmten Umständen können Mitgliedstaaten mehr Zeit zur Einhaltung der Grenzwerte erhalten.',
      'Bei gesundheitlichen Schäden durch Verstöße gegen die Vorschriften kann Schadensersatz verlangt werden.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Die Grenzwerte werden gesenkt, aber nicht vollständig an die WHO-Richtwerte angeglichen. A, C und D stehen so im Text.'],

  ['Energieeffizienz',
    'Energieeffizienz wird in der Energiepolitik der Union häufig als „erster Brennstoff“ bezeichnet: Energie, die gar nicht erst verbraucht wird, muss weder erzeugt noch importiert werden und verursacht keine Emissionen. Nach dem Grundsatz „Energieeffizienz an erster Stelle“ sollen Behörden bei Planungs- und Investitionsentscheidungen prüfen, ob Effizienzmaßnahmen kostengünstiger sind als zusätzliche Energieversorgung.\n\nAllerdings führen Effizienzgewinne nicht immer zu einem entsprechend geringeren Verbrauch. Wird ein Gerät sparsamer, sinken die Betriebskosten, was zu einer intensiveren Nutzung führen kann. Dieser sogenannte Rebound-Effekt kann einen Teil der Einsparungen wieder aufzehren. Studien zufolge ist er meist begrenzt, in einzelnen Fällen aber erheblich.',
    'a',
    ['Effizienzgewinne führen immer zu einer proportionalen Senkung des Energieverbrauchs.',
      'Der Rebound-Effekt hebt die Einsparungen durch Effizienzmaßnahmen in der Regel vollständig auf.',
      'Wer nach dem Kauf eines sparsameren Autos mehr fährt, kann einen Teil der möglichen Einsparung wieder verbrauchen.',
      'Der Grundsatz „Energieeffizienz an erster Stelle“ verbietet Investitionen in neue Energieversorgung.'],
    2,
    'C ist ein Beispiel für den beschriebenen Rebound-Effekt. A widerspricht dem zweiten Absatz. B widerspricht der meist begrenzten Wirkung. D übertreibt, der Grundsatz verlangt nur eine Prüfung.'],

  ['Gletscherschmelze',
    'Die Gletscher der Alpen haben seit Mitte des 19. Jahrhunderts mehr als die Hälfte ihres Volumens verloren. In den besonders warmen Jahren 2022 und 2023 beschleunigte sich der Verlust erheblich. Fachleute gehen davon aus, dass ein großer Teil der kleineren Gletscher bis zum Ende des Jahrhunderts verschwinden wird, selbst wenn die Erderwärmung begrenzt werden kann.\n\nDer Rückgang hat Folgen weit über die Berge hinaus. Gletscher speichern im Winter Niederschlag und geben ihn im Sommer als Schmelzwasser ab. Kurzfristig kann die verstärkte Schmelze die Abflussmengen der Flüsse sogar erhöhen. Langfristig fehlt diese Wasserquelle jedoch gerade in trockenen Sommern, was Landwirtschaft, Wasserkraft und Binnenschifffahrt beeinträchtigen kann.',
    'r',
    ['Die verstärkte Gletscherschmelze führt sofort zu geringeren Abflussmengen der Flüsse.',
      'Eine Begrenzung der Erderwärmung würde alle kleineren Alpengletscher erhalten.',
      'Der Gletscherrückgang kann langfristig die Wasserverfügbarkeit in trockenen Sommern verringern.',
      'Die Alpengletscher haben seit dem 19. Jahrhundert weniger als ein Viertel ihres Volumens verloren.'],
    2,
    'C steht im letzten Satz. A widerspricht der kurzfristigen Zunahme. B widerspricht der Annahme, dass viele kleine Gletscher selbst dann verschwinden. D widerspricht dem Verlust von mehr als der Hälfte.'],

  ['Verbot von Einwegkunststoffen',
    'Die Richtlinie über Einwegkunststoffe verbietet das Inverkehrbringen bestimmter Produkte, für die es leicht verfügbare Alternativen gibt, etwa Wattestäbchen, Besteck, Teller und Trinkhalme aus Kunststoff. Für andere Produkte, für die es solche Alternativen noch nicht gibt, sieht sie stattdessen Maßnahmen zur Verbrauchsminderung, Kennzeichnungspflichten oder eine erweiterte Herstellerverantwortung vor.\n\nPlastikflaschen müssen bis 2025 zu 77 Prozent und bis 2029 zu 90 Prozent getrennt gesammelt werden. Zudem müssen Getränkeflaschen einen Mindestanteil an recyceltem Kunststoff enthalten. Die Hersteller bestimmter Produkte, etwa Zigarettenfilter, müssen sich an den Kosten für die Reinigung der Umwelt beteiligen.',
    'r',
    ['Alle Einwegprodukte aus Kunststoff sind in der Union verboten.',
      'Hersteller von Zigarettenfiltern müssen sich an den Kosten von Reinigungsmaßnahmen beteiligen.',
      'Bis 2025 müssen 90 Prozent der Plastikflaschen getrennt gesammelt werden.',
      'Für Produkte ohne verfügbare Alternativen sieht die Richtlinie ebenfalls ein Verbot vor.'],
    1,
    'B steht im letzten Satz. A übertreibt, verboten sind nur bestimmte Produkte. C vertauscht die Zieljahre, 90 Prozent gelten bis 2029. D widerspricht den alternativen Maßnahmen für solche Produkte.'],

  ['Offshore-Windenergie',
    'Die Union will die Kapazität der Offshore-Windenergie bis 2050 vervielfachen. Windparks auf See erzielen in der Regel höhere und gleichmäßigere Windgeschwindigkeiten als Anlagen an Land und können deshalb mehr Strom pro installierter Leistung erzeugen. Ihre Errichtung ist jedoch teurer, und der Strom muss über lange Seekabel an Land transportiert werden.\n\nDer Ausbau erfordert eine enge Zusammenarbeit der Anrainerstaaten, etwa bei der Raumplanung auf See und beim Bau grenzüberschreitender Netze. Naturschutzverbände unterstützen den Ausbau grundsätzlich, fordern aber, Auswirkungen auf Meeressäuger und Seevögel stärker zu berücksichtigen. In jüngster Zeit haben gestiegene Zinsen und Materialkosten mehrere Projekte verzögert.',
    'a',
    ['Offshore-Windparks sind günstiger zu errichten als Windanlagen an Land.',
      'Naturschutzverbände lehnen den Ausbau der Offshore-Windenergie ab.',
      'Die Wirtschaftlichkeit von Offshore-Projekten hängt auch von den Finanzierungskosten ab.',
      'Offshore-Windparks können ohne Zusammenarbeit mit anderen Staaten ausgebaut werden.'],
    2,
    'C lässt sich daraus ableiten, dass gestiegene Zinsen Projekte verzögert haben. A widerspricht den höheren Errichtungskosten. B widerspricht der grundsätzlichen Unterstützung. D widerspricht der geforderten Zusammenarbeit.'],

  ['Bodengesundheit',
    'Nach Schätzungen der Kommission befinden sich 60 bis 70 Prozent der Böden in der Union nicht in einem gesunden Zustand. Ursachen sind unter anderem Erosion, Verdichtung, Versiegelung durch Bebauung, der Verlust organischer Substanz und Verschmutzung. Die Bildung von einem Zentimeter fruchtbarem Oberboden kann mehrere hundert Jahre dauern; Boden gilt daher als praktisch nicht erneuerbare Ressource.\n\nAnders als für Luft und Wasser gab es lange keine umfassenden Unionsvorschriften zum Schutz des Bodens. Die neue Bodenüberwachungsrichtlinie verpflichtet die Mitgliedstaaten, den Zustand ihrer Böden nach einheitlichen Kriterien zu erfassen. Verbindliche Ziele zur Verbesserung des Bodenzustands enthält sie jedoch nicht.',
    'r',
    ['Die Bodenüberwachungsrichtlinie schreibt den Mitgliedstaaten verbindliche Verbesserungsziele vor.',
      'Boden kann sich innerhalb weniger Jahre vollständig regenerieren.',
      'Für den Schutz von Luft und Wasser gab es früher umfassendere Unionsvorschriften als für den Boden.',
      'Mehr als drei Viertel der Böden in der Union gelten als ungesund.'],
    2,
    'C folgt aus dem Satz „Anders als für Luft und Wasser …“. A widerspricht dem letzten Satz. B widerspricht der langen Bildungsdauer. D übertreibt die Schätzung von 60 bis 70 Prozent.'],

  ['Klimagesetz',
    'Das Europäische Klimagesetz schreibt das Ziel der Klimaneutralität der Union bis 2050 rechtsverbindlich fest. Bis 2030 sollen die Netto-Treibhausgasemissionen um mindestens 55 Prozent gegenüber 1990 sinken. Klimaneutralität bedeutet dabei nicht, dass überhaupt keine Emissionen mehr entstehen, sondern dass verbleibende Emissionen durch den Abbau von Treibhausgasen, etwa durch Wälder oder technische Verfahren, ausgeglichen werden.\n\nDas Gesetz verpflichtet die Union als Ganzes, nicht jeden einzelnen Mitgliedstaat, Klimaneutralität zu erreichen. Die Beiträge der einzelnen Mitgliedstaaten ergeben sich aus weiteren Rechtsakten. Ein unabhängiger wissenschaftlicher Beirat berät die Union bei der Festlegung ihrer Klimaziele.',
    'f',
    ['Klimaneutralität schließt verbleibende Emissionen nicht aus, sofern sie ausgeglichen werden.',
      'Das Ziel für 2030 bezieht sich auf das Emissionsniveau von 1990.',
      'Nach dem Klimagesetz muss jeder Mitgliedstaat für sich bis 2050 klimaneutral werden.',
      'Ein wissenschaftlicher Beirat berät die Union bei ihren Klimazielen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Verpflichtung gilt für die Union als Ganzes, nicht für jeden Mitgliedstaat. A, B und D stehen so im Text.'],

  ['Insektensterben',
    'Zahlreiche Studien belegen in Europa einen deutlichen Rückgang der Insektenbestände, sowohl bei der Zahl der Arten als auch bei der Gesamtmasse. Als Hauptursachen gelten der Verlust von Lebensräumen, die intensive Landwirtschaft einschließlich des Einsatzes von Pestiziden, Lichtverschmutzung und der Klimawandel. Welcher Faktor jeweils am stärksten wirkt, ist je nach Region und Insektengruppe unterschiedlich und oft schwer zu bestimmen.\n\nDer Rückgang ist nicht nur für den Artenschutz bedeutsam. Rund drei Viertel der wichtigsten Nahrungspflanzen sind zumindest teilweise auf die Bestäubung durch Tiere, vor allem Insekten, angewiesen. Zudem sind Insekten Nahrungsgrundlage für viele Vögel, Fledermäuse und Amphibien.',
    'a',
    ['Pestizide sind überall die wichtigste Ursache für den Rückgang der Insekten.',
      'Ein weiterer Rückgang der Insekten könnte sich auf die Erträge mancher Nahrungspflanzen auswirken.',
      'Alle Nahrungspflanzen sind vollständig auf die Bestäubung durch Insekten angewiesen.',
      'Der Rückgang betrifft nur die Zahl der Insektenarten, nicht ihre Gesamtmasse.'],
    1,
    'B lässt sich aus der Abhängigkeit vieler Nahrungspflanzen von der Bestäubung ableiten. A widerspricht der regional unterschiedlichen Gewichtung. C übertreibt („drei Viertel“, „zumindest teilweise“). D widerspricht dem ersten Satz.'],

  ['Energiearmut',
    'Als energiearm gelten Haushalte, die sich eine angemessene Versorgung mit Energie für Heizung, Kühlung und Beleuchtung nicht leisten können. Während der Energiekrise 2022 stieg der Anteil der Menschen in der Union, die angaben, ihre Wohnung nicht angemessen warm halten zu können, deutlich an.\n\nEnergiearmut ist nicht allein eine Folge niedriger Einkommen. Sie entsteht häufig aus einer Kombination von geringem Einkommen, hohen Energiepreisen und energetisch schlechten Gebäuden. Deshalb gelten kurzfristige Zuschüsse zwar als wichtig, um akute Notlagen zu lindern, langfristig aber als weniger wirksam als Investitionen in die Gebäudesanierung. Ein Teil der Einnahmen aus dem neuen Emissionshandel für Gebäude und Verkehr soll über einen Klima-Sozialfonds an betroffene Haushalte fließen.',
    'r',
    ['Energiearmut betrifft ausschließlich Haushalte mit niedrigem Einkommen.',
      'Kurzfristige Zuschüsse gelten als die langfristig wirksamste Maßnahme gegen Energiearmut.',
      'Der Anteil der Menschen, die ihre Wohnung nicht angemessen heizen konnten, ging während der Energiekrise zurück.',
      'Schlecht gedämmte Gebäude können zur Energiearmut beitragen.'],
    3,
    'D ergibt sich aus der Aufzählung der Ursachen. A widerspricht der Kombination verschiedener Faktoren. B widerspricht der Bewertung im Text. C kehrt die Entwicklung um.'],

  ['Elektromobilität und Rohstoffe',
    'Batterien für Elektrofahrzeuge benötigen Rohstoffe wie Lithium, Nickel, Kobalt und Graphit. Ein großer Teil dieser Rohstoffe wird außerhalb der Union abgebaut und insbesondere in wenigen Ländern verarbeitet. Die Union ist deshalb in hohem Maße von Importen abhängig.\n\nDie Verordnung über kritische Rohstoffe setzt Richtwerte: Bis 2030 sollen mindestens zehn Prozent des jährlichen Bedarfs an strategischen Rohstoffen in der Union abgebaut, 40 Prozent in der Union verarbeitet und 25 Prozent durch Recycling gedeckt werden. Zudem soll die Union bei keinem strategischen Rohstoff mehr als 65 Prozent ihres Bedarfs aus einem einzigen Drittland beziehen. Neue Bergbauprojekte stoßen in den Mitgliedstaaten allerdings häufig auf Widerstand der örtlichen Bevölkerung.',
    'r',
    ['Nach den Richtwerten soll die Union 2030 mindestens 40 Prozent ihres Bedarfs an strategischen Rohstoffen selbst verarbeiten.',
      'Die Union deckt ihren Bedarf an Batterierohstoffen bereits überwiegend aus eigenem Abbau.',
      'Nach den Richtwerten darf die Union höchstens zehn Prozent ihres Bedarfs aus einem einzigen Drittland beziehen.',
      'Neue Bergbauprojekte werden von der örtlichen Bevölkerung meist begrüßt.'],
    0,
    'A entspricht dem Richtwert für die Verarbeitung. B widerspricht der Importabhängigkeit. C verwechselt die Werte, die Obergrenze für ein einzelnes Drittland liegt bei 65 Prozent. D widerspricht dem häufigen Widerstand.'],

  ['Wasserknappheit',
    'Wasserknappheit ist in der Union längst nicht mehr auf den Mittelmeerraum beschränkt. Auch in Teilen Mittel- und Nordeuropas treten in trockenen Sommern zunehmend Engpässe auf. Der größte Teil der Wasserentnahme entfällt je nach Region auf die Landwirtschaft, die Kühlung von Kraftwerken oder die öffentliche Versorgung.\n\nFachleute weisen darauf hin, dass in vielen Leitungsnetzen erhebliche Mengen Wasser durch Lecks verloren gehen, in einigen Mitgliedstaaten mehr als ein Viertel. Zudem wird aufbereitetes Abwasser bislang nur in geringem Umfang wiederverwendet, etwa zur Bewässerung. Eine seit 2023 geltende Verordnung legt Mindestanforderungen für die Qualität von wiederverwendetem Wasser in der Landwirtschaft fest, verpflichtet die Mitgliedstaaten aber nicht zur Wiederverwendung.',
    'a',
    ['Die Landwirtschaft ist in allen Regionen der größte Wassernutzer.',
      'Die Verringerung von Leitungsverlusten könnte in manchen Mitgliedstaaten die verfügbare Wassermenge merklich erhöhen.',
      'Die Verordnung von 2023 verpflichtet alle Mitgliedstaaten, Abwasser für die Bewässerung wiederzuverwenden.',
      'Wasserknappheit tritt in Nordeuropa nicht auf.'],
    1,
    'B lässt sich aus den hohen Leitungsverlusten ableiten. A widerspricht der regional unterschiedlichen Verteilung („je nach Region“). C widerspricht dem letzten Satz. D widerspricht dem ersten Absatz.'],

  ['Wälder als Kohlenstoffsenke',
    'Wälder nehmen beim Wachstum Kohlendioxid aus der Atmosphäre auf und speichern Kohlenstoff in Holz und Boden. Die Wälder der Union binden jährlich einen nennenswerten Teil der Treibhausgasemissionen der Union. In den vergangenen Jahren ist diese Senkenleistung jedoch zurückgegangen, unter anderem wegen höherer Holzernte, Dürre, Stürmen und Schädlingsbefall.\n\nDie Nutzung von Holz kann das Klima entlasten, wenn Holz Materialien wie Beton oder Stahl ersetzt, deren Herstellung viel Energie erfordert. Wird Holz dagegen verbrannt, gelangt der gespeicherte Kohlenstoff sofort wieder in die Atmosphäre. Ob eine intensivere Holznutzung dem Klima insgesamt nützt, hängt daher stark davon ab, wofür das Holz verwendet wird.',
    'h',
    ['Um das Klima zu schützen, sollte in europäischen Wäldern kein Holz mehr geerntet werden.',
      'Die Senkenleistung der europäischen Wälder hat in den letzten Jahren stetig zugenommen.',
      'Wälder sind wichtige Kohlenstoffspeicher, doch ob Holznutzung dem Klima nützt, hängt von der Art der Verwendung ab.',
      'Das Verbrennen von Holz ist klimaneutral.'],
    2,
    'C fasst beide Absätze zusammen. A ist eine Schlussfolgerung, die der Text nicht zieht. B widerspricht dem Rückgang. D widerspricht dem Satz über die sofortige Freisetzung.'],

  ['Lichtverschmutzung',
    'Künstliches Licht in der Nacht hat in Europa in den vergangenen Jahrzehnten stark zugenommen. Satellitendaten unterschätzen das Ausmaß dabei möglicherweise, weil viele Sensoren das blaue Licht moderner LED-Leuchten nur unzureichend erfassen. Untersuchungen von Freiwilligen, die die Sichtbarkeit von Sternen beobachten, deuten darauf hin, dass die Himmelshelligkeit schneller zunimmt, als die Satellitenmessungen vermuten lassen.\n\nLichtverschmutzung beeinträchtigt nachtaktive Tiere, etwa Insekten und Zugvögel, und kann auch den Schlaf-Wach-Rhythmus des Menschen stören. Einige Gemeinden haben Straßenbeleuchtung nachts gedimmt oder auf wärmere Lichtfarben umgestellt, die weniger Insekten anziehen.',
    'r',
    ['Satellitendaten erfassen das Licht moderner LED-Leuchten vollständig.',
      'Die Beobachtungen von Freiwilligen legen nahe, dass die Himmelshelligkeit schneller zunimmt, als Satellitendaten zeigen.',
      'Lichtverschmutzung betrifft ausschließlich Tiere, nicht den Menschen.',
      'Wärmere Lichtfarben ziehen mehr Insekten an als kaltes Licht.'],
    1,
    'B entspricht dem Text. A widerspricht der unzureichenden Erfassung des blauen Lichts. C widerspricht dem Hinweis auf den Schlaf-Wach-Rhythmus. D kehrt die Aussage über wärmere Lichtfarben um.'],

  ['Ökodesign',
    'Die Ökodesign-Verordnung ermöglicht es der Union, Anforderungen an nahezu alle physischen Produkte festzulegen, etwa an Haltbarkeit, Reparierbarkeit, Energieeffizienz und den Anteil recycelter Materialien. Die konkreten Anforderungen werden für einzelne Produktgruppen in delegierten Rechtsakten festgelegt; die Verordnung selbst gilt also nicht unmittelbar für alle Produkte gleichermaßen.\n\nEin digitaler Produktpass soll Informationen über die Zusammensetzung und Umweltwirkung eines Produkts entlang der Lieferkette zugänglich machen. Zudem verbietet die Verordnung großen Unternehmen, unverkaufte Kleidung und Schuhe zu vernichten. Lebensmittel, Futtermittel und Arzneimittel sind vom Anwendungsbereich ausgenommen.',
    'f',
    ['Konkrete Anforderungen werden für einzelne Produktgruppen gesondert festgelegt.',
      'Große Unternehmen dürfen unverkaufte Kleidung nicht vernichten.',
      'Arzneimittel fallen unter die Anforderungen der Ökodesign-Verordnung.',
      'Der digitale Produktpass soll Informationen über die Umweltwirkung eines Produkts bereitstellen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht der ausdrücklichen Ausnahme für Arzneimittel. A, B und D stehen so im Text.'],

  ['Hitzewellen und Gesundheit',
    'Europa erwärmt sich schneller als der globale Durchschnitt. Hitzewellen werden häufiger, länger und intensiver. Nach Schätzungen starben in den Sommern 2022 und 2023 in Europa jeweils zehntausende Menschen an den Folgen von Hitze. Besonders gefährdet sind ältere Menschen, Menschen mit Vorerkrankungen, Kleinkinder und Personen, die im Freien arbeiten.\n\nStädte sind stärker betroffen als ländliche Gebiete, weil versiegelte Flächen Wärme speichern und nachts nur langsam abgeben. Grünflächen, Bäume und Wasserflächen können die Temperaturen in Städten spürbar senken. Mehrere Mitgliedstaaten haben Hitzeaktionspläne eingeführt, die etwa Warnsysteme und die gezielte Betreuung gefährdeter Gruppen vorsehen.',
    'a',
    ['In ländlichen Gebieten gibt es keine hitzebedingten Todesfälle.',
      'Die Begrünung von Städten kann dazu beitragen, gesundheitliche Folgen von Hitzewellen zu verringern.',
      'Europa erwärmt sich langsamer als der globale Durchschnitt.',
      'Alle Mitgliedstaaten haben Hitzeaktionspläne eingeführt.'],
    1,
    'B lässt sich daraus ableiten, dass Grünflächen die Temperaturen senken und Hitze die Gesundheit gefährdet. A übertreibt den Unterschied zwischen Stadt und Land. C widerspricht dem ersten Satz. D verallgemeinert „mehrere Mitgliedstaaten“.'],

  ['Methanemissionen',
    'Methan ist nach Kohlendioxid das zweitwichtigste vom Menschen verursachte Treibhausgas. Es verbleibt zwar deutlich kürzer in der Atmosphäre als CO2, hat über einen Zeitraum von zwanzig Jahren aber eine rund 80-mal stärkere Treibhauswirkung. Eine rasche Verringerung der Methanemissionen gilt daher als besonders wirksames Mittel, um die Erwärmung in den kommenden Jahrzehnten zu bremsen.\n\nDie wichtigsten Quellen sind Landwirtschaft, Abfalldeponien sowie die Förderung und der Transport fossiler Energieträger. Die Methanverordnung der Union verpflichtet Betreiber im Energiesektor, Lecks aufzuspüren und zu beheben, und schränkt das Abfackeln und Ablassen von Methan ein. Ab einem späteren Zeitpunkt sollen vergleichbare Anforderungen auch für importierte fossile Energieträger gelten. Die Landwirtschaft ist von der Verordnung nicht erfasst.',
    'r',
    ['Methan verbleibt länger in der Atmosphäre als Kohlendioxid.',
      'Die Methanverordnung verpflichtet landwirtschaftliche Betriebe zur Verringerung ihrer Emissionen.',
      'Eine Senkung der Methanemissionen kann die Erwärmung in den nächsten Jahrzehnten vergleichsweise schnell bremsen.',
      'Die Anforderungen der Verordnung gelten bereits heute uneingeschränkt für importierte Energieträger.'],
    2,
    'C steht so im ersten Absatz. A kehrt das Verhältnis um. B widerspricht dem letzten Satz. D widerspricht der späteren Einführung für Importe.'],

  ['Klimaanpassung',
    'Selbst wenn es gelingt, die Treibhausgasemissionen rasch zu senken, werden sich die Folgen des Klimawandels in den kommenden Jahrzehnten weiter verstärken. Neben dem Klimaschutz, der die Ursachen bekämpft, gewinnt daher die Anpassung an unvermeidbare Folgen an Bedeutung, etwa durch Hochwasserschutz, hitzeresistente Stadtplanung oder dürretolerante Anbaumethoden.\n\nDie Europäische Umweltagentur warnt, dass die Union auf viele Klimarisiken nicht ausreichend vorbereitet ist. Die Kosten der Anpassung seien zwar erheblich, lägen aber in vielen Fällen deutlich unter den Schäden, die ohne Anpassung entstünden. Klimaschutz und Anpassung ergänzen sich; die Anpassung kann den Klimaschutz nicht ersetzen, da ihre Möglichkeiten bei starker Erwärmung an Grenzen stoßen.',
    'h',
    ['Anpassungsmaßnahmen machen weitere Emissionsminderungen überflüssig.',
      'Neben der Emissionsminderung ist eine vorausschauende Anpassung an unvermeidbare Klimafolgen notwendig und in der Regel lohnend.',
      'Die Union ist auf alle Klimarisiken gut vorbereitet.',
      'Die Kosten der Anpassung übersteigen in der Regel die vermiedenen Schäden.'],
    1,
    'B gibt die Kernaussage wieder. A widerspricht dem letzten Satz. C widerspricht der Warnung der Umweltagentur. D kehrt den Kostenvergleich um.'],

  ['Mikroplastik',
    'Mikroplastik bezeichnet Kunststoffpartikel mit einer Größe von weniger als fünf Millimetern. Es wird entweder gezielt hergestellt, etwa als Granulat für Kunstrasenplätze oder in Kosmetika, oder entsteht durch den Zerfall größerer Kunststoffteile, zum Beispiel beim Abrieb von Reifen oder beim Waschen synthetischer Textilien. Der unbeabsichtigte Eintrag durch Zerfall und Abrieb macht dabei den weitaus größeren Teil aus.\n\nDie Union hat den Verkauf von bewusst zugesetztem Mikroplastik in vielen Produkten schrittweise beschränkt. Eine weitere Verordnung zielt darauf ab, den Verlust von Kunststoffgranulat entlang der Lieferkette zu verhindern. Welche gesundheitlichen Folgen die Aufnahme von Mikroplastik für den Menschen hat, ist wissenschaftlich noch nicht abschließend geklärt.',
    'a',
    ['Ein Verbot von Mikroplastik in Kosmetika würde das Problem weitgehend lösen.',
      'Die Beschränkung bewusst zugesetzten Mikroplastiks erfasst nur einen kleineren Teil der gesamten Mikroplastikeinträge.',
      'Die gesundheitlichen Folgen von Mikroplastik für den Menschen sind vollständig erforscht.',
      'Reifenabrieb trägt nicht zur Entstehung von Mikroplastik bei.'],
    1,
    'B folgt daraus, dass der unbeabsichtigte Eintrag den weitaus größeren Teil ausmacht. A übersieht diesen Befund. C widerspricht dem letzten Satz. D widerspricht dem Beispiel Reifenabrieb.'],
]);

/* data/verbal-d.js */
/* Fragenpool Sprachlogik – Block D: Digitales, Technik, Wissenschaft */
EPSO_VERBAL_ADD('d', [
  ['KI-Verordnung',
    'Die KI-Verordnung der Union verfolgt einen risikobasierten Ansatz. KI-Anwendungen, die ein unannehmbares Risiko darstellen, etwa bestimmte Formen des Social Scorings durch Behörden, sind verboten. Hochrisiko-Systeme, zum Beispiel in der Personalauswahl, im Bildungswesen oder bei kritischer Infrastruktur, dürfen nur eingesetzt werden, wenn sie strenge Anforderungen an Datenqualität, Dokumentation, menschliche Aufsicht und Genauigkeit erfüllen.\n\nFür Systeme mit begrenztem Risiko, etwa Chatbots, gelten vor allem Transparenzpflichten: Nutzer müssen erkennen können, dass sie mit einer Maschine interagieren. Die große Mehrheit der KI-Anwendungen, etwa Spamfilter, unterliegt keinen besonderen Pflichten. Für KI-Modelle mit allgemeinem Verwendungszweck gelten eigene Vorschriften, die bei Modellen mit systemischem Risiko strenger ausfallen.',
    'r',
    ['Alle KI-Anwendungen unterliegen denselben strengen Anforderungen.',
      'Ein KI-System, das Bewerbungen vorsortiert, muss Anforderungen an die menschliche Aufsicht erfüllen.',
      'Chatbots sind nach der KI-Verordnung verboten.',
      'Spamfilter gelten als Hochrisiko-Systeme.'],
    1,
    'B ist richtig: Die Personalauswahl ist als Hochrisiko-Bereich genannt, für den menschliche Aufsicht gefordert ist. A widerspricht dem risikobasierten Ansatz. C ist falsch, für Chatbots gelten nur Transparenzpflichten. D ist falsch, Spamfilter unterliegen keinen besonderen Pflichten.'],

  ['Gesetz über digitale Dienste',
    'Das Gesetz über digitale Dienste regelt die Pflichten von Online-Vermittlungsdiensten wie sozialen Netzwerken, Marktplätzen und Suchmaschinen. Plattformen müssen Verfahren einrichten, über die Nutzer rechtswidrige Inhalte melden können, und ihre Entscheidungen über die Entfernung von Inhalten begründen. Eine allgemeine Pflicht, alle Inhalte vorab zu überwachen, besteht jedoch nicht.\n\nFür sehr große Online-Plattformen und Suchmaschinen mit mehr als 45 Millionen monatlichen Nutzern in der Union gelten zusätzliche Pflichten. Sie müssen systemische Risiken, etwa für demokratische Prozesse oder den Jugendschutz, bewerten und mindern und sich unabhängigen Prüfungen unterziehen. Die Aufsicht über diese Anbieter liegt bei der Kommission, die Geldbußen von bis zu sechs Prozent des weltweiten Jahresumsatzes verhängen kann.',
    'a',
    ['Plattformen müssen jeden hochgeladenen Beitrag vor der Veröffentlichung prüfen.',
      'Eine Plattform mit 30 Millionen monatlichen Nutzern in der Union unterliegt nicht den zusätzlichen Pflichten für sehr große Plattformen.',
      'Die Aufsicht über alle Online-Plattformen liegt ausschließlich bei der Kommission.',
      'Plattformen dürfen Inhalte ohne Begründung entfernen.'],
    1,
    'B folgt aus der Schwelle von 45 Millionen Nutzern. A widerspricht dem Fehlen einer Vorabüberwachungspflicht. C verallgemeinert, die Kommission ist nur für sehr große Anbieter zuständig. D widerspricht der Begründungspflicht.'],

  ['Quantencomputer',
    'Quantencomputer nutzen quantenmechanische Effekte, um bestimmte Rechenaufgaben potenziell sehr viel schneller zu lösen als klassische Computer. Die Grundeinheit, das Qubit, kann anders als ein klassisches Bit nicht nur die Zustände 0 oder 1 annehmen, sondern auch eine Überlagerung beider Zustände.\n\nDer Vorteil von Quantencomputern beschränkt sich allerdings auf spezielle Problemklassen, etwa die Simulation von Molekülen oder bestimmte Optimierungsaufgaben. Für die meisten alltäglichen Anwendungen dürften klassische Computer auch künftig die bessere Wahl sein. Ein großes technisches Problem ist die Fehleranfälligkeit der Qubits, die durch geringste Störungen aus der Umgebung ihren Zustand verlieren. Fachleute halten es daher für ungewiss, wann Quantencomputer in großem Maßstab praktisch nutzbar sein werden.',
    'r',
    ['Quantencomputer werden klassische Computer in naher Zukunft für alle Aufgaben ersetzen.',
      'Qubits sind besonders unempfindlich gegenüber Störungen aus der Umgebung.',
      'Der Zeitpunkt, zu dem Quantencomputer in großem Maßstab nutzbar sein werden, ist ungewiss.',
      'Ein Qubit kann nur die Zustände 0 oder 1 annehmen.'],
    2,
    'C steht im letzten Satz. A widerspricht der Beschränkung auf spezielle Problemklassen. B kehrt die Fehleranfälligkeit um. D widerspricht der Überlagerung von Zuständen.'],

  ['Datenschutz-Grundverordnung',
    'Die Datenschutz-Grundverordnung (DSGVO) gilt nicht nur für Unternehmen mit Sitz in der Union, sondern auch für Unternehmen außerhalb der Union, sofern diese Personen in der Union Waren oder Dienstleistungen anbieten oder deren Verhalten beobachten. Die Verarbeitung personenbezogener Daten ist nur zulässig, wenn eine Rechtsgrundlage vorliegt; die Einwilligung ist dabei nur eine von mehreren möglichen Grundlagen.\n\nFür grenzüberschreitende Fälle gilt das sogenannte One-Stop-Shop-Prinzip: Zuständig ist grundsätzlich die Aufsichtsbehörde des Mitgliedstaats, in dem das Unternehmen seine Hauptniederlassung hat. Kritiker bemängeln, dass dies zu einer Überlastung einzelner Behörden führe, in deren Land viele große Technologieunternehmen ihren europäischen Sitz haben.',
    'f',
    ['Ein Unternehmen ohne Sitz in der Union kann der DSGVO unterliegen.',
      'Die Verarbeitung personenbezogener Daten ist ausschließlich mit Einwilligung der betroffenen Person zulässig.',
      'Bei grenzüberschreitenden Fällen ist grundsätzlich die Behörde am Ort der Hauptniederlassung zuständig.',
      'Das One-Stop-Shop-Prinzip wird kritisiert, weil es einzelne Behörden stark belasten kann.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Die Einwilligung ist nur eine von mehreren Rechtsgrundlagen. A, C und D stehen so im Text.'],

  ['Cybersicherheit',
    'Die überarbeitete Richtlinie zur Netz- und Informationssicherheit (NIS-2) erweitert den Kreis der Unternehmen, die Maßnahmen zur Cybersicherheit ergreifen müssen, erheblich. Erfasst sind nun zahlreiche Sektoren wie Energie, Verkehr, Gesundheit, digitale Infrastruktur, öffentliche Verwaltung sowie bestimmte Hersteller. Kleinstunternehmen und kleine Unternehmen sind in der Regel nicht betroffen.\n\nDie Unternehmen müssen Risiken bewerten, Sicherheitsmaßnahmen umsetzen und erhebliche Sicherheitsvorfälle innerhalb von 24 Stunden als Frühwarnung melden. Neu ist, dass die Leitungsorgane für die Einhaltung der Pflichten verantwortlich gemacht werden können. Die Mitgliedstaaten mussten die Richtlinie bis Oktober 2024 in nationales Recht umsetzen; viele haben diese Frist verpasst.',
    'r',
    ['NIS-2 gilt nur für den Energiesektor.',
      'Unternehmen müssen erhebliche Sicherheitsvorfälle innerhalb einer Woche erstmals melden.',
      'Alle Mitgliedstaaten haben die Richtlinie fristgerecht umgesetzt.',
      'Die Geschäftsleitung eines erfassten Unternehmens kann für Verstöße gegen die Pflichten verantwortlich gemacht werden.'],
    3,
    'D steht so im Text. A widerspricht der Aufzählung zahlreicher Sektoren. B widerspricht der Frist von 24 Stunden. C widerspricht dem letzten Satz.'],

  ['Halbleiterindustrie',
    'Mikrochips sind Bestandteil nahezu aller elektronischen Geräte, von Smartphones über Autos bis zu medizinischen Geräten. Während der Pandemie führten Lieferengpässe dazu, dass in Europa zeitweise Produktionsbänder in der Automobilindustrie stillstanden. Der Anteil Europas an der weltweiten Halbleiterproduktion liegt bei etwa zehn Prozent.\n\nMit dem Chip-Gesetz will die Union diesen Anteil bis 2030 auf 20 Prozent verdoppeln. Da der weltweite Markt gleichzeitig stark wächst, müsste die Produktion in Europa dafür deutlich mehr als verdoppelt werden. Der Europäische Rechnungshof hält das Ziel für kaum erreichbar. Europa ist bei bestimmten Schritten der Wertschöpfungskette stark, etwa bei Maschinen zur Chipherstellung, bei der Fertigung der modernsten Chips aber kaum vertreten.',
    'a',
    ['Selbst eine Verdopplung der europäischen Chipproduktion würde bei wachsendem Weltmarkt nicht ausreichen, um das Ziel von 20 Prozent zu erreichen.',
      'Europa produziert derzeit die modernsten Chips der Welt.',
      'Der Rechnungshof hält das Ziel des Chip-Gesetzes für leicht erreichbar.',
      'Die Lieferengpässe während der Pandemie hatten keine Auswirkungen auf die europäische Industrie.'],
    0,
    'A folgt aus dem Satz, dass die Produktion bei wachsendem Weltmarkt deutlich mehr als verdoppelt werden müsste. B widerspricht dem Text. C widerspricht der Einschätzung des Rechnungshofs. D widerspricht den Produktionsstillständen.'],

  ['Open Access',
    'Unter Open Access versteht man den freien, kostenlosen Zugang zu wissenschaftlichen Veröffentlichungen im Internet. Im Forschungsprogramm Horizont Europa müssen Veröffentlichungen, die aus geförderten Projekten hervorgehen, grundsätzlich sofort frei zugänglich gemacht werden. Eine Sperrfrist, wie sie früher zulässig war, ist nicht mehr vorgesehen.\n\nOpen Access verlagert die Kosten häufig von den Lesern auf die Autoren: Viele Zeitschriften erheben Publikationsgebühren, die mehrere tausend Euro betragen können. Kritiker befürchten, dass dies Forschende aus finanzschwachen Einrichtungen benachteiligt. Daneben gibt es Modelle, bei denen weder Leser noch Autoren zahlen und die Kosten von Institutionen getragen werden.',
    'r',
    ['Bei Open Access fallen grundsätzlich keine Kosten an.',
      'In Horizont Europa dürfen Veröffentlichungen erst nach einer Sperrfrist frei zugänglich gemacht werden.',
      'Publikationsgebühren können für Forschende aus finanzschwachen Einrichtungen ein Hindernis darstellen.',
      'Bei allen Open-Access-Modellen zahlen die Autoren.'],
    2,
    'C gibt die Befürchtung der Kritiker wieder. A übersieht die Publikationsgebühren. B widerspricht der sofortigen Zugänglichkeit. D widerspricht den Modellen ohne Kosten für Autoren.'],

  ['Recht auf Reparatur',
    'Die Richtlinie über das Recht auf Reparatur verpflichtet Hersteller bestimmter Produkte, etwa Waschmaschinen, Kühlschränke und Smartphones, diese auch nach Ablauf der gesetzlichen Gewährleistung zu angemessenen Preisen zu reparieren. Die Pflicht gilt nur für Produkte, für die das Unionsrecht Anforderungen an die Reparierbarkeit festlegt.\n\nWird ein Produkt während der Gewährleistungsfrist repariert statt ersetzt, verlängert sich die Gewährleistung um zwölf Monate. Hersteller dürfen den Einsatz von Ersatzteilen unabhängiger Anbieter nicht durch technische Maßnahmen verhindern. Eine Online-Plattform soll Verbraucherinnen und Verbrauchern helfen, Reparaturbetriebe in ihrer Nähe zu finden.',
    'a',
    ['Die Reparaturpflicht gilt für alle Konsumgüter.',
      'Wer sich während der Gewährleistung für eine Reparatur entscheidet, erhält eine längere Gewährleistung als bei einem Austausch.',
      'Hersteller dürfen Ersatzteile unabhängiger Anbieter technisch blockieren.',
      'Die Reparatur nach Ablauf der Gewährleistung muss kostenlos erfolgen.'],
    1,
    'B folgt aus der Verlängerung um zwölf Monate bei einer Reparatur. A widerspricht der Beschränkung auf bestimmte Produkte. C widerspricht dem Verbot. D ist falsch, die Reparatur muss nur zu angemessenen Preisen angeboten werden.'],

  ['Placebo-Effekt',
    'Als Placebo-Effekt bezeichnet man positive Veränderungen des Gesundheitszustands, die nicht auf den Wirkstoff einer Behandlung zurückzuführen sind, sondern auf die Erwartungen der Patienten und den Behandlungskontext. Er tritt vor allem bei subjektiv erlebten Beschwerden wie Schmerzen, Übelkeit oder Müdigkeit auf. Auf objektiv messbare Krankheitsverläufe, etwa das Wachstum eines Tumors, hat er dagegen kaum Einfluss.\n\nUm die tatsächliche Wirkung eines Medikaments zu ermitteln, werden in klinischen Studien Patienten häufig zufällig einer Wirkstoff- oder einer Placebogruppe zugeteilt, ohne dass sie oder die behandelnden Ärzte wissen, wer was erhält. Überraschenderweise zeigen einige Studien, dass Placebos selbst dann wirken können, wenn Patienten wissen, dass sie ein Scheinmedikament erhalten.',
    'r',
    ['Der Placebo-Effekt kann das Wachstum von Tumoren wirksam aufhalten.',
      'Placebos wirken nur, wenn der Patient glaubt, einen echten Wirkstoff zu erhalten.',
      'In den beschriebenen Studien wissen die behandelnden Ärzte, welcher Patient ein Placebo erhält.',
      'Der Placebo-Effekt zeigt sich vor allem bei subjektiv erlebten Beschwerden.'],
    3,
    'D steht so im ersten Absatz. A widerspricht dem geringen Einfluss auf objektive Verläufe. B widerspricht den Studien mit offen verabreichten Placebos. C widerspricht der Verblindung der Ärzte.'],

  ['Satellitennavigation Galileo',
    'Galileo ist das globale Satellitennavigationssystem der Europäischen Union. Anders als das amerikanische GPS, das ursprünglich für militärische Zwecke entwickelt wurde, steht Galileo unter ziviler Kontrolle. Die meisten modernen Smartphones können Signale von Galileo, GPS und weiteren Systemen gleichzeitig empfangen, was die Genauigkeit der Ortung verbessert.\n\nNeben dem frei zugänglichen Dienst bietet Galileo einen verschlüsselten öffentlichen regulierten Dienst für staatliche Nutzer, etwa Polizei und Katastrophenschutz, der auch in Krisensituationen verfügbar bleiben soll. Ein Such- und Rettungsdienst ermöglicht es, Notrufsignale schneller zu lokalisieren und dem Absender eine Empfangsbestätigung zu senden.',
    'f',
    ['Galileo steht unter ziviler Kontrolle.',
      'Smartphones können Galileo und GPS gleichzeitig nutzen.',
      'Der öffentliche regulierte Dienst ist für alle Nutzer frei zugänglich.',
      'Der Such- und Rettungsdienst kann dem Absender eines Notrufs den Empfang bestätigen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Der öffentliche regulierte Dienst ist verschlüsselt und staatlichen Nutzern vorbehalten. A, B und D stehen so im Text.'],

  ['Gesetz über digitale Märkte',
    'Das Gesetz über digitale Märkte richtet sich an sogenannte Torwächter, also sehr große Plattformen, die als wichtiges Zugangstor zwischen Unternehmen und Endnutzern dienen. Die Kommission benennt Torwächter anhand quantitativer Schwellenwerte, etwa beim Umsatz und bei der Zahl der Nutzer.\n\nTorwächter dürfen unter anderem ihre eigenen Produkte in Suchergebnissen nicht bevorzugen und müssen es Nutzern ermöglichen, vorinstallierte Anwendungen zu deinstallieren. Anders als im klassischen Wettbewerbsrecht muss die Kommission nicht im Einzelfall nachweisen, dass ein bestimmtes Verhalten den Wettbewerb schädigt; die Pflichten gelten unmittelbar. Bei Verstößen drohen Geldbußen von bis zu zehn Prozent, im Wiederholungsfall bis zu zwanzig Prozent des weltweiten Jahresumsatzes.',
    'a',
    ['Die Pflichten des Gesetzes gelten für alle Online-Plattformen.',
      'Ein Torwächter, der eigene Produkte in seinen Suchergebnissen bevorzugt, verstößt gegen das Gesetz, ohne dass ein konkreter Wettbewerbsschaden nachgewiesen werden muss.',
      'Die Geldbuße ist auch im Wiederholungsfall auf zehn Prozent des Umsatzes begrenzt.',
      'Torwächter werden ausschließlich nach qualitativen Kriterien bestimmt.'],
    1,
    'B folgt daraus, dass die Pflichten unmittelbar gelten und kein Einzelfallnachweis nötig ist. A ist falsch, das Gesetz gilt nur für Torwächter. C widerspricht der Obergrenze von 20 Prozent im Wiederholungsfall. D widerspricht den quantitativen Schwellenwerten.'],

  ['Antibiotikaresistenzen',
    'Antibiotikaresistenzen entstehen, wenn Bakterien sich so verändern, dass Antibiotika gegen sie nicht mehr wirken. Jeder Einsatz von Antibiotika begünstigt die Auswahl resistenter Bakterien; besonders problematisch ist daher der unnötige Einsatz, etwa bei viralen Infektionen wie Erkältungen, gegen die Antibiotika ohnehin nicht wirken.\n\nIn der Union sterben nach Schätzungen jedes Jahr mehr als 35 000 Menschen an Infektionen mit resistenten Erregern. Der Antibiotikaeinsatz unterscheidet sich zwischen den Mitgliedstaaten erheblich. Die Entwicklung neuer Antibiotika gilt für Pharmaunternehmen als wirtschaftlich wenig attraktiv, weil neue Wirkstoffe als Reservemittel möglichst selten eingesetzt werden sollen und daher nur geringe Umsätze erzielen.',
    'r',
    ['Antibiotika sind bei Erkältungen in der Regel wirksam.',
      'Der Einsatz von Antibiotika ist in allen Mitgliedstaaten etwa gleich hoch.',
      'Dass neue Antibiotika möglichst selten eingesetzt werden sollen, verringert den Anreiz für Unternehmen, sie zu entwickeln.',
      'Nur der unnötige Einsatz von Antibiotika fördert Resistenzen.'],
    2,
    'C steht im letzten Satz. A widerspricht der Unwirksamkeit bei viralen Infektionen. B widerspricht den erheblichen Unterschieden. D ist falsch, jeder Einsatz begünstigt Resistenzen, der unnötige ist nur besonders problematisch.'],

  ['Digitale Identität',
    'Mit der überarbeiteten eIDAS-Verordnung sollen alle Mitgliedstaaten ihren Bürgerinnen und Bürgern eine digitale Brieftasche für die europäische digitale Identität anbieten. Damit sollen sich Nutzer online und offline ausweisen und Nachweise wie Führerscheine, Diplome oder Rezepte speichern und vorzeigen können.\n\nDie Nutzung der Brieftasche ist freiwillig. Niemand darf benachteiligt werden, weil er sie nicht verwendet. Nutzer sollen selbst entscheiden können, welche Daten sie weitergeben; so soll es etwa möglich sein, nachzuweisen, dass man volljährig ist, ohne das genaue Geburtsdatum offenzulegen. Große Online-Plattformen, die eine Authentifizierung verlangen, müssen die Brieftasche auf Wunsch der Nutzer akzeptieren.',
    'r',
    ['Die Nutzung der digitalen Brieftasche wird für alle Bürger verpflichtend.',
      'Mit der Brieftasche muss man bei jeder Altersprüfung das vollständige Geburtsdatum offenlegen.',
      'Große Online-Plattformen können die Brieftasche als Authentifizierungsmittel ablehnen, auch wenn der Nutzer sie verwenden will.',
      'Die Brieftasche soll es ermöglichen, nur die für einen Zweck erforderlichen Daten weiterzugeben.'],
    3,
    'D ergibt sich aus dem Beispiel der Altersprüfung. A widerspricht der Freiwilligkeit. B widerspricht dem Beispiel. C widerspricht der Pflicht großer Plattformen, die Brieftasche zu akzeptieren.'],

  ['Schlaf und Gedächtnis',
    'Zahlreiche Studien zeigen, dass Schlaf eine wichtige Rolle bei der Festigung von Gedächtnisinhalten spielt. Während des Schlafs werden neu gelernte Informationen offenbar wiederholt aktiviert und in langfristige Speicher überführt. Probanden, die nach dem Lernen schlafen, erinnern sich in Tests häufig besser als Probanden, die die gleiche Zeit wach verbringen.\n\nAllerdings ist noch nicht vollständig geklärt, welche Schlafphasen für welche Art von Gedächtnisinhalten besonders bedeutsam sind. Hinweise deuten darauf hin, dass der Tiefschlaf vor allem für Faktenwissen wichtig ist, während andere Phasen eher bei motorischen Fähigkeiten eine Rolle spielen könnten. Chronischer Schlafmangel wird mit einer schlechteren Lernleistung in Verbindung gebracht.',
    'a',
    ['Wer vor einer Prüfung die Nacht durchlernt, anstatt zu schlafen, verzichtet möglicherweise auf einen Teil des Lernerfolgs.',
      'Die Rolle der einzelnen Schlafphasen für das Gedächtnis ist vollständig geklärt.',
      'Schlaf hat keinen Einfluss auf das Erinnern von Faktenwissen.',
      'Probanden, die nach dem Lernen wach bleiben, erinnern sich stets besser.'],
    0,
    'A lässt sich aus der Rolle des Schlafs bei der Gedächtnisfestigung ableiten („möglicherweise“ ist angemessen vorsichtig). B widerspricht dem zweiten Absatz. C widerspricht der Bedeutung des Tiefschlafs. D kehrt die Befunde um.'],

  ['Rechenzentren und Energie',
    'Der Stromverbrauch von Rechenzentren ist in den vergangenen Jahren gestiegen und dürfte mit der zunehmenden Nutzung künstlicher Intelligenz weiter wachsen. Dabei wurden erhebliche Effizienzgewinne erzielt: Die Rechenleistung pro verbrauchter Kilowattstunde hat sich vervielfacht. Diese Gewinne wurden jedoch durch die stark steigende Nachfrage nach Rechenleistung mehr als ausgeglichen.\n\nNeben dem Stromverbrauch rückt auch der Wasserbedarf für die Kühlung in den Blick. Die Energieeffizienzrichtlinie verpflichtet Betreiber größerer Rechenzentren, Kennzahlen zu Energieverbrauch, Wasserverbrauch und Abwärmenutzung zu veröffentlichen. In einigen Städten wird die Abwärme von Rechenzentren bereits in Fernwärmenetze eingespeist.',
    'r',
    ['Durch Effizienzgewinne ist der Stromverbrauch der Rechenzentren insgesamt gesunken.',
      'Die Nachfrage nach Rechenleistung ist stärker gestiegen als die Effizienz.',
      'Rechenzentren benötigen kein Wasser für die Kühlung.',
      'Alle Rechenzentren müssen ihren Energieverbrauch veröffentlichen, unabhängig von ihrer Größe.'],
    1,
    'B folgt daraus, dass die Effizienzgewinne durch die steigende Nachfrage mehr als ausgeglichen wurden. A widerspricht dem gestiegenen Verbrauch. C widerspricht dem Wasserbedarf. D verallgemeinert, die Pflicht gilt nur für größere Rechenzentren.'],

  ['Impfstoffentwicklung',
    'Die Entwicklung eines Impfstoffs dauerte früher in der Regel zehn Jahre oder länger. Dass während der Pandemie innerhalb eines Jahres mehrere Impfstoffe zugelassen werden konnten, lag nicht daran, dass Prüfschritte ausgelassen wurden. Vielmehr wurden einzelne Phasen parallel statt nacheinander durchgeführt, Behörden prüften Daten laufend, sobald sie verfügbar waren, und Staaten übernahmen einen Teil des finanziellen Risikos, indem sie Produktionskapazitäten bereits vor der Zulassung finanzierten.\n\nZudem konnte auf jahrelange Vorarbeiten zur mRNA-Technologie und zu verwandten Coronaviren zurückgegriffen werden. Die Europäische Arzneimittel-Agentur erteilte zunächst bedingte Zulassungen, die an die Vorlage weiterer Daten geknüpft waren.',
    'h',
    ['Die schnelle Zulassung der Pandemie-Impfstoffe beruhte vor allem auf dem Weglassen von Prüfschritten.',
      'Die ungewöhnlich schnelle Impfstoffentwicklung war durch parallele Abläufe, laufende Prüfung, staatliche Risikoübernahme und Vorarbeiten möglich.',
      'Die mRNA-Technologie wurde erst während der Pandemie erfunden.',
      'Die Europäische Arzneimittel-Agentur erteilte sofort unbedingte Zulassungen.'],

  ['Desinformation',
    'Desinformation bezeichnet falsche oder irreführende Informationen, die gezielt verbreitet werden, um zu täuschen oder Schaden anzurichten. Davon zu unterscheiden ist die Fehlinformation, bei der falsche Inhalte ohne Täuschungsabsicht weitergegeben werden, etwa aus Unwissenheit.\n\nStudien deuten darauf hin, dass falsche Nachrichten sich in sozialen Netzwerken teilweise schneller verbreiten als zutreffende, möglicherweise weil sie häufig überraschender oder emotionaler sind. Als Gegenmaßnahmen gelten neben der Richtigstellung falscher Inhalte auch die Stärkung der Medienkompetenz und das sogenannte Prebunking, bei dem Menschen vorab über typische Manipulationstechniken informiert werden. Nach einigen Untersuchungen kann Prebunking wirksamer sein als nachträgliche Richtigstellungen.',
    'r',
    ['Wer unwissentlich eine falsche Nachricht teilt, verbreitet nach der Definition des Textes Desinformation.',
      'Falsche Nachrichten verbreiten sich in sozialen Netzwerken stets langsamer als zutreffende.',
      'Beim Prebunking werden falsche Inhalte nachträglich richtiggestellt.',
      'Nach einigen Untersuchungen kann die vorherige Aufklärung über Manipulationstechniken besser wirken als eine spätere Richtigstellung.'],
    3,
    'D steht so im Text. A ist falsch, ohne Täuschungsabsicht handelt es sich um Fehlinformation. B widerspricht den Studien. C verwechselt Prebunking mit nachträglicher Richtigstellung.'],

  ['Weltraumschrott',
    'In der Erdumlaufbahn befinden sich mehrere zehntausend Objekte, die größer als zehn Zentimeter sind und von Überwachungssystemen verfolgt werden, sowie eine weit größere Zahl kleinerer Trümmerteile. Da sich diese Teile mit sehr hohen Geschwindigkeiten bewegen, können selbst millimetergroße Partikel Satelliten beschädigen.\n\nFachleute warnen vor einer Kettenreaktion: Kollisionen erzeugen neue Trümmer, die wiederum weitere Kollisionen verursachen können. Durch die wachsende Zahl von Satelliten, insbesondere großer Kommunikationskonstellationen, steigt dieses Risiko. Die Europäische Weltraumorganisation hat sich verpflichtet, ab 2030 keine neuen Trümmer mehr zu hinterlassen. Verbindliche internationale Regeln zur Beseitigung von Weltraumschrott gibt es bislang nicht.',
    'a',
    ['Nur Objekte, die größer als zehn Zentimeter sind, können Satelliten beschädigen.',
      'Der Start zahlreicher neuer Satelliten kann das Risiko weiterer Kollisionen erhöhen.',
      'Es gibt verbindliche internationale Regeln zur Beseitigung von Weltraumschrott.',
      'Alle Trümmerteile in der Umlaufbahn werden von Überwachungssystemen verfolgt.'],
    1,
    'B folgt aus dem Satz über die wachsende Zahl von Satelliten. A widerspricht der Gefahr durch millimetergroße Partikel. C widerspricht dem letzten Satz. D ist falsch, verfolgt werden nur größere Objekte.'],

  ['Mobilfunkroaming',
    'Seit 2017 zahlen Kundinnen und Kunden von Mobilfunkanbietern in der Union bei vorübergehenden Reisen in andere Mitgliedstaaten für Anrufe, SMS und Datennutzung grundsätzlich dieselben Preise wie zu Hause („Roam like at home“). Die Regelung wurde 2022 um zehn Jahre verlängert.\n\nDie Regelung gilt für vorübergehende Reisen, nicht für dauerhafte Aufenthalte. Anbieter dürfen eine Regelung zur angemessenen Nutzung anwenden und Zuschläge erheben, wenn eine SIM-Karte über einen längeren Zeitraum überwiegend im Ausland genutzt wird. Bei Datentarifen mit sehr günstigem Preis pro Gigabyte kann das im Ausland verfügbare Datenvolumen begrenzt sein. Anrufe von zu Hause in einen anderen Mitgliedstaat fallen nicht unter die Roaming-Regelung.',
    'f',
    ['Bei vorübergehenden Reisen fallen in der Regel keine zusätzlichen Roaming-Gebühren an.',
      'Die Roaming-Regelung wurde 2022 verlängert.',
      'Ein Anruf aus Deutschland nach Spanien ist durch die Roaming-Regelung zum Inlandstarif abgedeckt.',
      'Bei dauerhafter Nutzung im Ausland können Anbieter Zuschläge verlangen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem letzten Satz: Anrufe von zu Hause ins EU-Ausland fallen nicht unter die Roaming-Regelung. A, B und D stehen so im Text.'],

  ['Wissenschaftliche Reproduzierbarkeit',
    'In mehreren Disziplinen, insbesondere in der Psychologie und der biomedizinischen Forschung, ist es in groß angelegten Projekten nicht gelungen, einen erheblichen Teil veröffentlichter Befunde zu wiederholen. Diese Entwicklung wird häufig als Replikationskrise bezeichnet.\n\nAls Ursachen gelten unter anderem kleine Stichproben, eine flexible Auswertung der Daten sowie der Umstand, dass Zeitschriften überraschende positive Ergebnisse eher veröffentlichen als Nullbefunde. Daraus folgt nicht, dass die betroffenen Befunde falsch sein müssen; eine gescheiterte Wiederholung kann auch auf Unterschiede in den Versuchsbedingungen zurückgehen. Als Gegenmaßnahme setzen sich die Vorregistrierung von Studien und die Veröffentlichung der Rohdaten zunehmend durch.',
    'a',
    ['Jeder Befund, der sich nicht wiederholen lässt, ist nachweislich falsch.',
      'Wenn Zeitschriften bevorzugt positive Ergebnisse veröffentlichen, kann dies ein verzerrtes Bild des Forschungsstands erzeugen.',
      'Die Replikationskrise betrifft ausschließlich die Psychologie.',
      'Die Vorregistrierung von Studien wird zunehmend abgelehnt.'],
    1,
    'B lässt sich aus der genannten Ursache ableiten. A widerspricht dem Hinweis, dass gescheiterte Wiederholungen auch andere Gründe haben können. C widerspricht der Nennung der biomedizinischen Forschung. D kehrt die Entwicklung um.'],

  ['Barrierefreiheit digitaler Produkte',
    'Der Europäische Rechtsakt zur Barrierefreiheit verpflichtet seit Juni 2025 Anbieter bestimmter Produkte und Dienstleistungen, diese barrierefrei zu gestalten. Dazu gehören unter anderem Computer, Smartphones, E-Books, Online-Shops, Bankdienstleistungen und Fahrkartenautomaten. Menschen mit Behinderungen sollen diese Produkte und Dienste ohne fremde Hilfe nutzen können.\n\nKleinstunternehmen, die Dienstleistungen erbringen, sind von den Anforderungen ausgenommen. Auch müssen die Anforderungen nicht erfüllt werden, wenn sie eine unverhältnismäßige Belastung darstellen würden oder eine grundlegende Veränderung des Produkts erforderten; dies muss der Anbieter jedoch begründen und dokumentieren.',
    'r',
    ['Alle Unternehmen ohne Ausnahme müssen ihre Dienstleistungen barrierefrei gestalten.',
      'Ein Anbieter kann sich auf eine unverhältnismäßige Belastung berufen, muss dies aber begründen.',

  ['Mehrsprachigkeit und Gehirn',
    'Lange wurde angenommen, dass das Aufwachsen mit mehreren Sprachen Kinder verwirren und ihre sprachliche Entwicklung verzögern könne. Neuere Forschung widerlegt diese Befürchtung weitgehend: Mehrsprachig aufwachsende Kinder erreichen die wesentlichen Meilensteine der Sprachentwicklung in einem ähnlichen Alter wie einsprachige Kinder, auch wenn ihr Wortschatz in jeder einzelnen Sprache zeitweise kleiner sein kann.\n\nUmstritten ist dagegen die These, dass Mehrsprachigkeit allgemeine geistige Fähigkeiten wie Aufmerksamkeit und Aufgabenwechsel verbessere. Frühere Studien, die solche Vorteile fanden, konnten in größeren Untersuchungen teilweise nicht bestätigt werden.',
    'r',
    ['Mehrsprachig aufwachsende Kinder erreichen die Meilensteine der Sprachentwicklung deutlich später.',
      'Es ist inzwischen eindeutig belegt, dass Mehrsprachigkeit die Aufmerksamkeit verbessert.',
      'Der Wortschatz mehrsprachiger Kinder kann in jeder einzelnen Sprache zeitweise geringer sein als bei einsprachigen Kindern.',
      'Die Befürchtung, Mehrsprachigkeit verwirre Kinder, wurde durch neuere Forschung bestätigt.'],

  ['Stromnetze',
    'Der Ausbau erneuerbarer Energien erfordert erhebliche Investitionen in die Stromnetze. Wind- und Solaranlagen werden oft dort errichtet, wo die natürlichen Bedingungen günstig sind, nicht dort, wo der Strom verbraucht wird. Zudem schwankt ihre Erzeugung mit Wetter und Tageszeit, sodass Netze flexibler werden müssen.\n\nIn mehreren Mitgliedstaaten warten Anlagen bereits heute lange auf einen Netzanschluss. Die Kommission schätzt den Investitionsbedarf in die Stromnetze bis 2030 auf mehrere hundert Milliarden Euro. Ein stärker vernetztes europäisches Stromnetz kann helfen, Schwankungen auszugleichen, weil der Wind nicht überall gleichzeitig schwach weht. Genehmigungsverfahren für neue Leitungen dauern jedoch häufig viele Jahre.',
    'a',
    ['Der Ausbau erneuerbarer Energien kann ohne Investitionen in die Netze erfolgen.',
      'Lange Genehmigungsverfahren können den Ausbau erneuerbarer Energien bremsen.',
      'Wind- und Solaranlagen werden stets in der Nähe der Verbraucher gebaut.',
      'Ein grenzüberschreitend vernetztes Stromnetz verstärkt die Schwankungen der Erzeugung.'],
    1,

  ['Gentechnik in Pflanzen',
    'Neue genomische Techniken wie die Genschere CRISPR/Cas ermöglichen gezielte Veränderungen im Erbgut von Pflanzen, ohne dass zwingend artfremde Gene eingefügt werden. Einige dieser Veränderungen könnten auch durch herkömmliche Züchtung oder natürlich entstehen.\n\nDie Kommission hat vorgeschlagen, Pflanzen, deren Veränderungen denen herkömmlicher Züchtung vergleichbar sind, von den strengen Regeln für gentechnisch veränderte Organismen weitgehend auszunehmen. Für andere Pflanzen sollen die bestehenden Regeln weiter gelten. Befürworter erhoffen sich widerstandsfähigere Sorten, etwa gegen Trockenheit. Kritiker fordern weiterhin eine Kennzeichnung aller Produkte und warnen vor möglichen Risiken sowie vor einer Stärkung von Patenten großer Saatgutkonzerne.',
    'r',
    ['Nach dem Vorschlag sollen alle mit neuen Techniken veränderten Pflanzen von den Gentechnikregeln ausgenommen werden.',
      'Mit neuen genomischen Techniken werden immer artfremde Gene eingefügt.',

  ['Künstliche Intelligenz und Arbeitsmarkt',
    'Über die Folgen generativer künstlicher Intelligenz für den Arbeitsmarkt gehen die Einschätzungen weit auseinander. Anders als frühere Automatisierungswellen, die vor allem Routinetätigkeiten in der Produktion betrafen, könnten generative Systeme auch Aufgaben von Bürobeschäftigten mit höherem Bildungsabschluss übernehmen, etwa das Verfassen von Texten oder die Analyse von Dokumenten.\n\nViele Ökonomen gehen allerdings davon aus, dass eher einzelne Aufgaben als ganze Berufe automatisiert werden. In vielen Fällen könnte KI Beschäftigte ergänzen und ihre Produktivität steigern, statt sie zu ersetzen. Frühere technologische Umbrüche haben langfristig zwar neue Berufe hervorgebracht, gingen aber zeitweise mit erheblichen Anpassungskosten für einzelne Beschäftigtengruppen einher.',
    'h',
    ['Generative KI wird in den nächsten Jahren die meisten Bürobeschäftigten ersetzen.',
      'Die Arbeitsmarktfolgen generativer KI sind ungewiss; sie dürfte eher Aufgaben als ganze Berufe verändern, was dennoch Anpassungskosten verursachen kann.',
      'Generative KI betrifft ausschließlich Routinetätigkeiten in der Produktion.',
      'Frühere technologische Umbrüche hatten keine negativen Folgen für Beschäftigte.'],

EPSO_VERBAL_ADD('e', [
  ['Montanunion',
    'Die Europäische Gemeinschaft für Kohle und Stahl (EGKS) wurde 1951 von sechs Staaten gegründet: Belgien, der Bundesrepublik Deutschland, Frankreich, Italien, Luxemburg und den Niederlanden. Die Idee ging auf den französischen Außenminister Robert Schuman zurück, der vorgeschlagen hatte, die gesamte deutsch-französische Kohle- und Stahlproduktion einer gemeinsamen Hohen Behörde zu unterstellen.\n\nKohle und Stahl waren damals die Grundlage jeder Rüstungsproduktion. Durch ihre Vergemeinschaftung sollte ein Krieg zwischen den beteiligten Staaten nicht nur undenkbar, sondern materiell unmöglich werden. Der Vertrag war auf 50 Jahre befristet und lief 2002 aus; die Zuständigkeiten gingen auf die Europäische Gemeinschaft über. Das Vereinigte Königreich lehnte eine Beteiligung ab.',

    ['Das Vereinigte Königreich gehörte zu den Gründungsmitgliedern der EGKS.',

  ['Römische Verträge',
    'Mit den Römischen Verträgen gründeten die sechs Mitgliedstaaten der Montanunion 1957 die Europäische Wirtschaftsgemeinschaft (EWG) und die Europäische Atomgemeinschaft (Euratom). Kern der EWG war die Schaffung eines Gemeinsamen Marktes und einer Zollunion. Die Zölle zwischen den Mitgliedstaaten wurden schrittweise abgebaut; die Zollunion wurde 1968 und damit früher als vorgesehen vollendet.\n\nDer Gemeinsame Markt blieb allerdings lange unvollständig, weil zahlreiche nichttarifäre Handelshemmnisse wie unterschiedliche technische Normen fortbestanden. Erst mit dem Binnenmarktprogramm der 1980er-Jahre, das auf die Vollendung des Binnenmarkts bis Ende 1992 abzielte, wurden viele dieser Hindernisse systematisch beseitigt.',
    'a',
    ['Mit Vollendung der Zollunion 1968 waren alle Handelshemmnisse zwischen den Mitgliedstaaten beseitigt.',
      'Der Abbau der Zölle erfolgte in einem einzigen Schritt im Jahr 1957.',
      'Unterschiedliche technische Normen behinderten den Handel auch nach Abschaffung der Binnenzölle.',
      'Die EWG und Euratom wurden zu verschiedenen Zeitpunkten gegründet.'],
    2,
    'C folgt aus dem Fortbestehen nichttarifärer Hemmnisse wie technischer Normen. A widerspricht dem zweiten Absatz. B widerspricht dem schrittweisen Abbau. D widerspricht der gemeinsamen Gründung 1957.'],

  ['Vertrag von Maastricht',
    'Der 1992 unterzeichnete und 1993 in Kraft getretene Vertrag von Maastricht gründete die Europäische Union. Er führte die Unionsbürgerschaft ein und legte den Grundstein für die Wirtschafts- und Währungsunion, einschließlich der Kriterien, die Staaten für die Einführung einer gemeinsamen Währung erfüllen mussten.\n\nDie Ratifizierung verlief nicht reibungslos. In Dänemark lehnten die Wähler den Vertrag in einem ersten Referendum knapp ab; erst nachdem Dänemark Ausnahmen, unter anderem von der gemeinsamen Währung, zugestanden worden waren, stimmte eine Mehrheit in einem zweiten Referendum zu. In Frankreich wurde der Vertrag in einem Referendum nur mit knapper Mehrheit angenommen.',
    'r',
    ['Der Vertrag von Maastricht wurde in allen Referenden mit großer Mehrheit angenommen.',
      'Dänemark stimmte dem Vertrag erst zu, nachdem ihm Ausnahmen gewährt worden waren.',
      'Der Vertrag von Maastricht führte den Euro als Bargeld ein.',
      'Die Unionsbürgerschaft existierte bereits vor dem Vertrag von Maastricht.'],
    1,

  ['Osterweiterung',
    'Im Jahr 2004 traten der Europäischen Union zehn Staaten bei, darunter acht mittel- und osteuropäische Staaten sowie Malta und Zypern. Es war die größte Erweiterung in der Geschichte der Union. 2007 folgten Bulgarien und Rumänien, 2013 Kroatien.\n\nViele der bisherigen Mitgliedstaaten nutzten die Möglichkeit, die Arbeitnehmerfreizügigkeit für Bürgerinnen und Bürger der neuen Mitgliedstaaten für eine Übergangszeit von bis zu sieben Jahren einzuschränken. Einige Staaten, darunter das Vereinigte Königreich, Irland und Schweden, öffneten ihre Arbeitsmärkte hingegen sofort. Ökonomische Studien kommen überwiegend zu dem Ergebnis, dass die Erweiterung das Wachstum in den neuen Mitgliedstaaten deutlich gefördert hat.',
    'f',
    ['Kroatien trat der Union nach Bulgarien bei.',
      'Mit der Erweiterung von 2004 wurden zehn Staaten Mitglied der Union.',
      'Alle bisherigen Mitgliedstaaten schränkten die Arbeitnehmerfreizügigkeit für die neuen Mitgliedstaaten vorübergehend ein.',
      'Die Erweiterung von 2004 war die größte in der Geschichte der Union.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Einige Staaten wie Schweden öffneten ihre Arbeitsmärkte sofort. A, B und D stehen so im Text.'],

  ['Erasmus-Programm',
    'Das 1987 gestartete Erasmus-Programm ermöglicht Studierenden, einen Teil ihres Studiums an einer Hochschule in einem anderen Land zu absolvieren. Seit seinem Beginn haben mehr als 15 Millionen Menschen an Erasmus und seinen Nachfolgeprogrammen teilgenommen. Das heutige Programm Erasmus+ umfasst neben dem Hochschulbereich auch die berufliche Bildung, die Schulbildung, die Erwachsenenbildung, die Jugendarbeit und den Sport.\n\nStudien deuten darauf hin, dass Erasmus-Teilnehmende nach ihrem Abschluss seltener von Langzeitarbeitslosigkeit betroffen sind. Kritiker geben jedoch zu bedenken, dass Studierende aus einkommensschwachen Familien unterdurchschnittlich teilnehmen, sodass der Befund teilweise auch auf die unterschiedliche soziale Herkunft der Teilnehmenden zurückgehen könnte.',
    'a',
    ['Erasmus+ richtet sich ausschließlich an Studierende.',
      'Es ist erwiesen, dass die Teilnahme an Erasmus allein die geringere Arbeitslosigkeit der Teilnehmenden verursacht.',
      'Die Gruppe der Erasmus-Teilnehmenden ist hinsichtlich ihrer sozialen Herkunft nicht repräsentativ für alle Studierenden.',
      'Seit 1987 haben weniger als eine Million Menschen am Programm teilgenommen.'],
    2,
    'C folgt aus der unterdurchschnittlichen Teilnahme einkommensschwacher Studierender. A widerspricht der Ausweitung auf weitere Bereiche. B übersieht den Einwand, der Befund könne auch auf die Herkunft zurückgehen. D widerspricht den mehr als 15 Millionen Teilnehmenden.'],

  ['Europäische Kulturhauptstädte',
    'Seit 1985 werden jedes Jahr eine oder mehrere Städte zur Kulturhauptstadt Europas ernannt. Die Initiative soll den Reichtum und die Vielfalt der Kulturen in Europa hervorheben und das Gefühl der Zugehörigkeit zu einem gemeinsamen Kulturraum stärken. Die Auswahl erfolgt durch eine unabhängige Expertenjury, die die Bewerbungen der Städte bewertet.\n\nFür viele Städte ist der Titel auch ein Instrument der Stadtentwicklung. Einige nutzten ihn, um sich nach dem Niedergang traditioneller Industrien neu zu positionieren. Die langfristigen Wirkungen fallen allerdings unterschiedlich aus: Während manche Städte dauerhaft mehr Besucher anziehen, kehren andere nach dem Kulturhauptstadtjahr weitgehend zu den früheren Besucherzahlen zurück. Die finanzielle Förderung durch die Union deckt nur einen kleinen Teil der Kosten.',
    'r',
    ['Die Kulturhauptstädte werden von der Kommission ohne externe Beteiligung ausgewählt.',
      'Alle Kulturhauptstädte verzeichnen nach dem Titeljahr dauerhaft höhere Besucherzahlen.',
      'Die Union finanziert den größten Teil der Kosten eines Kulturhauptstadtjahres.',
      'Einige Städte haben den Titel genutzt, um den Strukturwandel nach dem Ende traditioneller Industrien zu gestalten.'],
