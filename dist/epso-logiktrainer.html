EPSO_VERBAL_ADD('g', [
  ['Gemeinsames Europäisches Asylsystem',
    'Nach der Dublin-Verordnung ist grundsätzlich derjenige Mitgliedstaat für die Prüfung eines Asylantrags zuständig, über den eine asylsuchende Person erstmals in die Union eingereist ist. Dies hat in der Vergangenheit Staaten an den Außengrenzen, etwa Italien und Griechenland, besonders stark belastet. Gleichzeitig reisten viele Asylsuchende ohne Registrierung in andere Mitgliedstaaten weiter.\n\nDas 2024 verabschiedete Migrations- und Asylpaket behält das Grundprinzip der Zuständigkeit des Ersteinreisestaats bei, führt aber einen Solidaritätsmechanismus ein. Mitgliedstaaten unter Migrationsdruck sollen unterstützt werden; die übrigen Staaten können wählen, ob sie Asylsuchende aufnehmen, finanzielle Beiträge leisten oder operative Unterstützung bereitstellen. Zudem sollen Asylanträge von Personen aus Staaten mit niedriger Anerkennungsquote in beschleunigten Grenzverfahren geprüft werden.',
    'r',
    ['Das Migrations- und Asylpaket hebt die Zuständigkeit des Ersteinreisestaats vollständig auf.',
      'Nach dem neuen Solidaritätsmechanismus müssen alle Mitgliedstaaten Asylsuchende aufnehmen.',
      'Ein Mitgliedstaat kann sich an der Solidarität beteiligen, ohne Asylsuchende aufzunehmen.',
      'Beschleunigte Grenzverfahren gelten für alle Asylsuchenden unabhängig von ihrer Herkunft.'],
    2,
    'C ist richtig, weil Staaten zwischen Aufnahme, Geldbeiträgen und operativer Unterstützung wählen können. A widerspricht der Beibehaltung des Grundprinzips. B widerspricht der Wahlmöglichkeit. D ist falsch, die Verfahren gelten für Personen aus Staaten mit niedriger Anerkennungsquote.'],

  ['Frühkindliche Bildung',
    'Zahlreiche Studien zeigen, dass eine hochwertige frühkindliche Bildung und Betreuung sich positiv auf die spätere Entwicklung von Kindern auswirken kann, insbesondere bei Kindern aus benachteiligten Familien. Entscheidend ist dabei nach übereinstimmender Einschätzung die Qualität der Einrichtungen, etwa die Qualifikation des Personals und der Betreuungsschlüssel, nicht allein die Dauer der Betreuung.\n\nDie Union hat das Ziel festgelegt, dass mindestens 96 Prozent der Kinder zwischen drei Jahren und dem Beginn der Schulpflicht an frühkindlicher Bildung teilnehmen. Für Kinder unter drei Jahren soll die Beteiligung auf mindestens 45 Prozent steigen. Die Beteiligungsquoten unterscheiden sich zwischen den Mitgliedstaaten erheblich, ebenso wie die Kosten für die Eltern.',
    'a',
    ['Eine lange Betreuungsdauer führt unabhängig von der Qualität zu besseren Entwicklungsergebnissen.',
      'Kinder aus benachteiligten Familien können von hochwertiger frühkindlicher Bildung besonders profitieren.',
      'Das Ziel für Kinder unter drei Jahren liegt bei 96 Prozent.',
      'Die Kosten für frühkindliche Betreuung sind in allen Mitgliedstaaten gleich.'],
    1,
    'B entspricht dem ersten Satz. A widerspricht der Bedeutung der Qualität. C verwechselt die Zielwerte, für unter Dreijährige gelten 45 Prozent. D widerspricht den erheblichen Unterschieden.'],

  ['Schulabbruch',
    'Als frühe Schulabgänger gelten in der Statistik der Union junge Menschen zwischen 18 und 24 Jahren, die höchstens einen Abschluss der Sekundarstufe I erreicht haben und sich nicht in Aus- oder Weiterbildung befinden. Ihr Anteil ist in den vergangenen zwei Jahrzehnten deutlich gesunken und lag zuletzt unter zehn Prozent. Das Ziel für 2030 liegt bei weniger als neun Prozent.\n\nJunge Männer sind häufiger betroffen als junge Frauen, ebenso junge Menschen mit Migrationshintergrund. Frühe Schulabgänger haben ein deutlich höheres Risiko, arbeitslos zu werden oder in schlecht bezahlten Tätigkeiten zu arbeiten. Als wirksam gelten präventive Maßnahmen, die schon vor dem Abbruch ansetzen, etwa eine frühzeitige Förderung leistungsschwacher Schülerinnen und Schüler.',
    'r',
    ['Eine 22-Jährige mit Abschluss der Sekundarstufe I, die eine Berufsausbildung absolviert, gilt als frühe Schulabgängerin.',
      'Der Anteil der frühen Schulabgänger ist in den vergangenen zwanzig Jahren gestiegen.',
      'Junge Frauen verlassen die Schule häufiger vorzeitig als junge Männer.',
      'Maßnahmen, die ansetzen, bevor ein Abbruch erfolgt, gelten als wirksam.'],
    3,
    'D steht im letzten Satz. A ist falsch, weil sich die Person in Ausbildung befindet und damit nicht unter die Definition fällt. B kehrt die Entwicklung um. C kehrt den Geschlechterunterschied um.'],

  ['Blaue Karte EU',
    'Die Blaue Karte EU ist ein Aufenthaltstitel für hochqualifizierte Fachkräfte aus Drittstaaten. Voraussetzung sind ein Arbeitsvertrag oder ein verbindliches Arbeitsplatzangebot über mindestens sechs Monate und ein Gehalt, das eine vom jeweiligen Mitgliedstaat festgelegte Schwelle erreicht. Seit der Reform von 2021 können in bestimmten IT-Berufen auch Berufserfahrung statt eines Hochschulabschlusses als Qualifikationsnachweis dienen.\n\nInhaber einer Blauen Karte können nach einer bestimmten Zeit leichter in einen anderen Mitgliedstaat wechseln und erhalten erleichterten Zugang zum Familiennachzug. Die Mitgliedstaaten dürfen parallel eigene nationale Aufenthaltstitel für Fachkräfte beibehalten. Dänemark und Irland beteiligen sich nicht an der Blauen Karte.',
    'f',
    ['Die Gehaltsschwelle für die Blaue Karte wird von den Mitgliedstaaten festgelegt.',
      'In bestimmten IT-Berufen kann Berufserfahrung einen Hochschulabschluss ersetzen.',
      'Neben der Blauen Karte dürfen keine nationalen Aufenthaltstitel für Fachkräfte bestehen.',
      'Irland beteiligt sich nicht an der Blauen Karte.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Mitgliedstaaten dürfen eigene nationale Titel beibehalten. A, B und D stehen so im Text.'],

  ['Integration auf dem Arbeitsmarkt',
    'Zugewanderte sind in den meisten Mitgliedstaaten seltener erwerbstätig als Einheimische. Die Unterschiede fallen jedoch je nach Herkunft, Zuwanderungsgrund und Aufenthaltsdauer sehr unterschiedlich aus. Geflüchtete haben in den ersten Jahren nach ihrer Ankunft besonders niedrige Beschäftigungsquoten, die sich mit zunehmender Aufenthaltsdauer allerdings deutlich erhöhen.\n\nAls Hindernisse gelten unter anderem fehlende Sprachkenntnisse, lange Asylverfahren, die fehlende Anerkennung von Abschlüssen und Diskriminierung bei der Stellensuche. Viele Zugewanderte arbeiten zudem unterhalb ihres Qualifikationsniveaus. Studien zeigen, dass ein früher Zugang zu Sprachkursen und zum Arbeitsmarkt die spätere Integration verbessert.',
    'a',
    ['Die Beschäftigungsquote von Geflüchteten bleibt dauerhaft auf dem Niveau der ersten Jahre.',
      'Die Tatsache, dass ein Zugewanderter erwerbstätig ist, bedeutet nicht zwingend, dass seine Qualifikationen angemessen genutzt werden.',
      'Alle Gruppen von Zugewanderten sind gleich häufig erwerbstätig.',
      'Ein späterer Zugang zu Sprachkursen verbessert die Integration.'],
    1,
    'B folgt daraus, dass viele Zugewanderte unterhalb ihres Qualifikationsniveaus arbeiten. A widerspricht dem Anstieg mit der Aufenthaltsdauer. C widerspricht den Unterschieden nach Herkunft und Zuwanderungsgrund. D kehrt den Befund zum frühen Zugang um.'],

  ['Vertrauen in Institutionen',
    'Regelmäßige Umfragen des Eurobarometers zeigen, dass das Vertrauen der Bürgerinnen und Bürger in die Europäische Union zwischen den Mitgliedstaaten stark variiert. In vielen Ländern ist das Vertrauen in die Union höher als das Vertrauen in die eigene nationale Regierung oder das nationale Parlament.\n\nForschende warnen jedoch davor, diese Werte zu überschätzen. Das Vertrauen in die Union könne teilweise auch Ausdruck von Misstrauen gegenüber nationalen Institutionen sein: Wer der eigenen Regierung wenig zutraue, sehe die Union unter Umständen als Gegengewicht. Zudem schwanken die Werte mit wirtschaftlichen Krisen; nach der Finanzkrise sank das Vertrauen in die Union in mehreren Staaten deutlich.',
    'r',
    ['In allen Mitgliedstaaten ist das Vertrauen in die Union höher als in die nationale Regierung.',
      'Ein hohes Vertrauen in die Union kann auch mit geringem Vertrauen in nationale Institutionen zusammenhängen.',
      'Das Vertrauen in die Union ist seit Jahrzehnten konstant.',
      'Nach der Finanzkrise stieg das Vertrauen in die Union in allen Staaten.'],
    1,
    'B entspricht der Erklärung der Forschenden. A verallgemeinert „in vielen Ländern“. C widerspricht den Schwankungen. D widerspricht dem Rückgang nach der Finanzkrise.'],

  ['Anerkennung von Berufsqualifikationen',
    'Die Richtlinie über die Anerkennung von Berufsqualifikationen erleichtert es Fachkräften, ihren Beruf in einem anderen Mitgliedstaat auszuüben. Für sieben Berufe, darunter Ärzte, Krankenpfleger, Zahnärzte, Hebammen, Apotheker, Tierärzte und Architekten, gilt eine automatische Anerkennung, weil die Mindestanforderungen an die Ausbildung unionsweit harmonisiert sind.\n\nFür andere reglementierte Berufe prüft der Aufnahmestaat die Qualifikation im Einzelfall. Bestehen wesentliche Unterschiede, kann er eine Anpassungsmaßnahme verlangen, etwa einen Anpassungslehrgang oder eine Eignungsprüfung. Für nicht reglementierte Berufe ist keine formelle Anerkennung erforderlich; hier entscheidet der Arbeitgeber, ob er die Qualifikation für ausreichend hält.',
    'a',
    ['Eine in Spanien ausgebildete Hebamme muss in Deutschland eine Eignungsprüfung ablegen.',
      'Für einen nicht reglementierten Beruf benötigt man in einem anderen Mitgliedstaat keine staatliche Anerkennung der Qualifikation.',
      'Für alle reglementierten Berufe gilt eine automatische Anerkennung.',
      'Ein Aufnahmestaat kann bei Architekten grundsätzlich einen Anpassungslehrgang verlangen.'],
    1,
    'B folgt aus dem letzten Satz. A und D widersprechen der automatischen Anerkennung für Hebammen und Architekten. C ist falsch, die automatische Anerkennung gilt nur für sieben Berufe.'],

  ['Digitale Kompetenzen',
    'Nach Daten von Eurostat verfügt nur gut die Hälfte der Erwachsenen in der Union zumindest über grundlegende digitale Kompetenzen. Das Ziel der Union für 2030 liegt bei 80 Prozent. Die Unterschiede zwischen den Mitgliedstaaten sind groß, ebenso zwischen Altersgruppen und Bildungsniveaus.\n\nBemerkenswert ist, dass auch unter jungen Menschen ein beträchtlicher Teil nicht über grundlegende digitale Kompetenzen verfügt. Die häufige Nutzung von Smartphones und sozialen Netzwerken bedeutet nicht automatisch, dass jemand etwa Informationen kritisch bewerten, Tabellenkalkulationen nutzen oder sich vor Online-Betrug schützen kann. Fachleute fordern daher, digitale Kompetenzen systematischer in den Schulunterricht einzubeziehen.',
    'h',
    ['Junge Menschen verfügen durchweg über ausreichende digitale Kompetenzen.',
      'Viele Erwachsene, und auch viele junge Menschen, haben keine grundlegenden digitalen Kompetenzen, was eine gezieltere Förderung erforderlich macht.',
      'Das Ziel von 80 Prozent ist bereits erreicht.',
      'Wer regelmäßig soziale Netzwerke nutzt, kann Informationen kritisch bewerten.'],
    1,
    'B fasst Befund und Forderung zusammen. A widerspricht dem zweiten Absatz. C widerspricht dem Anteil von gut der Hälfte. D widerspricht dem Hinweis, dass häufige Nutzung nicht automatisch Kompetenz bedeutet.'],

  ['Ländliche Räume',
    'Viele ländliche Regionen in der Union verlieren seit Jahren Einwohner, insbesondere junge Menschen, die zur Ausbildung oder Arbeit in die Städte ziehen. Die Bevölkerung dort altert daher schneller. Zugleich schließen Schulen, Arztpraxen und Geschäfte, was die Regionen weniger attraktiv macht und die Abwanderung weiter verstärken kann.\n\nNicht alle ländlichen Räume sind jedoch gleichermaßen betroffen. Regionen in der Nähe großer Städte gewinnen teilweise Einwohner hinzu, weil Menschen dort günstiger wohnen und in die Stadt pendeln können. Die Möglichkeit, von zu Hause aus zu arbeiten, hat diesen Trend verstärkt. Voraussetzung ist allerdings ein leistungsfähiger Internetanschluss, der in vielen abgelegenen Gebieten noch fehlt.',
    'r',
    ['Alle ländlichen Regionen der Union verlieren Einwohner.',
      'Die Schließung von Schulen und Arztpraxen kann die Abwanderung aus ländlichen Regionen verstärken.',
      'Die Arbeit von zu Hause aus hat die Abwanderung aus stadtnahen ländlichen Regionen beschleunigt.',
      'Abgelegene ländliche Gebiete verfügen durchweg über leistungsfähige Internetanschlüsse.'],
    1,
    'B entspricht dem ersten Absatz. A widerspricht dem Zuzug in stadtnahe Regionen. C kehrt die Wirkung des Homeoffice um. D widerspricht dem fehlenden Internetanschluss in vielen abgelegenen Gebieten.'],

  ['PISA-Studie',
    'Die PISA-Studie der OECD misst alle drei Jahre die Kompetenzen 15-jähriger Schülerinnen und Schüler in Lesen, Mathematik und Naturwissenschaften. In der Erhebung von 2022 verschlechterten sich die Ergebnisse in vielen europäischen Ländern deutlich, vor allem in Mathematik. Ein Teil des Rückgangs wird auf die Schulschließungen während der Pandemie zurückgeführt; in einigen Ländern hatte der Abwärtstrend jedoch bereits vorher eingesetzt.\n\nDie Studie zeigt außerdem, dass der sozioökonomische Hintergrund in den meisten Ländern einen erheblichen Einfluss auf die Leistungen hat. In einigen Bildungssystemen ist dieser Zusammenhang allerdings deutlich schwächer als in anderen, was darauf hindeutet, dass Bildungspolitik ihn beeinflussen kann.',
    'a',
    ['Die Schulschließungen während der Pandemie erklären den gesamten Leistungsrückgang in allen Ländern.',
      'Der Einfluss des sozialen Hintergrunds auf die Schulleistungen ist in allen Ländern gleich stark.',
      'Unterschiede zwischen Bildungssystemen legen nahe, dass Politik den Zusammenhang zwischen Herkunft und Leistung abschwächen kann.',
      'Die PISA-Studie wird jährlich durchgeführt.'],
    2,
    'C gibt die Schlussfolgerung des Textes wieder. A widerspricht dem bereits vorher einsetzenden Trend. B widerspricht den Unterschieden zwischen den Systemen. D widerspricht dem Dreijahresrhythmus.'],

  ['Vorübergehender Schutz',
    'Nach dem russischen Angriff auf die Ukraine im Februar 2022 aktivierte die Union erstmals die Richtlinie über vorübergehenden Schutz. Sie war nach den Kriegen im ehemaligen Jugoslawien geschaffen, aber zuvor nie angewandt worden. Geflüchtete aus der Ukraine erhalten damit ohne individuelles Asylverfahren sofort einen Aufenthaltstitel, Zugang zum Arbeitsmarkt, zu Wohnraum, medizinischer Versorgung und Bildung.\n\nDer Schutz ist befristet und wurde mehrfach verlängert. Da Ukrainerinnen und Ukrainer visumfrei in die Union einreisen durften, konnten sie selbst wählen, in welchem Mitgliedstaat sie Schutz beantragen. Die meisten Schutzberechtigten wurden in Deutschland und Polen registriert, gemessen an der Einwohnerzahl nahmen jedoch einige kleinere Staaten wie Tschechien besonders viele auf.',
    'r',
    ['Die Richtlinie über vorübergehenden Schutz wurde bereits während der Jugoslawienkriege angewandt.',
      'Personen mit vorübergehendem Schutz müssen zunächst ein individuelles Asylverfahren durchlaufen.',
      'Gemessen an der Einwohnerzahl nahmen einige kleinere Staaten besonders viele Schutzberechtigte auf.',
      'Der vorübergehende Schutz ist unbefristet.'],
    2,
    'C steht im letzten Satz. A widerspricht der erstmaligen Aktivierung 2022. B widerspricht dem Schutz ohne individuelles Verfahren. D widerspricht der Befristung.'],

  ['Gleichbehandlung',
    'Das Unionsrecht verbietet Diskriminierung aufgrund der Rasse oder ethnischen Herkunft nicht nur in der Beschäftigung, sondern auch beim Zugang zu Gütern und Dienstleistungen, zu Bildung und zu sozialem Schutz. Für Diskriminierung aufgrund der Religion, einer Behinderung, des Alters oder der sexuellen Ausrichtung besteht ein unionsrechtlicher Schutz dagegen bislang im Wesentlichen nur im Bereich der Beschäftigung.\n\nEin Vorschlag der Kommission, den Schutz auf weitere Lebensbereiche auszudehnen, ist seit 2008 im Rat blockiert, weil er dort Einstimmigkeit erfordert. Viele Mitgliedstaaten gewähren jedoch nach nationalem Recht einen weitergehenden Schutz.',
    'a',
    ['Nach Unionsrecht ist die Verweigerung einer Wohnung wegen der ethnischen Herkunft des Mieters verboten.',
      'Das Unionsrecht schützt bereits heute umfassend vor Altersdiskriminierung beim Zugang zu Dienstleistungen.',
      'Der Vorschlag der Kommission von 2008 wurde inzwischen angenommen.',
      'Kein Mitgliedstaat geht beim Diskriminierungsschutz über das Unionsrecht hinaus.'],
    0,
    'A folgt daraus, dass Diskriminierung wegen der ethnischen Herkunft auch beim Zugang zu Gütern und Dienstleistungen verboten ist. B widerspricht der Beschränkung auf die Beschäftigung. C widerspricht der Blockade im Rat. D widerspricht dem weitergehenden nationalen Schutz.'],

  ['Lebenslanges Lernen',
    'Der technologische Wandel verändert die Anforderungen vieler Berufe in immer kürzeren Abständen. Es gilt daher als zunehmend unwahrscheinlich, dass die in Schule und Ausbildung erworbenen Kenntnisse für ein ganzes Berufsleben ausreichen. Dennoch nehmen in vielen Mitgliedstaaten nur vergleichsweise wenige Erwachsene regelmäßig an Weiterbildungen teil.\n\nAuffällig ist, dass gerade Beschäftigte mit geringer Qualifikation, deren Tätigkeiten besonders häufig von Automatisierung betroffen sind, am seltensten an Weiterbildung teilnehmen. Als Gründe werden unter anderem Zeitmangel, Kosten und fehlende Angebote durch Arbeitgeber genannt. Einige Mitgliedstaaten haben individuelle Weiterbildungskonten eingeführt, die Beschäftigten ein Budget für Kurse zur Verfügung stellen.',
    'r',
    ['Beschäftigte mit geringer Qualifikation nehmen am häufigsten an Weiterbildung teil.',
      'Die Weiterbildungsbeteiligung ist dort am geringsten, wo das Automatisierungsrisiko besonders hoch ist.',
      'Die in der Ausbildung erworbenen Kenntnisse reichen in der Regel für das gesamte Berufsleben aus.',
      'Alle Mitgliedstaaten haben individuelle Weiterbildungskonten eingeführt.'],
    1,
    'B fasst den zweiten Absatz zusammen: Geringqualifizierte sind am stärksten von Automatisierung betroffen und bilden sich am seltensten weiter. A kehrt den Befund um. C widerspricht dem ersten Absatz. D verallgemeinert „einige Mitgliedstaaten“.'],

  ['Wahlbeteiligung junger Menschen',
    'Junge Menschen beteiligen sich in vielen Mitgliedstaaten seltener an Wahlen als ältere. Daraus wird häufig geschlossen, sie seien politisch weniger interessiert. Umfragen zeigen jedoch, dass sich junge Menschen oft auf andere Weise politisch engagieren, etwa durch Demonstrationen, Petitionen, Konsumentscheidungen oder in sozialen Netzwerken.\n\nEinige Mitgliedstaaten haben das Wahlalter für bestimmte Wahlen auf 16 Jahre gesenkt. Bei der Europawahl 2024 durften in Belgien, Deutschland, Malta und Österreich bereits 16-Jährige wählen, in Griechenland 17-Jährige. Studien aus Österreich deuten darauf hin, dass Erstwählerinnen und -wähler mit 16 Jahren eher wählen gehen als solche, die erstmals mit 18 oder 19 Jahren wählen dürfen.',
    'f',
    ['Bei der Europawahl 2024 lag das Mindestwahlalter nicht in allen Mitgliedstaaten bei 18 Jahren.',
      'Junge Menschen engagieren sich nach Umfragen auch außerhalb von Wahlen politisch.',
      'Aus der geringeren Wahlbeteiligung junger Menschen lässt sich nach dem Text zuverlässig auf ein geringeres politisches Interesse schließen.',
      'In Österreich durften 16-Jährige an der Europawahl 2024 teilnehmen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text, der diesen Schluss mit dem Verweis auf andere Formen des Engagements gerade in Frage stellt. A, B und D stehen so im Text.'],

  ['Brain Drain',
    'Mehrere Mitgliedstaaten in Mittel-, Ost- und Südeuropa haben in den vergangenen zwei Jahrzehnten einen erheblichen Teil ihrer jungen, gut ausgebildeten Bevölkerung durch Abwanderung in wohlhabendere Mitgliedstaaten verloren. Dieser sogenannte Brain Drain kann in den Herkunftsländern zu Fachkräftemangel führen, etwa im Gesundheitswesen, und die öffentlichen Investitionen in Ausbildung gewissermaßen in andere Staaten verlagern.\n\nAndererseits überweisen viele Abgewanderte Geld an ihre Familien, und ein Teil kehrt mit neuen Kenntnissen und Kontakten zurück. Einige Herkunftsstaaten versuchen, Rückkehrer mit steuerlichen Anreizen zu gewinnen. Ob die Rückkehr in größerem Umfang gelingt, hängt nach Ansicht von Fachleuten vor allem von den Löhnen und den Karrierechancen im Herkunftsland ab.',
    'h',
    ['Die Abwanderung Hochqualifizierter hat für die Herkunftsländer ausschließlich Nachteile.',
      'Die Abwanderung gut Ausgebildeter belastet die Herkunftsstaaten, bringt aber auch gewisse Vorteile, und eine Rückkehr hängt vor allem von den wirtschaftlichen Perspektiven ab.',
      'Steuerliche Anreize allein reichen aus, um Abgewanderte zur Rückkehr zu bewegen.',
      'Brain Drain betrifft vor allem die wohlhabendsten Mitgliedstaaten.'],
    1,
    'B fasst Nachteile, Vorteile und die Bedingungen einer Rückkehr zusammen. A widerspricht den genannten Vorteilen. C widerspricht der Bedeutung von Löhnen und Karrierechancen. D kehrt die Richtung der Abwanderung um.'],

  ['Mehrsprachigkeitsziel',
    'Die Mitgliedstaaten der Union haben 2002 das Ziel formuliert, dass alle Bürgerinnen und Bürger neben ihrer Muttersprache zwei weitere Sprachen beherrschen sollen. Von diesem Ziel ist die Union weit entfernt: Nach Umfragen gibt etwa ein Drittel der Erwachsenen an, keine Fremdsprache zu sprechen.\n\nDie Unterschiede zwischen den Mitgliedstaaten sind groß. In kleineren Staaten und in Staaten mit mehreren Amtssprachen ist die Fremdsprachenkenntnis im Durchschnitt deutlich höher als in großen Staaten, deren Sprache international verbreitet ist. Englisch ist mit Abstand die am häufigsten gelernte Fremdsprache. Einige Fachleute befürchten, dass dies die Motivation zum Erlernen weiterer Sprachen verringern könnte.',
    'r',
    ['Das Ziel, dass alle Bürger zwei Fremdsprachen beherrschen, ist weitgehend erreicht.',
      'In großen Staaten mit international verbreiteter Sprache sind Fremdsprachenkenntnisse im Durchschnitt stärker verbreitet als in kleinen Staaten.',
      'Etwa ein Drittel der Erwachsenen gibt an, keine Fremdsprache zu sprechen.',
      'Französisch ist die am häufigsten gelernte Fremdsprache in der Union.'],
    2,
    'C steht im ersten Absatz. A widerspricht der großen Entfernung vom Ziel. B kehrt den Vergleich zwischen großen und kleinen Staaten um. D widerspricht der Stellung des Englischen.'],

  ['Kriminalstatistik',
    'Polizeiliche Kriminalstatistiken erfassen nur die Straftaten, die der Polizei bekannt werden. Viele Delikte, etwa Ladendiebstahl, häusliche Gewalt oder Betrug im Internet, werden jedoch häufig nicht angezeigt. Man spricht vom Dunkelfeld.\n\nEin Anstieg der registrierten Fälle muss daher nicht bedeuten, dass tatsächlich mehr Straftaten begangen wurden. Er kann auch darauf zurückgehen, dass Betroffene häufiger Anzeige erstatten, etwa aufgrund öffentlicher Sensibilisierung, oder dass die Polizei in einem Bereich gezielter kontrolliert. Um das Dunkelfeld abzuschätzen, werden ergänzend Opferbefragungen durchgeführt, bei denen Menschen gefragt werden, ob sie Opfer einer Straftat geworden sind.',
    'a',
    ['Ein Anstieg der registrierten Fälle häuslicher Gewalt beweist, dass häusliche Gewalt zugenommen hat.',
      'Verstärkte Kontrollen der Polizei in einem Bereich können die Zahl der registrierten Straftaten erhöhen, ohne dass mehr Straftaten begangen werden.',
      'Opferbefragungen erfassen ausschließlich angezeigte Straftaten.',
      'Die polizeiliche Kriminalstatistik bildet alle begangenen Straftaten vollständig ab.'],
    1,
    'B lässt sich aus dem zweiten Absatz ableiten. A widerspricht dem Hinweis, dass ein Anstieg auch auf mehr Anzeigen zurückgehen kann. C verkennt den Zweck der Opferbefragungen, das Dunkelfeld abzuschätzen. D widerspricht dem Dunkelfeld.'],

  ['Hochschulzugang',
    'Der Anteil der 25- bis 34-Jährigen mit Hochschulabschluss ist in der Union in den vergangenen Jahrzehnten stark gestiegen und liegt inzwischen über 40 Prozent. Das Ziel der Union für 2030 liegt bei mindestens 45 Prozent. In fast allen Mitgliedstaaten haben junge Frauen häufiger einen Hochschulabschluss als junge Männer.\n\nDer Anteil variiert jedoch stark zwischen den Mitgliedstaaten. Dabei ist zu berücksichtigen, dass die Bildungssysteme unterschiedlich aufgebaut sind: In Staaten mit einem ausgeprägten System der dualen Berufsausbildung werden manche Qualifikationen außerhalb der Hochschulen erworben, die in anderen Staaten ein Studium erfordern. Ein niedrigerer Akademikeranteil ist daher nicht zwingend ein Zeichen geringerer Qualifikation.',
    'r',
    ['Junge Männer haben in fast allen Mitgliedstaaten häufiger einen Hochschulabschluss als junge Frauen.',
      'Das Ziel von 45 Prozent ist bereits überschritten.',
      'Ein Staat mit dualer Berufsausbildung kann einen niedrigeren Akademikeranteil aufweisen, ohne dass seine Bevölkerung schlechter qualifiziert ist.',
      'Der Akademikeranteil ist in allen Mitgliedstaaten ähnlich hoch.'],
    2,
    'C folgt aus dem zweiten Absatz. A kehrt den Geschlechterunterschied um. B widerspricht dem Anteil von „über 40 Prozent“ bei einem Ziel von 45 Prozent. D widerspricht der starken Variation.'],

  ['Freiwilligenarbeit',
    'Das Europäische Solidaritätskorps bietet jungen Menschen zwischen 18 und 30 Jahren die Möglichkeit, sich in Freiwilligenprojekten im eigenen Land oder im Ausland zu engagieren, etwa im Umweltschutz, in der sozialen Arbeit oder im Katastrophenschutz. Für die humanitäre Hilfe außerhalb der Union liegt die Altersgrenze bei 35 Jahren.\n\nDie Teilnehmenden erhalten Unterkunft, Verpflegung, eine Versicherung und ein Taschengeld, jedoch kein Gehalt. Die Projekte sollen nicht dazu dienen, reguläre Arbeitsplätze zu ersetzen. Neben der persönlichen Entwicklung der Teilnehmenden soll das Programm den Zusammenhalt in der Gesellschaft stärken.',
    'f',
    ['Ein 33-Jähriger kann sich über das Solidaritätskorps an einem Projekt der humanitären Hilfe außerhalb der Union beteiligen.',
      'Freiwillige im Solidaritätskorps erhalten ein reguläres Gehalt.',
      'Projekte des Solidaritätskorps dürfen reguläre Arbeitsplätze nicht ersetzen.',
      'Freiwilligenprojekte können auch im eigenen Land stattfinden.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Die Teilnehmenden erhalten ein Taschengeld, aber kein Gehalt. A folgt aus der Altersgrenze von 35 Jahren. C und D stehen so im Text.'],

  ['Wohnungsnot in Universitätsstädten',
    'In vielen Universitätsstädten ist es für Studierende schwierig geworden, bezahlbaren Wohnraum zu finden. Die Zahl der Studierenden ist gestiegen, während der Bau von Wohnheimen nicht Schritt gehalten hat. Zudem konkurrieren Studierende auf dem privaten Wohnungsmarkt mit Berufstätigen und Touristen, da Wohnungen teilweise als Ferienunterkünfte vermietet werden.\n\nFür Studierende aus einkommensschwachen Familien kann dies die Wahl des Studienorts einschränken oder sie ganz vom Studium abhalten. Einige Städte haben den Bau von Wohnheimen gefördert oder die Vermietung an Touristen begrenzt. Auch Modelle, bei denen Studierende günstig bei älteren Menschen wohnen und ihnen im Gegenzug im Alltag helfen, werden erprobt.',
    'a',
    ['Die Wohnungsknappheit in Universitätsstädten betrifft alle Studierenden gleichermaßen.',
      'Hohe Mieten in Universitätsstädten können die soziale Zusammensetzung der Studierenden beeinflussen.',
      'Der Bau von Wohnheimen hat mit der steigenden Zahl der Studierenden Schritt gehalten.',
      'Die Vermietung an Touristen hat keinen Einfluss auf den Wohnungsmarkt für Studierende.'],
    1,
    'B folgt daraus, dass Studierende aus einkommensschwachen Familien vom Studium abgehalten werden können. A widerspricht der besonderen Betroffenheit einkommensschwacher Studierender. C und D widersprechen dem ersten Absatz.'],

  ['Unionsbürger und Sozialleistungen',
    'Nach der Freizügigkeitsrichtlinie haben Unionsbürgerinnen und -bürger das Recht, sich bis zu drei Monate ohne weitere Bedingungen in einem anderen Mitgliedstaat aufzuhalten. Für einen längeren Aufenthalt müssen sie Arbeitnehmer oder Selbstständige sein oder über ausreichende Existenzmittel und einen umfassenden Krankenversicherungsschutz verfügen, damit sie die Sozialleistungen des Aufnahmestaats nicht unangemessen in Anspruch nehmen.\n\nDer Gerichtshof hat entschieden, dass Mitgliedstaaten wirtschaftlich nicht aktive Unionsbürger, die allein zur Arbeitsuche oder ohne ausreichende Mittel einreisen, unter bestimmten Umständen von bestimmten Sozialleistungen ausschließen dürfen. Nach fünf Jahren rechtmäßigen Aufenthalts erwerben Unionsbürger ein Daueraufenthaltsrecht.',
    'r',
    ['Unionsbürger dürfen sich in jedem Mitgliedstaat zeitlich unbegrenzt ohne Bedingungen aufhalten.',
      'Mitgliedstaaten müssen allen Unionsbürgern ab dem ersten Tag dieselben Sozialleistungen gewähren wie ihren eigenen Staatsangehörigen.',
      'Nach fünf Jahren rechtmäßigen Aufenthalts erwerben Unionsbürger ein Daueraufenthaltsrecht.',
      'Wirtschaftlich nicht aktive Unionsbürger dürfen nie von Sozialleistungen ausgeschlossen werden.'],
    2,
    'C steht im letzten Satz. A widerspricht den Bedingungen nach drei Monaten. B und D widersprechen der Rechtsprechung zum Ausschluss bestimmter Gruppen.'],

  ['Ehrenamt und Vereine',
    'Ein großer Teil der Menschen in der Union engagiert sich ehrenamtlich, etwa in Sportvereinen, Feuerwehren, Kirchengemeinden oder sozialen Initiativen. Die Beteiligung unterscheidet sich stark zwischen den Mitgliedstaaten und ist in nord- und westeuropäischen Staaten im Durchschnitt höher als in süd- und osteuropäischen.\n\nDie Formen des Engagements verändern sich. Vereine berichten, dass es schwieriger werde, Menschen für langfristige Ämter wie Vorstandsposten zu gewinnen, während die Bereitschaft zu kurzfristigem, projektbezogenem Engagement zunehme. Einige Fachleute sehen darin keinen Rückgang des Engagements insgesamt, sondern einen Wandel seiner Formen.',
    'h',
    ['Das ehrenamtliche Engagement in Europa bricht zusammen.',
      'Das Ehrenamt verlagert sich von langfristigen Verpflichtungen hin zu kurzfristigem Engagement, was nicht zwingend einen Rückgang bedeutet.',
      'In allen Mitgliedstaaten engagieren sich gleich viele Menschen ehrenamtlich.',
      'Vereine haben keine Schwierigkeiten, Vorstandsposten zu besetzen.'],
    1,
    'B gibt die Kernaussage des zweiten Absatzes wieder. A übertreibt und widerspricht der Deutung als Wandel. C widerspricht den Unterschieden zwischen den Staaten. D widerspricht den Berichten der Vereine.'],

  ['Pressefreiheit',
    'Die Pressefreiheit ist in der Union im weltweiten Vergleich gut geschützt, doch Organisationen, die sie beobachten, berichten auch hier von Verschlechterungen. Genannt werden unter anderem der wachsende Einfluss von Regierungen auf öffentlich-rechtliche Medien in einigen Mitgliedstaaten, die Konzentration von Medienbesitz und missbräuchliche Klagen gegen Journalistinnen und Journalisten.\n\nSolche Klagen, oft als SLAPP bezeichnet, zielen weniger darauf ab, einen Prozess zu gewinnen, als die Betroffenen durch Kosten und Aufwand einzuschüchtern. Eine Richtlinie der Union ermöglicht es Gerichten, offensichtlich unbegründete Klagen in grenzüberschreitenden Fällen frühzeitig abzuweisen. Das Europäische Medienfreiheitsgesetz soll zudem die Unabhängigkeit öffentlich-rechtlicher Medien und die Transparenz der Eigentumsverhältnisse stärken.',
    'a',
    ['Bei SLAPP-Klagen ist das wichtigste Ziel des Klägers, den Prozess zu gewinnen.',
      'Die Richtlinie gegen SLAPP gilt für sämtliche Klagen, auch rein nationale Fälle.',
      'Selbst eine erfolglose Klage kann Journalisten durch Kosten und Aufwand von Berichterstattung abhalten.',
      'Die Pressefreiheit in der Union hat sich nach übereinstimmenden Berichten zuletzt verbessert.'],
    2,
    'C folgt aus der Einschüchterungswirkung durch Kosten und Aufwand. A widerspricht dem beschriebenen Zweck solcher Klagen. B widerspricht der Beschränkung auf grenzüberschreitende Fälle. D widerspricht den berichteten Verschlechterungen.'],

  ['Bevölkerungsprognosen',
    'Nach den Projektionen von Eurostat wird die Bevölkerung der Union in den kommenden Jahren zunächst noch leicht wachsen und danach zurückgehen. Das Wachstum beruht dabei ausschließlich auf Zuwanderung, denn in der Union sterben seit einigen Jahren mehr Menschen, als geboren werden.\n\nProjektionen sind keine Vorhersagen. Sie zeigen, wie sich die Bevölkerung entwickeln würde, wenn bestimmte Annahmen über Geburten, Sterblichkeit und Wanderung eintreffen. Insbesondere die Annahmen zur Zuwanderung sind mit großer Unsicherheit behaftet, da diese stark von politischen und wirtschaftlichen Entwicklungen abhängt. Eurostat veröffentlicht deshalb auch Varianten mit abweichenden Annahmen.',
    'r',
    ['In der Union werden seit einigen Jahren mehr Menschen geboren, als sterben.',
      'Ohne Zuwanderung würde die Bevölkerung der Union bereits heute schrumpfen.',
      'Die Projektionen von Eurostat sind verlässliche Vorhersagen der künftigen Bevölkerung.',
      'Die Annahmen zur Zuwanderung gelten als besonders sicher.'],
    1,
    'B folgt daraus, dass mehr Menschen sterben als geboren werden und das Wachstum allein auf Zuwanderung beruht. A kehrt den Befund um. C widerspricht dem Satz „Projektionen sind keine Vorhersagen“. D widerspricht der großen Unsicherheit.'],

  ['Medienkompetenz in Schulen',
    'Kinder und Jugendliche verbringen einen großen Teil ihrer Freizeit mit digitalen Medien. Mehrere Mitgliedstaaten haben daher Medienkompetenz als Querschnittsaufgabe in ihre Lehrpläne aufgenommen. Die Schülerinnen und Schüler sollen lernen, Quellen zu prüfen, Werbung und redaktionelle Inhalte zu unterscheiden und die Funktionsweise von Algorithmen in sozialen Netzwerken zu verstehen.\n\nLehrkräfte berichten jedoch, dass sie sich auf diese Aufgabe oft nicht ausreichend vorbereitet fühlen. Zudem konkurriert Medienkompetenz als Querschnittsaufgabe mit den Anforderungen der einzelnen Fächer um knappe Unterrichtszeit. Einige Staaten haben daneben Beschränkungen für die Nutzung privater Smartphones während des Unterrichts eingeführt.',
    'f',
    ['Mehrere Mitgliedstaaten haben Medienkompetenz in ihre Lehrpläne aufgenommen.',
      'Lehrkräfte fühlen sich nach eigenen Angaben durchweg gut auf die Vermittlung von Medienkompetenz vorbereitet.',
      'Zur Medienkompetenz gehört, Werbung von redaktionellen Inhalten unterscheiden zu können.',
      'Einige Staaten beschränken die Nutzung privater Smartphones im Unterricht.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Lehrkräfte fühlen sich oft nicht ausreichend vorbereitet. A, C und D stehen so im Text.'],
]);

/* Fragenpool Sprachlogik – Block H: Verkehr, Landwirtschaft, Fischerei, Lebensmittel */
EPSO_VERBAL_ADD('h', [
  ['Fluggastrechte',
    'Nach der Fluggastrechteverordnung haben Reisende bei großer Verspätung, Annullierung oder Nichtbeförderung Anspruch auf Ausgleichszahlungen zwischen 250 und 600 Euro, je nach Flugstrecke. Die Verordnung gilt für alle Flüge, die in der Union starten, sowie für Flüge in die Union, sofern sie von einer Fluggesellschaft aus der Union durchgeführt werden.\n\nEin Anspruch auf Ausgleich besteht nicht, wenn die Fluggesellschaft nachweist, dass die Störung auf außergewöhnliche Umstände zurückgeht, die sich auch bei Ergreifen aller zumutbaren Maßnahmen nicht hätten vermeiden lassen, etwa extreme Wetterbedingungen. Technische Defekte gelten nach der Rechtsprechung des Gerichtshofs in der Regel nicht als außergewöhnliche Umstände. Unabhängig vom Ausgleichsanspruch müssen Fluggesellschaften bei langen Wartezeiten Verpflegung und gegebenenfalls eine Hotelunterkunft bereitstellen.',
    'r',
    ['Ein Flug von New York nach Paris mit einer amerikanischen Fluggesellschaft fällt unter die Verordnung.',
      'Bei einer Verspätung wegen eines technischen Defekts entfällt der Ausgleichsanspruch in der Regel.',
      'Auch wenn wegen extremen Wetters kein Ausgleich geschuldet ist, kann die Fluggesellschaft zur Verpflegung der Wartenden verpflichtet sein.',
      'Die Ausgleichszahlung beträgt unabhängig von der Flugstrecke 600 Euro.'],
    2,
    'C folgt daraus, dass die Betreuungspflicht unabhängig vom Ausgleichsanspruch besteht. A ist falsch, bei Flügen in die Union muss eine EU-Fluggesellschaft fliegen. B widerspricht der Rechtsprechung zu technischen Defekten. D widerspricht der Staffelung nach Strecke.'],

  ['Gemeinsame Agrarpolitik',
    'Die Gemeinsame Agrarpolitik (GAP) ist einer der größten Posten im Haushalt der Union. Sie besteht aus zwei Säulen: Die erste Säule umfasst vor allem Direktzahlungen an landwirtschaftliche Betriebe, die überwiegend nach der bewirtschafteten Fläche bemessen werden. Die zweite Säule finanziert die Entwicklung des ländlichen Raums, etwa Umweltmaßnahmen und Investitionen, und muss von den Mitgliedstaaten kofinanziert werden.\n\nKritiker bemängeln, dass die flächenbezogenen Direktzahlungen vor allem großen Betrieben und Landeigentümern zugutekommen. Seit der jüngsten Reform erstellen die Mitgliedstaaten nationale Strategiepläne, in denen sie festlegen, wie sie die Mittel einsetzen. Ein Teil der Direktzahlungen ist an zusätzliche Umweltleistungen gebunden, sogenannte Öko-Regelungen.',
    'a',
    ['Kleine Betriebe erhalten nach dem System der Direktzahlungen in der Regel höhere Zahlungen als große.',
      'Die zweite Säule der GAP wird vollständig aus dem Unionshaushalt finanziert.',
      'Ein Betrieb mit größerer Fläche erhält aus der ersten Säule tendenziell mehr Geld.',
      'Die Mitgliedstaaten haben bei der Verwendung der GAP-Mittel keinen Spielraum.'],
    2,
    'C folgt aus der Bemessung nach der Fläche. A kehrt diesen Zusammenhang um. B widerspricht der Kofinanzierung. D widerspricht den nationalen Strategieplänen.'],

  ['Gemeinsame Fischereipolitik',
    'Fischbestände sind eine gemeinsame Ressource: Fisch, den ein Fischer nicht fängt, kann ein anderer fangen. Ohne Regeln besteht daher ein Anreiz zur Überfischung. Die Gemeinsame Fischereipolitik legt deshalb für viele Bestände jährlich zulässige Gesamtfangmengen fest, die auf die Mitgliedstaaten aufgeteilt werden.\n\nZiel ist, die Bestände auf einem Niveau zu bewirtschaften, das langfristig den höchstmöglichen Dauerertrag erlaubt. Seit einigen Jahren gilt zudem eine Anlandeverpflichtung: Unerwünschte Beifänge dürfen grundsätzlich nicht mehr über Bord geworfen werden, sondern müssen angelandet und auf die Quote angerechnet werden. Die Durchsetzung dieser Pflicht auf See gilt als schwierig. Im Nordostatlantik hat sich der Zustand vieler Bestände verbessert, im Mittelmeer gilt ein großer Teil weiterhin als überfischt.',
    'r',
    ['Unerwünschte Beifänge dürfen grundsätzlich weiterhin über Bord geworfen werden.',
      'Der Zustand der Fischbestände hat sich in allen Meeren der Union verbessert.',
      'Die Anlandeverpflichtung lässt sich auf See leicht kontrollieren.',
      'Beifänge, die angelandet werden müssen, werden auf die Fangquote angerechnet.'],
    3,
    'D steht so im Text. A widerspricht der Anlandeverpflichtung. B widerspricht der Lage im Mittelmeer. C widerspricht der schwierigen Durchsetzung.'],

  ['Güterverkehr auf der Schiene',
    'Der Anteil der Schiene am Güterverkehr in der Union liegt seit Jahren bei knapp einem Fünftel, während der Großteil der Güter auf der Straße transportiert wird. Ein Güterzug verursacht pro transportierter Tonne und Kilometer deutlich weniger Treibhausgase als ein Lastwagen. Die Union will den Schienengüterverkehr daher bis 2030 um die Hälfte steigern.\n\nHindernisse sind unter anderem unterschiedliche technische Standards und Zugsicherungssysteme in den Mitgliedstaaten, Engpässe im Netz und die Vorrangstellung des Personenverkehrs bei der Vergabe von Trassen. Zudem ist die Schiene vor allem für große Mengen über weite Strecken wirtschaftlich; für die Feinverteilung bleiben Lastwagen meist unverzichtbar. Das einheitliche europäische Zugsicherungssystem ETCS wird nur langsam eingeführt.',
    'a',
    ['Die Schiene kann den Lastwagen im Güterverkehr vollständig ersetzen.',
      'Eine Verlagerung von Transporten von der Straße auf die Schiene kann die Treibhausgasemissionen senken.',
      'Der Anteil der Schiene am Güterverkehr ist in den vergangenen Jahren stark gestiegen.',
      'Güterzüge haben bei der Vergabe von Trassen Vorrang vor Personenzügen.'],
    1,
    'B folgt aus den geringeren Emissionen pro Tonnenkilometer. A widerspricht der Unverzichtbarkeit von Lastwagen für die Feinverteilung. C widerspricht dem seit Jahren stabilen Anteil. D kehrt den Vorrang um.'],

  ['Lebensmittelverschwendung',
    'In der Union werden jährlich fast 60 Millionen Tonnen Lebensmittel weggeworfen, das sind rund 130 Kilogramm pro Person. Mehr als die Hälfte davon fällt in privaten Haushalten an; der Rest entfällt auf Verarbeitung, Handel, Gastronomie und Erzeugung.\n\nEin Teil der Verschwendung geht auf Missverständnisse bei der Datumskennzeichnung zurück. Das Verbrauchsdatum („zu verbrauchen bis“) gibt an, bis wann ein leicht verderbliches Lebensmittel aus Sicherheitsgründen verzehrt werden sollte. Das Mindesthaltbarkeitsdatum („mindestens haltbar bis“) gibt dagegen an, bis wann ein Lebensmittel seine spezifischen Eigenschaften mindestens behält; viele Produkte sind danach noch genießbar. Die Union hat verbindliche Ziele zur Verringerung der Lebensmittelverschwendung bis 2030 beschlossen.',
    'r',
    ['Der größte Teil der Lebensmittelverschwendung entsteht im Handel.',
      'Ein Joghurt ist nach Ablauf des Mindesthaltbarkeitsdatums in jedem Fall ungenießbar.',
      'Das Verbrauchsdatum bezieht sich auf die Sicherheit leicht verderblicher Lebensmittel.',
      'Pro Person werden in der Union jährlich rund 60 Kilogramm Lebensmittel weggeworfen.'],
    2,
    'C entspricht der Definition im Text. A widerspricht dem Anteil der privaten Haushalte von mehr als der Hälfte. B widerspricht dem Satz, dass viele Produkte danach noch genießbar sind. D verwechselt die Gesamtmenge mit dem Wert pro Person (130 kg).'],

  ['Autonomes Fahren',
    'Automatisierte Fahrzeuge werden in Stufen eingeteilt. Auf den unteren Stufen unterstützen Assistenzsysteme den Fahrer, der jedoch jederzeit die Kontrolle behalten und das Verkehrsgeschehen überwachen muss. Erst ab Stufe 3 darf sich der Fahrer in bestimmten Situationen vom Verkehrsgeschehen abwenden, muss aber auf Aufforderung des Systems die Steuerung übernehmen können. Auf den höchsten Stufen ist kein Fahrer mehr erforderlich.\n\nIn der Union sind Systeme der Stufe 3 inzwischen unter bestimmten Bedingungen zugelassen, etwa auf Autobahnen bis zu einer bestimmten Geschwindigkeit. Offene Fragen betreffen unter anderem die Haftung bei Unfällen, die Cybersicherheit und die Frage, wie Menschen nach längerer Passivität rasch wieder die Kontrolle übernehmen können.',
    'f',
    ['Bei Assistenzsystemen der unteren Stufen muss der Fahrer das Verkehrsgeschehen ständig überwachen.',
      'Auf Stufe 3 muss der Fahrer die Steuerung übernehmen können, wenn das System ihn dazu auffordert.',
      'Systeme der Stufe 3 dürfen in der Union auf allen Straßen ohne Einschränkungen eingesetzt werden.',
      'Die Haftung bei Unfällen automatisierter Fahrzeuge ist eine offene Frage.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Stufe 3 ist nur unter bestimmten Bedingungen zugelassen, etwa auf Autobahnen bis zu einer bestimmten Geschwindigkeit. A, B und D stehen so im Text.'],

  ['Geschützte Ursprungsbezeichnungen',
    'Die Union schützt Bezeichnungen landwirtschaftlicher Erzeugnisse und Lebensmittel, deren Qualität oder Eigenschaften mit ihrer Herkunft verbunden sind. Bei einer geschützten Ursprungsbezeichnung müssen alle Produktionsschritte in dem abgegrenzten Gebiet stattfinden, bei einer geschützten geografischen Angabe genügt es, dass mindestens ein Produktionsschritt dort erfolgt.\n\nSo darf etwa ein Käse nur dann unter einer geschützten Ursprungsbezeichnung verkauft werden, wenn die Milch aus der Region stammt und dort verarbeitet wurde. Der Schutz gilt auch gegen Anspielungen, etwa Bezeichnungen wie „nach Art von“. Die Union setzt sich in Handelsabkommen dafür ein, dass Drittstaaten diese Bezeichnungen ebenfalls schützen, was nicht immer gelingt.',
    'a',
    ['Bei einer geschützten geografischen Angabe müssen sämtliche Produktionsschritte in der Region erfolgen.',
      'Ein Erzeugnis, dessen Rohstoffe aus einer anderen Region stammen, kann unter Umständen dennoch eine geschützte geografische Angabe tragen.',
      'Bezeichnungen wie „nach Art von“ sind von dem Schutz ausgenommen.',
      'Alle Drittstaaten erkennen die geschützten Bezeichnungen der Union an.'],
    1,
    'B folgt daraus, dass bei einer geschützten geografischen Angabe ein Produktionsschritt in der Region genügt. A verwechselt die beiden Kategorien. C widerspricht dem Schutz gegen Anspielungen. D widerspricht dem Hinweis, dass dies nicht immer gelingt.'],

  ['Fahrradverkehr',
    'Der Anteil des Fahrrads an den zurückgelegten Wegen unterscheidet sich zwischen europäischen Städten erheblich. In einigen niederländischen und dänischen Städten wird ein großer Teil aller Wege mit dem Rad zurückgelegt, in vielen anderen Städten nur ein kleiner Bruchteil. Untersuchungen zeigen, dass der wichtigste Faktor nicht das Klima oder die Topografie ist, sondern das Gefühl von Sicherheit, das vor allem durch baulich getrennte Radwege entsteht.\n\nElektrofahrräder haben die Reichweite des Radverkehrs erhöht und machen auch hügelige Städte und längere Pendelstrecken attraktiver. Zugleich gehen mit dem wachsenden Radverkehr neue Konflikte um den begrenzten Straßenraum einher, etwa bei der Umwidmung von Fahrspuren oder Parkplätzen.',
    'r',
    ['Das Klima ist nach den Untersuchungen der wichtigste Faktor für den Radverkehrsanteil einer Stadt.',
      'Baulich getrennte Radwege können das Sicherheitsgefühl der Radfahrenden erhöhen.',
      'Elektrofahrräder haben die Reichweite des Radverkehrs verringert.',
      'In allen europäischen Städten ist der Radverkehrsanteil ähnlich hoch.'],
    1,
    'B entspricht dem ersten Absatz. A widerspricht den Untersuchungen. C kehrt die Wirkung der Elektrofahrräder um. D widerspricht den erheblichen Unterschieden.'],

  ['Pestizidreduktion',
    'Die Kommission hatte vorgeschlagen, den Einsatz chemischer Pflanzenschutzmittel und das damit verbundene Risiko bis 2030 um 50 Prozent zu verringern. Der Vorschlag scheiterte im Europäischen Parlament und wurde später von der Kommission zurückgezogen. Landwirtschaftsverbände hatten befürchtet, dass Ernteerträge sinken und die Produktion in Länder mit geringeren Standards abwandern würde.\n\nDie Zulassung von Wirkstoffen erfolgt weiterhin auf Unionsebene, während die einzelnen Pflanzenschutzmittel von den Mitgliedstaaten zugelassen werden. Die Verwendung bestimmter Wirkstoffe, etwa einiger Neonikotinoide, ist wegen ihrer Auswirkungen auf Bienen im Freiland stark eingeschränkt. Einige Mitgliedstaaten haben nationale Ziele zur Verringerung des Pestizideinsatzes festgelegt.',
    'r',
    ['Das Ziel, den Pestizideinsatz bis 2030 zu halbieren, ist heute geltendes Unionsrecht.',
      'Einzelne Pflanzenschutzmittel werden von der Union zentral zugelassen.',
      'Der Einsatz bestimmter Neonikotinoide im Freiland ist wegen ihrer Wirkung auf Bienen stark eingeschränkt.',
      'Landwirtschaftsverbände unterstützten den Vorschlag der Kommission.'],
    2,
    'C steht so im Text. A widerspricht dem Scheitern und Rückzug des Vorschlags. B verwechselt die Zuständigkeiten, die Mittel lassen die Mitgliedstaaten zu. D widerspricht den Befürchtungen der Verbände.'],

  ['Transeuropäische Verkehrsnetze',
    'Die transeuropäischen Verkehrsnetze (TEN-V) sollen Lücken zwischen den nationalen Verkehrsnetzen schließen und Engpässe beseitigen, insbesondere an den Grenzen. Das Netz umfasst Schienen, Straßen, Binnenwasserstraßen, Häfen und Flughäfen. Es ist in ein Kernnetz, das bis 2030 fertiggestellt sein soll, ein erweitertes Kernnetz bis 2040 und ein Gesamtnetz bis 2050 gegliedert.\n\nDie Finanzierung erfolgt überwiegend durch die Mitgliedstaaten; die Union beteiligt sich über die Fazilität „Connecting Europe“, vor allem an grenzüberschreitenden Projekten. Große Vorhaben wie Alpentunnel verzögern sich häufig um Jahre. Der Europäische Rechnungshof hat bemängelt, dass die Fristen für die Fertigstellung des Kernnetzes voraussichtlich nicht eingehalten werden.',
    'a',
    ['Die Union finanziert die transeuropäischen Verkehrsnetze vollständig.',
      'Es ist wahrscheinlich, dass Teile des Kernnetzes nicht bis 2030 fertiggestellt sein werden.',
      'Das Netz umfasst ausschließlich Schienenverbindungen.',
      'Das Gesamtnetz soll vor dem Kernnetz fertiggestellt werden.'],
    1,
    'B lässt sich aus der Einschätzung des Rechnungshofs ableiten. A widerspricht der überwiegenden Finanzierung durch die Mitgliedstaaten. C widerspricht der Aufzählung der Verkehrsträger. D kehrt die zeitliche Reihenfolge um.'],

  ['Tierschutz in der Nutztierhaltung',
    'Die Union hat bereits in den 1990er- und 2000er-Jahren Mindeststandards für die Haltung von Nutztieren festgelegt, etwa das Verbot herkömmlicher Käfige für Legehennen. Viele dieser Vorschriften gelten als veraltet. Eine Europäische Bürgerinitiative mit dem Titel „End the Cage Age“ sammelte mehr als eine Million Unterschriften für ein Ende der Käfighaltung, und die Kommission kündigte daraufhin einen entsprechenden Gesetzesvorschlag an.\n\nDie Umsetzung verzögerte sich jedoch. Befürworter strengerer Vorschriften verweisen auf wissenschaftliche Gutachten zum Tierwohl; Landwirte warnen vor hohen Umstellungskosten und fordern lange Übergangsfristen sowie gleiche Standards für importierte Produkte.',
    'f',
    ['Die Haltung von Legehennen in herkömmlichen Käfigen ist in der Union verboten.',
      'Die Bürgerinitiative „End the Cage Age“ erreichte die erforderliche Zahl an Unterschriften.',
      'Die Kommission hat die angekündigten Vorschriften zur Beendigung der Käfighaltung ohne Verzögerung umgesetzt.',
      'Landwirte fordern, dass für importierte Produkte gleiche Standards gelten.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Umsetzung verzögerte sich. A, B und D stehen so im Text.'],

  ['Nachtzüge',
    'Nachtzüge verbanden früher zahlreiche europäische Städte, doch viele Verbindungen wurden in den 2000er- und 2010er-Jahren eingestellt, weil sie als unwirtschaftlich galten und Billigflüge Reisende abwarben. Seit einigen Jahren erleben Nachtzüge eine Wiederbelebung, getragen unter anderem von einem gestiegenen Umweltbewusstsein.\n\nDer Betrieb bleibt allerdings anspruchsvoll. Nachtzüge benötigen spezielles Wagenmaterial, das teuer ist und tagsüber meist ungenutzt bleibt. Für jede Strecke müssen Trassen in mehreren Ländern gebucht und Trassenentgelte gezahlt werden, und Bauarbeiten, die häufig nachts stattfinden, führen zu Umleitungen. Anders als der internationale Luftverkehr sind Bahnfahrkarten zudem in vielen Ländern mehrwertsteuerpflichtig.',
    'r',
    ['Alle Nachtzugverbindungen der 2000er-Jahre bestehen bis heute.',
      'Wagen für Nachtzüge werden tagsüber in der Regel intensiv genutzt.',
      'Nächtliche Bauarbeiten am Schienennetz können den Betrieb von Nachtzügen erschweren.',
      'Internationale Flugtickets sind in vielen Ländern stärker mit Mehrwertsteuer belastet als Bahnfahrkarten.'],
    2,
    'C folgt aus dem Hinweis auf nächtliche Bauarbeiten und Umleitungen. A widerspricht den Einstellungen. B widerspricht der Nichtnutzung tagsüber. D kehrt den steuerlichen Vergleich um.'],

  ['Ökologischer Landbau',
    'Die Union hat das Ziel formuliert, dass bis 2030 mindestens ein Viertel der landwirtschaftlichen Fläche ökologisch bewirtschaftet wird. Derzeit liegt der Anteil bei knapp über zehn Prozent, wobei die Unterschiede zwischen den Mitgliedstaaten groß sind. In einigen Staaten, etwa Österreich, wird bereits mehr als ein Viertel der Fläche ökologisch bewirtschaftet.\n\nÖkologisch erzeugte Lebensmittel sind in der Regel teurer, da die Erträge pro Fläche niedriger und die Produktionskosten höher sind. Während der Inflationsphase nach 2022 ging die Nachfrage in einigen Ländern zurück, weil Verbraucher zu günstigeren Produkten griffen. Fachleute betonen, dass ein Ausbau der Fläche nur gelingen kann, wenn auch die Nachfrage mitwächst.',
    'a',
    ['Das Ziel von 25 Prozent ökologisch bewirtschafteter Fläche ist unionsweit bereits erreicht.',
      'Österreich liegt beim Anteil der ökologisch bewirtschafteten Fläche über dem Unionsziel für 2030.',
      'Ökologisch erzeugte Lebensmittel sind in der Regel günstiger als konventionelle.',
      'Die Nachfrage nach ökologischen Lebensmitteln ist während der Inflationsphase überall gestiegen.'],
    1,
    'B folgt daraus, dass in Österreich mehr als ein Viertel der Fläche ökologisch bewirtschaftet wird. A widerspricht dem Anteil von knapp über zehn Prozent. C kehrt den Preisvergleich um. D widerspricht dem Rückgang in einigen Ländern.'],

  ['Führerscheinrichtlinie',
    'Die überarbeitete Führerscheinrichtlinie soll die Verkehrssicherheit verbessern und die Freizügigkeit erleichtern. Sie sieht unter anderem vor, dass 17-Jährige in allen Mitgliedstaaten in Begleitung eines erfahrenen Fahrers Auto fahren dürfen und dass für Fahranfänger eine Probezeit von mindestens zwei Jahren gilt. Ein digitaler Führerschein auf dem Smartphone soll künftig in der gesamten Union anerkannt werden.\n\nIm Gesetzgebungsverfahren umstritten war die Frage, ob ältere Fahrerinnen und Fahrer ihre Fahrtauglichkeit regelmäßig nachweisen müssen. Eine unionsweite Pflicht zu medizinischen Untersuchungen ab einem bestimmten Alter wurde nicht eingeführt; die Mitgliedstaaten können jedoch selbst entsprechende Regelungen treffen.',
    'r',
    ['Nach der Richtlinie müssen alle Fahrer ab 70 Jahren regelmäßig ihre Fahrtauglichkeit medizinisch nachweisen.',
      'Die Mitgliedstaaten dürfen keine eigenen Regeln zur Fahrtauglichkeit älterer Fahrer erlassen.',
      'Fahranfänger unterliegen einer Probezeit von mindestens zwei Jahren.',
      'Der digitale Führerschein wird nur im ausstellenden Mitgliedstaat anerkannt.'],
    2,
    'C steht so im Text. A widerspricht dem Verzicht auf eine unionsweite Pflicht. B widerspricht dem Spielraum der Mitgliedstaaten. D widerspricht der unionsweiten Anerkennung.'],

  ['Wasserstraßen',
    'Die Binnenschifffahrt kann große Gütermengen mit vergleichsweise geringem Energieaufwand transportieren. Auf dem Rhein, der wichtigsten Wasserstraße Europas, werden jährlich Millionen Tonnen Güter befördert. Die Binnenschifffahrt ist jedoch stark von den Wasserständen abhängig. In trockenen Sommern können Schiffe wegen niedriger Pegel nur einen Teil ihrer Ladekapazität nutzen, was die Transportkosten erhöht.\n\nIn den Dürrejahren 2018 und 2022 führten Niedrigwasser am Rhein zu Engpässen bei der Versorgung von Industriebetrieben und Kraftwerken. Es wird erwartet, dass solche Niedrigwasserphasen mit dem Klimawandel häufiger werden. Diskutiert werden unter anderem eine Anpassung der Schiffe an geringere Tiefgänge und bauliche Maßnahmen an der Fahrrinne.',
    'h',
    ['Die Binnenschifffahrt ist energieeffizient, aber durch zunehmende Niedrigwasserphasen verwundbar, was Anpassungen erfordert.',
      'Die Binnenschifffahrt verbraucht mehr Energie als alle anderen Verkehrsträger.',
      'Niedrigwasser hat keine Auswirkungen auf die Transportkosten.',
      'Der Klimawandel wird Niedrigwasserphasen am Rhein seltener machen.'],
    0,
    'A fasst Stärke, Schwäche und Handlungsbedarf zusammen. B widerspricht dem geringen Energieaufwand. C widerspricht den höheren Kosten bei geringerer Auslastung. D kehrt die Erwartung um.'],

  ['Lebensmittelkennzeichnung',
    'Nach der Lebensmittelinformationsverordnung müssen vorverpackte Lebensmittel unter anderem ein Zutatenverzeichnis, eine Nährwertdeklaration und Angaben zu den 14 wichtigsten Allergenen enthalten. Allergene müssen im Zutatenverzeichnis hervorgehoben werden, etwa durch Fettdruck. Auch bei lose verkauften Lebensmitteln, etwa in Bäckereien oder Restaurants, müssen Informationen über Allergene verfügbar sein.\n\nEine einheitliche, verpflichtende Nährwertkennzeichnung auf der Vorderseite der Verpackung, wie sie etwa der in einigen Mitgliedstaaten freiwillig verwendete Nutri-Score darstellt, gibt es in der Union bislang nicht. Befürworter sehen darin eine Hilfe für schnelle Kaufentscheidungen, Kritiker bemängeln, dass vereinfachende Bewertungen bestimmte traditionelle Produkte benachteiligen könnten.',
    'a',
    ['Restaurants müssen keinerlei Angaben zu Allergenen machen.',
      'Der Nutri-Score ist in allen Mitgliedstaaten verpflichtend.',
      'Ein Käufer in einer Bäckerei kann verlangen, über enthaltene Allergene informiert zu werden.',
      'Allergene müssen im Zutatenverzeichnis nicht besonders gekennzeichnet werden.'],
    2,
    'C folgt daraus, dass auch bei lose verkauften Lebensmitteln Allergeninformationen verfügbar sein müssen. A widerspricht diesem Satz. B widerspricht der Freiwilligkeit. D widerspricht der Hervorhebungspflicht.'],

  ['Hafenwirtschaft',
    'Die großen Seehäfen an der Nordsee, etwa Rotterdam, Antwerpen-Brügge und Hamburg, konkurrieren um den Containerumschlag. Rotterdam ist mit Abstand der größte Hafen Europas. Neben dem Umschlag sind die Häfen bedeutende Industriestandorte, insbesondere für die Chemie- und Energiewirtschaft.\n\nMit der Energiewende verändert sich ihre Rolle: Der Umschlag von Kohle und Öl dürfte langfristig zurückgehen, während die Häfen sich als Drehscheiben für den Import von Wasserstoff und für die Offshore-Windenergie positionieren wollen. Zugleich hat die Beteiligung ausländischer Staatsunternehmen an Hafenterminals Sicherheitsbedenken ausgelöst. Einige Mitgliedstaaten prüfen solche Investitionen inzwischen genauer.',
    'r',
    ['Hamburg ist der größte Hafen Europas.',
      'Die Häfen dienen ausschließlich dem Umschlag von Gütern.',
      'Der Umschlag fossiler Energieträger wird in den Häfen langfristig voraussichtlich zunehmen.',
      'Investitionen ausländischer Staatsunternehmen in Hafenterminals werden in einigen Mitgliedstaaten genauer geprüft.'],
    3,
    'D steht im letzten Satz. A widerspricht der Stellung Rotterdams. B widerspricht der Rolle als Industriestandort. C kehrt die erwartete Entwicklung um.'],

  ['Pendeln',
    'Die durchschnittliche Pendeldauer unterscheidet sich zwischen den Mitgliedstaaten deutlich. Beschäftigte in Großstadtregionen pendeln im Durchschnitt länger als Beschäftigte in kleineren Städten, obwohl die zurückgelegten Entfernungen dort oft kürzer sind. Ursache sind unter anderem Staus und die Nutzung öffentlicher Verkehrsmittel mit Umstiegen.\n\nStudien zeigen, dass lange Pendelzeiten mit geringerer Lebenszufriedenheit einhergehen. Viele Menschen nehmen sie dennoch in Kauf, etwa um günstiger zu wohnen oder eine besser bezahlte Stelle anzunehmen. Seit der Pandemie ist der Anteil der Beschäftigten, die zumindest teilweise von zu Hause arbeiten, deutlich gestiegen, was die Zahl der Pendelfahrten verringert hat.',
    'f',
    ['In Großstadtregionen dauert das Pendeln im Durchschnitt länger, obwohl die Entfernungen oft kürzer sind.',
      'Lange Pendelzeiten gehen nach Studien mit geringerer Lebenszufriedenheit einher.',
      'Seit der Pandemie ist die Zahl der Pendelfahrten gestiegen.',
      'Manche Menschen nehmen lange Pendelzeiten in Kauf, um günstiger zu wohnen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Durch die Arbeit von zu Hause hat die Zahl der Pendelfahrten abgenommen. A, B und D stehen so im Text.'],

  ['Wolf und Weidetierhaltung',
    'Der Wolf ist in vielen Regionen Europas zurückgekehrt, nachdem er dort über lange Zeit ausgerottet gewesen war. Er war nach dem Unionsrecht streng geschützt. Mit der zunehmenden Zahl von Wölfen haben auch die Übergriffe auf Weidetiere wie Schafe und Ziegen zugenommen, was insbesondere in Berggebieten zu Konflikten führt.\n\nDie Union hat den Schutzstatus des Wolfs inzwischen von „streng geschützt“ auf „geschützt“ herabgestuft. Damit erhalten die Mitgliedstaaten mehr Spielraum, etwa für die Entnahme einzelner Tiere. Der günstige Erhaltungszustand der Art muss jedoch weiterhin gewährleistet werden. Naturschutzverbände kritisieren die Herabstufung und verweisen darauf, dass Herdenschutzmaßnahmen wie Zäune und Herdenschutzhunde Übergriffe wirksam verringern können.',
    'r',
    ['Nach der Herabstufung darf der Wolf in der Union uneingeschränkt gejagt werden.',
      'Die Mitgliedstaaten müssen auch nach der Herabstufung einen günstigen Erhaltungszustand des Wolfs sicherstellen.',
      'Naturschutzverbände haben die Herabstufung begrüßt.',
      'Die Zahl der Übergriffe auf Weidetiere ist mit der Rückkehr des Wolfs gesunken.'],
    1,
    'B entspricht dem Text. A übertreibt den größeren Spielraum. C widerspricht der Kritik der Verbände. D kehrt die Entwicklung um.'],

  ['Luftfahrt und Klima',
    'Der Luftverkehr verursacht einen wachsenden Anteil der Treibhausgasemissionen der Union. Hinzu kommen Effekte, die nicht auf CO2 beruhen, etwa die Bildung von Kondensstreifen in großer Höhe, deren Klimawirkung nach wissenschaftlichen Schätzungen erheblich sein kann, aber mit großer Unsicherheit behaftet ist.\n\nDie Union verpflichtet Treibstoffanbieter an Flughäfen, dem Kerosin einen steigenden Anteil nachhaltiger Flugkraftstoffe beizumischen, beginnend mit zwei Prozent im Jahr 2025. Solche Kraftstoffe sind derzeit deutlich teurer als fossiles Kerosin und nur in begrenzten Mengen verfügbar. Innereuropäische Flüge unterliegen dem Emissionshandel, Flüge in Drittstaaten bislang nur eingeschränkt.',
    'a',
    ['Die Klimawirkung des Luftverkehrs beschränkt sich vollständig auf seine CO2-Emissionen.',
      'Die Beimischungspflicht für nachhaltige Flugkraftstoffe dürfte die Kosten für Kerosin erhöhen.',
      'Ab 2025 muss Kerosin vollständig durch nachhaltige Kraftstoffe ersetzt werden.',
      'Flüge in Drittstaaten sind vollständig in den Emissionshandel einbezogen.'],
    1,
    'B lässt sich daraus ableiten, dass nachhaltige Kraftstoffe teurer als fossiles Kerosin sind. A widerspricht den Nicht-CO2-Effekten. C widerspricht dem Anteil von zwei Prozent. D widerspricht der eingeschränkten Einbeziehung.'],

  ['Saisonarbeit in der Landwirtschaft',
    'Die Ernte von Obst und Gemüse ist in vielen Mitgliedstaaten auf Saisonarbeitskräfte angewiesen, die häufig aus anderen Mitgliedstaaten oder aus Drittstaaten kommen. Während der Pandemie wurde deutlich, wie abhängig die Landwirtschaft von diesen Arbeitskräften ist, als Grenzschließungen ihre Anreise zeitweise verhinderten.\n\nBerichte von Gewerkschaften und Journalisten weisen immer wieder auf schlechte Arbeits- und Unterkunftsbedingungen hin, etwa auf überlange Arbeitszeiten, überhöhte Abzüge für Unterkunft und fehlenden Krankenversicherungsschutz. Seit der jüngsten Agrarreform können Direktzahlungen gekürzt werden, wenn Betriebe gegen bestimmte arbeits- und sozialrechtliche Vorschriften verstoßen.',
    'r',
    ['Saisonarbeitskräfte kommen ausschließlich aus Drittstaaten.',
      'Verstöße gegen bestimmte arbeitsrechtliche Vorschriften können Kürzungen der Agrarzahlungen nach sich ziehen.',
      'Während der Pandemie konnten Saisonarbeitskräfte ungehindert anreisen.',
      'Berichte über schlechte Arbeitsbedingungen von Saisonarbeitskräften gibt es nicht.'],
    1,
    'B entspricht dem letzten Satz. A widerspricht der Herkunft auch aus anderen Mitgliedstaaten. C widerspricht den Grenzschließungen. D widerspricht den Berichten von Gewerkschaften und Journalisten.'],

  ['Tempolimits',
    'Die Höchstgeschwindigkeiten auf Autobahnen werden von den Mitgliedstaaten festgelegt. In fast allen Mitgliedstaaten gelten generelle Tempolimits, meist zwischen 110 und 130 Kilometern pro Stunde. Deutschland ist eine Ausnahme: Dort gilt auf vielen Autobahnabschnitten nur eine Richtgeschwindigkeit von 130 Kilometern pro Stunde.\n\nBefürworter eines Tempolimits verweisen auf geringere Emissionen und weniger schwere Unfälle; Gegner halten die Effekte für begrenzt und verweisen darauf, dass deutsche Autobahnen im internationalen Vergleich nicht zu den unsichersten Straßen gehören. Studien zeigen, dass die Emissionseinsparungen eines Tempolimits zwar messbar, im Vergleich zu den Gesamtemissionen des Verkehrs aber gering wären.',
    'h',
    ['Deutschland ist der einzige Mitgliedstaat mit einem generellen Tempolimit auf Autobahnen.',
      'Ein generelles Tempolimit auf Autobahnen ist in der Union der Regelfall; in Deutschland ist es umstritten, wobei seine Klimawirkung begrenzt, aber messbar wäre.',
      'Ein Tempolimit würde die Verkehrsemissionen halbieren.',
      'Deutsche Autobahnen gehören zu den unsichersten Straßen Europas.'],
    1,
    'B fasst die Lage in der Union, den Streit und den Befund der Studien zusammen. A kehrt die Ausnahmestellung Deutschlands um. C widerspricht den geringen Einsparungen. D widerspricht dem Argument der Gegner.'],

  ['Antibiotika in der Tierhaltung',
    'Ein großer Teil der in der Union eingesetzten Antibiotika wird in der Tierhaltung verwendet. Seit 2006 ist der Einsatz von Antibiotika als Wachstumsförderer in der Union verboten. Seit 2022 dürfen Antibiotika zudem nicht mehr routinemäßig vorbeugend an ganze Tierbestände verabreicht werden, sondern nur noch in Ausnahmefällen an einzelne Tiere.\n\nDer Verkauf von Antibiotika für Tiere ist in der Union in den vergangenen zehn Jahren deutlich zurückgegangen. Bestimmte Antibiotika, die für die Behandlung von Menschen besonders wichtig sind, sollen der Humanmedizin vorbehalten werden. Die Union verlangt, dass auch importierte tierische Erzeugnisse nicht von Tieren stammen, denen Antibiotika als Wachstumsförderer verabreicht wurden.',
    'f',
    ['Der Einsatz von Antibiotika zur Wachstumsförderung ist in der Union seit 2006 verboten.',
      'Der Verkauf von Antibiotika für Tiere ist in den vergangenen zehn Jahren zurückgegangen.',
      'Seit 2022 dürfen Antibiotika weiterhin routinemäßig an ganze Tierbestände verabreicht werden.',
      'Bestimmte für den Menschen besonders wichtige Antibiotika sollen der Humanmedizin vorbehalten werden.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Seit 2022 ist die routinemäßige vorbeugende Gabe an ganze Bestände nicht mehr erlaubt. A, B und D stehen so im Text.'],

  ['Städtische Zufahrtsbeschränkungen',
    'Immer mehr europäische Städte richten Umweltzonen oder Zonen mit Zufahrtsbeschränkungen ein, um die Luftqualität zu verbessern und den Verkehr zu verringern. Die Regeln unterscheiden sich stark: Manche Städte sperren ältere Dieselfahrzeuge aus, andere erheben eine Gebühr für die Einfahrt ins Stadtzentrum, wie etwa Stockholm und Mailand.\n\nIn Stockholm ging der Verkehr über die Mautgrenze nach Einführung der Staugebühr um rund ein Fünftel zurück, und der Effekt blieb über Jahre stabil. Die Akzeptanz der Bevölkerung, die vor der Einführung gering war, stieg nach einer Testphase deutlich an. Kritiker solcher Maßnahmen verweisen darauf, dass Menschen mit geringem Einkommen, die sich kein neueres Auto leisten können, besonders betroffen seien.',
    'a',
    ['Die Zustimmung zu einer Maßnahme kann sich ändern, nachdem die Bevölkerung Erfahrungen mit ihr gemacht hat.',
      'In Stockholm stieg der Verkehr nach Einführung der Staugebühr an.',
      'Alle europäischen Städte verwenden dieselben Regeln für Umweltzonen.',
      'Zufahrtsbeschränkungen betreffen alle Einkommensgruppen in gleicher Weise.'],
    0,
    'A lässt sich aus der gestiegenen Akzeptanz nach der Testphase in Stockholm ableiten. B kehrt den Verkehrsrückgang um. C widerspricht den unterschiedlichen Regeln. D widerspricht dem Einwand der Kritiker.'],
]);
