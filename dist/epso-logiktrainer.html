      'C folgt aus dem Recht, in jeder Amtssprache eine Antwort in derselben Sprache zu erhalten. A widerspricht der Auslegung nach Zusammenhang und Zweck. B widerspricht der Praxis weniger Verfahrenssprachen. D widerspricht der Angabe „weniger als ein Prozent“.'],

    ['Vertragsverletzungsverfahren',
      'Die Europäische Kommission kann ein Vertragsverletzungsverfahren gegen einen Mitgliedstaat einleiten, der seinen Verpflichtungen aus dem Unionsrecht nicht nachkommt, etwa weil er eine Richtlinie nicht fristgerecht umgesetzt hat. Das Verfahren beginnt mit einem Aufforderungsschreiben, auf das eine mit Gründen versehene Stellungnahme folgen kann. Erst wenn der Mitgliedstaat auch danach nicht reagiert, kann die Kommission den Gerichtshof anrufen.\n\nStellt der Gerichtshof einen Verstoß fest, muss der Mitgliedstaat die erforderlichen Maßnahmen ergreifen. Kommt er dem Urteil nicht nach, kann die Kommission den Gerichtshof erneut anrufen und die Verhängung eines Pauschalbetrags oder eines Zwangsgelds beantragen. Die weitaus meisten Verfahren werden jedoch beigelegt, bevor es überhaupt zu einer Klage kommt.',
      'a',
      ['Finanzielle Sanktionen können bereits im ersten Urteil des Gerichtshofs verhängt werden.',
        'Ein Mitgliedstaat kann eine Klage vor dem Gerichtshof vermeiden, indem er nach dem Aufforderungsschreiben den Verstoß beseitigt.',
        'Die meisten Vertragsverletzungsverfahren enden mit einem Urteil des Gerichtshofs.',
        'Vertragsverletzungsverfahren betreffen ausschließlich die verspätete Umsetzung von Richtlinien.'],
      1,
      'B lässt sich ableiten: Die Klage ist erst möglich, wenn der Staat nicht reagiert, und die meisten Verfahren werden vorher beigelegt. A widerspricht dem Text, der Sanktionen erst nach einer erneuten Anrufung vorsieht. C widerspricht dem letzten Satz. D ist zu eng, die Richtlinienumsetzung ist nur ein Beispiel („etwa“).'],

    ['Europäischer Datenschutzbeauftragter',
      'Der Europäische Datenschutzbeauftragte (EDSB) ist eine unabhängige Aufsichtsbehörde, die darüber wacht, dass die Organe, Einrichtungen und sonstigen Stellen der Union bei der Verarbeitung personenbezogener Daten die Datenschutzvorschriften einhalten. Für die Aufsicht über Unternehmen und nationale Behörden sind hingegen die Datenschutzbehörden der Mitgliedstaaten zuständig.\n\nDer EDSB berät die Kommission, das Parlament und den Rat außerdem zu Gesetzesvorschlägen, die Auswirkungen auf den Datenschutz haben. Seine Stellungnahmen sind nicht bindend, werden aber im Gesetzgebungsverfahren häufig zitiert. Darüber hinaus ist der EDSB Mitglied des Europäischen Datenschutzausschusses, in dem die nationalen Aufsichtsbehörden zusammenarbeiten, um eine einheitliche Anwendung der Datenschutz-Grundverordnung sicherzustellen.',
      'r',
      ['Der EDSB kann Bußgelder gegen private Unternehmen verhängen, die gegen die Datenschutz-Grundverordnung verstoßen.',
        'Die Stellungnahmen des EDSB zu Gesetzesvorschlägen sind für den Gesetzgeber verbindlich.',
        'Der EDSB leitet den Europäischen Datenschutzausschuss.',
        'Eine Beschwerde über die Datenverarbeitung durch eine Agentur der Union fällt in die Zuständigkeit des EDSB.'],
      3,
      'D ist richtig: Der EDSB überwacht Organe, Einrichtungen und sonstige Stellen der Union, also auch Agenturen. A ist falsch, für Unternehmen sind nationale Behörden zuständig. B ist falsch, die Stellungnahmen sind nicht bindend. C geht über den Text hinaus, dort ist nur von Mitgliedschaft die Rede.'],

    ['Die Rolle des Europäischen Rates',
      'Der Europäische Rat, dem die Staats- und Regierungschefs der Mitgliedstaaten, sein Präsident und die Präsidentin der Kommission angehören, gibt der Union die für ihre Entwicklung erforderlichen Impulse und legt die allgemeinen politischen Zielvorstellungen und Prioritäten fest. Er wird ausdrücklich nicht gesetzgeberisch tätig.\n\nDer Europäische Rat ist nicht mit dem Rat der Europäischen Union zu verwechseln, in dem die Fachministerinnen und -minister der Mitgliedstaaten zusammenkommen und gemeinsam mit dem Parlament Gesetze beschließen. Ebenfalls zu unterscheiden ist der Europarat, eine eigenständige internationale Organisation mit Sitz in Straßburg, die nicht zur Europäischen Union gehört. Die Ähnlichkeit der Bezeichnungen führt in der öffentlichen Debatte regelmäßig zu Verwechslungen.',
      'f',
      ['Der Europäische Rat beschließt gemeinsam mit dem Europäischen Parlament Richtlinien und Verordnungen.',
        'Dem Europäischen Rat gehört auch die Präsidentin der Kommission an.',
        'Der Europarat ist kein Organ der Europäischen Union.',
        'Im Rat der Europäischen Union kommen Fachministerinnen und -minister zusammen.'],
      0,
      'Gesucht ist die falsche Aussage. A ist falsch: Der Europäische Rat wird ausdrücklich nicht gesetzgeberisch tätig, Gesetze beschließt der Rat der EU mit dem Parlament. B, C und D stehen so im Text.'],

    ['Europäische Staatsanwaltschaft',
      'Die Europäische Staatsanwaltschaft (EUStA) hat im Jahr 2021 ihre Arbeit aufgenommen. Sie ist für die Ermittlung und Verfolgung von Straftaten zum Nachteil der finanziellen Interessen der Union zuständig, etwa Betrug mit EU-Fördermitteln oder grenzüberschreitenden Mehrwertsteuerbetrug ab einem Schaden von zehn Millionen Euro.\n\nNicht alle Mitgliedstaaten beteiligen sich an der EUStA; sie wurde im Wege der sogenannten Verstärkten Zusammenarbeit errichtet. In den nicht teilnehmenden Staaten bleiben die nationalen Behörden zuständig, und die Zusammenarbeit mit der EUStA erfolgt auf der Grundlage besonderer Vereinbarungen. Anders als das Amt für Betrugsbekämpfung OLAF, das nur verwaltungsrechtliche Untersuchungen führt, kann die EUStA Anklage vor den nationalen Gerichten erheben.',
      'r',
      ['Die EUStA ist für sämtliche Fälle von Mehrwertsteuerbetrug in der Union zuständig.',
        'OLAF und die EUStA verfügen über dieselben Befugnisse zur Anklageerhebung.',
        'Die EUStA kann in einem teilnehmenden Mitgliedstaat Anklage vor einem nationalen Gericht erheben.',
        'Alle Mitgliedstaaten sind verpflichtet, sich an der EUStA zu beteiligen.'],
      2,
      'C ist richtig, der Text nennt ausdrücklich die Anklage vor nationalen Gerichten. A übersieht die Einschränkung auf grenzüberschreitende Fälle ab 10 Mio. Euro. B widerspricht dem Vergleich mit OLAF. D widerspricht der Verstärkten Zusammenarbeit.'],

    ['Grundrechtecharta',
      'Die Charta der Grundrechte der Europäischen Union ist seit dem Inkrafttreten des Vertrags von Lissabon im Jahr 2009 rechtsverbindlich und hat denselben Rang wie die Verträge. Sie gilt für die Organe und Einrichtungen der Union sowie für die Mitgliedstaaten, allerdings ausschließlich bei der Durchführung des Unionsrechts.\n\nDaraus folgt, dass sich Bürgerinnen und Bürger nicht in jedem Rechtsstreit mit nationalen Behörden auf die Charta berufen können. Handelt ein Mitgliedstaat in einem Bereich, der rein national geregelt ist, sind vielmehr die nationalen Grundrechte und die Europäische Menschenrechtskonvention maßgeblich. Wann genau ein Mitgliedstaat Unionsrecht „durchführt“, ist in der Rechtsprechung allerdings immer wieder umstritten gewesen.',
      'a',
      ['Die Charta hat einen niedrigeren Rang als die Verträge.',
        'In einem rein national geregelten Bereich kann sich eine Person gegenüber ihrer Behörde nicht auf die Charta berufen.',
        'Die Europäische Menschenrechtskonvention ist Teil der Charta.',
        'Die Frage, wann Unionsrecht durchgeführt wird, ist durch die Rechtsprechung abschließend geklärt.'],
      1,
      'B folgt daraus, dass die Charta für die Mitgliedstaaten nur bei der Durchführung des Unionsrechts gilt. A widerspricht dem gleichen Rang. C wird im Text nicht behauptet. D widerspricht dem letzten Satz.'],

    ['Europäische Bürgerbeauftragte',
      'Die Europäische Bürgerbeauftragte untersucht Beschwerden über Missstände in der Verwaltungstätigkeit der Organe, Einrichtungen und sonstigen Stellen der Union. Beschwerden können von allen Unionsbürgern sowie von Personen mit Wohnsitz in einem Mitgliedstaat eingereicht werden. Ausgenommen ist der Gerichtshof in seiner Rechtsprechungstätigkeit.\n\nDie Bürgerbeauftragte kann Empfehlungen aussprechen, aber keine verbindlichen Entscheidungen treffen. Folgt ein Organ einer Empfehlung nicht, kann sie dem Europäischen Parlament einen Sonderbericht vorlegen. Nach ihren eigenen Angaben werden Empfehlungen in der großen Mehrheit der Fälle ganz oder teilweise umgesetzt. Die Bürgerbeauftragte kann Untersuchungen außerdem aus eigener Initiative einleiten, ohne dass eine Beschwerde vorliegt.',
      'r',
      ['Eine Person ohne Unionsbürgerschaft kann keine Beschwerde bei der Bürgerbeauftragten einreichen.',
        'Die Bürgerbeauftragte kann ein Organ verpflichten, eine Verwaltungsentscheidung aufzuheben.',
        'Die Bürgerbeauftragte kann die Urteile des Gerichtshofs überprüfen.',
        'Die Bürgerbeauftragte kann eine Untersuchung auch ohne vorliegende Beschwerde beginnen.'],
      3,
      'D steht ausdrücklich im letzten Satz. A ist falsch, auch Personen mit Wohnsitz in einem Mitgliedstaat sind beschwerdeberechtigt. B ist falsch, sie gibt nur Empfehlungen ab. C ist falsch, die Rechtsprechungstätigkeit ist ausgenommen.'],

    ['Qualifizierte Mehrheit im Rat',
      'Die meisten Beschlüsse des Rates der Europäischen Union werden mit qualifizierter Mehrheit gefasst. Diese gilt als erreicht, wenn mindestens 55 % der Mitgliedstaaten zustimmen und diese zusammen mindestens 65 % der Bevölkerung der Union repräsentieren. Eine Sperrminorität muss mindestens vier Mitgliedstaaten umfassen; andernfalls gilt die qualifizierte Mehrheit als erreicht, selbst wenn die Bevölkerungsschwelle verfehlt wird.\n\nIn einigen sensiblen Bereichen, etwa der Gemeinsamen Außen- und Sicherheitspolitik oder der Steuerpolitik, ist weiterhin Einstimmigkeit erforderlich. Eine Enthaltung verhindert einen einstimmigen Beschluss nicht. Befürworter einer Ausweitung der Mehrheitsentscheidungen argumentieren, dass die Einstimmigkeit einzelnen Staaten ein Vetorecht verschafft; Gegner sehen darin einen notwendigen Schutz nationaler Souveränität.',
      'r',
      ['Drei große Mitgliedstaaten können einen Beschluss mit qualifizierter Mehrheit allein blockieren, wenn sie mehr als 35 % der Bevölkerung repräsentieren.',
        'Bei Beschlüssen, die Einstimmigkeit erfordern, verhindert die Enthaltung eines Mitgliedstaats die Annahme.',
        'In der Steuerpolitik kann ein einzelner Mitgliedstaat einen Beschluss durch Gegenstimme verhindern.',
        'Die qualifizierte Mehrheit setzt die Zustimmung von 65 % der Mitgliedstaaten voraus.'],
      2,
      'C folgt aus dem Einstimmigkeitserfordernis in der Steuerpolitik. A ist falsch, eine Sperrminorität braucht mindestens vier Staaten. B widerspricht dem Satz über die Enthaltung. D verwechselt die Schwellen: 55 % der Staaten, 65 % der Bevölkerung.'],

    ['Transparenzregister',
      'Das Transparenzregister der Europäischen Union erfasst Organisationen und Einzelpersonen, die Einfluss auf die Politikgestaltung und Entscheidungsprozesse der Organe nehmen wollen. Seit einer interinstitutionellen Vereinbarung von 2021 beteiligen sich Parlament, Rat und Kommission gemeinsam an dem Register.\n\nFür bestimmte Tätigkeiten ist die Eintragung faktisch Voraussetzung: So treffen sich Kommissionsmitglieder und hochrangige Beamte grundsätzlich nur mit eingetragenen Interessenvertretern, und für den Zugang zu den Gebäuden des Parlaments mit einem langfristigen Ausweis ist die Eintragung erforderlich. Eine gesetzliche Pflicht zur Registrierung für alle Lobbyisten besteht jedoch nicht. Kritiker halten die Angaben im Register zudem teilweise für unvollständig, da sie auf Selbstauskünften beruhen und nur stichprobenartig überprüft werden.',
      'a',
      ['Wer sich nicht einträgt, macht sich strafbar.',
        'Ein nicht eingetragener Interessenvertreter wird in der Regel keinen Termin bei einem Kommissionsmitglied erhalten.',
        'Alle Angaben im Register werden von den Organen vollständig überprüft.',
        'Der Rat beteiligt sich nicht am Transparenzregister.'],
      1,
      'B folgt aus dem Grundsatz, dass Kommissionsmitglieder sich nur mit eingetragenen Interessenvertretern treffen. A widerspricht dem Fehlen einer gesetzlichen Pflicht. C widerspricht den Stichprobenkontrollen. D widerspricht der Vereinbarung von 2021.'],

    ['Agenturen der Union',
      'Neben den Organen gibt es mehr als 40 dezentrale Agenturen der Europäischen Union, die über die Mitgliedstaaten verteilt sind. Sie erfüllen technische, wissenschaftliche oder verwaltungsbezogene Aufgaben, etwa die Bewertung von Arzneimitteln, die Überwachung der Flugsicherheit oder die Unterstützung bei der Kontrolle der Außengrenzen.\n\nDie Agenturen besitzen eigene Rechtspersönlichkeit und werden in der Regel von einem Verwaltungsrat geleitet, in dem die Mitgliedstaaten und die Kommission vertreten sind. Ihre Befugnisse sind in den jeweiligen Gründungsverordnungen festgelegt; manche Agenturen dürfen verbindliche Einzelentscheidungen treffen, die meisten hingegen bereiten lediglich Entscheidungen der Kommission vor. Die Standortwahl ist häufig Gegenstand politischer Verhandlungen zwischen den Mitgliedstaaten.',
      'r',
      ['Alle Agenturen der Union haben die Befugnis, verbindliche Entscheidungen zu treffen.',
        'Die Agenturen haben ihren Sitz überwiegend in Brüssel.',
        'Die Befugnisse einer Agentur ergeben sich aus ihrer Gründungsverordnung.',
        'In den Verwaltungsräten der Agenturen ist ausschließlich die Kommission vertreten.'],
      2,
      'C steht im Text. A ist falsch, nur manche Agenturen dürfen verbindlich entscheiden. B widerspricht der Verteilung über die Mitgliedstaaten. D ist falsch, auch die Mitgliedstaaten sind vertreten.'],

    ['Haushaltsverfahren',
      'Der Jahreshaushalt der Europäischen Union wird von Parlament und Rat gemeinsam auf Vorschlag der Kommission festgelegt. Er muss sich innerhalb der Obergrenzen des Mehrjährigen Finanzrahmens bewegen, der in der Regel für sieben Jahre vom Rat einstimmig nach Zustimmung des Parlaments beschlossen wird.\n\nAnders als nationale Haushalte darf der Unionshaushalt kein Defizit aufweisen: Die Einnahmen müssen die Ausgaben vollständig decken. Die Einnahmen stammen überwiegend aus Beiträgen der Mitgliedstaaten, die sich nach ihrem Bruttonationaleinkommen richten, sowie aus Zöllen und einem Anteil an der Mehrwertsteuer. Für den Wiederaufbaufonds nach der Pandemie hat die Kommission ausnahmsweise in großem Umfang Anleihen an den Kapitalmärkten aufgenommen.',
      'f',
      ['Der Jahreshaushalt darf die Obergrenzen des Mehrjährigen Finanzrahmens nicht überschreiten.',
        'Der Mehrjährige Finanzrahmen wird mit qualifizierter Mehrheit im Rat beschlossen.',
        'Die Beiträge der Mitgliedstaaten richten sich nach ihrem Bruttonationaleinkommen.',
        'Zölle sind eine Einnahmequelle des Unionshaushalts.'],
      1,
      'Gesucht ist die falsche Aussage. B widerspricht dem Text, der eine einstimmige Beschlussfassung nennt. A, C und D sind im Text belegt.'],

    ['Schengen-Raum',
      'Im Schengen-Raum finden an den Binnengrenzen grundsätzlich keine Personenkontrollen statt. Zum Schengen-Raum gehören die meisten, aber nicht alle Mitgliedstaaten der Union; umgekehrt nehmen auch einige Nicht-EU-Staaten wie Norwegen und die Schweiz teil.\n\nDie Mitgliedstaaten dürfen in Ausnahmefällen vorübergehend wieder Kontrollen an den Binnengrenzen einführen, etwa bei einer ernsthaften Bedrohung der öffentlichen Ordnung oder der inneren Sicherheit. Solche Kontrollen müssen verhältnismäßig und zeitlich befristet sein und sind der Kommission und den anderen Mitgliedstaaten mitzuteilen. In den vergangenen Jahren haben mehrere Staaten solche Kontrollen wiederholt verlängert, was Kritik hervorgerufen hat, dass der Ausnahmefall zur Regel werde.',
      'r',
      ['Die Mitgliedschaft im Schengen-Raum setzt die Mitgliedschaft in der Europäischen Union voraus.',
        'Wiedereingeführte Binnengrenzkontrollen müssen von der Kommission genehmigt werden.',
        'Alle EU-Mitgliedstaaten gehören dem Schengen-Raum an.',
        'Ein Schengen-Staat darf bei einer ernsthaften Bedrohung der inneren Sicherheit vorübergehend wieder Grenzkontrollen einführen.'],
      3,
      'D steht so im Text. A ist falsch, Norwegen und die Schweiz nehmen teil. B geht über den Text hinaus, dort ist nur von einer Mitteilungspflicht die Rede. C ist falsch, es sind „nicht alle“ Mitgliedstaaten.'],

    ['Europäischer Auswärtiger Dienst',
      'Der Europäische Auswärtige Dienst (EAD) unterstützt den Hohen Vertreter der Union für Außen- und Sicherheitspolitik bei der Durchführung der Gemeinsamen Außen- und Sicherheitspolitik. Er wurde 2010 geschaffen und setzt sich aus Beamten des Generalsekretariats des Rates, der Kommission sowie abgeordneten Diplomaten der Mitgliedstaaten zusammen.\n\nDer EAD unterhält weltweit über 140 Delegationen, die die Union in Drittstaaten und bei internationalen Organisationen vertreten. Die Delegationen ersetzen jedoch nicht die Botschaften der Mitgliedstaaten, die weiterhin die nationale Außenpolitik vertreten und etwa konsularische Aufgaben für ihre eigenen Staatsangehörigen wahrnehmen. In Krisensituationen kann die Zusammenarbeit zwischen Delegationen und nationalen Botschaften allerdings eng sein.',
      'a',
      ['Mit der Gründung des EAD haben die Mitgliedstaaten ihre Botschaften in Drittstaaten geschlossen.',
        'Ein Teil des Personals des EAD stammt aus den diplomatischen Diensten der Mitgliedstaaten.',
        'Der EAD ist allein für die konsularische Betreuung von Unionsbürgern im Ausland zuständig.',
        'Der Hohe Vertreter ist dem EAD unterstellt.'],
      1,
      'B folgt aus der Zusammensetzung mit abgeordneten Diplomaten der Mitgliedstaaten. A widerspricht dem Fortbestehen der Botschaften. C widerspricht den konsularischen Aufgaben der Botschaften. D kehrt das Verhältnis um, der EAD unterstützt den Hohen Vertreter.'],

    ['Zugang zu Dokumenten',
      'Jede Unionsbürgerin und jeder Unionsbürger sowie jede Person mit Wohnsitz in einem Mitgliedstaat hat das Recht auf Zugang zu Dokumenten des Parlaments, des Rates und der Kommission. Der Zugang kann verweigert werden, wenn die Verbreitung bestimmte öffentliche oder private Interessen beeinträchtigen würde, etwa die öffentliche Sicherheit, die internationalen Beziehungen oder den Schutz der Privatsphäre.\n\nFür einige Ausnahmen, beispielsweise den Schutz von Gerichtsverfahren oder laufenden Entscheidungsprozessen, gilt die Verweigerung nur dann, wenn kein überwiegendes öffentliches Interesse an der Verbreitung besteht. Die Organe müssen einen Antrag innerhalb von 15 Arbeitstagen beantworten; die Frist kann in Ausnahmefällen verlängert werden. Wird der Zugang verweigert, kann der Antragsteller einen Zweitantrag stellen und anschließend Klage erheben oder sich an die Bürgerbeauftragte wenden.',
      'r',
      ['Der Schutz der Privatsphäre kann in keinem Fall die Verweigerung des Zugangs rechtfertigen.',
        'Die Antwortfrist von 15 Arbeitstagen kann unter keinen Umständen verlängert werden.',
        'Auch bei laufenden Entscheidungsprozessen kann ein überwiegendes öffentliches Interesse die Freigabe eines Dokuments rechtfertigen.',
        'Gegen die Verweigerung des Zugangs ist ausschließlich die Beschwerde bei der Bürgerbeauftragten möglich.'],
      2,
      'C ergibt sich aus der Abwägung mit dem überwiegenden öffentlichen Interesse. A widerspricht der ausdrücklichen Ausnahme für die Privatsphäre. B widerspricht der möglichen Fristverlängerung. D übersieht die Klagemöglichkeit.'],

    ['Unionsbürgerschaft',
      'Unionsbürgerin oder Unionsbürger ist, wer die Staatsangehörigkeit eines Mitgliedstaats besitzt. Die Unionsbürgerschaft tritt zur nationalen Staatsbürgerschaft hinzu, ersetzt sie aber nicht. Die Mitgliedstaaten entscheiden daher weiterhin selbst, unter welchen Voraussetzungen sie ihre Staatsangehörigkeit verleihen.\n\nZu den mit der Unionsbürgerschaft verbundenen Rechten gehören das Recht auf Freizügigkeit, das aktive und passive Wahlrecht bei Kommunalwahlen und bei den Wahlen zum Europäischen Parlament im Wohnsitzmitgliedstaat sowie der konsularische Schutz durch andere Mitgliedstaaten in Drittstaaten, in denen der eigene Staat nicht vertreten ist. Das Wahlrecht bei nationalen Parlamentswahlen ist hingegen nicht Teil der Unionsbürgerschaft.',
      'f',
      ['Eine Italienerin mit Wohnsitz in Deutschland kann in Deutschland bei Kommunalwahlen kandidieren.',
        'Die Unionsbürgerschaft kann unabhängig von der Staatsangehörigkeit eines Mitgliedstaats erworben werden.',
        'Ein Österreicher in einem Drittstaat ohne österreichische Vertretung kann den Schutz der deutschen Botschaft in Anspruch nehmen.',
        'Unionsbürger haben aufgrund der Unionsbürgerschaft kein Wahlrecht bei den nationalen Parlamentswahlen ihres Wohnsitzstaats.'],
      1,
      'Gesucht ist die falsche Aussage. B widerspricht dem Text: Unionsbürger ist nur, wer die Staatsangehörigkeit eines Mitgliedstaats besitzt. A, C und D ergeben sich aus den genannten Rechten.'],

    ['Wettbewerbsrecht',
      'Das Wettbewerbsrecht der Union verbietet Vereinbarungen zwischen Unternehmen, die den Wettbewerb im Binnenmarkt beschränken, etwa Preisabsprachen oder die Aufteilung von Märkten. Ebenso verboten ist die missbräuchliche Ausnutzung einer marktbeherrschenden Stellung. Eine beherrschende Stellung als solche ist dagegen nicht verboten.\n\nDie Kommission kann bei Verstößen Geldbußen von bis zu zehn Prozent des weltweiten Jahresumsatzes eines Unternehmens verhängen. Unternehmen, die an einem Kartell beteiligt waren und dieses als Erste offenlegen, kann im Rahmen der Kronzeugenregelung die Geldbuße ganz oder teilweise erlassen werden. Diese Regelung hat sich als eines der wirksamsten Instrumente zur Aufdeckung von Kartellen erwiesen.',
      'r',
      ['Ein Unternehmen mit marktbeherrschender Stellung verstößt allein dadurch gegen das Wettbewerbsrecht.',
        'Die Geldbuße ist auf zehn Prozent des in der Union erzielten Umsatzes begrenzt.',
        'Ein Kartellmitglied, das das Kartell als Erstes offenlegt, kann straffrei bleiben.',
        'Die Kronzeugenregelung hat sich in der Praxis als wenig wirksam erwiesen.'],
      2,
      'C folgt daraus, dass die Geldbuße ganz erlassen werden kann. A widerspricht dem Satz, dass die beherrschende Stellung als solche nicht verboten ist. B verwechselt den weltweiten mit dem EU-Umsatz. D widerspricht der Bewertung im Text.'],

    ['Petitionsrecht',
      'Jede Unionsbürgerin und jeder Unionsbürger sowie jede natürliche oder juristische Person mit Wohnsitz oder satzungsmäßigem Sitz in einem Mitgliedstaat kann beim Europäischen Parlament eine Petition einreichen. Die Petition muss ein Anliegen betreffen, das in die Tätigkeitsbereiche der Union fällt und den Petenten unmittelbar betrifft.\n\nDer Petitionsausschuss prüft zunächst die Zulässigkeit. Zulässige Petitionen können dazu führen, dass die Kommission um Auskunft ersucht wird, dass der Ausschuss einen Bericht erstellt oder dass ein Informationsbesuch in dem betroffenen Mitgliedstaat stattfindet. Das Parlament kann jedoch keine Entscheidungen nationaler Behörden aufheben. Im Unterschied zur Europäischen Bürgerinitiative ist für eine Petition keine Mindestzahl an Unterstützern erforderlich.',
      'a',
      ['Eine Petition kann auch von einem einzelnen Bürger eingereicht werden.',
        'Das Parlament kann auf eine Petition hin eine rechtswidrige Entscheidung einer nationalen Behörde aufheben.',
        'Unternehmen dürfen keine Petitionen beim Parlament einreichen.',
        'Jede eingereichte Petition wird vom Petitionsausschuss inhaltlich behandelt.'],
      0,
      'A folgt daraus, dass keine Mindestzahl an Unterstützern nötig ist. B widerspricht dem Text. C ist falsch, auch juristische Personen sind berechtigt. D übersieht die vorgeschaltete Zulässigkeitsprüfung.'],

    ['Rechtsstaatlichkeitsmechanismus',
      'Seit 2021 gilt eine Verordnung, die es der Union ermöglicht, Zahlungen aus dem Unionshaushalt an einen Mitgliedstaat auszusetzen oder zu kürzen, wenn Verstöße gegen die Grundsätze der Rechtsstaatlichkeit die wirtschaftliche Führung des Haushalts beeinträchtigen oder ernsthaft zu beeinträchtigen drohen. Es genügt also nicht, dass ein Verstoß gegen die Rechtsstaatlichkeit vorliegt; es muss ein hinreichend unmittelbarer Zusammenhang mit dem Haushalt bestehen.\n\nDie Kommission schlägt die Maßnahmen vor, der Rat beschließt sie mit qualifizierter Mehrheit. Zwei Mitgliedstaaten hatten gegen die Verordnung geklagt; der Gerichtshof wies die Klagen ab. Kritiker innerhalb des Parlaments haben der Kommission wiederholt vorgeworfen, den Mechanismus zu zögerlich anzuwenden.',
      'r',
      ['Jeder Verstoß gegen die Rechtsstaatlichkeit führt automatisch zur Kürzung von EU-Mitteln.',
        'Über Maßnahmen nach der Verordnung entscheidet die Kommission allein.',
        'Der Gerichtshof hat die Verordnung für nichtig erklärt.',
        'Für eine Kürzung muss ein Zusammenhang zwischen dem Rechtsstaatsverstoß und dem Unionshaushalt bestehen.'],
      3,
      'D steht so im Text. A widerspricht dem Erfordernis des Haushaltsbezugs. B ist falsch, der Rat beschließt auf Vorschlag der Kommission. C widerspricht der Abweisung der Klagen.'],

    ['Beamtenstatut und Auswahlverfahren',
      'Die Einstellung von Beamtinnen und Beamten der EU-Organe erfolgt in der Regel über allgemeine Auswahlverfahren, die vom Europäischen Amt für Personalauswahl (EPSO) organisiert werden. Wer ein Auswahlverfahren erfolgreich abschließt, wird in eine Reserveliste aufgenommen. Die Aufnahme in die Reserveliste begründet jedoch keinen Anspruch auf eine Einstellung.\n\nDie Organe wählen aus den Reservelisten Bewerberinnen und Bewerber aus, deren Profil zu den offenen Stellen passt. Es ist daher möglich, dass erfolgreiche Kandidaten längere Zeit oder sogar überhaupt nicht eingestellt werden. Die Gültigkeitsdauer der Reservelisten ist begrenzt, kann aber verlängert werden. Bewerberinnen und Bewerbern wird deshalb empfohlen, sich aktiv bei den Organen um Stellen zu bemühen.',
      'r',
      ['Wer in die Reserveliste aufgenommen wird, hat Anspruch auf eine Stelle bei einem EU-Organ.',
        'Die Reservelisten sind unbegrenzt gültig.',
        'EPSO entscheidet, welches Organ welche Kandidatin einstellt.',
        'Ein erfolgreicher Abschluss des Auswahlverfahrens garantiert keine Einstellung.'],

      'D entspricht dem Text. A widerspricht dem fehlenden Anspruch. B widerspricht der begrenzten Gültigkeit. C geht über den Text hinaus, die Organe wählen selbst aus.'],

    ['Assoziierungsabkommen',
      'Assoziierungsabkommen schafft die Europäische Union mit Drittstaaten, um besonders enge Beziehungen zu begründen, die über reine Handelsabkommen hinausgehen. Sie können Bestimmungen über politischen Dialog, Zusammenarbeit in zahlreichen Politikbereichen und eine schrittweise Annäherung an das Unionsrecht enthalten.\n\nEin Assoziierungsabkommen ist nicht gleichbedeutend mit einer Beitrittsperspektive. Zwar haben einige Staaten, mit denen solche Abkommen bestanden, später einen Beitrittsantrag gestellt und sind der Union beigetreten; andere Abkommen, etwa mit Staaten des Mittelmeerraums, sehen einen Beitritt ausdrücklich nicht vor. Die Abkommen bedürfen in der Regel der Zustimmung des Europäischen Parlaments und werden häufig auch von den nationalen Parlamenten ratifiziert.',
      'a',
      ['Wer ein Assoziierungsabkommen mit der Union schließt, erhält damit das Recht, der Union beizutreten.',
        'Assoziierungsabkommen beschränken sich auf den Abbau von Zöllen.',
        'Aus dem Bestehen eines Assoziierungsabkommens lässt sich nicht schließen, dass der Partnerstaat der Union beitreten wird.',
        'Assoziierungsabkommen werden ohne Beteiligung des Europäischen Parlaments geschlossen.'],
      2,
      'C folgt daraus, dass ein solches Abkommen nicht gleichbedeutend mit einer Beitrittsperspektive ist. A widerspricht dem Text. B widerspricht der Aussage, dass die Abkommen über Handel hinausgehen. D widerspricht dem Zustimmungserfordernis.'],
  ]);

/* Fragenpool Sprachlogik – Block B: Wirtschaft, Währung, Binnenmarkt */
EPSO_VERBAL_ADD('b', [
  ['Mandat der EZB',
    'Das vorrangige Ziel der Europäischen Zentralbank ist die Gewährleistung der Preisstabilität im Euroraum. Seit ihrer Strategieüberprüfung von 2021 strebt sie eine Inflationsrate von zwei Prozent auf mittlere Sicht an und betrachtet Abweichungen nach oben und unten als gleichermaßen unerwünscht. Zuvor hatte das Ziel „unter, aber nahe zwei Prozent“ gelautet, was häufig als Obergrenze verstanden worden war.\n\nSoweit dies ohne Beeinträchtigung der Preisstabilität möglich ist, unterstützt die EZB auch die allgemeine Wirtschaftspolitik in der Union. Die EZB ist unabhängig: Weder sie noch die nationalen Zentralbanken dürfen Weisungen von Organen der Union oder von Regierungen der Mitgliedstaaten einholen oder entgegennehmen. Der unmittelbare Erwerb von Staatsanleihen bei den Mitgliedstaaten ist ihr untersagt.',
    'r',
    ['Nach der Strategie von 2021 gilt eine Inflationsrate von 1,5 % als ebenso unerwünscht wie eine von 2,5 %.',
      'Die EZB darf Staatsanleihen unmittelbar von den Mitgliedstaaten kaufen, wenn die Preisstabilität gefährdet ist.',
      'Die Unterstützung der allgemeinen Wirtschaftspolitik hat Vorrang vor der Preisstabilität.',
      'Die Regierungen der Mitgliedstaaten können der EZB in Krisenzeiten Weisungen erteilen.'],
    0,
    'A folgt aus dem symmetrischen Ziel: Abweichungen nach oben und unten sind gleichermaßen unerwünscht, und 1,5 % und 2,5 % liegen gleich weit von 2 % entfernt. B widerspricht dem Verbot des unmittelbaren Erwerbs. C kehrt die Rangfolge um. D widerspricht der Unabhängigkeit.'],

  ['Der Euro als Reservewährung',
    'Der Euro ist nach dem US-Dollar die zweitwichtigste Reservewährung der Welt. Rund ein Fünftel der weltweiten Devisenreserven der Zentralbanken wird in Euro gehalten, während der Anteil des Dollars bei knapp sechzig Prozent liegt. Dieser Abstand hat sich in den vergangenen zwei Jahrzehnten kaum verringert.\n\nFachleute führen die Dominanz des Dollars unter anderem auf die Größe und Liquidität des US-Anleihemarktes zurück. Im Euroraum gibt es dagegen keinen einheitlichen Markt für sichere Staatsanleihen, sondern neunzehn beziehungsweise zwanzig nationale Märkte mit unterschiedlicher Bonität. Einige Ökonomen sehen in den gemeinsamen Anleihen, die zur Finanzierung des Wiederaufbaufonds begeben wurden, einen möglichen Ansatz, um die internationale Rolle des Euro zu stärken; andere halten deren Volumen dafür für zu gering.',
    'a',
    ['Der Euro wird den Dollar in den nächsten Jahren als wichtigste Reservewährung ablösen.',
      'Der Anteil des Euro an den Devisenreserven ist in den letzten zwanzig Jahren stark gestiegen.',
      'Die Zersplitterung der Anleihemärkte im Euroraum wird als ein Hindernis für eine größere internationale Rolle des Euro gesehen.',
      'Alle Ökonomen halten gemeinsame Anleihen für geeignet, die Rolle des Euro zu stärken.'],
    2,
    'C folgt aus dem Vergleich mit dem großen, liquiden US-Anleihemarkt. A ist eine Prognose, die der Text nicht stützt. B widerspricht dem kaum veränderten Abstand. D widerspricht der Uneinigkeit der Ökonomen.'],

  ['Binnenmarkt und gegenseitige Anerkennung',
    'Nach dem Grundsatz der gegenseitigen Anerkennung darf ein Mitgliedstaat den Verkauf eines Erzeugnisses, das in einem anderen Mitgliedstaat rechtmäßig in Verkehr gebracht wurde, grundsätzlich nicht verbieten, auch wenn das Erzeugnis nicht den eigenen technischen Vorschriften entspricht. Dies gilt nur für Waren, die nicht durch harmonisierte Unionsvorschriften geregelt sind.\n\nEin Mitgliedstaat kann den Marktzugang ausnahmsweise beschränken, wenn dies aus zwingenden Gründen des Allgemeininteresses, etwa zum Schutz der Gesundheit oder der Umwelt, gerechtfertigt und verhältnismäßig ist. Die Beweislast liegt dabei bei der Behörde, die den Zugang verweigert. Unternehmen berichten dennoch, dass nationale Behörden den Grundsatz in der Praxis nicht immer beachten.',
    'r',
    ['Der Grundsatz der gegenseitigen Anerkennung gilt auch für Waren, die durch harmonisierte Unionsvorschriften geregelt sind.',
      'Ein Unternehmen muss nachweisen, dass sein Produkt die Gesundheit nicht gefährdet, bevor es in einem anderen Mitgliedstaat verkauft werden darf.',
      'Eine Beschränkung des Marktzugangs aus Gründen des Umweltschutzes ist unter bestimmten Voraussetzungen zulässig.',
      'Nationale Behörden beachten den Grundsatz in allen Fällen.'],
    2,
    'C ist richtig: Umweltschutz ist als zwingender Grund genannt, sofern die Maßnahme verhältnismäßig ist. A widerspricht der Beschränkung auf nicht harmonisierte Waren. B kehrt die Beweislast um. D widerspricht den Erfahrungen der Unternehmen.'],

  ['Stabilitäts- und Wachstumspakt',
    'Der Stabilitäts- und Wachstumspakt soll solide öffentliche Finanzen in den Mitgliedstaaten sichern. Als Referenzwerte gelten ein jährliches Haushaltsdefizit von höchstens drei Prozent und ein öffentlicher Schuldenstand von höchstens sechzig Prozent des Bruttoinlandsprodukts. Überschreitet ein Staat diese Werte, kann ein Verfahren bei einem übermäßigen Defizit eingeleitet werden, an dessen Ende grundsätzlich auch finanzielle Sanktionen stehen können.\n\nIn der Praxis wurden solche Sanktionen jedoch nie verhängt. Während der Pandemie wurde die sogenannte allgemeine Ausweichklausel aktiviert, die eine vorübergehende Abweichung von den Vorgaben erlaubte. Die 2024 in Kraft getretene Reform soll die Regeln einfacher machen und stärker auf die Lage des einzelnen Staates zuschneiden, etwa durch mehrjährige nationale Ausgabenpfade.',
    'f',
    ['Die Referenzwerte beziehen sich auf das Bruttoinlandsprodukt.',
      'Während der Pandemie durften die Mitgliedstaaten vorübergehend von den Vorgaben abweichen.',
      'Gegen mehrere Mitgliedstaaten wurden bereits Geldbußen wegen eines übermäßigen Defizits verhängt.',
      'Die Reform von 2024 sieht mehrjährige nationale Ausgabenpfade vor.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Sanktionen wurden in der Praxis nie verhängt. A, B und D stehen so im Text.'],

  ['Inflation und Löhne',
    'Nach einer Phase hoher Inflation stellt sich die Frage, ob steigende Löhne eine Lohn-Preis-Spirale auslösen. Eine solche Spirale entsteht, wenn Unternehmen höhere Lohnkosten über Preiserhöhungen weitergeben und Beschäftigte daraufhin weitere Lohnerhöhungen fordern, um ihre Kaufkraft zu sichern.\n\nIm Euroraum stiegen die Nominallöhne nach dem Inflationsschub von 2022 zwar kräftig, die Reallöhne lagen jedoch zunächst deutlich unter ihrem Vorkrisenniveau. Die meisten Analysen kommen zu dem Ergebnis, dass die Inflation in dieser Phase stärker von Energiepreisen und Unternehmensgewinnen getrieben war als von Löhnen. Ob sich das Verhältnis in den folgenden Jahren umkehrt, hängt nach Einschätzung der EZB unter anderem davon ab, wie schnell die Reallöhne aufholen.',
    'r',
    ['Nach 2022 lagen die Reallöhne im Euroraum zunächst über ihrem Vorkrisenniveau.',
      'Die meisten Analysen sehen die Löhne als Haupttreiber der Inflation nach 2022.',
      'Eine Lohn-Preis-Spirale ist im Euroraum ausgeschlossen.',
      'Trotz kräftig steigender Nominallöhne hatten die Beschäftigten zunächst eine geringere Kaufkraft als vor der Krise.'],
    3,
    'D ergibt sich daraus, dass die Reallöhne trotz steigender Nominallöhne unter dem Vorkrisenniveau lagen. A widerspricht dem Text. B widerspricht der Einschätzung, Energiepreise und Gewinne hätten dominiert. C ist zu absolut, laut Text ist die weitere Entwicklung offen.'],

  ['Kapitalmarktunion',
    'Unternehmen in Europa finanzieren sich weit stärker über Bankkredite als Unternehmen in den Vereinigten Staaten, wo Aktien- und Anleihemärkte eine größere Rolle spielen. Die Kapitalmarktunion soll die nationalen Kapitalmärkte stärker zusammenführen und es Unternehmen, insbesondere jungen und innovativen, erleichtern, sich grenzüberschreitend Kapital zu beschaffen.\n\nFortschritte gelten jedoch als langsam. Hindernisse sind unter anderem unterschiedliche nationale Insolvenzrechte, steuerliche Regelungen und Aufsichtsstrukturen. Befürworter argumentieren, eine tiefere Kapitalmarktunion könne auch die private Risikoteilung zwischen den Mitgliedstaaten verbessern, sodass wirtschaftliche Schocks in einem Land besser abgefedert würden. Kritiker warnen, dass eine stärkere Rolle der Kapitalmärkte auch neue Risiken für die Finanzstabilität mit sich bringe.',
    'a',
    ['Unterschiedliche Insolvenzrechte erschweren die Integration der Kapitalmärkte.',
      'Europäische Unternehmen nutzen Kapitalmärkte bereits stärker als US-Unternehmen.',
      'Die Kapitalmarktunion ist inzwischen weitgehend verwirklicht.',
      'Eine tiefere Kapitalmarktunion beseitigt alle Risiken für die Finanzstabilität.'],
    0,
    'A wird im Text als Hindernis genannt. B kehrt den Vergleich um. C widerspricht den langsamen Fortschritten. D widerspricht der Warnung der Kritiker vor neuen Risiken.'],

  ['Staatliche Beihilfen',
    'Staatliche Beihilfen, also Vorteile, die ein Mitgliedstaat bestimmten Unternehmen aus staatlichen Mitteln gewährt, sind nach dem Unionsrecht grundsätzlich verboten, soweit sie den Wettbewerb verfälschen und den Handel zwischen den Mitgliedstaaten beeinträchtigen. Das Verbot soll verhindern, dass sich Mitgliedstaaten mit Subventionen gegenseitig überbieten.\n\nZahlreiche Ausnahmen sind jedoch möglich, etwa für Beihilfen zur Förderung benachteiligter Regionen, für Forschung und Entwicklung oder für Umweltschutz. Geplante Beihilfen müssen grundsätzlich vorab bei der Kommission angemeldet werden und dürfen erst nach deren Genehmigung gewährt werden. Für bestimmte Gruppen von Beihilfen, die als unproblematisch gelten, entfällt die Anmeldepflicht. Rechtswidrig gewährte Beihilfen muss der Mitgliedstaat vom begünstigten Unternehmen zurückfordern.',
    'r',
    ['Jede staatliche Förderung eines Unternehmens ist nach Unionsrecht verboten.',
      'Ein Unternehmen, das eine rechtswidrige Beihilfe erhalten hat, kann zur Rückzahlung verpflichtet werden.',
      'Alle Beihilfen müssen ohne Ausnahme vorab bei der Kommission angemeldet werden.',
      'Beihilfen für Forschung und Entwicklung sind in jedem Fall ausgeschlossen.'],
    1,
    'B folgt aus der Rückforderungspflicht. A ist zu absolut, das Verbot gilt nur bei Wettbewerbsverfälschung und Handelsbeeinträchtigung, und es gibt Ausnahmen. C widerspricht dem Wegfall der Anmeldepflicht für bestimmte Gruppen. D widerspricht der genannten Ausnahme.'],

  ['Digitaler Euro',
    'Die Europäische Zentralbank bereitet die mögliche Einführung eines digitalen Euro vor. Er soll als digitales Zentralbankgeld Bargeld ergänzen, nicht ersetzen. Anders als Guthaben auf einem Bankkonto wäre der digitale Euro eine direkte Forderung gegenüber der Zentralbank.\n\nUm zu verhindern, dass Bürgerinnen und Bürger in einer Krise massenhaft Einlagen von Geschäftsbanken in digitale Euro umschichten, ist eine Obergrenze für das Halten digitaler Euro vorgesehen. Datenschutzbedenken begegnet die EZB mit dem Hinweis, dass sie selbst keine Zahlungen einzelnen Personen zuordnen könne. Ob der digitale Euro tatsächlich eingeführt wird, hängt von einem Rechtsakt ab, über den Parlament und Rat entscheiden müssen.',
    'r',
    ['Mit Einführung des digitalen Euro soll das Bargeld abgeschafft werden.',
      'Die EZB kann bereits heute ohne Rechtsakt über die Einführung des digitalen Euro entscheiden.',
      'Guthaben auf einem Girokonto sind ebenfalls direkte Forderungen gegenüber der Zentralbank.',
      'Die Haltegrenze soll einen massenhaften Abzug von Bankeinlagen in Krisenzeiten verhindern.'],
    3,
    'D gibt den im Text genannten Zweck der Obergrenze wieder. A widerspricht dem Ergänzungscharakter. B widerspricht dem erforderlichen Rechtsakt. C widerspricht dem Unterschied zu Bankguthaben.'],

  ['Mindestlohnrichtlinie',
    'Die Richtlinie über angemessene Mindestlöhne verpflichtet die Mitgliedstaaten nicht, einen gesetzlichen Mindestlohn einzuführen oder einen bestimmten Betrag festzulegen. Sie legt vielmehr einen Rahmen fest, um die Angemessenheit bestehender gesetzlicher Mindestlöhne zu verbessern und Tarifverhandlungen zu fördern.\n\nMitgliedstaaten mit gesetzlichem Mindestlohn sollen bei dessen Festsetzung Kriterien wie die Kaufkraft und die Lohnentwicklung berücksichtigen; als Richtwerte werden 60 Prozent des Bruttomedianlohns und 50 Prozent des Bruttodurchschnittslohns genannt. Staaten, in denen weniger als 80 Prozent der Beschäftigten von Tarifverträgen erfasst sind, müssen einen Aktionsplan zur Förderung von Tarifverhandlungen vorlegen. Einige Mitgliedstaaten hatten die Zuständigkeit der Union für diese Richtlinie bezweifelt.',
    'a',
    ['Die Richtlinie schreibt einen einheitlichen Mindestlohn für alle Mitgliedstaaten vor.',
      'Ein Staat, in dem 70 Prozent der Beschäftigten unter einen Tarifvertrag fallen, muss einen Aktionsplan erstellen.',
      'Staaten ohne gesetzlichen Mindestlohn müssen einen solchen einführen.',
      'Der Mindestlohn muss nach der Richtlinie genau 60 Prozent des Medianlohns betragen.'],
    1,
    'B folgt aus der Schwelle von 80 Prozent Tarifbindung. A und C widersprechen dem ersten Absatz. D verwechselt einen Richtwert mit einer verbindlichen Vorgabe.'],

  ['Zollunion',
    'Die Europäische Union bildet eine Zollunion: Zwischen den Mitgliedstaaten werden keine Zölle erhoben, und gegenüber Drittstaaten gilt ein gemeinsamer Außenzolltarif. Ein Erzeugnis, das einmal ordnungsgemäß in die Union eingeführt und verzollt wurde, kann daher frei zwischen den Mitgliedstaaten verkehren.\n\nDie Zolleinnahmen fließen überwiegend in den Unionshaushalt; die Mitgliedstaaten behalten einen Teil als Ausgleich für die Erhebungskosten. Die Zollabfertigung selbst obliegt den nationalen Zollbehörden. Weil diese unterschiedlich streng vorgehen, wird kritisiert, dass Importeure gezielt Häfen mit laxeren Kontrollen wählen. Eine geplante Reform sieht deshalb eine Zollbehörde auf Unionsebene vor, die die nationalen Behörden koordinieren soll.',
    'f',
    ['Zwischen Frankreich und Spanien werden keine Zölle erhoben.',
      'Eine aus China eingeführte und in den Niederlanden verzollte Ware kann ohne weitere Verzollung nach Österreich gebracht werden.',
      'Die Zollabfertigung wird bereits heute von einer zentralen Unionsbehörde durchgeführt.',
      'Die Mitgliedstaaten behalten einen Teil der Zolleinnahmen ein.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Abfertigung obliegt den nationalen Behörden, eine Unionsbehörde ist erst geplant. A, B und D sind im Text belegt.'],

  ['Kohäsionspolitik',
    'Die Kohäsionspolitik ist einer der größten Ausgabenbereiche des Unionshaushalts. Sie soll wirtschaftliche, soziale und territoriale Unterschiede zwischen den Regionen verringern. Die Mittel werden nach Regionskategorien verteilt: Weniger entwickelte Regionen, deren Pro-Kopf-BIP unter 75 Prozent des Unionsdurchschnitts liegt, erhalten die höchste Förderintensität.\n\nDie Programme werden überwiegend von nationalen und regionalen Behörden verwaltet, die auch die Projekte auswählen. Die Mitgliedstaaten müssen die Förderung in der Regel durch eigene Mittel kofinanzieren. Studien zeigen, dass die Kohäsionspolitik das Wachstum in geförderten Regionen gesteigert hat; die Wirkung hängt jedoch stark von der Qualität der regionalen Verwaltung ab. Einige Regionen haben zudem Schwierigkeiten, die verfügbaren Mittel fristgerecht auszugeben.',
    'r',
    ['Die Kommission wählt die geförderten Projekte selbst aus.',
      'Regionen mit einem Pro-Kopf-BIP von 80 Prozent des Unionsdurchschnitts gehören zur Kategorie der weniger entwickelten Regionen.',
      'Die Kohäsionspolitik wird vollständig aus dem Unionshaushalt finanziert.',
      'Eine leistungsfähige regionale Verwaltung kann die Wirkung der Förderung erhöhen.'],
    3,
    'D folgt aus der Abhängigkeit der Wirkung von der Verwaltungsqualität. A ist falsch, nationale und regionale Behörden wählen aus. B ist falsch, die Grenze liegt bei 75 Prozent. C widerspricht der Kofinanzierung.'],

  ['Produkthaftung und Software',
    'Die überarbeitete Produkthaftungsrichtlinie erweitert den Produktbegriff ausdrücklich auf Software, einschließlich Anwendungen und Systemen künstlicher Intelligenz. Hersteller haften danach verschuldensunabhängig für Schäden, die durch ein fehlerhaftes Produkt verursacht werden. Der Geschädigte muss also nicht nachweisen, dass der Hersteller fahrlässig gehandelt hat, wohl aber, dass das Produkt fehlerhaft war und den Schaden verursacht hat.\n\nWeil dieser Nachweis bei komplexen technischen Systemen schwierig sein kann, sieht die Richtlinie Beweiserleichterungen vor: Unter bestimmten Umständen wird der Fehler oder der Kausalzusammenhang vermutet. Freie und quelloffene Software, die außerhalb einer Geschäftstätigkeit entwickelt oder bereitgestellt wird, ist vom Anwendungsbereich ausgenommen.',
    'r',
    ['Nach der Richtlinie muss der Geschädigte dem Hersteller Fahrlässigkeit nachweisen.',
      'Quelloffene Software fällt in keinem Fall unter die Richtlinie.',
      'Der Geschädigte muss grundsätzlich nachweisen, dass das Produkt fehlerhaft war.',
      'Die Richtlinie gilt nicht für Systeme künstlicher Intelligenz.'],
    2,
    'C steht im Text. A widerspricht der verschuldensunabhängigen Haftung. B ist zu absolut, ausgenommen ist nur quelloffene Software außerhalb einer Geschäftstätigkeit. D widerspricht der ausdrücklichen Einbeziehung von KI.'],

  ['Wirtschaftliche Folgen alternder Gesellschaften',
    'In den meisten Mitgliedstaaten wird der Anteil der Menschen im Erwerbsalter an der Gesamtbevölkerung in den kommenden Jahrzehnten sinken. Ohne Gegenmaßnahmen würde dies das Wachstumspotenzial verringern und die Finanzierung der Rentensysteme erschweren, weil weniger Beitragszahler für mehr Leistungsempfänger aufkommen müssten.\n\nAls mögliche Antworten gelten eine höhere Erwerbsbeteiligung, insbesondere von Frauen und älteren Beschäftigten, eine längere Lebensarbeitszeit, Zuwanderung und eine höhere Produktivität. Keine dieser Maßnahmen dürfte allein ausreichen. Ökonomen weisen darauf hin, dass selbst eine deutlich höhere Zuwanderung den Alterungsprozess nur verlangsamen, nicht aber umkehren könne, da auch Zugewanderte altern.',
    'h',
    ['Die Alterung der Bevölkerung lässt sich durch Zuwanderung vollständig ausgleichen.',
      'Die demografische Alterung stellt Wachstum und Rentenfinanzierung vor Herausforderungen, denen nur mit einer Kombination verschiedener Maßnahmen begegnet werden kann.',
      'Die Rentensysteme der Mitgliedstaaten werden in den kommenden Jahrzehnten zusammenbrechen.',
      'Eine höhere Erwerbsbeteiligung von Frauen ist die wirksamste Maßnahme gegen die Folgen der Alterung.'],
    1,
    'B fasst Problem und Lösungsansatz zusammen: Keine Maßnahme reicht allein aus. A widerspricht dem letzten Satz. C übertreibt, der Text spricht von „erschweren“. D gewichtet eine einzelne Maßnahme, was der Text nicht tut.'],

  ['Verbraucherkredite',
    'Die Verbraucherkreditrichtlinie verpflichtet Kreditgeber, vor Abschluss eines Vertrags die Kreditwürdigkeit des Verbrauchers zu prüfen. Die Prüfung muss im Interesse des Verbrauchers erfolgen und darauf abzielen, eine Überschuldung zu vermeiden. Ein Kredit soll grundsätzlich nur gewährt werden, wenn die Prüfung ergibt, dass der Verbraucher seinen Verpflichtungen voraussichtlich nachkommen kann.\n\nDie überarbeitete Richtlinie erfasst nun auch Kleinkredite unter 200 Euro sowie Angebote nach dem Muster „Jetzt kaufen, später bezahlen“, die zuvor häufig nicht unter die Regeln fielen. Verbraucher haben zudem das Recht, einen Kreditvertrag innerhalb von 14 Tagen ohne Angabe von Gründen zu widerrufen.',
    'a',
    ['Kredite unter 200 Euro sind von der Kreditwürdigkeitsprüfung ausgenommen.',
      'Ergibt die Prüfung, dass der Verbraucher den Kredit voraussichtlich nicht zurückzahlen kann, soll der Kredit grundsätzlich nicht gewährt werden.',
      'Ein Widerruf des Kreditvertrags muss begründet werden.',
      'Die Kreditwürdigkeitsprüfung dient in erster Linie dem Schutz des Kreditgebers vor Zahlungsausfällen.'],
    1,
    'B folgt unmittelbar aus dem dritten Satz. A widerspricht der Einbeziehung von Kleinkrediten. C widerspricht dem Widerruf ohne Angabe von Gründen. D widerspricht der Prüfung im Interesse des Verbrauchers.'],

  ['Handelsbilanz und Wettbewerbsfähigkeit',
    'Ein Handelsbilanzüberschuss wird in der öffentlichen Debatte häufig als Zeichen wirtschaftlicher Stärke gewertet. Ökonomen weisen jedoch darauf hin, dass ein Überschuss nicht zwingend auf eine besonders hohe Wettbewerbsfähigkeit schließen lässt. Er kann auch Ausdruck einer schwachen Binnennachfrage sein, wenn Haushalte und Unternehmen im Inland wenig konsumieren und investieren und deshalb auch wenig importieren.\n\nUmgekehrt ist ein Defizit nicht automatisch problematisch: Ein Land, das stark investiert und dafür Kapital aus dem Ausland anzieht, kann vorübergehend mehr importieren als exportieren, ohne dass dies seine wirtschaftliche Zukunft gefährdet. Entscheidend ist nach dieser Sicht, wodurch ein Überschuss oder Defizit entsteht und ob es dauerhaft ist.',
    'h',
    ['Handelsbilanzüberschüsse sind stets ein Zeichen schwacher Binnennachfrage.',
      'Länder mit Handelsbilanzdefiziten haben eine gefährdete wirtschaftliche Zukunft.',
      'Ob eine Handelsbilanz positiv oder negativ ist, sagt für sich genommen wenig darüber aus, wie gut es einer Volkswirtschaft geht.',
      'Hohe Investitionen führen immer zu einem Handelsbilanzdefizit.'],
    2,
    'C fasst den Text zusammen: Entscheidend sind Ursache und Dauer, nicht das Vorzeichen. A verallgemeinert eine mögliche Ursache („kann“). B widerspricht dem zweiten Absatz. D verallgemeinert ein Beispiel.'],

  ['Geldwäschebekämpfung',
    'Mit dem Geldwäschepaket hat die Union eine neue Behörde zur Bekämpfung der Geldwäsche und der Terrorismusfinanzierung (AMLA) mit Sitz in Frankfurt am Main geschaffen. Sie soll ab 2028 einige der risikoreichsten grenzüberschreitend tätigen Finanzinstitute direkt beaufsichtigen. Für die übrigen Verpflichteten bleiben die nationalen Aufsichtsbehörden zuständig, die von der AMLA koordiniert und unterstützt werden.\n\nDas Paket führt außerdem eine unionsweite Obergrenze für Barzahlungen von 10 000 Euro im gewerblichen Verkehr ein. Mitgliedstaaten dürfen niedrigere Obergrenzen beibehalten oder festlegen. Barzahlungen zwischen Privatpersonen, die nicht gewerblich handeln, sind von der Obergrenze nicht erfasst.',
    'r',
    ['Die AMLA beaufsichtigt künftig alle Banken in der Union unmittelbar.',
      'Ein Mitgliedstaat darf eine Barzahlungsobergrenze von 5 000 Euro festlegen.',
      'Der private Verkauf eines gebrauchten Autos zwischen zwei Privatpersonen darf nicht bar über 10 000 Euro abgewickelt werden.',
      'Die nationalen Aufsichtsbehörden werden durch die AMLA vollständig ersetzt.'],
    1,
    'B ist zulässig, weil Mitgliedstaaten niedrigere Obergrenzen festlegen dürfen. A übertreibt, gemeint sind nur einige risikoreiche Institute. C ist falsch, Zahlungen zwischen Privatpersonen sind nicht erfasst. D widerspricht der fortbestehenden nationalen Zuständigkeit.'],

  ['Tourismus und Saisonalität',
    'Der Tourismus trägt in mehreren südeuropäischen Mitgliedstaaten mehr als zehn Prozent zur Wirtschaftsleistung bei. Die Einnahmen konzentrieren sich jedoch stark auf die Sommermonate, was zu saisonaler Arbeitslosigkeit und einer ungleichmäßigen Auslastung der Infrastruktur führt.\n\nMehrere Regionen versuchen daher, die Saison zu verlängern, etwa durch Kultur-, Gesundheits- oder Geschäftstourismus. Gleichzeitig klagen beliebte Städte über die Folgen des Massentourismus, darunter steigende Mieten und die Verdrängung der ansässigen Bevölkerung. Einige Städte haben Tagesbesuchergebühren eingeführt oder die Vermietung von Ferienwohnungen beschränkt. Ob diese Maßnahmen die Zahl der Besucher spürbar senken, ist bislang umstritten.',
    'f',
    ['In einigen Mitgliedstaaten macht der Tourismus mehr als ein Zehntel der Wirtschaftsleistung aus.',
      'Die Konzentration auf den Sommer kann zu saisonaler Arbeitslosigkeit führen.',
      'Es ist inzwischen erwiesen, dass Tagesbesuchergebühren die Zahl der Besucher deutlich senken.',
      'Einige Städte haben die Vermietung von Ferienwohnungen eingeschränkt.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem letzten Satz, die Wirkung ist umstritten. A, B und D stehen so im Text.'],

  ['Preisbildung am Strommarkt',
    'Auf dem europäischen Großhandelsmarkt für Strom wird der Preis in jeder Stunde durch das teuerste Kraftwerk bestimmt, das noch benötigt wird, um die Nachfrage zu decken. Alle Anbieter erhalten diesen Preis, auch wenn ihre eigenen Erzeugungskosten niedriger sind. Dieses Verfahren wird als Merit-Order-Prinzip bezeichnet.\n\nWährend der Energiekrise 2022 bestimmten häufig Gaskraftwerke den Preis, sodass der starke Anstieg des Gaspreises den Strompreis insgesamt nach oben trieb. Betreiber von Wind- und Solaranlagen erzielten dadurch außergewöhnlich hohe Erlöse. Die Union führte daraufhin vorübergehend eine Obergrenze für die Markterlöse bestimmter Erzeuger ein. Befürworter des Merit-Order-Prinzips betonen, dass es kurzfristig für einen effizienten Einsatz der Kraftwerke sorge.',
    'r',
    ['Jeder Anbieter erhält auf dem Großhandelsmarkt einen Preis, der seinen eigenen Erzeugungskosten entspricht.',
      'Die Obergrenze für Markterlöse gilt dauerhaft für alle Stromerzeuger.',
      'Steigende Gaspreise können auch die Erlöse von Solaranlagenbetreibern erhöhen.',
      'Während der Energiekrise bestimmten Windkraftanlagen meist den Strompreis.'],
    2,
    'C folgt daraus, dass Gaskraftwerke den Preis setzten und alle Anbieter diesen Preis erhalten. A widerspricht dem Einheitspreis. B ist falsch, die Obergrenze war vorübergehend und betraf bestimmte Erzeuger. D widerspricht dem Text.'],

  ['Plattformarbeit',
    'Die Richtlinie zur Plattformarbeit soll die Arbeitsbedingungen von Menschen verbessern, die über digitale Plattformen tätig sind, etwa als Fahrer oder Lieferboten. Kern der Richtlinie ist eine widerlegbare Vermutung eines Arbeitsverhältnisses: Liegen bestimmte Anhaltspunkte für Kontrolle und Weisung vor, wird ein Arbeitsverhältnis vermutet. Es ist dann Sache der Plattform nachzuweisen, dass tatsächlich keine abhängige Beschäftigung besteht.\n\nDie Kriterien für die Vermutung legen die Mitgliedstaaten nach ihrem nationalen Recht fest. Die Richtlinie enthält außerdem Regeln zum algorithmischen Management: Plattformen dürfen etwa keine Kündigung allein auf Grundlage einer automatisierten Entscheidung aussprechen, und Beschäftigte haben das Recht, eine Erklärung für automatisierte Entscheidungen zu erhalten.',
    'a',
    ['Alle Plattformbeschäftigten gelten nach der Richtlinie zwingend als Arbeitnehmer.',
      'Eine Plattform kann eine vermutete Arbeitnehmereigenschaft durch Gegenbeweis entkräften.',
      'Die Richtlinie legt einheitliche Kriterien für die Vermutung in allen Mitgliedstaaten fest.',
      'Plattformen dürfen Kündigungen ausschließlich durch Algorithmen aussprechen lassen.'],
    1,
    'B folgt aus der widerlegbaren Vermutung. A übersieht die Widerlegbarkeit und die Voraussetzungen. C widerspricht der nationalen Festlegung der Kriterien. D widerspricht dem Verbot rein automatisierter Kündigungen.'],

  ['Bargeldnutzung',
    'Nach Erhebungen der EZB wird Bargeld im Euroraum an der Ladenkasse nach wie vor häufiger verwendet als jedes andere Zahlungsmittel, wenn man die Zahl der Transaktionen betrachtet. Gemessen am Wert der Zahlungen haben Karten das Bargeld jedoch inzwischen überholt. Der Anteil des Bargelds ist in den vergangenen Jahren deutlich gesunken, wobei die Pandemie diese Entwicklung beschleunigt hat.\n\nZwischen den Mitgliedstaaten bestehen große Unterschiede: In einigen Ländern wird Bargeld bei der Mehrheit aller Einkäufe verwendet, in anderen nur noch bei einer Minderheit. Viele Befragte geben an, Bargeld zu schätzen, weil es ihnen einen besseren Überblick über ihre Ausgaben verschafft. Um die Annahme von Bargeld zu sichern, hat die Kommission einen Vorschlag zum gesetzlichen Zahlungsmittel vorgelegt.',
    'r',
    ['Gemessen am Wert werden die meisten Zahlungen an der Ladenkasse bar abgewickelt.',
      'In allen Mitgliedstaaten wird Bargeld bei der Mehrheit der Einkäufe verwendet.',
      'Kartenzahlungen betreffen im Durchschnitt höhere Beträge als Barzahlungen.',
      'Die Pandemie hat den Rückgang der Bargeldnutzung gebremst.'],
    2,
    'C ergibt sich logisch: Bargeld liegt bei der Zahl der Transaktionen vorn, Karten beim Wert. Also müssen Kartenzahlungen im Schnitt höhere Beträge betreffen. A widerspricht dem Text. B widerspricht den Unterschieden zwischen den Ländern. D kehrt die Wirkung der Pandemie um.'],

  ['Mehrwertsteuerbetrug',
    'Beim sogenannten Karussellbetrug nutzen Betrüger aus, dass grenzüberschreitende Lieferungen zwischen Unternehmen in der Union von der Mehrwertsteuer befreit sind. Ein Unternehmen erwirbt Waren steuerfrei aus einem anderen Mitgliedstaat, verkauft sie im Inland mit Mehrwertsteuer weiter und verschwindet, ohne die vereinnahmte Steuer abzuführen. Der Abnehmer macht die gezahlte Steuer dennoch als Vorsteuer geltend.\n\nDer Schaden für die öffentlichen Haushalte wird auf viele Milliarden Euro jährlich geschätzt. Die Mitgliedstaaten tauschen Informationen über das Netzwerk Eurofisc aus, um verdächtige Muster frühzeitig zu erkennen. Eine grundlegende Umstellung auf ein Besteuerungssystem, bei dem grenzüberschreitende Lieferungen im Ursprungsland besteuert würden, wird seit Langem diskutiert, ist aber bisher nicht umgesetzt worden.',
    'r',
    ['Beim Karussellbetrug zahlt der Abnehmer keine Mehrwertsteuer an den Verkäufer.',
      'Die Besteuerung grenzüberschreitender Lieferungen im Ursprungsland wurde bereits eingeführt.',
      'Der Karussellbetrug nutzt die Steuerbefreiung grenzüberschreitender Lieferungen zwischen Unternehmen aus.',
      'Eurofisc ist eine Behörde, die Steuern in allen Mitgliedstaaten einzieht.'],
    2,
    'C steht im ersten Satz. A widerspricht dem Ablauf, der Abnehmer zahlt die Steuer und macht sie als Vorsteuer geltend. B widerspricht dem letzten Satz. D ist falsch, Eurofisc ist ein Netzwerk für den Informationsaustausch.'],

  ['Lieferkettenrichtlinie',
    'Die Richtlinie über die Sorgfaltspflichten von Unternehmen im Hinblick auf Nachhaltigkeit verpflichtet große Unternehmen, negative Auswirkungen ihrer Tätigkeit auf Menschenrechte und Umwelt zu ermitteln, zu verhindern und zu beheben. Die Pflichten erstrecken sich auch auf Geschäftspartner in der Aktivitätskette, nicht nur auf das Unternehmen selbst.\n\nKleine und mittlere Unternehmen fallen nicht unmittelbar in den Anwendungsbereich. Sie können aber mittelbar betroffen sein, wenn sie als Zulieferer großer Unternehmen vertragliche Zusicherungen abgeben müssen. Wirtschaftsverbände hatten vor hohem Verwaltungsaufwand gewarnt; im Zuge eines Vereinfachungspakets wurden Fristen verschoben und einzelne Pflichten abgeschwächt.',
    'a',
    ['Kleine Unternehmen können von der Richtlinie betroffen sein, obwohl sie nicht unmittelbar unter sie fallen.',
      'Die Richtlinie gilt nur für die eigenen Tätigkeiten eines Unternehmens, nicht für seine Geschäftspartner.',
      'Die Richtlinie wurde nach ihrer Verabschiedung inhaltlich nicht mehr verändert.',
      'Kleine und mittlere Unternehmen unterliegen denselben Pflichten wie große Unternehmen.'],
    0,
    'A folgt aus der mittelbaren Betroffenheit als Zulieferer. B widerspricht der Einbeziehung der Aktivitätskette. C widerspricht dem Vereinfachungspaket. D widerspricht dem Anwendungsbereich.'],

  ['Wohnkosten',
    'In vielen europäischen Städten sind die Mieten in den vergangenen zehn Jahren deutlich schneller gestiegen als die Einkommen. Als überbelastet gelten nach der Definition von Eurostat Haushalte, die mehr als 40 Prozent ihres verfügbaren Einkommens für Wohnkosten ausgeben. Dieser Anteil ist bei Mieterhaushalten deutlich höher als bei Eigentümern und bei Haushalten mit niedrigem Einkommen deutlich höher als im Durchschnitt.\n\nDie Wohnungspolitik liegt überwiegend in der Zuständigkeit der Mitgliedstaaten. Die Union kann jedoch über die Kohäsionsmittel Investitionen in bezahlbaren Wohnraum fördern und über das Beihilferecht festlegen, unter welchen Bedingungen der soziale Wohnungsbau staatlich unterstützt werden darf. Die Kommission hat einen europäischen Plan für bezahlbares Wohnen angekündigt.',
    'r',
    ['Ein Haushalt, der 35 Prozent seines verfügbaren Einkommens für Wohnkosten ausgibt, gilt nach Eurostat als überbelastet.',
      'Die Union ist vorrangig für die Wohnungspolitik zuständig.',
      'Die Einkommen sind in vielen Städten schneller gestiegen als die Mieten.',
      'Die Union kann über Beihilferegeln Einfluss auf die staatliche Förderung des sozialen Wohnungsbaus nehmen.'],
    3,
    'D steht im zweiten Absatz. A ist falsch, die Schwelle liegt bei mehr als 40 Prozent. B kehrt die Zuständigkeit um. C kehrt das Verhältnis von Mieten und Einkommen um.'],

  ['Frauen in Führungspositionen',
    'Nach der Richtlinie über ein ausgewogeneres Geschlechterverhältnis in Leitungsorganen börsennotierter Gesellschaften sollen bis Mitte 2026 mindestens 40 Prozent der Posten nicht geschäftsführender Direktoren oder 33 Prozent aller Direktorenposten mit Angehörigen des unterrepräsentierten Geschlechts besetzt sein. Die Mitgliedstaaten können wählen, welches der beiden Ziele sie verfolgen.\n\nErreicht ein Unternehmen die Ziele nicht, muss es sein Auswahlverfahren anpassen: Bei gleicher Qualifikation ist der Person des unterrepräsentierten Geschlechts Vorrang zu geben. Kleine und mittlere Unternehmen sind ausgenommen. Die Mitgliedstaaten müssen wirksame Sanktionen, etwa Geldbußen, für Verstöße gegen die Verfahrenspflichten vorsehen.',
    'f',
    ['Die Mitgliedstaaten können zwischen zwei Zielvorgaben wählen.',
      'Kleine und mittlere Unternehmen sind von der Richtlinie ausgenommen.',
      'Unternehmen, die die Ziele verfehlen, müssen stets eine Person des unterrepräsentierten Geschlechts einstellen, unabhängig von der Qualifikation.',
      'Die Mitgliedstaaten müssen Sanktionen für Verstöße gegen Verfahrenspflichten vorsehen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text, der Vorrang gilt nur bei gleicher Qualifikation. A, B und D stehen so im Text.'],

  ['Wettbewerbsfähigkeit und Produktivität',
    'Seit Mitte der 1990er-Jahre ist das Produktivitätswachstum in der Europäischen Union hinter dem der Vereinigten Staaten zurückgeblieben. Ein wesentlicher Teil dieses Rückstands wird auf den Technologiesektor zurückgeführt: Europäische Unternehmen sind unter den weltweit größten Technologiekonzernen kaum vertreten, und die Ausgaben für Forschung und Entwicklung konzentrieren sich in der Union stärker auf etablierte Branchen wie die Automobilindustrie.\n\nEin viel beachteter Bericht zur Zukunft der europäischen Wettbewerbsfähigkeit empfiehlt unter anderem erhebliche zusätzliche Investitionen, eine Vertiefung des Binnenmarktes und eine bessere Abstimmung der Industriepolitik. Kritiker wenden ein, dass die vorgeschlagene gemeinsame Finanzierung politisch schwer durchsetzbar sei.',
    'a',
    ['Der Produktivitätsrückstand der Union gegenüber den USA ist allein auf den Technologiesektor zurückzuführen.',
      'In der Union fließt ein vergleichsweise großer Teil der Forschungsausgaben in etablierte Industrien.',
      'Die Empfehlungen des Berichts sind inzwischen vollständig umgesetzt.',
      'Die Union hat die USA beim Produktivitätswachstum seit den 1990er-Jahren überholt.'],
    1,
    'B entspricht der Aussage über die Konzentration der Forschungsausgaben. A übertreibt, laut Text ist es „ein wesentlicher Teil“. C lässt sich aus dem Text nicht ableiten. D kehrt den Befund um.'],
]);
