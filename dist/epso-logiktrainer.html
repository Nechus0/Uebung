EPSO_VERBAL_ADD('j', [
  ['Zugvögel',
    'Viele europäische Zugvögel überwintern in Afrika südlich der Sahara und legen dafür jedes Jahr Tausende Kilometer zurück. Lange war unklar, wie sie sich orientieren. Heute gilt als gesichert, dass sie mehrere Informationsquellen kombinieren: den Stand der Sonne, das Muster der Sterne und das Erdmagnetfeld. Junge Vögel einiger Arten finden ihr Winterquartier beim ersten Zug ohne erwachsene Begleiter, was darauf hindeutet, dass Richtung und Dauer des Zuges zumindest teilweise angeboren sind.\n\nDer Klimawandel verändert das Zugverhalten. Einige Arten kehren früher aus dem Winterquartier zurück, andere verkürzen ihre Zugstrecke oder überwintern inzwischen in Südeuropa. Arten, die ihren Zeitplan nicht anpassen, kommen mitunter zu spät, um die Hauptzeit des Insektenangebots für die Aufzucht ihrer Jungen zu nutzen.',
    'r',
    ['Zugvögel orientieren sich ausschließlich am Erdmagnetfeld.',
      'Bei allen Vogelarten lernen die Jungvögel die Zugroute von erwachsenen Artgenossen.',
      'Eine unveränderte Rückkehrzeit kann für manche Arten zu einem Nahrungsengpass bei der Jungenaufzucht führen.',
      'Der Klimawandel hat keinen Einfluss auf das Zugverhalten.'],
    2,
    'C folgt aus dem letzten Satz. A widerspricht der Kombination mehrerer Informationsquellen. B widerspricht den Jungvögeln, die ohne Begleitung ziehen. D widerspricht dem zweiten Absatz.'],

  ['Bestätigungsfehler',
    'Als Bestätigungsfehler bezeichnet die Psychologie die Neigung, Informationen so zu suchen, zu interpretieren und zu erinnern, dass sie die eigenen Überzeugungen bestätigen. Menschen bewerten Belege, die ihrer Meinung widersprechen, oft strenger als Belege, die sie stützen.\n\nDer Bestätigungsfehler ist nicht auf wenig gebildete Menschen beschränkt. Studien deuten darauf hin, dass Personen mit hoher Fachkenntnis in bestimmten Situationen sogar besonders geschickt darin sein können, widersprechende Informationen zu entkräften. Als Gegenmittel gilt es, gezielt nach Gegenargumenten zu suchen oder sich zu fragen, welche Belege die eigene Meinung widerlegen würden. Ganz vermeiden lässt sich die Verzerrung jedoch kaum.',
    'a',
    ['Fachkenntnis schützt zuverlässig vor dem Bestätigungsfehler.',
      'Wer gezielt nach Argumenten gegen die eigene Position sucht, kann den Bestätigungsfehler verringern.',
      'Der Bestätigungsfehler lässt sich durch Übung vollständig vermeiden.',
      'Menschen bewerten Belege für und gegen ihre Meinung in der Regel gleich streng.'],
    1,
    'B folgt aus den genannten Gegenmitteln. A widerspricht den Befunden zu Personen mit hoher Fachkenntnis. C widerspricht dem letzten Satz. D widerspricht der unterschiedlichen Strenge.'],

  ['Korallenriffe',
    'Korallenriffe bedecken weniger als ein Prozent des Meeresbodens, beherbergen aber schätzungsweise ein Viertel aller Meeresarten. Riffbildende Korallen leben in Symbiose mit einzelligen Algen, die ihnen durch Photosynthese Nährstoffe liefern und ihnen ihre Farbe verleihen.\n\nSteigt die Wassertemperatur über längere Zeit über ein bestimmtes Maß, stoßen die Korallen die Algen ab und verlieren ihre Farbe; man spricht von Korallenbleiche. Gebleichte Korallen sind nicht sofort tot. Sinkt die Temperatur rechtzeitig wieder, können sie die Algen erneut aufnehmen und sich erholen. Dauert die Hitze jedoch zu lange an oder wiederholen sich Bleichereignisse in kurzen Abständen, sterben viele Korallen ab.',
    'r',
    ['Korallenriffe bedecken rund ein Viertel des Meeresbodens.',
      'Eine gebleichte Koralle ist in jedem Fall abgestorben.',
      'Kurz aufeinanderfolgende Bleichereignisse verringern die Chancen der Korallen, sich zu erholen.',
      'Die Algen entziehen den Korallen Nährstoffe.'],
    2,
    'C folgt aus dem letzten Satz. A verwechselt den Flächenanteil mit dem Anteil der Arten. B widerspricht der möglichen Erholung. D kehrt die Symbiose um, die Algen liefern Nährstoffe.'],

  ['Der Anker-Effekt',
    'Beim sogenannten Anker-Effekt lassen sich Menschen bei Schätzungen von einer zuvor genannten Zahl beeinflussen, selbst wenn diese offensichtlich keine Aussagekraft hat. In einem bekannten Experiment drehten Versuchspersonen zunächst ein Glücksrad, das auf eine hohe oder niedrige Zahl fiel, und sollten dann schätzen, wie hoch der Anteil afrikanischer Staaten in den Vereinten Nationen sei. Wer eine hohe Zahl gesehen hatte, schätzte im Durchschnitt deutlich höher.\n\nDer Effekt zeigt sich auch in Verhandlungen: Das erste genannte Angebot beeinflusst häufig das Ergebnis. Selbst Fachleute, etwa Richterinnen und Richter bei der Strafzumessung, sind nach einigen Studien nicht dagegen gefeit.',
    'a',
    ['Nur Laien lassen sich vom Anker-Effekt beeinflussen.',
      'In Verhandlungen kann es von Vorteil sein, das erste Angebot zu machen.',
      'Der Anker-Effekt tritt nur auf, wenn die genannte Zahl für die Schätzung relevant ist.',
      'Im beschriebenen Experiment hatte die Zahl des Glücksrads keinen Einfluss auf die Schätzungen.'],
    1,
    'B lässt sich daraus ableiten, dass das erste Angebot das Ergebnis häufig beeinflusst. A widerspricht den Studien mit Richtern. C widerspricht der Wirkung auch aussageloser Zahlen. D widerspricht dem Ergebnis des Experiments.'],

  ['Honigbienen und Wildbienen',
    'In der öffentlichen Debatte über das Bienensterben steht häufig die Honigbiene im Mittelpunkt. Sie ist jedoch ein vom Menschen gehaltenes Nutztier, dessen Völker Imker bei Verlusten wieder aufstocken können. Die Zahl der Honigbienenvölker ist in Europa insgesamt nicht zurückgegangen.\n\nBedroht sind vor allem die Wildbienen, von denen es in Europa rund 2 000 Arten gibt, darunter viele Hummeln und solitär lebende Arten. Viele von ihnen sind auf bestimmte Pflanzen oder Nistplätze spezialisiert und reagieren empfindlich auf den Verlust von Lebensräumen. Einige Fachleute weisen darauf hin, dass eine sehr hohe Dichte an Honigbienen in manchen Gebieten sogar die Konkurrenz um Nahrung für Wildbienen verschärfen kann.',
    'h',
    ['Das Aufstellen möglichst vieler Honigbienenvölker ist die beste Maßnahme gegen das Bienensterben.',
      'Nicht die Honigbiene, sondern vor allem die vielfältigen und oft spezialisierten Wildbienen sind bedroht, was beim Schutz der Bienen berücksichtigt werden sollte.',
      'Die Zahl der Honigbienenvölker in Europa ist stark zurückgegangen.',
      'Wildbienen sind nicht auf bestimmte Pflanzen angewiesen.'],
    1,
    'B fasst die Kernaussage zusammen. A widerspricht dem Hinweis auf die Konkurrenz durch Honigbienen. C widerspricht dem ersten Absatz. D widerspricht der Spezialisierung vieler Wildbienen.'],

  ['Vulkane und Klima',
    'Große Vulkanausbrüche können das Klima kurzfristig abkühlen. Dabei ist nicht die ausgestoßene Asche entscheidend, die meist innerhalb weniger Wochen aus der Atmosphäre fällt, sondern Schwefeldioxid, das in der Stratosphäre zu winzigen Tröpfchen reagiert. Diese reflektieren einen Teil des Sonnenlichts und können über ein bis zwei Jahre die Temperaturen senken.\n\nSo folgte auf den Ausbruch des Tambora im heutigen Indonesien 1815 das sogenannte „Jahr ohne Sommer“, das in Teilen Europas zu Missernten führte. Die CO2-Emissionen aller Vulkane zusammen sind nach wissenschaftlichen Schätzungen deutlich geringer als die vom Menschen verursachten Emissionen und spielen für die gegenwärtige Erwärmung keine wesentliche Rolle.',
    'f',
    ['Die abkühlende Wirkung großer Vulkanausbrüche geht vor allem auf Schwefeldioxid zurück.',
      'Die abkühlende Wirkung eines großen Ausbruchs kann ein bis zwei Jahre anhalten.',
      'Vulkane stoßen mehr CO2 aus als der Mensch.',
      'Auf den Ausbruch des Tambora folgten in Teilen Europas Missernten.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die vulkanischen CO2-Emissionen sind deutlich geringer als die menschlichen. A, B und D stehen so im Text.'],

  ['Mehrfachaufgaben',
    'Viele Menschen glauben, mehrere Aufgaben gleichzeitig erledigen zu können, etwa E-Mails zu beantworten, während sie an einer Besprechung teilnehmen. Kognitionspsychologische Studien zeigen jedoch, dass das Gehirn anspruchsvolle Aufgaben, die dieselben Ressourcen erfordern, nicht wirklich parallel bearbeitet, sondern zwischen ihnen hin- und herwechselt. Jeder Wechsel kostet Zeit und erhöht die Fehlerwahrscheinlichkeit.\n\nAnders verhält es sich bei gut eingeübten, weitgehend automatisierten Tätigkeiten: Ein erfahrener Autofahrer kann sich auf einer ruhigen Strecke unterhalten, ohne dass seine Fahrleistung merklich leidet. In anspruchsvollen Verkehrssituationen verschlechtert sich die Leistung jedoch auch bei ihm deutlich, wenn er gleichzeitig telefoniert.',
    'a',
    ['Menschen können beliebig viele anspruchsvolle Aufgaben ohne Leistungsverlust parallel bearbeiten.',
      'Wer während einer Besprechung E-Mails beantwortet, dürfte bei mindestens einer der Tätigkeiten weniger leisten.',
      'Automatisierte Tätigkeiten lassen sich nie mit anderen Tätigkeiten verbinden.',
      'Ein erfahrener Autofahrer kann in jeder Verkehrssituation gefahrlos telefonieren.'],
    1,
    'B lässt sich daraus ableiten, dass jeder Wechsel Zeit kostet und Fehler begünstigt. A widerspricht den Studien. C widerspricht dem Beispiel des erfahrenen Autofahrers. D widerspricht der Leistungseinbuße in anspruchsvollen Situationen.'],

  ['Die Tiefsee',
    'Die Tiefsee, also die Meeresbereiche unterhalb von etwa 200 Metern, ist der größte Lebensraum der Erde, aber zugleich einer der am wenigsten erforschten. Bei vielen Expeditionen werden bislang unbekannte Arten entdeckt. Da kein Sonnenlicht in die Tiefe vordringt, sind die meisten Lebewesen dort auf organisches Material angewiesen, das aus höheren Wasserschichten absinkt.\n\nEine Ausnahme bilden die Lebensgemeinschaften an hydrothermalen Quellen. Dort nutzen Bakterien chemische Verbindungen aus dem austretenden Wasser als Energiequelle und bilden die Grundlage einer eigenen Nahrungskette. Das Interesse am Abbau von Rohstoffen am Meeresboden, etwa von Manganknollen, ist gewachsen. Wissenschaftler warnen, dass die Folgen für die langsam wachsenden Tiefseeökosysteme kaum abschätzbar seien.',
    'r',
    ['Alle Lebewesen der Tiefsee sind auf absinkendes organisches Material angewiesen.',
      'An hydrothermalen Quellen gibt es Nahrungsketten, die nicht auf Sonnenlicht beruhen.',
      'Die Tiefsee gilt als vollständig erforscht.',
      'Die Folgen des Rohstoffabbaus in der Tiefsee sind gut bekannt.'],
    1,
    'B folgt aus der Energiegewinnung durch chemische Verbindungen an den Quellen. A übersieht diese Ausnahme. C widerspricht der geringen Erforschung. D widerspricht der Warnung der Wissenschaftler.'],

  ['Gewohnheiten',
    'Ein erheblicher Teil unseres täglichen Verhaltens beruht auf Gewohnheiten, also auf Handlungen, die durch häufige Wiederholung in einem bestimmten Kontext weitgehend automatisch ablaufen. Gewohnheiten entlasten das Gehirn, erschweren aber zugleich Verhaltensänderungen, da gute Vorsätze gegen eingeübte Routinen ankämpfen müssen.\n\nStudien zeigen, dass Veränderungen besonders gut gelingen, wenn sich der Kontext ohnehin ändert, etwa nach einem Umzug oder einem Arbeitsplatzwechsel. In solchen Phasen werden alte Auslöser unterbrochen, und neue Gewohnheiten lassen sich leichter etablieren. Wie lange es dauert, bis ein neues Verhalten zur Gewohnheit wird, ist individuell sehr unterschiedlich; die oft genannte Zahl von 21 Tagen ist wissenschaftlich nicht belegt.',
    'r',
    ['Nach genau 21 Tagen wird jedes neue Verhalten zur Gewohnheit.',
      'Gewohnheiten erleichtern Verhaltensänderungen.',
      'Ein Wohnortwechsel kann ein günstiger Zeitpunkt sein, um neue Gewohnheiten aufzubauen.',
      'Gewohnheiten beanspruchen das Gehirn stärker als bewusst gesteuerte Handlungen.'],
    2,
    'C folgt aus dem zweiten Absatz. A widerspricht dem Hinweis, dass die Zahl nicht belegt ist. B kehrt die Wirkung um. D widerspricht der Entlastung des Gehirns.'],

  ['Wetter und Klima',
    'Wetter und Klima werden im Alltag häufig verwechselt. Das Wetter beschreibt den Zustand der Atmosphäre an einem bestimmten Ort zu einem bestimmten Zeitpunkt, etwa Temperatur, Niederschlag und Wind. Das Klima beschreibt dagegen die statistischen Eigenschaften des Wetters über einen langen Zeitraum, üblicherweise mindestens 30 Jahre.\n\nEin einzelner kalter Winter widerlegt daher nicht die globale Erwärmung, und ein einzelner heißer Sommer beweist sie nicht. Die Attributionsforschung kann inzwischen jedoch abschätzen, wie stark der Klimawandel die Wahrscheinlichkeit oder Intensität eines bestimmten Extremereignisses verändert hat, etwa einer Hitzewelle.',
    'a',
    ['Ein ungewöhnlich kalter Winter in Europa zeigt, dass die Erde sich nicht erwärmt.',
      'Aussagen über das Klima erfordern Beobachtungen über viele Jahre.',
      'Die Attributionsforschung kann nicht abschätzen, ob der Klimawandel ein Extremereignis wahrscheinlicher gemacht hat.',
      'Wetter und Klima bezeichnen dasselbe.'],
    1,
    'B folgt aus der Definition des Klimas über mindestens 30 Jahre. A widerspricht dem zweiten Absatz. C widerspricht der Leistung der Attributionsforschung. D widerspricht der Unterscheidung.'],

  ['Die Farbe des Himmels',
    'Das Sonnenlicht setzt sich aus Licht verschiedener Wellenlängen zusammen. Beim Durchgang durch die Atmosphäre wird kurzwelliges blaues Licht an den Luftmolekülen deutlich stärker gestreut als langwelliges rotes Licht. Dieses gestreute blaue Licht erreicht uns aus allen Richtungen, weshalb der Himmel tagsüber blau erscheint.\n\nBei Sonnenauf- und -untergang muss das Licht einen deutlich längeren Weg durch die Atmosphäre zurücklegen. Dabei wird ein großer Teil des blauen Lichts herausgestreut, bevor es den Beobachter erreicht, sodass vor allem rote und orange Anteile übrig bleiben. Dass der Himmel nicht violett erscheint, obwohl violettes Licht noch stärker gestreut wird, liegt unter anderem daran, dass das menschliche Auge für Blau empfindlicher ist.',
    'r',
    ['Rotes Licht wird in der Atmosphäre stärker gestreut als blaues.',
      'Bei Sonnenuntergang legt das Licht einen kürzeren Weg durch die Atmosphäre zurück als mittags.',
      'Violettes Licht wird schwächer gestreut als blaues.',
      'Die Empfindlichkeit des menschlichen Auges trägt dazu bei, dass der Himmel blau und nicht violett erscheint.'],
    3,
    'D steht so im letzten Satz. A kehrt das Streuverhalten um. B kehrt die Weglänge um. C widerspricht der stärkeren Streuung von Violett.'],

  ['Der Mitläufereffekt',
    'In einem klassischen Experiment der Sozialpsychologie sollten Versuchspersonen die Länge von Linien vergleichen, eine Aufgabe mit einer offensichtlich richtigen Antwort. Die übrigen Gruppenmitglieder waren jedoch eingeweiht und gaben in einigen Durchgängen absichtlich eine falsche Antwort. Ein erheblicher Teil der Versuchspersonen schloss sich zumindest in einigen Durchgängen der falschen Mehrheitsmeinung an.\n\nWeitere Varianten des Experiments zeigten, dass die Anpassung deutlich zurückging, wenn nur ein einziges anderes Gruppenmitglied von der Mehrheit abwich und die richtige Antwort gab. Auch wenn die Versuchspersonen ihre Antwort schriftlich und nicht öffentlich abgeben konnten, passten sie sich seltener an.',
    'a',
    ['Die Versuchspersonen passten sich in allen Durchgängen der Mehrheit an.',
      'Ein einzelner Abweichler in einer Gruppe kann anderen erleichtern, ihrer eigenen Wahrnehmung zu folgen.',
      'Die Aufgabe im Experiment war so schwierig, dass die richtige Antwort nicht erkennbar war.',
      'Die Möglichkeit, anonym zu antworten, erhöhte die Anpassung an die Mehrheit.'],
    1,
    'B lässt sich aus dem Rückgang der Anpassung bei einem Abweichler ableiten. A übertreibt, laut Text taten dies „ein erheblicher Teil“ in „einigen Durchgängen“. C widerspricht der offensichtlich richtigen Antwort. D kehrt den Befund zur schriftlichen Antwort um.'],

  ['Erdbeben in Europa',
    'Die meisten starken Erdbeben in Europa ereignen sich im Mittelmeerraum, vor allem in Italien, Griechenland und der Türkei, wo die Afrikanische und die Eurasische Platte aufeinandertreffen. In Mittel- und Nordeuropa sind starke Beben selten, aber nicht ausgeschlossen.\n\nErdbeben lassen sich nach dem heutigen Stand der Wissenschaft nicht zuverlässig vorhersagen. Möglich ist jedoch die Abschätzung der Erdbebengefährdung einer Region, also der Wahrscheinlichkeit, mit der dort innerhalb eines bestimmten Zeitraums Erschütterungen einer bestimmten Stärke auftreten. Auf dieser Grundlage legen Bauvorschriften fest, wie erdbebensicher Gebäude sein müssen. Viele Schäden entstehen, weil ältere Gebäude errichtet wurden, bevor solche Vorschriften galten, oder weil diese nicht eingehalten wurden.',
    'r',
    ['Starke Erdbeben in Mitteleuropa sind ausgeschlossen.',
      'Der genaue Zeitpunkt eines Erdbebens lässt sich heute zuverlässig vorhersagen.',
      'Ältere Gebäude können besonders anfällig sein, wenn sie vor Einführung der Bauvorschriften errichtet wurden.',
      'Die Erdbebengefährdung einer Region lässt sich nicht abschätzen.'],
    2,
    'C folgt aus dem letzten Satz. A widerspricht „selten, aber nicht ausgeschlossen“. B widerspricht der fehlenden Vorhersagbarkeit. D widerspricht der Abschätzung der Gefährdung.'],

  ['Kaffee und Gesundheit',
    'Kaffee galt lange als eher ungesund. Große Beobachtungsstudien der vergangenen Jahrzehnte deuten jedoch darauf hin, dass ein mäßiger Kaffeekonsum von drei bis vier Tassen täglich bei den meisten Erwachsenen nicht mit gesundheitlichen Nachteilen verbunden ist. Einige Studien fanden sogar ein geringeres Risiko für bestimmte Erkrankungen.\n\nBeobachtungsstudien können allerdings nur Zusammenhänge aufzeigen, keine Ursachen belegen. Es ist möglich, dass Kaffeetrinker sich in anderen Merkmalen von Nichttrinkern unterscheiden, die das Ergebnis beeinflussen. Für Schwangere und Menschen mit bestimmten Vorerkrankungen gelten zudem niedrigere empfohlene Höchstmengen an Koffein.',
    'f',
    ['Nach großen Beobachtungsstudien ist mäßiger Kaffeekonsum bei den meisten Erwachsenen nicht mit gesundheitlichen Nachteilen verbunden.',
      'Die Beobachtungsstudien haben bewiesen, dass Kaffee bestimmte Erkrankungen verhindert.',
      'Für Schwangere gelten niedrigere empfohlene Höchstmengen an Koffein.',
      'Unterschiede zwischen Kaffeetrinkern und Nichttrinkern in anderen Merkmalen könnten die Ergebnisse beeinflussen.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Beobachtungsstudien können nur Zusammenhänge aufzeigen, keine Ursachen belegen. A, C und D stehen so im Text.'],

  ['Invasive Arten',
    'Als invasiv gelten gebietsfremde Arten, die vom Menschen absichtlich oder unabsichtlich in ein neues Gebiet eingebracht wurden und dort heimische Arten, Ökosysteme oder die menschliche Gesundheit beeinträchtigen. Nicht jede gebietsfremde Art ist invasiv: Die meisten eingeschleppten Arten können sich gar nicht dauerhaft ansiedeln, und viele der angesiedelten verursachen keine erkennbaren Schäden.\n\nDie Union führt eine Liste invasiver Arten von unionsweiter Bedeutung. Für diese Arten gelten Verbote, etwa der Einfuhr, der Haltung und der Freisetzung. Die Bekämpfung bereits etablierter Arten ist oft aufwendig und teuer; Fachleute halten daher Vorbeugung und frühzeitiges Eingreifen für am wirksamsten.',
    'a',
    ['Alle gebietsfremden Arten schaden den heimischen Ökosystemen.',
      'Es dürfte in der Regel kostengünstiger sein, die Ansiedlung einer invasiven Art zu verhindern, als sie später zu bekämpfen.',
      'Die meisten eingeschleppten Arten siedeln sich dauerhaft an.',
      'Für Arten auf der Unionsliste ist die private Haltung erlaubt.'],
    1,
    'B lässt sich daraus ableiten, dass die Bekämpfung etablierter Arten teuer ist und Vorbeugung als am wirksamsten gilt. A widerspricht der Unterscheidung zwischen gebietsfremd und invasiv. C widerspricht dem ersten Absatz. D widerspricht dem Haltungsverbot.'],

  ['Mondlandung und Technologie',
    'Häufig wird behauptet, alltägliche Produkte wie Teflon oder Klettverschlüsse seien für die Raumfahrt erfunden worden. Tatsächlich existierten beide bereits, bevor die amerikanische Raumfahrtbehörde sie nutzte. Dennoch hat die Raumfahrt zahlreiche technische Entwicklungen vorangetrieben, etwa in der Miniaturisierung von Elektronik, bei Werkstoffen und in der Satellitentechnik.\n\nDer Nutzen von Raumfahrtprogrammen lässt sich daher nicht allein an einzelnen „Nebenprodukten“ messen. Befürworter verweisen zudem auf wissenschaftliche Erkenntnisse und auf Anwendungen wie Wettervorhersage, Navigation und Erdbeobachtung, die ohne Satelliten nicht denkbar wären. Kritiker halten die hohen Kosten angesichts dringender Probleme auf der Erde für schwer zu rechtfertigen.',
    'r',
    ['Teflon wurde eigens für die Raumfahrt erfunden.',
      'Die Raumfahrt hat die Miniaturisierung der Elektronik vorangetrieben.',
      'Der Nutzen der Raumfahrt besteht ausschließlich in Nebenprodukten für den Alltag.',
      'Alle Beobachter halten die Kosten der Raumfahrt für gerechtfertigt.'],
    1,
    'B steht im ersten Absatz. A widerspricht dem Text. C widerspricht dem zweiten Absatz. D widerspricht der Position der Kritiker.'],

  ['Sprache und Denken',
    'Die These, dass die Sprache, die ein Mensch spricht, sein Denken bestimmt, ist in ihrer starken Form weitgehend widerlegt: Menschen können auch Unterscheidungen treffen, für die ihre Sprache kein eigenes Wort hat. Eine schwächere Form der These findet dagegen empirische Unterstützung.\n\nSo zeigen Experimente, dass Sprecher von Sprachen, die zwei Blautöne mit verschiedenen Grundwörtern bezeichnen, diese Farben etwas schneller unterscheiden als Sprecher von Sprachen ohne diese Unterscheidung. Der Unterschied ist messbar, aber gering. Sprache beeinflusst demnach die Wahrnehmung und das Denken in gewissem Maß, legt es aber nicht fest.',
    'h',
    ['Sprache bestimmt das Denken vollständig.',
      'Sprache hat keinerlei Einfluss auf das Denken.',
      'Sprache kann Wahrnehmung und Denken in begrenztem Maß beeinflussen, bestimmt sie aber nicht.',
      'Menschen können nur Unterscheidungen treffen, für die es in ihrer Sprache ein Wort gibt.'],
    2,
    'C gibt das Fazit des Textes wieder. A beschreibt die widerlegte starke These. B widerspricht den Experimenten. D widerspricht dem ersten Absatz.'],

  ['Plastik im Meer',
    'Jedes Jahr gelangen Millionen Tonnen Kunststoff in die Ozeane. Nur ein kleiner Teil davon treibt an der Oberfläche; ein großer Teil sinkt ab oder zerfällt zu Mikroplastik. Die bekannten Müllstrudel im Pazifik bestehen daher weniger aus einer geschlossenen Plastikinsel als aus einer erhöhten Konzentration meist kleiner Teile, die über eine große Fläche verteilt sind.\n\nEin erheblicher Teil des Plastiks im Meer stammt aus Flüssen, insbesondere in Regionen mit unzureichender Abfallentsorgung. Aufräumaktionen an Stränden und auf See können lokal hilfreich sein, gelten aber angesichts der Mengen als unzureichend, solange der Eintrag nicht verringert wird.',
    'r',
    ['Die Müllstrudel im Pazifik bestehen aus einer geschlossenen, begehbaren Plastikinsel.',
      'Der größte Teil des Plastiks im Meer treibt an der Oberfläche.',
      'Eine bessere Abfallentsorgung in Flussregionen könnte den Plastikeintrag ins Meer verringern.',
      'Aufräumaktionen gelten als ausreichend, um das Problem zu lösen.'],
    2,
    'C folgt daraus, dass ein erheblicher Teil des Plastiks über Flüsse aus Regionen mit unzureichender Entsorgung kommt. A und B widersprechen dem ersten Absatz. D widerspricht dem letzten Satz.'],

  ['Das Gedächtnis als Rekonstruktion',
    'Das Gedächtnis funktioniert nicht wie eine Videoaufzeichnung. Erinnerungen werden bei jedem Abruf neu zusammengesetzt und können dabei verändert werden, etwa durch spätere Informationen oder suggestive Fragen. In Experimenten schätzten Versuchspersonen die Geschwindigkeit von Autos in einem gezeigten Unfall höher ein, wenn gefragt wurde, wie schnell die Autos „ineinanderkrachten“, als wenn gefragt wurde, wie schnell sie sich „berührten“.\n\nFür Strafverfahren ist dies von großer Bedeutung. Zeugenaussagen gelten als wichtiges Beweismittel, sind aber fehleranfälliger als oft angenommen. Die Überzeugung, mit der ein Zeuge aussagt, ist nach Forschungsergebnissen nur ein begrenzt verlässlicher Hinweis auf die Richtigkeit seiner Aussage.',
    'a',
    ['Ein Zeuge, der sich seiner Erinnerung sehr sicher ist, liegt immer richtig.',
      'Die Formulierung einer Frage kann beeinflussen, woran sich ein Zeuge zu erinnern glaubt.',
      'Erinnerungen bleiben nach ihrer Entstehung unverändert.',
      'Zeugenaussagen sind weniger fehleranfällig als allgemein angenommen.'],
    1,
    'B folgt aus dem Experiment mit den unterschiedlichen Formulierungen. A widerspricht der begrenzten Verlässlichkeit der Überzeugung. C widerspricht der Rekonstruktion beim Abruf. D kehrt die Aussage um.'],

  ['Pilze',
    'Pilze sind weder Pflanzen noch Tiere, sondern bilden ein eigenes Reich von Lebewesen. Anders als Pflanzen betreiben sie keine Photosynthese, sondern ernähren sich von organischem Material. Der sichtbare Fruchtkörper ist nur ein kleiner Teil des Organismus; der größte Teil besteht aus einem Geflecht feiner Fäden im Boden oder im Holz.\n\nViele Pilzarten gehen mit den Wurzeln von Bäumen eine Symbiose ein: Sie versorgen die Bäume mit Wasser und Mineralstoffen und erhalten im Gegenzug Zucker. Die weit verbreitete Vorstellung, dass Bäume über solche Pilznetzwerke gezielt miteinander „kommunizieren“ und sich gegenseitig versorgen, ist nach Einschätzung mehrerer Forschender jedoch deutlich weniger gut belegt, als in populären Darstellungen oft behauptet wird.',
    'f',
    ['Pilze betreiben keine Photosynthese.',
      'Der Fruchtkörper macht den größten Teil eines Pilzes aus.',
      'In einer Symbiose mit Bäumen erhalten Pilze Zucker.',
      'Die These einer gezielten Kommunikation von Bäumen über Pilznetzwerke ist nach Ansicht mehrerer Forschender schwächer belegt als oft dargestellt.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Der Fruchtkörper ist nur ein kleiner Teil, der größte Teil ist das Fadengeflecht. A, C und D stehen so im Text.'],

  ['Motivation durch Belohnung',
    'Belohnungen gelten gemeinhin als wirksames Mittel, um Leistung zu steigern. Die Motivationsforschung zeigt jedoch ein differenziertes Bild. Bei einfachen, klar umrissenen Aufgaben können finanzielle Anreize die Leistung tatsächlich erhöhen. Bei Tätigkeiten, die Menschen aus eigenem Interesse ausüben, können in Aussicht gestellte Belohnungen dagegen die innere Motivation untergraben.\n\nIn Experimenten verbrachten Kinder, die für das Malen eine Belohnung erwartet hatten, später in freien Phasen weniger Zeit mit Malen als Kinder, die keine Belohnung erhalten hatten. Unerwartete Belohnungen oder Anerkennung, die sich auf die Qualität der Arbeit bezieht, scheinen die innere Motivation dagegen weniger zu beeinträchtigen.',
    'r',
    ['Belohnungen steigern die Leistung bei allen Arten von Aufgaben.',
      'Kinder, die eine Belohnung für das Malen erwarteten, malten später in freien Phasen mehr.',
      'Eine angekündigte Belohnung für eine gern ausgeübte Tätigkeit kann das Interesse an dieser Tätigkeit verringern.',
      'Unerwartete Belohnungen beeinträchtigen die innere Motivation am stärksten.'],
    2,
    'C gibt den zentralen Befund wieder. A widerspricht der differenzierten Wirkung. B kehrt das Experiment um. D widerspricht dem letzten Satz.'],

  ['Trinkwasser aus Meerwasser',
    'Die Meerwasserentsalzung gewinnt in wasserarmen Regionen an Bedeutung, etwa in Spanien, Zypern und Malta. Das am weitesten verbreitete Verfahren ist die Umkehrosmose, bei der Meerwasser mit hohem Druck durch Membranen gepresst wird, die Salz zurückhalten. Der Energiebedarf ist in den vergangenen Jahrzehnten deutlich gesunken, bleibt aber höher als bei der Gewinnung von Grund- oder Oberflächenwasser.\n\nEin Nebenprodukt ist stark salzhaltiges Wasser, die sogenannte Sole, die meist ins Meer zurückgeleitet wird und dort die Lebewesen in der Nähe der Einleitungsstelle beeinträchtigen kann. Werden Entsalzungsanlagen mit erneuerbarem Strom betrieben, lässt sich ihr Beitrag zu den Treibhausgasemissionen deutlich verringern.',
    'a',
    ['Die Meerwasserentsalzung benötigt heute weniger Energie als die Förderung von Grundwasser.',
      'Die Klimabilanz einer Entsalzungsanlage hängt davon ab, wie ihr Strom erzeugt wird.',
      'Die Sole ist für Meereslebewesen unbedenklich.',
      'Der Energiebedarf der Entsalzung ist in den letzten Jahrzehnten gestiegen.'],
    1,
    'B lässt sich aus dem letzten Satz ableiten. A widerspricht dem höheren Energiebedarf. C widerspricht der möglichen Beeinträchtigung. D kehrt die Entwicklung um.'],

  ['Das Dunning-Kruger-Phänomen',
    'Nach einem vielzitierten psychologischen Befund neigen Menschen mit geringen Kenntnissen in einem Bereich dazu, ihre Fähigkeiten zu überschätzen, während sehr kompetente Menschen ihre Fähigkeiten eher leicht unterschätzen. Als Erklärung wurde angeführt, dass gerade die Kenntnisse, die für gute Leistungen nötig sind, auch nötig sind, um die eigene Leistung richtig einzuschätzen.\n\nIn jüngerer Zeit wurde die Deutung des Befunds kritisiert. Ein Teil des Musters lässt sich demnach bereits mit statistischen Effekten erklären, die auch bei zufälligen Daten auftreten. Unbestritten ist, dass Selbsteinschätzungen und tatsächliche Leistungen oft nur mäßig übereinstimmen.',
    'r',
    ['Nach dem Befund überschätzen sehr kompetente Menschen ihre Fähigkeiten stark.',
      'Die Deutung des Befunds ist in der Forschung unumstritten.',
      'Statistische Effekte könnten einen Teil des beobachteten Musters erklären.',
      'Selbsteinschätzungen stimmen in der Regel genau mit den tatsächlichen Leistungen überein.'],
    2,
    'C steht im zweiten Absatz. A kehrt den Befund für kompetente Menschen um. B widerspricht der Kritik. D widerspricht der nur mäßigen Übereinstimmung.'],

  ['Städtische Bäume',
    'Bäume in Städten spenden Schatten, kühlen durch Verdunstung die Umgebung und können Regenwasser zurückhalten. Studien zeigen, dass die Oberflächentemperatur unter Baumkronen an heißen Tagen deutlich niedriger ist als auf unbeschatteten versiegelten Flächen.\n\nDie Lebensbedingungen für Stadtbäume sind jedoch schwierig: Wurzelraum ist knapp, Böden sind verdichtet, und im Winter belastet Streusalz die Bäume. Hinzu kommen zunehmend trockene Sommer. Viele Städte pflanzen daher Baumarten aus wärmeren Regionen, die mit Hitze und Trockenheit besser zurechtkommen. Ein großer, alter Baum lässt sich zudem nicht kurzfristig ersetzen: Ein junger Baum braucht Jahrzehnte, bis er eine vergleichbare Kühlwirkung erreicht.',
    'a',
    ['Die Fällung eines alten Stadtbaums kann durch die Pflanzung eines jungen Baums sofort ausgeglichen werden.',
      'Der Erhalt bestehender großer Bäume kann für die Kühlung einer Stadt kurzfristig wichtiger sein als Neupflanzungen.',
      'Stadtbäume finden in der Regel ideale Lebensbedingungen vor.',
      'Städte pflanzen ausschließlich heimische Baumarten.'],
    1,
    'B lässt sich daraus ableiten, dass ein junger Baum Jahrzehnte für eine vergleichbare Kühlwirkung braucht. A widerspricht diesem Satz. C widerspricht den schwierigen Lebensbedingungen. D widerspricht der Pflanzung von Arten aus wärmeren Regionen.'],
]);

/* Fragenpool Sprachlogik – Block K: Öffentliche Verwaltung, EU-Dienst, Ethik, Management */
EPSO_VERBAL_ADD('k', [
  ['Interessenkonflikte',
    'Beamtinnen und Beamte der Union müssen bei der Wahrnehmung ihrer Aufgaben jeden Interessenkonflikt vermeiden. Ein Interessenkonflikt liegt vor, wenn persönliche Interessen, etwa familiäre oder finanzielle, die unparteiische Ausübung des Amtes beeinträchtigen können. Bereits der Anschein eines Interessenkonflikts ist problematisch, weil er das Vertrauen der Öffentlichkeit untergraben kann.\n\nWer bei der Erfüllung einer Aufgabe mit einer Angelegenheit befasst wird, an der er ein persönliches Interesse hat, muss dies der Anstellungsbehörde mitteilen, die dann geeignete Maßnahmen trifft, etwa die Übertragung der Angelegenheit auf eine andere Person. Nach dem Ausscheiden aus dem Dienst müssen ehemalige Beamte bestimmte berufliche Tätigkeiten für eine gewisse Zeit anzeigen.',
    'r',
    ['Ein Interessenkonflikt ist erst dann problematisch, wenn nachweislich eine parteiische Entscheidung getroffen wurde.',
      'Ein Beamter, der über einen Auftrag an das Unternehmen seines Bruders entscheiden soll, muss dies seiner Anstellungsbehörde mitteilen.',
      'Nach dem Ausscheiden aus dem Dienst unterliegen ehemalige Beamte keinerlei Pflichten mehr.',
      'Die Anstellungsbehörde darf die Angelegenheit nicht einer anderen Person übertragen.'],
    1,
    'B folgt aus der Mitteilungspflicht bei persönlichem, hier familiärem Interesse. A widerspricht der Bedeutung des bloßen Anscheins. C widerspricht der Anzeigepflicht nach dem Ausscheiden. D widerspricht den möglichen Maßnahmen.'],

  ['Bessere Rechtsetzung',
    'Nach der Agenda für bessere Rechtsetzung soll die Kommission für wichtige Gesetzesvorschläge eine Folgenabschätzung erstellen, in der wirtschaftliche, soziale und ökologische Auswirkungen verschiedener Optionen untersucht werden. Ein unabhängiger Ausschuss für Regulierungskontrolle prüft die Qualität dieser Folgenabschätzungen.\n\nZudem hat die Kommission den Grundsatz „One in, one out“ eingeführt: Neue Belastungen für Bürger und Unternehmen durch Rechtsvorschriften sollen durch den Abbau gleichwertiger Belastungen in demselben Politikbereich ausgeglichen werden. Kritiker bemängeln, dass Folgenabschätzungen manchmal fehlen, etwa bei dringlichen Vorschlägen, und dass Parlament und Rat die Vorschläge im Gesetzgebungsverfahren oft erheblich ändern, ohne die Folgen der Änderungen abzuschätzen.',
    'a',
    ['Für jeden Gesetzesvorschlag der Kommission liegt ausnahmslos eine Folgenabschätzung vor.',
      'Ein Rechtsakt kann am Ende Wirkungen haben, die in der ursprünglichen Folgenabschätzung nicht untersucht wurden.',
      'Nach dem Grundsatz „One in, one out“ darf die Kommission keine neuen Rechtsvorschriften vorschlagen.',
      'Der Ausschuss für Regulierungskontrolle erstellt die Folgenabschätzungen selbst.'],
    1,
    'B folgt daraus, dass Parlament und Rat Vorschläge ändern, ohne die Folgen abzuschätzen. A widerspricht den fehlenden Folgenabschätzungen. C verkennt den Grundsatz, der Belastungen ausgleichen soll. D verwechselt Prüfung und Erstellung.'],

  ['Whistleblower-Schutz',
    'Die Whistleblower-Richtlinie schützt Personen, die im beruflichen Kontext Informationen über Verstöße gegen das Unionsrecht erlangen und melden. Unternehmen mit 50 oder mehr Beschäftigten sowie öffentliche Stellen müssen interne Meldekanäle einrichten. Hinweisgebende können jedoch wählen, ob sie einen Verstoß intern oder direkt bei einer zuständigen Behörde melden.\n\nEine Offenlegung gegenüber der Öffentlichkeit, etwa über die Medien, ist nur unter bestimmten Voraussetzungen geschützt, zum Beispiel wenn auf eine Meldung keine angemessenen Maßnahmen folgten oder eine unmittelbare Gefahr für das öffentliche Interesse besteht. Repressalien wie Kündigung, Herabstufung oder Einschüchterung sind verboten. Kommt es dennoch zu Benachteiligungen, muss der Arbeitgeber beweisen, dass diese nicht auf die Meldung zurückgehen.',
    'r',
    ['Hinweisgebende müssen einen Verstoß stets zuerst intern melden.',
      'Jede Veröffentlichung eines Verstoßes in den Medien ist ohne Einschränkung geschützt.',
      'Wird ein Hinweisgeber nach seiner Meldung herabgestuft, muss der Arbeitgeber nachweisen, dass kein Zusammenhang mit der Meldung besteht.',
      'Unternehmen mit 20 Beschäftigten müssen einen internen Meldekanal einrichten.'],
    2,
    'C folgt aus der Beweislastumkehr. A widerspricht der Wahlfreiheit zwischen intern und extern. B widerspricht den Voraussetzungen für öffentliche Offenlegungen. D widerspricht der Schwelle von 50 Beschäftigten.'],

  ['Telearbeit in den Institutionen',
    'Seit der Pandemie arbeiten die Beschäftigten der EU-Institutionen deutlich häufiger von zu Hause aus. Die Regeln der Kommission erlauben Telearbeit an einem Teil der Arbeitstage, wobei eine regelmäßige Anwesenheit im Büro erwartet wird, um die Zusammenarbeit im Team zu sichern. Telearbeit vom Ausland aus ist nur in begrenztem Umfang und unter bestimmten Bedingungen möglich.\n\nDie Kommission hat zugleich begonnen, ihre Büroflächen in Brüssel erheblich zu verringern und auf gemeinsam genutzte Arbeitsplätze umzustellen. Personalvertretungen begrüßen die größere Flexibilität, kritisieren aber, dass gemeinsam genutzte Arbeitsplätze die Konzentration erschweren und die Bindung an das Team schwächen könnten.',
    'f',
    ['Beschäftigte der Kommission können an einem Teil ihrer Arbeitstage von zu Hause aus arbeiten.',
      'Telearbeit vom Ausland aus ist unbegrenzt möglich.',
      'Die Kommission verringert ihre Büroflächen in Brüssel.',
      'Personalvertretungen befürchten, dass gemeinsam genutzte Arbeitsplätze die Konzentration erschweren.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Telearbeit vom Ausland ist nur begrenzt und unter Bedingungen möglich. A, C und D stehen so im Text.'],

  ['Führung und Feedback',
    'Regelmäßiges Feedback gilt als wichtiges Instrument der Mitarbeiterführung. Studien zeigen jedoch, dass Feedback nicht automatisch zu besseren Leistungen führt. In einem erheblichen Teil der untersuchten Fälle verschlechterte sich die Leistung nach dem Feedback sogar.\n\nAls entscheidend gilt, worauf sich das Feedback richtet. Rückmeldungen zu konkreten Aufgaben und Verhaltensweisen, verbunden mit Hinweisen, wie sich etwas verbessern lässt, sind in der Regel wirksamer als Rückmeldungen, die sich auf die Person als Ganzes beziehen, etwa „Sie sind nicht teamfähig“. Letztere lenken die Aufmerksamkeit auf das Selbstbild und können Abwehrreaktionen auslösen.',
    'h',
    ['Feedback verbessert die Leistung in jedem Fall.',
      'Feedback sollte möglichst vermieden werden, weil es die Leistung verschlechtert.',
      'Ob Feedback die Leistung verbessert, hängt stark davon ab, ob es sich auf konkrete Aufgaben statt auf die Person richtet.',
      'Rückmeldungen zur Persönlichkeit sind wirksamer als Rückmeldungen zu konkreten Aufgaben.'],
    2,
    'C gibt die Kernaussage wieder. A widerspricht den Studien. B übertreibt die Befunde und übersieht die Bedingungen wirksamen Feedbacks. D kehrt den Befund um.'],

  ['Öffentliche Auftragsvergabe',
    'Öffentliche Aufträge oberhalb bestimmter Schwellenwerte müssen nach den Vergaberichtlinien der Union unionsweit ausgeschrieben werden. Dadurch sollen Unternehmen aus allen Mitgliedstaaten gleiche Chancen erhalten und öffentliche Mittel wirtschaftlich eingesetzt werden. Unterhalb der Schwellenwerte gelten nationale Vorschriften.\n\nDer Zuschlag muss nicht an das billigste Angebot erteilt werden, sondern an das wirtschaftlich günstigste, bei dem neben dem Preis auch Kriterien wie Qualität, Umweltaspekte oder soziale Aspekte berücksichtigt werden können. Die Kriterien und ihre Gewichtung müssen jedoch vorab in den Vergabeunterlagen bekannt gegeben werden. In der Praxis wird dennoch häufig allein nach dem Preis entschieden, und in vielen Verfahren gibt es nur einen einzigen Bieter.',
    'a',
    ['Öffentliche Aufträge müssen immer an das billigste Angebot vergeben werden.',
      'Ein Auftraggeber darf Umweltkriterien berücksichtigen, wenn er sie vorab in den Vergabeunterlagen bekannt gegeben hat.',
      'Die Vergaberichtlinien der Union gelten für alle öffentlichen Aufträge unabhängig von ihrem Wert.',
      'Die Kriterien für den Zuschlag dürfen nach Eingang der Angebote festgelegt werden.'],
    1,
    'B folgt aus der Möglichkeit, Umweltaspekte zu berücksichtigen, sofern sie vorab bekannt gegeben werden. A widerspricht dem wirtschaftlich günstigsten Angebot. C widerspricht den Schwellenwerten. D widerspricht der Pflicht zur vorherigen Bekanntgabe.'],

  ['Ausschuss der Regionen',
    'Der Europäische Ausschuss der Regionen ist eine beratende Einrichtung der Union, in der Vertreterinnen und Vertreter regionaler und lokaler Gebietskörperschaften sitzen, etwa Bürgermeister oder Mitglieder von Regionalparlamenten. Er muss in bestimmten Politikbereichen, die die Regionen und Kommunen betreffen, wie Verkehr, Umwelt, Bildung und Gesundheit, angehört werden.\n\nSeine Stellungnahmen sind nicht bindend. Der Ausschuss kann jedoch vor dem Gerichtshof klagen, wenn er der Auffassung ist, dass ein Rechtsakt gegen das Subsidiaritätsprinzip verstößt oder er nicht ordnungsgemäß angehört wurde. Neben ihm besteht der Europäische Wirtschafts- und Sozialausschuss, in dem Arbeitgeber, Arbeitnehmer und andere Interessengruppen vertreten sind.',
    'r',
    ['Die Stellungnahmen des Ausschusses der Regionen sind für die Gesetzgeber verbindlich.',
      'Im Ausschuss der Regionen sind Arbeitgeber und Gewerkschaften vertreten.',
      'Der Ausschuss der Regionen kann klagen, wenn er in einem vorgeschriebenen Fall nicht angehört wurde.',
      'Der Ausschuss der Regionen ist ein Organ der Gesetzgebung.'],
    2,
    'C steht so im Text. A widerspricht der fehlenden Bindungswirkung. B verwechselt ihn mit dem Wirtschafts- und Sozialausschuss. D widerspricht der beratenden Funktion.'],

  ['Verwaltungsvereinfachung',
    'Unternehmen in der Union klagen seit Langem über hohe Verwaltungslasten, etwa durch Berichtspflichten. Die Kommission hat sich deshalb das Ziel gesetzt, Berichtspflichten um 25 Prozent und für kleine und mittlere Unternehmen um 35 Prozent zu verringern. Mehrere sogenannte Omnibus-Pakete sollen bestehende Rechtsakte vereinfachen.\n\nBefürworter sehen darin einen Beitrag zur Wettbewerbsfähigkeit. Kritiker, darunter Umwelt- und Verbraucherverbände, befürchten, dass unter dem Etikett der Vereinfachung auch Schutzstandards abgeschwächt würden. Fachleute weisen darauf hin, dass ein Teil der Belastungen nicht auf das Unionsrecht selbst zurückgeht, sondern auf seine Umsetzung in den Mitgliedstaaten, die mitunter zusätzliche Anforderungen stellen.',
    'a',
    ['Die Verwaltungslasten für Unternehmen gehen ausschließlich auf Unionsrecht zurück.',
      'Selbst eine vollständige Umsetzung der Omnibus-Pakete muss nicht alle Belastungen beseitigen, die Unternehmen durch EU-bezogene Vorschriften erfahren.',
      'Umweltverbände unterstützen die Vereinfachungspakete uneingeschränkt.',
      'Das Ziel für kleine und mittlere Unternehmen liegt niedriger als das allgemeine Ziel.'],
    1,
    'B lässt sich daraus ableiten, dass ein Teil der Belastungen auf die nationale Umsetzung zurückgeht. A widerspricht diesem Hinweis. C widerspricht den Befürchtungen der Verbände. D kehrt das Verhältnis um, für KMU gelten 35 Prozent.'],

  ['Evaluierung von Programmen',
    'Die Union evaluiert ihre Förderprogramme regelmäßig, um festzustellen, ob sie ihre Ziele erreichen und die Mittel wirksam eingesetzt werden. Eine große Herausforderung besteht darin, die Wirkung eines Programms von anderen Einflüssen zu trennen. Steigt etwa die Beschäftigung in einer geförderten Region, kann dies an der Förderung liegen, aber auch an der allgemeinen Konjunktur.\n\nAussagekräftige Evaluierungen vergleichen daher geförderte Projekte oder Regionen mit ähnlichen, nicht geförderten. Solche Vergleichsgruppen sind jedoch nicht immer verfügbar. Der Europäische Rechnungshof hat wiederholt kritisiert, dass manche Evaluierungen vor allem den Mittelabfluss und die Zahl der Projekte messen, nicht aber die tatsächlich erzielten Ergebnisse.',
    'r',
    ['Ein Anstieg der Beschäftigung in einer geförderten Region beweist die Wirksamkeit der Förderung.',
      'Vergleichsgruppen stehen für jede Evaluierung zur Verfügung.',
      'Die Zahl der geförderten Projekte sagt für sich genommen wenig über die tatsächlichen Ergebnisse eines Programms aus.',
      'Der Rechnungshof hält alle Evaluierungen der Union für methodisch einwandfrei.'],
    2,
    'C ergibt sich aus der Kritik des Rechnungshofs. A widerspricht dem Problem, Wirkungen von anderen Einflüssen zu trennen. B widerspricht der eingeschränkten Verfügbarkeit. D widerspricht der wiederholten Kritik.'],

  ['Kommunikation von Behörden',
    'Behördliche Schreiben gelten oft als schwer verständlich. Lange Sätze, Fachbegriffe und Passivkonstruktionen erschweren es Bürgerinnen und Bürgern, zu verstehen, was von ihnen erwartet wird. Untersuchungen zeigen, dass verständlich formulierte Schreiben zu weniger Rückfragen und weniger Fehlern bei der Bearbeitung führen.\n\nMehrere Verwaltungen haben daher Leitfäden für verständliche Sprache eingeführt. Kritiker wenden ein, dass Rechtssicherheit manchmal präzise Fachbegriffe erfordere, die sich nicht ohne Bedeutungsverlust vereinfachen ließen. Befürworter halten dem entgegen, dass sich auch komplexe Sachverhalte häufig klarer ausdrücken ließen, ohne an Präzision zu verlieren, etwa indem Fachbegriffe erklärt statt vermieden werden.',
    'f',
    ['Verständlich formulierte Schreiben können den Aufwand für Rückfragen verringern.',
      'Mehrere Verwaltungen haben Leitfäden für verständliche Sprache eingeführt.',
      'Befürworter verständlicher Sprache fordern, Fachbegriffe grundsätzlich zu vermeiden.',
      'Kritiker verweisen auf die Bedeutung präziser Fachbegriffe für die Rechtssicherheit.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Befürworter schlagen vor, Fachbegriffe zu erklären statt sie zu vermeiden. A, B und D stehen so im Text.'],

  ['Personalpolitik und geografische Ausgewogenheit',
    'Nach dem Beamtenstatut sollen die Beamtinnen und Beamten der Union auf möglichst breiter geografischer Grundlage aus den Staatsangehörigen der Mitgliedstaaten ausgewählt werden. Kein Dienstposten darf jedoch den Angehörigen eines bestimmten Mitgliedstaats vorbehalten werden. Die Einstellung erfolgt grundsätzlich nach Befähigung, Leistung und Integrität.\n\nIn den vergangenen Jahren sind Staatsangehörige einiger Mitgliedstaaten, gemessen an deren Bevölkerungsanteil, deutlich unterrepräsentiert, vor allem in den jüngeren Jahrgängen. Die Kommission hat daher Richtwerte für jeden Mitgliedstaat festgelegt und in einigen Fällen gezielte Maßnahmen ergriffen, etwa Informationskampagnen und Auswahlverfahren, die auf bestimmte Kandidatengruppen ausgerichtet sind.',
    'r',
    ['Bestimmte Dienstposten können den Staatsangehörigen eines Mitgliedstaats vorbehalten werden.',
      'Die Staatsangehörigkeit ist das wichtigste Kriterium bei der Einstellung.',
      'Die Kommission hat für jeden Mitgliedstaat Richtwerte für eine ausgewogene Vertretung festgelegt.',
      'Alle Mitgliedstaaten sind entsprechend ihrem Bevölkerungsanteil vertreten.'],
    2,
    'C steht im zweiten Absatz. A widerspricht dem Verbot, Dienstposten vorzubehalten. B widerspricht der Einstellung nach Befähigung, Leistung und Integrität. D widerspricht der Unterrepräsentation einiger Staaten.'],

  ['Entscheidungsfindung in Gruppen',
    'Gruppen treffen nicht zwangsläufig bessere Entscheidungen als Einzelpersonen. Ein bekanntes Risiko ist das sogenannte Gruppendenken: In sehr geschlossenen, harmonieorientierten Gruppen werden abweichende Meinungen unterdrückt oder gar nicht erst geäußert, um den Zusammenhalt nicht zu gefährden. Dadurch werden Alternativen und Risiken unzureichend geprüft.\n\nAls Gegenmaßnahmen gelten unter anderem, eine Person gezielt die Rolle des Kritikers übernehmen zu lassen, externe Fachleute hinzuzuziehen und die Vorgesetzten ihre eigene Meinung erst am Ende äußern zu lassen. Gruppen, deren Mitglieder unterschiedliche Perspektiven einbringen und sich frei äußern können, erzielen nach Studien häufig bessere Ergebnisse als Einzelpersonen.',
    'a',
    ['Gruppen treffen immer bessere Entscheidungen als Einzelpersonen.',
      'Wenn eine Vorgesetzte ihre Meinung zu Beginn einer Besprechung äußert, kann dies abweichende Meinungen der Teammitglieder hemmen.',
      'Harmonieorientierte Gruppen prüfen Risiken besonders gründlich.',
      'Die Hinzuziehung externer Fachleute verstärkt das Gruppendenken.'],
    1,
    'B lässt sich aus der Empfehlung ableiten, dass Vorgesetzte ihre Meinung erst am Ende äußern sollen. A widerspricht dem ersten Satz. C kehrt die Wirkung des Gruppendenkens um. D widerspricht den genannten Gegenmaßnahmen.'],

  ['Open Data',
    'Nach der Richtlinie über offene Daten sollen Daten des öffentlichen Sektors grundsätzlich zur Weiterverwendung zur Verfügung gestellt werden, etwa Geodaten, Wetterdaten, Unternehmensregister oder Verkehrsdaten. Für bestimmte hochwertige Datensätze gilt, dass sie kostenlos, maschinenlesbar und über Programmierschnittstellen bereitgestellt werden müssen.\n\nPersonenbezogene Daten und Daten, die aus Gründen der Sicherheit oder des Schutzes von Geschäftsgeheimnissen vertraulich sind, fallen nicht unter die Pflicht. Befürworter erwarten wirtschaftlichen Nutzen durch neue Anwendungen und mehr Transparenz. In der Praxis sind viele Datensätze jedoch schwer auffindbar oder liegen in Formaten vor, die sich nur mit großem Aufwand verarbeiten lassen.',
    'r',
    ['Personenbezogene Daten müssen nach der Richtlinie frei zugänglich gemacht werden.',
      'Alle Daten des öffentlichen Sektors müssen kostenlos bereitgestellt werden.',
      'Bestimmte hochwertige Datensätze müssen maschinenlesbar bereitgestellt werden.',
      'Offene Daten sind in der Praxis durchweg leicht auffindbar und gut verarbeitbar.'],
    2,
    'C steht im ersten Absatz. A widerspricht der Ausnahme für personenbezogene Daten. B verallgemeinert die Regel für hochwertige Datensätze. D widerspricht dem letzten Satz.'],

  ['Das Peter-Prinzip',
    'Nach dem sogenannten Peter-Prinzip werden Beschäftigte in Hierarchien so lange befördert, bis sie eine Position erreichen, für die sie nicht mehr geeignet sind. Der Grund: Beförderungen orientieren sich häufig an der Leistung in der bisherigen Position, obwohl die neue Position andere Fähigkeiten erfordert. Eine hervorragende Sachbearbeiterin ist nicht automatisch eine gute Führungskraft.\n\nEine empirische Untersuchung im Vertrieb ergab, dass die besten Verkäufer mit höherer Wahrscheinlichkeit befördert wurden, als Führungskräfte aber im Durchschnitt schlechtere Teamergebnisse erzielten. Als Gegenmittel werden getrennte Karrierewege für Fachkräfte und Führungskräfte sowie Auswahlverfahren empfohlen, die gezielt die Anforderungen der neuen Position prüfen.',
    'h',
    ['Die besten Fachkräfte werden immer auch die besten Führungskräfte.',
      'Weil Beförderungen oft auf der bisherigen Leistung beruhen, gelangen Beschäftigte mitunter in Positionen, für die ihnen die nötigen Fähigkeiten fehlen, was gezielte Auswahlverfahren nahelegt.',
      'Beförderungen sollten grundsätzlich abgeschafft werden.',
      'Getrennte Karrierewege verstärken das Peter-Prinzip.'],
    1,
    'B fasst Mechanismus, Beleg und Gegenmittel zusammen. A widerspricht der Untersuchung im Vertrieb. C ist eine Schlussfolgerung, die der Text nicht zieht. D kehrt die Wirkung des Gegenmittels um.'],

  ['Haushaltsvollzug',
    'Ein erheblicher Teil der Mittel des Unionshaushalts wird in geteilter Mittelverwaltung ausgeführt: Die Kommission trägt die Gesamtverantwortung, die Mitgliedstaaten wählen jedoch die Projekte aus und verwalten die Mittel vor Ort. Dies gilt etwa für die Agrar- und die Kohäsionspolitik.\n\nDer Europäische Rechnungshof schätzt jedes Jahr die Fehlerquote bei den Ausgaben, also den Anteil der Mittel, die nicht im Einklang mit den Vorschriften ausgegeben wurden. Eine Fehlerquote ist nicht gleichbedeutend mit Betrug oder Verschwendung; häufig handelt es sich um Verstöße gegen Vergabevorschriften oder um nicht förderfähige Kosten. Bei Ausgabenbereichen mit komplexen Förderregeln liegt die Fehlerquote in der Regel höher.',
    'a',
    ['Eine hohe Fehlerquote beweist, dass Mittel in großem Umfang veruntreut wurden.',
      'Eine Vereinfachung komplexer Förderregeln könnte dazu beitragen, die Fehlerquote zu senken.',
      'Bei geteilter Mittelverwaltung wählt die Kommission die Projekte selbst aus.',
      'Die Fehlerquote ist in allen Ausgabenbereichen gleich hoch.'],
    1,
    'B lässt sich daraus ableiten, dass die Fehlerquote bei komplexen Förderregeln höher liegt. A widerspricht dem Hinweis, dass Fehler nicht gleichbedeutend mit Betrug sind. C widerspricht der Projektauswahl durch die Mitgliedstaaten. D widerspricht den Unterschieden zwischen Bereichen.'],

  ['Diversität in Teams',
    'Diverse Teams, deren Mitglieder sich etwa in Herkunft, Geschlecht, Alter oder fachlichem Hintergrund unterscheiden, gelten als besonders innovativ. Die Forschung zeigt jedoch ein gemischtes Bild. Unterschiedliche Perspektiven können die Qualität von Entscheidungen verbessern, gleichzeitig kann Vielfalt zunächst zu mehr Abstimmungsbedarf und Konflikten führen.\n\nOb die Vorteile überwiegen, hängt nach vielen Studien stark vom Umfeld ab, etwa davon, ob sich Teammitglieder trauen, abweichende Ansichten zu äußern, und ob Führungskräfte unterschiedliche Beiträge aktiv einbinden. Vielfalt allein garantiert demnach keine besseren Ergebnisse.',
    'r',
    ['Diverse Teams erzielen nach der Forschung ausnahmslos bessere Ergebnisse.',
      'Vielfalt in Teams kann anfangs zu mehr Konflikten führen.',
      'Das Verhalten von Führungskräften hat keinen Einfluss auf die Wirkung von Vielfalt.',
      'Vielfalt führt nach den Studien grundsätzlich zu schlechteren Entscheidungen.'],
    1,
    'B steht im ersten Absatz. A widerspricht dem gemischten Bild und dem letzten Satz. C widerspricht der Bedeutung der Führungskräfte. D widerspricht den möglichen Vorteilen.'],

  ['Verwaltungsdigitalisierung',
    'Die Union hat sich das Ziel gesetzt, dass bis 2030 alle wesentlichen öffentlichen Dienstleistungen online verfügbar sind. Der Stand der Digitalisierung unterscheidet sich zwischen den Mitgliedstaaten jedoch erheblich. Estland und Dänemark gelten als Vorreiter, andere Staaten liegen deutlich zurück.\n\nEin wichtiger Grundsatz ist „once only“: Bürger und Unternehmen sollen Daten, die einer Behörde bereits vorliegen, nicht erneut angeben müssen. Seine Umsetzung setzt voraus, dass Behörden untereinander Daten austauschen können, was technische Standards und klare datenschutzrechtliche Grundlagen erfordert. Fachleute betonen zudem, dass die bloße Übertragung bestehender Papierverfahren ins Internet wenig Nutzen bringe, wenn die Abläufe nicht zugleich vereinfacht würden.',
    'f',
    ['Estland gilt als Vorreiter bei der Digitalisierung der Verwaltung.',
      'Nach dem Grundsatz „once only“ sollen Bürger bereits vorliegende Daten nicht erneut angeben müssen.',
      'Nach Einschätzung von Fachleuten reicht es aus, bestehende Papierformulare unverändert online anzubieten.',
      'Die Umsetzung von „once only“ erfordert den Datenaustausch zwischen Behörden.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Fachleute betonen, dass die bloße Übertragung ohne Vereinfachung wenig Nutzen bringt. A, B und D stehen so im Text.'],

  ['Risikomanagement',
    'Organisationen, die Risiken systematisch steuern wollen, bewerten diese üblicherweise nach zwei Dimensionen: der Wahrscheinlichkeit, dass ein Ereignis eintritt, und dem Ausmaß des Schadens, falls es eintritt. Ein Ereignis mit geringer Wahrscheinlichkeit, aber sehr großem Schaden kann daher ebenso viel Aufmerksamkeit erfordern wie ein häufiges Ereignis mit geringem Schaden.\n\nProblematisch sind Ereignisse, deren Wahrscheinlichkeit sich kaum abschätzen lässt, weil es wenig Erfahrungswerte gibt. In solchen Fällen empfehlen Fachleute, weniger auf genaue Vorhersagen zu setzen als auf die Widerstandsfähigkeit der Organisation, etwa durch Reserven, alternative Lieferanten oder Notfallpläne, die für verschiedene Szenarien nutzbar sind.',
    'a',
    ['Seltene Ereignisse können im Risikomanagement vernachlässigt werden.',
      'Wenn sich die Wahrscheinlichkeit eines Risikos kaum abschätzen lässt, kann der Aufbau von Reserven sinnvoller sein als der Versuch einer genauen Prognose.',
      'Risiken werden ausschließlich nach ihrer Eintrittswahrscheinlichkeit bewertet.',
      'Notfallpläne sollten nur für ein einziges, besonders wahrscheinliches Szenario erstellt werden.'],
    1,
    'B folgt aus der Empfehlung im zweiten Absatz. A widerspricht dem Beispiel seltener Ereignisse mit großem Schaden. C widerspricht den zwei Dimensionen. D widerspricht den Plänen für verschiedene Szenarien.'],

  ['Bürgerbeteiligung',
    'Neben Wahlen setzen Staaten und die Union zunehmend auf weitere Formen der Bürgerbeteiligung. Bei der Konferenz zur Zukunft Europas diskutierten per Losverfahren ausgewählte Bürgerinnen und Bürger aus allen Mitgliedstaaten über die Zukunft der Union und erarbeiteten Empfehlungen. Die Kommission hat seitdem Bürgerforen zu einzelnen Gesetzesvorhaben eingerichtet.\n\nDas Losverfahren soll sicherstellen, dass nicht nur ohnehin politisch aktive Menschen teilnehmen. Die Empfehlungen der Foren sind jedoch nicht bindend. Kritiker befürchten, dass solche Formate bei den Teilnehmenden Erwartungen wecken, die enttäuscht werden, wenn ihre Empfehlungen nicht umgesetzt werden. Befürworter sehen darin eine sinnvolle Ergänzung der repräsentativen Demokratie, nicht deren Ersatz.',
    'r',
    ['Die Teilnehmenden der Bürgerforen werden von den Parteien bestimmt.',
      'Die Empfehlungen der Bürgerforen muss die Kommission umsetzen.',
      'Durch das Losverfahren sollen auch Menschen teilnehmen, die sich sonst nicht politisch engagieren.',
      'Befürworter wollen die repräsentative Demokratie durch Bürgerforen ersetzen.'],
    2,
    'C gibt den Zweck des Losverfahrens wieder. A widerspricht dem Losverfahren. B widerspricht der fehlenden Bindungswirkung. D widerspricht der Sicht der Befürworter als Ergänzung.'],

  ['Wissensmanagement',
    'Wenn erfahrene Beschäftigte in den Ruhestand gehen, verlässt oft auch wertvolles Wissen die Organisation. Ein Teil dieses Wissens ist dokumentiert, etwa in Vorschriften und Handbüchern. Ein großer Teil ist jedoch implizit: Es handelt sich um Erfahrungswissen, etwa darüber, wie Abläufe tatsächlich funktionieren oder an wen man sich bei Problemen wendet, das sich nur schwer aufschreiben lässt.\n\nAls wirksam gelten deshalb Maßnahmen, die den direkten Austausch fördern, etwa überlappende Einarbeitungszeiten, Tandems aus erfahrenen und neuen Beschäftigten oder Mentoring. Da viele öffentliche Verwaltungen in den kommenden Jahren einen hohen Anteil ihrer Beschäftigten altersbedingt verlieren werden, gewinnt das Thema an Bedeutung.',
    'a',
    ['Das gesamte Wissen erfahrener Beschäftigter lässt sich in Handbüchern festhalten.',
      'Eine Einarbeitung, bei der Nachfolger und Vorgänger eine Zeit lang gemeinsam arbeiten, kann den Verlust impliziten Wissens verringern.',
      'Implizites Wissen spielt in öffentlichen Verwaltungen keine Rolle.',
      'Die Zahl der altersbedingten Abgänge in öffentlichen Verwaltungen wird in den kommenden Jahren sinken.'],
    1,
    'B folgt aus der Empfehlung überlappender Einarbeitungszeiten. A widerspricht der Schwierigkeit, implizites Wissen aufzuschreiben. C widerspricht dem ersten Absatz. D widerspricht dem erwarteten hohen Anteil von Abgängen.'],

  ['Verhaltensökonomische Politik',
    'Sogenannte Nudges sind Maßnahmen, die Entscheidungen von Menschen in eine bestimmte Richtung lenken sollen, ohne Wahlmöglichkeiten einzuschränken oder finanzielle Anreize wesentlich zu verändern. Ein bekanntes Beispiel sind Voreinstellungen: Werden Beschäftigte automatisch in eine betriebliche Altersvorsorge aufgenommen und müssen aktiv widersprechen, wenn sie nicht teilnehmen wollen, steigt die Teilnahme deutlich im Vergleich zu einem System, in dem sie sich aktiv anmelden müssen.\n\nKritiker werfen Nudges vor, Menschen zu bevormunden und ihre Entscheidungsschwächen auszunutzen. Befürworter entgegnen, dass es ohnehin immer eine Voreinstellung gebe und diese daher bewusst gestaltet werden sollte. Neuere Auswertungen deuten darauf hin, dass die durchschnittliche Wirkung vieler Nudges kleiner ist als in frühen Studien berichtet.',
    'r',
    ['Nudges schränken die Wahlmöglichkeiten der Menschen erheblich ein.',
      'Eine automatische Aufnahme in die Altersvorsorge mit Widerspruchsmöglichkeit führt zu einer höheren Teilnahme als ein System mit aktiver Anmeldung.',
      'Neuere Auswertungen zeigen, dass Nudges stärker wirken als ursprünglich angenommen.',
      'Befürworter von Nudges bestreiten, dass es immer eine Voreinstellung gibt.'],
    1,
    'B steht so im ersten Absatz. A widerspricht der Definition. C kehrt die neueren Befunde um. D verkehrt das Argument der Befürworter ins Gegenteil.'],

  ['Krisenkommunikation',
    'In Krisen wie Pandemien oder Naturkatastrophen müssen Behörden oft Entscheidungen treffen und kommunizieren, bevor alle Fakten bekannt sind. Fachleute für Krisenkommunikation empfehlen, Unsicherheiten offen zu benennen, statt eine Sicherheit vorzutäuschen, die nicht besteht. Wer später Aussagen revidieren muss, die zuvor als sicher dargestellt wurden, verliert eher an Glaubwürdigkeit als jemand, der von Anfang an auf mögliche Änderungen hingewiesen hat.\n\nZugleich sollten Botschaften klar und handlungsorientiert sein: Menschen wollen wissen, was sie konkret tun sollen. Widersprüchliche Aussagen verschiedener Behörden gelten als besonders schädlich für das Vertrauen.',
    'h',
    ['Behörden sollten in Krisen erst kommunizieren, wenn alle Fakten gesichert sind.',
      'Gute Krisenkommunikation benennt Unsicherheiten offen, gibt dennoch klare Handlungsempfehlungen und vermeidet Widersprüche.',
      'Behörden sollten Sicherheit ausstrahlen, auch wenn die Faktenlage unklar ist.',
      'Widersprüchliche Aussagen verschiedener Behörden stärken das Vertrauen der Bevölkerung.'],
    1,
    'B fasst die drei Empfehlungen zusammen. A widerspricht der Notwendigkeit, vor Klärung aller Fakten zu kommunizieren. C widerspricht der Empfehlung, keine Sicherheit vorzutäuschen. D kehrt die Wirkung widersprüchlicher Aussagen um.'],

  ['Mehrsprachige Rechtsetzung',
    'Rechtsakte der Union werden in der Regel zunächst in einer Arbeitssprache, meist Englisch, entworfen und anschließend in alle Amtssprachen übersetzt. Rechts- und Sprachsachverständige prüfen die Fassungen, um sicherzustellen, dass sie inhaltlich übereinstimmen. Da alle Sprachfassungen gleichermaßen verbindlich sind, gibt es rechtlich kein „Original“.\n\nDennoch kommt es vor, dass Sprachfassungen voneinander abweichen, etwa weil ein Begriff in einer Sprache mehrdeutig ist oder in einer anderen Rechtsordnung eine besondere Bedeutung hat. Die Rechtsetzung der Union verwendet daher, wo möglich, eigenständige Begriffe, die unabhängig von nationalen Rechtsbegriffen auszulegen sind.',
    'f',
    ['Rechtsakte der Union werden meist zunächst auf Englisch entworfen.',
      'Die englische Fassung eines Rechtsakts ist rechtlich das maßgebliche Original.',
      'Sprachfassungen können trotz Prüfung voneinander abweichen.',
      'Die Union verwendet, wo möglich, eigenständige Begriffe, die unabhängig von nationalen Rechtsbegriffen ausgelegt werden.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Alle Sprachfassungen sind gleichermaßen verbindlich, es gibt kein rechtliches Original. A, C und D stehen so im Text.'],

  ['Zeitmanagement',
    'Ratgeber zum Zeitmanagement empfehlen häufig, Aufgaben nach Dringlichkeit und Wichtigkeit zu ordnen. Dringende Aufgaben verlangen sofortige Aufmerksamkeit, sind aber nicht immer wichtig; wichtige Aufgaben tragen zu langfristigen Zielen bei, sind aber oft nicht dringend. Nach diesem Ansatz sollten wichtige, nicht dringende Aufgaben bewusst eingeplant werden, weil sie sonst von dringenden, aber weniger wichtigen Aufgaben verdrängt werden.\n\nStudien deuten darauf hin, dass Menschen dazu neigen, dringende Aufgaben mit festen Fristen zu bevorzugen, selbst wenn andere Aufgaben einen größeren Nutzen bringen würden. Dieser Effekt trat auch auf, wenn die Versuchspersonen den Nutzen der Aufgaben kannten.',
    'a',
    ['Dringende Aufgaben sind immer auch wichtig.',
      'Das Wissen um den größeren Nutzen einer Aufgabe reicht nicht unbedingt aus, damit Menschen sie einer dringenden Aufgabe vorziehen.',
      'Wichtige Aufgaben erledigen sich in der Regel von selbst, ohne dass man sie einplant.',
      'Menschen bevorzugen nach den Studien Aufgaben ohne Fristen.'],
    1,
    'B folgt daraus, dass der Effekt auch bei bekanntem Nutzen auftrat. A widerspricht der Unterscheidung von Dringlichkeit und Wichtigkeit. C widerspricht der Empfehlung, wichtige Aufgaben einzuplanen. D kehrt den Befund um.'],
]);

EPSO_VERBAL_ADD('l', [
  ['Förderbedingungen',
    'Ein Forschungsprogramm fördert Projekte nur, wenn an ihnen Einrichtungen aus mindestens drei verschiedenen Mitgliedstaaten beteiligt sind. Die Erfüllung dieser Bedingung garantiert jedoch keine Förderung: Alle förderfähigen Anträge werden von unabhängigen Gutachtern bewertet, und nur die am besten bewerteten Anträge erhalten Mittel, bis das Budget ausgeschöpft ist.\n\nIn der jüngsten Ausschreibung erhielten rund 15 Prozent der förderfähigen Anträge eine Förderung. Anträge, an denen Einrichtungen aus Mitgliedstaaten mit geringer Forschungsbeteiligung mitwirken, erhalten bei gleicher Bewertung Vorrang.',
    'a',
    ['Ein Projekt mit Partnern aus drei Mitgliedstaaten wird gefördert.',
      'Ein Projekt mit Partnern aus nur zwei Mitgliedstaaten kann nicht gefördert werden.',
      'Anträge mit Partnern aus Mitgliedstaaten mit geringer Forschungsbeteiligung werden unabhängig von ihrer Bewertung gefördert.',
      'Rund 15 Prozent aller eingereichten Anträge wurden gefördert.'],
    1,
    'B folgt, weil drei Mitgliedstaaten eine notwendige Bedingung sind. A verwechselt eine notwendige mit einer hinreichenden Bedingung. C übersieht die Einschränkung „bei gleicher Bewertung“. D ist nicht belegt, die 15 Prozent beziehen sich auf die förderfähigen, nicht auf alle eingereichten Anträge.'],

  ['Korrelation und Ursache',
    'Eine Studie ergab, dass Städte mit mehr Radwegen im Durchschnitt einen höheren Anteil an Radfahrenden aufweisen. Daraus wird häufig geschlossen, dass der Bau von Radwegen den Radverkehr erhöht. Die Studie selbst betont jedoch, dass der Zusammenhang auch umgekehrt bestehen könnte: Städte, in denen ohnehin viele Menschen Rad fahren, könnten eher Radwege bauen, weil der politische Druck größer ist.\n\nUm die Wirkung neuer Radwege zu prüfen, untersuchten die Forschenden zusätzlich Städte vor und nach dem Bau neuer Radwege. Dort stieg der Radverkehr nach dem Bau im Durchschnitt an, allerdings unterschiedlich stark.',
    'r',
    ['Der Querschnittsvergleich zwischen Städten beweist, dass Radwege den Radverkehr erhöhen.',
      'Die Vorher-nachher-Untersuchung liefert Hinweise darauf, dass neue Radwege den Radverkehr erhöhen können.',
      'In allen untersuchten Städten stieg der Radverkehr nach dem Bau neuer Radwege gleich stark.',
      'Die Studie schließt aus, dass Städte mit viel Radverkehr eher Radwege bauen.'],

  ['Beschäftigungsquoten',
    'In einem Mitgliedstaat stieg die Zahl der Erwerbstätigen innerhalb eines Jahres um zwei Prozent. Im selben Zeitraum wuchs die Bevölkerung im erwerbsfähigen Alter um drei Prozent, vor allem durch Zuwanderung. Die Arbeitslosenquote blieb nahezu unverändert, weil viele der neu Hinzugekommenen dem Arbeitsmarkt noch nicht zur Verfügung standen, etwa weil sie Sprachkurse besuchten.\n\nDie Regierung verwies auf den Anstieg der Erwerbstätigenzahl als Erfolg ihrer Arbeitsmarktpolitik. Die Opposition kritisierte, die Erwerbstätigenquote, also der Anteil der Erwerbstätigen an der Bevölkerung im erwerbsfähigen Alter, sei gesunken.',
    'a',
    ['Die Aussage der Opposition über die Erwerbstätigenquote steht im Widerspruch zu den genannten Zahlen.',
      'Die Arbeitslosenquote ist deutlich gestiegen.',
      'Sowohl die Aussage der Regierung über die Zahl der Erwerbstätigen als auch die der Opposition über die Quote können zutreffen.',
      'Der Anstieg der Erwerbstätigenzahl ist nachweislich auf die Arbeitsmarktpolitik der Regierung zurückzuführen.'],
    2,

  ['Ausnahmeregelungen',
    'Eine Verordnung verpflichtet alle Unternehmen mit mehr als 250 Beschäftigten, jährlich einen Bericht über ihre Energieverbräuche zu veröffentlichen. Unternehmen, die ein zertifiziertes Energiemanagementsystem eingeführt haben, sind von dieser Pflicht befreit, sofern sie die Zertifizierung der zuständigen Behörde nachweisen.\n\nUnternehmen mit 250 oder weniger Beschäftigten können freiwillig berichten. Die Behörde hat angekündigt, die Schwelle in einigen Jahren zu überprüfen.',
    'a',
    ['Ein Unternehmen mit 300 Beschäftigten muss in jedem Fall einen Bericht veröffentlichen.',
      'Ein Unternehmen mit 200 Beschäftigten darf keinen Bericht veröffentlichen.',
      'Ein Unternehmen mit 400 Beschäftigten und nachgewiesenem zertifiziertem Energiemanagementsystem muss keinen Bericht veröffentlichen.',
      'Ein Unternehmen mit genau 250 Beschäftigten ist zur Berichterstattung verpflichtet.'],
    2,
    'C folgt aus der Befreiung bei nachgewiesener Zertifizierung. A übersieht diese Ausnahme („in jedem Fall“). B widerspricht der freiwilligen Berichterstattung. D ist falsch, die Pflicht gilt erst für „mehr als 250“ Beschäftigte.'],

  ['Umfrageergebnisse',
    'In einer Umfrage gaben 60 Prozent der Befragten an, die Einführung eines neuen Verkehrskonzepts zu befürworten. Unter den Befragten, die in der Innenstadt wohnen, lag die Zustimmung bei 75 Prozent, unter denen aus den Außenbezirken bei 50 Prozent.\n\nDie Stadtverwaltung wertete das Ergebnis als klare Unterstützung. Ein Verkehrsverband wies darauf hin, dass die Pendler, die täglich aus dem Umland in die Stadt fahren und besonders betroffen wären, nicht befragt worden seien, da die Umfrage sich ausschließlich an Einwohnerinnen und Einwohner der Stadt richtete.',
    'r',
    ['In den Außenbezirken lehnte eine Mehrheit der Befragten das Konzept ab.',
      'Die Pendler aus dem Umland befürworten das Konzept mehrheitlich.',
      'Die Zustimmung in der Innenstadt war um 25 Prozent höher als in den Außenbezirken.',
      'Mehr als die Hälfte der befragten Stadtbewohner befürwortete das Konzept.'],
    3,
    'D folgt aus der Zustimmung von 60 Prozent. A ist falsch: Bei 50 Prozent Zustimmung können höchstens 50 Prozent ablehnen, also keine Mehrheit. B lässt sich nicht beurteilen, weil die Pendler nicht befragt wurden. C ist falsch, der Unterschied beträgt 25 Prozentpunkte, relativ sind es 50 Prozent.'],

  ['Wirksamkeit eines Medikaments',
    'In einer Studie wurde ein neues Medikament gegen Migräne an 1 000 Patienten getestet. Die Hälfte erhielt das Medikament, die andere Hälfte ein Placebo. In der Medikamentengruppe verringerte sich die Zahl der Migränetage bei 60 Prozent der Patienten deutlich, in der Placebogruppe bei 35 Prozent.\n\nDie Herstellerfirma warb damit, dass das Medikament bei 60 Prozent der Patienten wirke. Unabhängige Fachleute kritisierten diese Darstellung, da ein Teil der Verbesserung auch ohne Wirkstoff eingetreten wäre. Zudem wurde die Studie nur über drei Monate durchgeführt, sodass die Langzeitwirkung unbekannt ist.',
    'a',
    ['Das Medikament ist bei 60 Prozent aller Migränepatienten wirksam.',
      'Der Anteil der Patienten, bei denen die Verbesserung auf den Wirkstoff zurückgeht, dürfte kleiner sein als 60 Prozent.',
      'Das Placebo hatte keinerlei Wirkung.',
      'Die Studie belegt die Wirksamkeit des Medikaments über mehrere Jahre.'],
    1,
    'B folgt aus dem Vergleich mit der Placebogruppe, in der sich 35 Prozent auch ohne Wirkstoff verbesserten. A übernimmt die kritisierte Werbeaussage. C widerspricht den 35 Prozent in der Placebogruppe. D widerspricht der Studiendauer von drei Monaten.'],

  ['Einschränkende Formulierungen',
    'Die meisten Mitgliedstaaten haben die neue Richtlinie fristgerecht umgesetzt. Von den Staaten, die die Frist versäumt haben, hat die Kommission bisher gegen einige, aber nicht gegen alle, ein Vertragsverletzungsverfahren eingeleitet. Gegen Staaten, die ihre Umsetzungsmaßnahmen kurz nach Fristablauf mitgeteilt haben, sieht die Kommission in der Regel von einem Verfahren ab.\n\nDie Kommission hat außerdem angekündigt, bei allen Staaten zu prüfen, ob die mitgeteilten Maßnahmen die Richtlinie vollständig und korrekt umsetzen. Frühere Erfahrungen zeigen, dass bei solchen Prüfungen häufig Mängel festgestellt werden.',
    'r',
    ['Gegen alle Staaten, die die Frist versäumt haben, läuft ein Vertragsverletzungsverfahren.',
      'Ein Staat, der seine Umsetzungsmaßnahmen fristgerecht mitgeteilt hat, hat die Richtlinie in jedem Fall korrekt umgesetzt.',
      'Einige Staaten, die die Frist versäumt haben, sind bisher von einem Vertragsverletzungsverfahren verschont geblieben.',
      'Die Mehrheit der Mitgliedstaaten hat die Umsetzungsfrist versäumt.'],
    2,
    'C folgt aus „gegen einige, aber nicht gegen alle“. A widerspricht dieser Formulierung. B übersieht die angekündigte Prüfung der Vollständigkeit und Korrektheit. D widerspricht dem ersten Satz.'],

  ['Durchschnitt und Median',
    'Das durchschnittliche Nettovermögen der Haushalte in einem Mitgliedstaat ist in den vergangenen zehn Jahren deutlich gestiegen. Der Median, also der Wert, der die Haushalte in zwei gleich große Hälften teilt, stieg dagegen nur geringfügig.\n\nÖkonomen führen dies darauf zurück, dass der Anstieg vor allem auf Wertsteigerungen bei Aktien und Immobilien beruhte, die überwiegend von vermögenden Haushalten gehalten werden. Die Regierung verweist auf den gestiegenen Durchschnitt, um eine positive Entwicklung des Wohlstands zu belegen.',
    'a',
    ['Das Vermögen der meisten Haushalte ist deutlich gestiegen.',
      'Der Vermögenszuwachs verteilte sich gleichmäßig auf alle Haushalte.',
      'Der gestiegene Durchschnitt allein lässt nicht darauf schließen, dass ein typischer Haushalt deutlich vermögender geworden ist.',
      'Der Median ist stärker gestiegen als der Durchschnitt.'],
    2,
    'C ergibt sich daraus, dass der Median, also der typische Haushalt, nur geringfügig stieg. A widerspricht diesem Befund. B widerspricht der Konzentration der Zuwächse bei vermögenden Haushalten. D kehrt das Verhältnis um.'],

  ['Bedingte Genehmigung',
    'Ein neuer Windpark darf nur errichtet werden, wenn eine Umweltverträglichkeitsprüfung durchgeführt wurde. Ergibt die Prüfung erhebliche Auswirkungen auf geschützte Vogelarten, kann die Genehmigung nur erteilt werden, wenn Ausgleichsmaßnahmen festgelegt werden, etwa Abschaltzeiten während des Vogelzugs.\n\nIn Gebieten, die als sogenannte Beschleunigungsgebiete ausgewiesen sind, entfällt die Umweltverträglichkeitsprüfung für einzelne Projekte, da die Umweltauswirkungen bereits bei der Ausweisung des Gebiets geprüft wurden. Auch dort müssen jedoch geeignete Minderungsmaßnahmen ergriffen werden.',
    'r',
    ['In einem Beschleunigungsgebiet muss für jeden Windpark eine eigene Umweltverträglichkeitsprüfung durchgeführt werden.',
      'Ein Windpark außerhalb eines Beschleunigungsgebiets kann ohne Umweltverträglichkeitsprüfung genehmigt werden.',
      'Ergibt die Prüfung erhebliche Auswirkungen auf geschützte Vögel, ist eine Genehmigung ausgeschlossen.',
      'Auch in Beschleunigungsgebieten sind Minderungsmaßnahmen erforderlich.'],
    3,
    'D steht so im Text. A widerspricht dem Wegfall der Einzelprüfung. B widerspricht der Pflicht zur Prüfung außerhalb solcher Gebiete. C übersieht die Genehmigung mit Ausgleichsmaßnahmen.'],

  ['Rangfolgen',
    'In einem Vergleich der Innovationskraft der Mitgliedstaaten belegte Schweden erneut den ersten Platz, gefolgt von Dänemark und Finnland. Die Niederlande verbesserten sich um zwei Plätze und liegen nun auf Rang vier. Deutschland fiel um einen Platz zurück, liegt aber weiterhin unter den zehn besten Staaten.\n\nDie Autoren betonen, dass die Unterschiede zwischen den Staaten auf den mittleren Rängen sehr gering sind, sodass bereits kleine Veränderungen in einzelnen Indikatoren zu deutlichen Verschiebungen in der Rangfolge führen können. Aus einem Rangverlust lasse sich daher nicht zwingend auf eine absolute Verschlechterung schließen.',
    'a',
    ['Die Innovationskraft Deutschlands hat sich absolut verschlechtert.',
      'Die Niederlande lagen im vorherigen Vergleich auf Rang zwei.',
      'Schweden hat im Vergleich zum Vorjahr einen Platz gewonnen.',
      'Finnland liegt vor den Niederlanden und hinter Dänemark.'],
    3,
    'D ist richtig: Dänemark ist Zweiter, Finnland Dritter, die Niederlande Vierte. A widerspricht dem Hinweis der Autoren, dass ein Rangverlust keine absolute Verschlechterung beweist. B ist falsch, eine Verbesserung um zwei Plätze auf Rang vier bedeutet vorher Rang sechs. C widerspricht dem „erneut“ ersten Platz.'],

  ['Pilotprojekte',
    'Eine Stadt führte in drei Stadtteilen probeweise eine kostenlose Nutzung des öffentlichen Nahverkehrs ein. In allen drei Stadtteilen stieg die Zahl der Fahrgäste deutlich. Der Autoverkehr ging jedoch nur in einem der drei Stadtteile messbar zurück; in den beiden anderen stammten die zusätzlichen Fahrgäste überwiegend aus Personen, die zuvor zu Fuß gegangen oder Rad gefahren waren.\n\nDie Stadtverwaltung prüft nun, ob sie das Angebot auf die gesamte Stadt ausweitet. Die Kosten wären erheblich, da die Einnahmen aus Fahrkarten entfielen.',
    'r',
    ['Das Pilotprojekt hat in allen drei Stadtteilen zu weniger Autoverkehr geführt.',
      'Ein Anstieg der Fahrgastzahlen bedeutet nicht zwangsläufig, dass weniger Auto gefahren wird.',
      'Die Ausweitung auf die gesamte Stadt wurde bereits beschlossen.',
      'Die zusätzlichen Fahrgäste waren zuvor überwiegend Autofahrer.'],
    1,
    'B ergibt sich daraus, dass in zwei Stadtteilen die Fahrgastzahlen stiegen, der Autoverkehr aber nicht sank. A widerspricht dem Befund. C widerspricht der laufenden Prüfung. D widerspricht der Herkunft der zusätzlichen Fahrgäste in zwei Stadtteilen.'],

  ['Mindestens und höchstens',
    'Nach einer neuen Regelung müssen mindestens 30 Prozent der Mitglieder eines Beirats aus der Wissenschaft stammen und höchstens 40 Prozent aus der Wirtschaft. Die übrigen Sitze gehen an Vertreterinnen und Vertreter der Zivilgesellschaft. Der Beirat hat 20 Mitglieder.\n\nBei der ersten Besetzung wurden sechs Mitglieder aus der Wissenschaft und acht aus der Wirtschaft ernannt. Einige Organisationen der Zivilgesellschaft hatten mehr Sitze gefordert.',
    'a',
    ['Bei der ersten Besetzung erhielt die Zivilgesellschaft sechs Sitze.',

  ['Zeitliche Abfolge',

  ['Kosten und Nutzen',

  ['Doppelte Verneinung',

  ['Teilmengen',
    'Alle Bewerberinnen und Bewerber, die die erste Testphase bestehen, werden zur zweiten Testphase eingeladen. Nicht alle, die zur zweiten Phase eingeladen werden, nehmen jedoch tatsächlich teil. Von denjenigen, die an der zweiten Phase teilnehmen, werden nur die mit den höchsten Gesamtpunktzahlen in die Reserveliste aufgenommen.\n\nIm letzten Verfahren nahmen rund 90 Prozent der Eingeladenen an der zweiten Phase teil. Die Reserveliste umfasste etwa ein Fünftel der Teilnehmenden der zweiten Phase.',

  ['Wachstumsraten',

  ['Alle, einige, keine',
