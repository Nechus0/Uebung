  ['Frühkindliche Bildung',
    'Zahlreiche Studien zeigen, dass eine hochwertige frühkindliche Bildung und Betreuung sich positiv auf die spätere Entwicklung von Kindern auswirken kann, insbesondere bei Kindern aus benachteiligten Familien. Entscheidend ist dabei nach übereinstimmender Einschätzung die Qualität der Einrichtungen, etwa die Qualifikation des Personals und der Betreuungsschlüssel, nicht allein die Dauer der Betreuung.\n\nDie Union hat das Ziel festgelegt, dass mindestens 96 Prozent der Kinder zwischen drei Jahren und dem Beginn der Schulpflicht an frühkindlicher Bildung teilnehmen. Für Kinder unter drei Jahren soll die Beteiligung auf mindestens 45 Prozent steigen. Die Beteiligungsquoten unterscheiden sich zwischen den Mitgliedstaaten erheblich, ebenso wie die Kosten für die Eltern.',
    'a',
    ['Eine lange Betreuungsdauer führt unabhängig von der Qualität zu besseren Entwicklungsergebnissen.',
      'Kinder aus benachteiligten Familien können von hochwertiger frühkindlicher Bildung besonders profitieren.',
      'Das Ziel für Kinder unter drei Jahren liegt bei 96 Prozent.',
      'Die Kosten für frühkindliche Betreuung sind in allen Mitgliedstaaten gleich.'],
    1,
    'B entspricht dem ersten Satz. A widerspricht der Bedeutung der Qualität. C verwechselt die Zielwerte, für unter Dreijährige gelten 45 Prozent. D widerspricht den erheblichen Unterschieden.'],

  ['Schulabbruch',
    'Als frühe Schulabgänger gelten in der Statistik der Union junge Menschen zwischen 18 und 24 Jahren, die höchstens einen Abschluss der Sekundarstufe I erreicht haben und sich nicht in Aus- oder Weiterbildung befinden. Ihr Anteil ist in den vergangenen zwei Jahrzehnten deutlich gesunken und lag zuletzt unter zehn Prozent. Das Ziel für 2030 liegt bei weniger als neun Prozent.\n\nJunge Männer sind häufiger betroffen als junge Frauen, ebenso junge Menschen mit Migrationshintergrund. Frühe Schulabgänger haben ein deutlich höheres Risiko, arbeitslos zu werden oder in schlecht bezahlten Tätigkeiten zu arbeiten. Als wirksam gelten präventive Maßnahmen, die schon vor dem Abbruch ansetzen, etwa eine frühzeitige Förderung leistungsschwacher Schülerinnen und Schüler.',
    'r',
    ['Eine 22-Jährige mit Abschluss der Sekundarstufe I, die eine Berufsausbildung absolviert, gilt als frühe Schulabgängerin.',
      'Der Anteil der frühen Schulabgänger ist in den vergangenen zwanzig Jahren gestiegen.',
      'Junge Frauen verlassen die Schule häufiger vorzeitig als junge Männer.',
      'Maßnahmen, die ansetzen, bevor ein Abbruch erfolgt, gelten als wirksam.'],
    3,
    'D steht im letzten Satz. A ist falsch, weil sich die Person in Ausbildung befindet und damit nicht unter die Definition fällt. B kehrt die Entwicklung um. C kehrt den Geschlechterunterschied um.'],

  ['Blaue Karte EU',
    'Die Blaue Karte EU ist ein Aufenthaltstitel für hochqualifizierte Fachkräfte aus Drittstaaten. Voraussetzung sind ein Arbeitsvertrag oder ein verbindliches Arbeitsplatzangebot über mindestens sechs Monate und ein Gehalt, das eine vom jeweiligen Mitgliedstaat festgelegte Schwelle erreicht. Seit der Reform von 2021 können in bestimmten IT-Berufen auch Berufserfahrung statt eines Hochschulabschlusses als Qualifikationsnachweis dienen.\n\nInhaber einer Blauen Karte können nach einer bestimmten Zeit leichter in einen anderen Mitgliedstaat wechseln und erhalten erleichterten Zugang zum Familiennachzug. Die Mitgliedstaaten dürfen parallel eigene nationale Aufenthaltstitel für Fachkräfte beibehalten. Dänemark und Irland beteiligen sich nicht an der Blauen Karte.',
    'f',
    ['Die Gehaltsschwelle für die Blaue Karte wird von den Mitgliedstaaten festgelegt.',
      'In bestimmten IT-Berufen kann Berufserfahrung einen Hochschulabschluss ersetzen.',
      'Neben der Blauen Karte dürfen keine nationalen Aufenthaltstitel für Fachkräfte bestehen.',
      'Irland beteiligt sich nicht an der Blauen Karte.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text: Die Mitgliedstaaten dürfen eigene nationale Titel beibehalten. A, B und D stehen so im Text.'],

  ['Integration auf dem Arbeitsmarkt',
    'Zugewanderte sind in den meisten Mitgliedstaaten seltener erwerbstätig als Einheimische. Die Unterschiede fallen jedoch je nach Herkunft, Zuwanderungsgrund und Aufenthaltsdauer sehr unterschiedlich aus. Geflüchtete haben in den ersten Jahren nach ihrer Ankunft besonders niedrige Beschäftigungsquoten, die sich mit zunehmender Aufenthaltsdauer allerdings deutlich erhöhen.\n\nAls Hindernisse gelten unter anderem fehlende Sprachkenntnisse, lange Asylverfahren, die fehlende Anerkennung von Abschlüssen und Diskriminierung bei der Stellensuche. Viele Zugewanderte arbeiten zudem unterhalb ihres Qualifikationsniveaus. Studien zeigen, dass ein früher Zugang zu Sprachkursen und zum Arbeitsmarkt die spätere Integration verbessert.',
    'a',
    ['Die Beschäftigungsquote von Geflüchteten bleibt dauerhaft auf dem Niveau der ersten Jahre.',
      'Die Tatsache, dass ein Zugewanderter erwerbstätig ist, bedeutet nicht zwingend, dass seine Qualifikationen angemessen genutzt werden.',
      'Alle Gruppen von Zugewanderten sind gleich häufig erwerbstätig.',
      'Ein späterer Zugang zu Sprachkursen verbessert die Integration.'],
    1,
    'B folgt daraus, dass viele Zugewanderte unterhalb ihres Qualifikationsniveaus arbeiten. A widerspricht dem Anstieg mit der Aufenthaltsdauer. C widerspricht den Unterschieden nach Herkunft und Zuwanderungsgrund. D kehrt den Befund zum frühen Zugang um.'],

  ['Vertrauen in Institutionen',
    'Regelmäßige Umfragen des Eurobarometers zeigen, dass das Vertrauen der Bürgerinnen und Bürger in die Europäische Union zwischen den Mitgliedstaaten stark variiert. In vielen Ländern ist das Vertrauen in die Union höher als das Vertrauen in die eigene nationale Regierung oder das nationale Parlament.\n\nForschende warnen jedoch davor, diese Werte zu überschätzen. Das Vertrauen in die Union könne teilweise auch Ausdruck von Misstrauen gegenüber nationalen Institutionen sein: Wer der eigenen Regierung wenig zutraue, sehe die Union unter Umständen als Gegengewicht. Zudem schwanken die Werte mit wirtschaftlichen Krisen; nach der Finanzkrise sank das Vertrauen in die Union in mehreren Staaten deutlich.',
    'r',
    ['In allen Mitgliedstaaten ist das Vertrauen in die Union höher als in die nationale Regierung.',
      'Ein hohes Vertrauen in die Union kann auch mit geringem Vertrauen in nationale Institutionen zusammenhängen.',
      'Das Vertrauen in die Union ist seit Jahrzehnten konstant.',
      'Nach der Finanzkrise stieg das Vertrauen in die Union in allen Staaten.'],
    1,
    'B entspricht der Erklärung der Forschenden. A verallgemeinert „in vielen Ländern“. C widerspricht den Schwankungen. D widerspricht dem Rückgang nach der Finanzkrise.'],

  ['Anerkennung von Berufsqualifikationen',
    'Die Richtlinie über die Anerkennung von Berufsqualifikationen erleichtert es Fachkräften, ihren Beruf in einem anderen Mitgliedstaat auszuüben. Für sieben Berufe, darunter Ärzte, Krankenpfleger, Zahnärzte, Hebammen, Apotheker, Tierärzte und Architekten, gilt eine automatische Anerkennung, weil die Mindestanforderungen an die Ausbildung unionsweit harmonisiert sind.\n\nFür andere reglementierte Berufe prüft der Aufnahmestaat die Qualifikation im Einzelfall. Bestehen wesentliche Unterschiede, kann er eine Anpassungsmaßnahme verlangen, etwa einen Anpassungslehrgang oder eine Eignungsprüfung. Für nicht reglementierte Berufe ist keine formelle Anerkennung erforderlich; hier entscheidet der Arbeitgeber, ob er die Qualifikation für ausreichend hält.',
    'a',
    ['Eine in Spanien ausgebildete Hebamme muss in Deutschland eine Eignungsprüfung ablegen.',
      'Für einen nicht reglementierten Beruf benötigt man in einem anderen Mitgliedstaat keine staatliche Anerkennung der Qualifikation.',
      'Für alle reglementierten Berufe gilt eine automatische Anerkennung.',
      'Ein Aufnahmestaat kann bei Architekten grundsätzlich einen Anpassungslehrgang verlangen.'],
    1,
    'B folgt aus dem letzten Satz. A und D widersprechen der automatischen Anerkennung für Hebammen und Architekten. C ist falsch, die automatische Anerkennung gilt nur für sieben Berufe.'],

  ['Digitale Kompetenzen',
    'Nach Daten von Eurostat verfügt nur gut die Hälfte der Erwachsenen in der Union zumindest über grundlegende digitale Kompetenzen. Das Ziel der Union für 2030 liegt bei 80 Prozent. Die Unterschiede zwischen den Mitgliedstaaten sind groß, ebenso zwischen Altersgruppen und Bildungsniveaus.\n\nBemerkenswert ist, dass auch unter jungen Menschen ein beträchtlicher Teil nicht über grundlegende digitale Kompetenzen verfügt. Die häufige Nutzung von Smartphones und sozialen Netzwerken bedeutet nicht automatisch, dass jemand etwa Informationen kritisch bewerten, Tabellenkalkulationen nutzen oder sich vor Online-Betrug schützen kann. Fachleute fordern daher, digitale Kompetenzen systematischer in den Schulunterricht einzubeziehen.',
    'h',
    ['Junge Menschen verfügen durchweg über ausreichende digitale Kompetenzen.',
      'Viele Erwachsene, und auch viele junge Menschen, haben keine grundlegenden digitalen Kompetenzen, was eine gezieltere Förderung erforderlich macht.',
      'Das Ziel von 80 Prozent ist bereits erreicht.',
      'Wer regelmäßig soziale Netzwerke nutzt, kann Informationen kritisch bewerten.'],
    1,
    'B fasst Befund und Forderung zusammen. A widerspricht dem zweiten Absatz. C widerspricht dem Anteil von gut der Hälfte. D widerspricht dem Hinweis, dass häufige Nutzung nicht automatisch Kompetenz bedeutet.'],

  ['Ländliche Räume',
    'Viele ländliche Regionen in der Union verlieren seit Jahren Einwohner, insbesondere junge Menschen, die zur Ausbildung oder Arbeit in die Städte ziehen. Die Bevölkerung dort altert daher schneller. Zugleich schließen Schulen, Arztpraxen und Geschäfte, was die Regionen weniger attraktiv macht und die Abwanderung weiter verstärken kann.\n\nNicht alle ländlichen Räume sind jedoch gleichermaßen betroffen. Regionen in der Nähe großer Städte gewinnen teilweise Einwohner hinzu, weil Menschen dort günstiger wohnen und in die Stadt pendeln können. Die Möglichkeit, von zu Hause aus zu arbeiten, hat diesen Trend verstärkt. Voraussetzung ist allerdings ein leistungsfähiger Internetanschluss, der in vielen abgelegenen Gebieten noch fehlt.',
    'r',
    ['Alle ländlichen Regionen der Union verlieren Einwohner.',
      'Die Schließung von Schulen und Arztpraxen kann die Abwanderung aus ländlichen Regionen verstärken.',
      'Die Arbeit von zu Hause aus hat die Abwanderung aus stadtnahen ländlichen Regionen beschleunigt.',
      'Abgelegene ländliche Gebiete verfügen durchweg über leistungsfähige Internetanschlüsse.'],
    1,
    'B entspricht dem ersten Absatz. A widerspricht dem Zuzug in stadtnahe Regionen. C kehrt die Wirkung des Homeoffice um. D widerspricht dem fehlenden Internetanschluss in vielen abgelegenen Gebieten.'],

  ['PISA-Studie',
    'Die PISA-Studie der OECD misst alle drei Jahre die Kompetenzen 15-jähriger Schülerinnen und Schüler in Lesen, Mathematik und Naturwissenschaften. In der Erhebung von 2022 verschlechterten sich die Ergebnisse in vielen europäischen Ländern deutlich, vor allem in Mathematik. Ein Teil des Rückgangs wird auf die Schulschließungen während der Pandemie zurückgeführt; in einigen Ländern hatte der Abwärtstrend jedoch bereits vorher eingesetzt.\n\nDie Studie zeigt außerdem, dass der sozioökonomische Hintergrund in den meisten Ländern einen erheblichen Einfluss auf die Leistungen hat. In einigen Bildungssystemen ist dieser Zusammenhang allerdings deutlich schwächer als in anderen, was darauf hindeutet, dass Bildungspolitik ihn beeinflussen kann.',
    'a',
    ['Die Schulschließungen während der Pandemie erklären den gesamten Leistungsrückgang in allen Ländern.',
      'Der Einfluss des sozialen Hintergrunds auf die Schulleistungen ist in allen Ländern gleich stark.',
      'Unterschiede zwischen Bildungssystemen legen nahe, dass Politik den Zusammenhang zwischen Herkunft und Leistung abschwächen kann.',
      'Die PISA-Studie wird jährlich durchgeführt.'],
    2,
    'C gibt die Schlussfolgerung des Textes wieder. A widerspricht dem bereits vorher einsetzenden Trend. B widerspricht den Unterschieden zwischen den Systemen. D widerspricht dem Dreijahresrhythmus.'],

  ['Vorübergehender Schutz',
    'Nach dem russischen Angriff auf die Ukraine im Februar 2022 aktivierte die Union erstmals die Richtlinie über vorübergehenden Schutz. Sie war nach den Kriegen im ehemaligen Jugoslawien geschaffen, aber zuvor nie angewandt worden. Geflüchtete aus der Ukraine erhalten damit ohne individuelles Asylverfahren sofort einen Aufenthaltstitel, Zugang zum Arbeitsmarkt, zu Wohnraum, medizinischer Versorgung und Bildung.\n\nDer Schutz ist befristet und wurde mehrfach verlängert. Da Ukrainerinnen und Ukrainer visumfrei in die Union einreisen durften, konnten sie selbst wählen, in welchem Mitgliedstaat sie Schutz beantragen. Die meisten Schutzberechtigten wurden in Deutschland und Polen registriert, gemessen an der Einwohnerzahl nahmen jedoch einige kleinere Staaten wie Tschechien besonders viele auf.',
    'r',
    ['Die Richtlinie über vorübergehenden Schutz wurde bereits während der Jugoslawienkriege angewandt.',
      'Personen mit vorübergehendem Schutz müssen zunächst ein individuelles Asylverfahren durchlaufen.',
      'Gemessen an der Einwohnerzahl nahmen einige kleinere Staaten besonders viele Schutzberechtigte auf.',
      'Der vorübergehende Schutz ist unbefristet.'],
    2,
    'C steht im letzten Satz. A widerspricht der erstmaligen Aktivierung 2022. B widerspricht dem Schutz ohne individuelles Verfahren. D widerspricht der Befristung.'],

  ['Gleichbehandlung',
    'Das Unionsrecht verbietet Diskriminierung aufgrund der Rasse oder ethnischen Herkunft nicht nur in der Beschäftigung, sondern auch beim Zugang zu Gütern und Dienstleistungen, zu Bildung und zu sozialem Schutz. Für Diskriminierung aufgrund der Religion, einer Behinderung, des Alters oder der sexuellen Ausrichtung besteht ein unionsrechtlicher Schutz dagegen bislang im Wesentlichen nur im Bereich der Beschäftigung.\n\nEin Vorschlag der Kommission, den Schutz auf weitere Lebensbereiche auszudehnen, ist seit 2008 im Rat blockiert, weil er dort Einstimmigkeit erfordert. Viele Mitgliedstaaten gewähren jedoch nach nationalem Recht einen weitergehenden Schutz.',
    'a',
    ['Nach Unionsrecht ist die Verweigerung einer Wohnung wegen der ethnischen Herkunft des Mieters verboten.',
      'Das Unionsrecht schützt bereits heute umfassend vor Altersdiskriminierung beim Zugang zu Dienstleistungen.',
      'Der Vorschlag der Kommission von 2008 wurde inzwischen angenommen.',
      'Kein Mitgliedstaat geht beim Diskriminierungsschutz über das Unionsrecht hinaus.'],
    0,
    'A folgt daraus, dass Diskriminierung wegen der ethnischen Herkunft auch beim Zugang zu Gütern und Dienstleistungen verboten ist. B widerspricht der Beschränkung auf die Beschäftigung. C widerspricht der Blockade im Rat. D widerspricht dem weitergehenden nationalen Schutz.'],

  ['Lebenslanges Lernen',
    'Der technologische Wandel verändert die Anforderungen vieler Berufe in immer kürzeren Abständen. Es gilt daher als zunehmend unwahrscheinlich, dass die in Schule und Ausbildung erworbenen Kenntnisse für ein ganzes Berufsleben ausreichen. Dennoch nehmen in vielen Mitgliedstaaten nur vergleichsweise wenige Erwachsene regelmäßig an Weiterbildungen teil.\n\nAuffällig ist, dass gerade Beschäftigte mit geringer Qualifikation, deren Tätigkeiten besonders häufig von Automatisierung betroffen sind, am seltensten an Weiterbildung teilnehmen. Als Gründe werden unter anderem Zeitmangel, Kosten und fehlende Angebote durch Arbeitgeber genannt. Einige Mitgliedstaaten haben individuelle Weiterbildungskonten eingeführt, die Beschäftigten ein Budget für Kurse zur Verfügung stellen.',
    'r',
    ['Beschäftigte mit geringer Qualifikation nehmen am häufigsten an Weiterbildung teil.',
      'Die Weiterbildungsbeteiligung ist dort am geringsten, wo das Automatisierungsrisiko besonders hoch ist.',
      'Die in der Ausbildung erworbenen Kenntnisse reichen in der Regel für das gesamte Berufsleben aus.',
      'Alle Mitgliedstaaten haben individuelle Weiterbildungskonten eingeführt.'],
    1,
    'B fasst den zweiten Absatz zusammen: Geringqualifizierte sind am stärksten von Automatisierung betroffen und bilden sich am seltensten weiter. A kehrt den Befund um. C widerspricht dem ersten Absatz. D verallgemeinert „einige Mitgliedstaaten“.'],

  ['Wahlbeteiligung junger Menschen',
    'Junge Menschen beteiligen sich in vielen Mitgliedstaaten seltener an Wahlen als ältere. Daraus wird häufig geschlossen, sie seien politisch weniger interessiert. Umfragen zeigen jedoch, dass sich junge Menschen oft auf andere Weise politisch engagieren, etwa durch Demonstrationen, Petitionen, Konsumentscheidungen oder in sozialen Netzwerken.\n\nEinige Mitgliedstaaten haben das Wahlalter für bestimmte Wahlen auf 16 Jahre gesenkt. Bei der Europawahl 2024 durften in Belgien, Deutschland, Malta und Österreich bereits 16-Jährige wählen, in Griechenland 17-Jährige. Studien aus Österreich deuten darauf hin, dass Erstwählerinnen und -wähler mit 16 Jahren eher wählen gehen als solche, die erstmals mit 18 oder 19 Jahren wählen dürfen.',
    'f',
    ['Bei der Europawahl 2024 lag das Mindestwahlalter nicht in allen Mitgliedstaaten bei 18 Jahren.',
      'Junge Menschen engagieren sich nach Umfragen auch außerhalb von Wahlen politisch.',
      'Aus der geringeren Wahlbeteiligung junger Menschen lässt sich nach dem Text zuverlässig auf ein geringeres politisches Interesse schließen.',
      'In Österreich durften 16-Jährige an der Europawahl 2024 teilnehmen.'],
    2,
    'Gesucht ist die falsche Aussage. C widerspricht dem Text, der diesen Schluss mit dem Verweis auf andere Formen des Engagements gerade in Frage stellt. A, B und D stehen so im Text.'],

  ['Brain Drain',
    'Mehrere Mitgliedstaaten in Mittel-, Ost- und Südeuropa haben in den vergangenen zwei Jahrzehnten einen erheblichen Teil ihrer jungen, gut ausgebildeten Bevölkerung durch Abwanderung in wohlhabendere Mitgliedstaaten verloren. Dieser sogenannte Brain Drain kann in den Herkunftsländern zu Fachkräftemangel führen, etwa im Gesundheitswesen, und die öffentlichen Investitionen in Ausbildung gewissermaßen in andere Staaten verlagern.\n\nAndererseits überweisen viele Abgewanderte Geld an ihre Familien, und ein Teil kehrt mit neuen Kenntnissen und Kontakten zurück. Einige Herkunftsstaaten versuchen, Rückkehrer mit steuerlichen Anreizen zu gewinnen. Ob die Rückkehr in größerem Umfang gelingt, hängt nach Ansicht von Fachleuten vor allem von den Löhnen und den Karrierechancen im Herkunftsland ab.',
    'h',
    ['Die Abwanderung Hochqualifizierter hat für die Herkunftsländer ausschließlich Nachteile.',
      'Die Abwanderung gut Ausgebildeter belastet die Herkunftsstaaten, bringt aber auch gewisse Vorteile, und eine Rückkehr hängt vor allem von den wirtschaftlichen Perspektiven ab.',
      'Steuerliche Anreize allein reichen aus, um Abgewanderte zur Rückkehr zu bewegen.',
      'Brain Drain betrifft vor allem die wohlhabendsten Mitgliedstaaten.'],
    1,
    'B fasst Nachteile, Vorteile und die Bedingungen einer Rückkehr zusammen. A widerspricht den genannten Vorteilen. C widerspricht der Bedeutung von Löhnen und Karrierechancen. D kehrt die Richtung der Abwanderung um.'],

  ['Mehrsprachigkeitsziel',
    'Die Mitgliedstaaten der Union haben 2002 das Ziel formuliert, dass alle Bürgerinnen und Bürger neben ihrer Muttersprache zwei weitere Sprachen beherrschen sollen. Von diesem Ziel ist die Union weit entfernt: Nach Umfragen gibt etwa ein Drittel der Erwachsenen an, keine Fremdsprache zu sprechen.\n\nDie Unterschiede zwischen den Mitgliedstaaten sind groß. In kleineren Staaten und in Staaten mit mehreren Amtssprachen ist die Fremdsprachenkenntnis im Durchschnitt deutlich höher als in großen Staaten, deren Sprache international verbreitet ist. Englisch ist mit Abstand die am häufigsten gelernte Fremdsprache. Einige Fachleute befürchten, dass dies die Motivation zum Erlernen weiterer Sprachen verringern könnte.',
    'r',
    ['Das Ziel, dass alle Bürger zwei Fremdsprachen beherrschen, ist weitgehend erreicht.',
      'In großen Staaten mit international verbreiteter Sprache sind Fremdsprachenkenntnisse im Durchschnitt stärker verbreitet als in kleinen Staaten.',
      'Etwa ein Drittel der Erwachsenen gibt an, keine Fremdsprache zu sprechen.',
      'Französisch ist die am häufigsten gelernte Fremdsprache in der Union.'],
    2,
    'C steht im ersten Absatz. A widerspricht der großen Entfernung vom Ziel. B kehrt den Vergleich zwischen großen und kleinen Staaten um. D widerspricht der Stellung des Englischen.'],

  ['Kriminalstatistik',
    'Polizeiliche Kriminalstatistiken erfassen nur die Straftaten, die der Polizei bekannt werden. Viele Delikte, etwa Ladendiebstahl, häusliche Gewalt oder Betrug im Internet, werden jedoch häufig nicht angezeigt. Man spricht vom Dunkelfeld.\n\nEin Anstieg der registrierten Fälle muss daher nicht bedeuten, dass tatsächlich mehr Straftaten begangen wurden. Er kann auch darauf zurückgehen, dass Betroffene häufiger Anzeige erstatten, etwa aufgrund öffentlicher Sensibilisierung, oder dass die Polizei in einem Bereich gezielter kontrolliert. Um das Dunkelfeld abzuschätzen, werden ergänzend Opferbefragungen durchgeführt, bei denen Menschen gefragt werden, ob sie Opfer einer Straftat geworden sind.',
    'a',
    ['Ein Anstieg der registrierten Fälle häuslicher Gewalt beweist, dass häusliche Gewalt zugenommen hat.',
      'Verstärkte Kontrollen der Polizei in einem Bereich können die Zahl der registrierten Straftaten erhöhen, ohne dass mehr Straftaten begangen werden.',
      'Opferbefragungen erfassen ausschließlich angezeigte Straftaten.',
      'Die polizeiliche Kriminalstatistik bildet alle begangenen Straftaten vollständig ab.'],
    1,
    'B lässt sich aus dem zweiten Absatz ableiten. A widerspricht dem Hinweis, dass ein Anstieg auch auf mehr Anzeigen zurückgehen kann. C verkennt den Zweck der Opferbefragungen, das Dunkelfeld abzuschätzen. D widerspricht dem Dunkelfeld.'],

  ['Hochschulzugang',
    'Der Anteil der 25- bis 34-Jährigen mit Hochschulabschluss ist in der Union in den vergangenen Jahrzehnten stark gestiegen und liegt inzwischen über 40 Prozent. Das Ziel der Union für 2030 liegt bei mindestens 45 Prozent. In fast allen Mitgliedstaaten haben junge Frauen häufiger einen Hochschulabschluss als junge Männer.\n\nDer Anteil variiert jedoch stark zwischen den Mitgliedstaaten. Dabei ist zu berücksichtigen, dass die Bildungssysteme unterschiedlich aufgebaut sind: In Staaten mit einem ausgeprägten System der dualen Berufsausbildung werden manche Qualifikationen außerhalb der Hochschulen erworben, die in anderen Staaten ein Studium erfordern. Ein niedrigerer Akademikeranteil ist daher nicht zwingend ein Zeichen geringerer Qualifikation.',
    'r',
    ['Junge Männer haben in fast allen Mitgliedstaaten häufiger einen Hochschulabschluss als junge Frauen.',
      'Das Ziel von 45 Prozent ist bereits überschritten.',
      'Ein Staat mit dualer Berufsausbildung kann einen niedrigeren Akademikeranteil aufweisen, ohne dass seine Bevölkerung schlechter qualifiziert ist.',
      'Der Akademikeranteil ist in allen Mitgliedstaaten ähnlich hoch.'],
    2,
    'C folgt aus dem zweiten Absatz. A kehrt den Geschlechterunterschied um. B widerspricht dem Anteil von „über 40 Prozent“ bei einem Ziel von 45 Prozent. D widerspricht der starken Variation.'],

  ['Freiwilligenarbeit',
    'Das Europäische Solidaritätskorps bietet jungen Menschen zwischen 18 und 30 Jahren die Möglichkeit, sich in Freiwilligenprojekten im eigenen Land oder im Ausland zu engagieren, etwa im Umweltschutz, in der sozialen Arbeit oder im Katastrophenschutz. Für die humanitäre Hilfe außerhalb der Union liegt die Altersgrenze bei 35 Jahren.\n\nDie Teilnehmenden erhalten Unterkunft, Verpflegung, eine Versicherung und ein Taschengeld, jedoch kein Gehalt. Die Projekte sollen nicht dazu dienen, reguläre Arbeitsplätze zu ersetzen. Neben der persönlichen Entwicklung der Teilnehmenden soll das Programm den Zusammenhalt in der Gesellschaft stärken.',
    'f',
    ['Ein 33-Jähriger kann sich über das Solidaritätskorps an einem Projekt der humanitären Hilfe außerhalb der Union beteiligen.',
      'Freiwillige im Solidaritätskorps erhalten ein reguläres Gehalt.',
      'Projekte des Solidaritätskorps dürfen reguläre Arbeitsplätze nicht ersetzen.',
      'Freiwilligenprojekte können auch im eigenen Land stattfinden.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Die Teilnehmenden erhalten ein Taschengeld, aber kein Gehalt. A folgt aus der Altersgrenze von 35 Jahren. C und D stehen so im Text.'],

  ['Wohnungsnot in Universitätsstädten',
    'In vielen Universitätsstädten ist es für Studierende schwierig geworden, bezahlbaren Wohnraum zu finden. Die Zahl der Studierenden ist gestiegen, während der Bau von Wohnheimen nicht Schritt gehalten hat. Zudem konkurrieren Studierende auf dem privaten Wohnungsmarkt mit Berufstätigen und Touristen, da Wohnungen teilweise als Ferienunterkünfte vermietet werden.\n\nFür Studierende aus einkommensschwachen Familien kann dies die Wahl des Studienorts einschränken oder sie ganz vom Studium abhalten. Einige Städte haben den Bau von Wohnheimen gefördert oder die Vermietung an Touristen begrenzt. Auch Modelle, bei denen Studierende günstig bei älteren Menschen wohnen und ihnen im Gegenzug im Alltag helfen, werden erprobt.',
    'a',
    ['Die Wohnungsknappheit in Universitätsstädten betrifft alle Studierenden gleichermaßen.',
      'Hohe Mieten in Universitätsstädten können die soziale Zusammensetzung der Studierenden beeinflussen.',
      'Der Bau von Wohnheimen hat mit der steigenden Zahl der Studierenden Schritt gehalten.',
      'Die Vermietung an Touristen hat keinen Einfluss auf den Wohnungsmarkt für Studierende.'],
    1,
    'B folgt daraus, dass Studierende aus einkommensschwachen Familien vom Studium abgehalten werden können. A widerspricht der besonderen Betroffenheit einkommensschwacher Studierender. C und D widersprechen dem ersten Absatz.'],

  ['Unionsbürger und Sozialleistungen',
    'Nach der Freizügigkeitsrichtlinie haben Unionsbürgerinnen und -bürger das Recht, sich bis zu drei Monate ohne weitere Bedingungen in einem anderen Mitgliedstaat aufzuhalten. Für einen längeren Aufenthalt müssen sie Arbeitnehmer oder Selbstständige sein oder über ausreichende Existenzmittel und einen umfassenden Krankenversicherungsschutz verfügen, damit sie die Sozialleistungen des Aufnahmestaats nicht unangemessen in Anspruch nehmen.\n\nDer Gerichtshof hat entschieden, dass Mitgliedstaaten wirtschaftlich nicht aktive Unionsbürger, die allein zur Arbeitsuche oder ohne ausreichende Mittel einreisen, unter bestimmten Umständen von bestimmten Sozialleistungen ausschließen dürfen. Nach fünf Jahren rechtmäßigen Aufenthalts erwerben Unionsbürger ein Daueraufenthaltsrecht.',
    'r',
    ['Unionsbürger dürfen sich in jedem Mitgliedstaat zeitlich unbegrenzt ohne Bedingungen aufhalten.',
      'Mitgliedstaaten müssen allen Unionsbürgern ab dem ersten Tag dieselben Sozialleistungen gewähren wie ihren eigenen Staatsangehörigen.',
      'Nach fünf Jahren rechtmäßigen Aufenthalts erwerben Unionsbürger ein Daueraufenthaltsrecht.',
      'Wirtschaftlich nicht aktive Unionsbürger dürfen nie von Sozialleistungen ausgeschlossen werden.'],
    2,
    'C steht im letzten Satz. A widerspricht den Bedingungen nach drei Monaten. B und D widersprechen der Rechtsprechung zum Ausschluss bestimmter Gruppen.'],

  ['Ehrenamt und Vereine',
    'Ein großer Teil der Menschen in der Union engagiert sich ehrenamtlich, etwa in Sportvereinen, Feuerwehren, Kirchengemeinden oder sozialen Initiativen. Die Beteiligung unterscheidet sich stark zwischen den Mitgliedstaaten und ist in nord- und westeuropäischen Staaten im Durchschnitt höher als in süd- und osteuropäischen.\n\nDie Formen des Engagements verändern sich. Vereine berichten, dass es schwieriger werde, Menschen für langfristige Ämter wie Vorstandsposten zu gewinnen, während die Bereitschaft zu kurzfristigem, projektbezogenem Engagement zunehme. Einige Fachleute sehen darin keinen Rückgang des Engagements insgesamt, sondern einen Wandel seiner Formen.',
    'h',
    ['Das ehrenamtliche Engagement in Europa bricht zusammen.',
      'Das Ehrenamt verlagert sich von langfristigen Verpflichtungen hin zu kurzfristigem Engagement, was nicht zwingend einen Rückgang bedeutet.',
      'In allen Mitgliedstaaten engagieren sich gleich viele Menschen ehrenamtlich.',
      'Vereine haben keine Schwierigkeiten, Vorstandsposten zu besetzen.'],
    1,
    'B gibt die Kernaussage des zweiten Absatzes wieder. A übertreibt und widerspricht der Deutung als Wandel. C widerspricht den Unterschieden zwischen den Staaten. D widerspricht den Berichten der Vereine.'],

  ['Pressefreiheit',
    'Die Pressefreiheit ist in der Union im weltweiten Vergleich gut geschützt, doch Organisationen, die sie beobachten, berichten auch hier von Verschlechterungen. Genannt werden unter anderem der wachsende Einfluss von Regierungen auf öffentlich-rechtliche Medien in einigen Mitgliedstaaten, die Konzentration von Medienbesitz und missbräuchliche Klagen gegen Journalistinnen und Journalisten.\n\nSolche Klagen, oft als SLAPP bezeichnet, zielen weniger darauf ab, einen Prozess zu gewinnen, als die Betroffenen durch Kosten und Aufwand einzuschüchtern. Eine Richtlinie der Union ermöglicht es Gerichten, offensichtlich unbegründete Klagen in grenzüberschreitenden Fällen frühzeitig abzuweisen. Das Europäische Medienfreiheitsgesetz soll zudem die Unabhängigkeit öffentlich-rechtlicher Medien und die Transparenz der Eigentumsverhältnisse stärken.',
    'a',
    ['Bei SLAPP-Klagen ist das wichtigste Ziel des Klägers, den Prozess zu gewinnen.',
      'Die Richtlinie gegen SLAPP gilt für sämtliche Klagen, auch rein nationale Fälle.',
      'Selbst eine erfolglose Klage kann Journalisten durch Kosten und Aufwand von Berichterstattung abhalten.',
      'Die Pressefreiheit in der Union hat sich nach übereinstimmenden Berichten zuletzt verbessert.'],
    2,
    'C folgt aus der Einschüchterungswirkung durch Kosten und Aufwand. A widerspricht dem beschriebenen Zweck solcher Klagen. B widerspricht der Beschränkung auf grenzüberschreitende Fälle. D widerspricht den berichteten Verschlechterungen.'],

  ['Bevölkerungsprognosen',
    'Nach den Projektionen von Eurostat wird die Bevölkerung der Union in den kommenden Jahren zunächst noch leicht wachsen und danach zurückgehen. Das Wachstum beruht dabei ausschließlich auf Zuwanderung, denn in der Union sterben seit einigen Jahren mehr Menschen, als geboren werden.\n\nProjektionen sind keine Vorhersagen. Sie zeigen, wie sich die Bevölkerung entwickeln würde, wenn bestimmte Annahmen über Geburten, Sterblichkeit und Wanderung eintreffen. Insbesondere die Annahmen zur Zuwanderung sind mit großer Unsicherheit behaftet, da diese stark von politischen und wirtschaftlichen Entwicklungen abhängt. Eurostat veröffentlicht deshalb auch Varianten mit abweichenden Annahmen.',
    'r',
    ['In der Union werden seit einigen Jahren mehr Menschen geboren, als sterben.',
      'Ohne Zuwanderung würde die Bevölkerung der Union bereits heute schrumpfen.',
      'Die Projektionen von Eurostat sind verlässliche Vorhersagen der künftigen Bevölkerung.',
      'Die Annahmen zur Zuwanderung gelten als besonders sicher.'],
    1,
    'B folgt daraus, dass mehr Menschen sterben als geboren werden und das Wachstum allein auf Zuwanderung beruht. A kehrt den Befund um. C widerspricht dem Satz „Projektionen sind keine Vorhersagen“. D widerspricht der großen Unsicherheit.'],

  ['Medienkompetenz in Schulen',
    'Kinder und Jugendliche verbringen einen großen Teil ihrer Freizeit mit digitalen Medien. Mehrere Mitgliedstaaten haben daher Medienkompetenz als Querschnittsaufgabe in ihre Lehrpläne aufgenommen. Die Schülerinnen und Schüler sollen lernen, Quellen zu prüfen, Werbung und redaktionelle Inhalte zu unterscheiden und die Funktionsweise von Algorithmen in sozialen Netzwerken zu verstehen.\n\nLehrkräfte berichten jedoch, dass sie sich auf diese Aufgabe oft nicht ausreichend vorbereitet fühlen. Zudem konkurriert Medienkompetenz als Querschnittsaufgabe mit den Anforderungen der einzelnen Fächer um knappe Unterrichtszeit. Einige Staaten haben daneben Beschränkungen für die Nutzung privater Smartphones während des Unterrichts eingeführt.',
    'f',
    ['Mehrere Mitgliedstaaten haben Medienkompetenz in ihre Lehrpläne aufgenommen.',
      'Lehrkräfte fühlen sich nach eigenen Angaben durchweg gut auf die Vermittlung von Medienkompetenz vorbereitet.',
      'Zur Medienkompetenz gehört, Werbung von redaktionellen Inhalten unterscheiden zu können.',
      'Einige Staaten beschränken die Nutzung privater Smartphones im Unterricht.'],
    1,
    'Gesucht ist die falsche Aussage. B widerspricht dem Text: Lehrkräfte fühlen sich oft nicht ausreichend vorbereitet. A, C und D stehen so im Text.'],
]);
